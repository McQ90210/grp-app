                        const playing = playingTonight.has(player.name);
                        return (
                          <div
                            key={player.name}
                            className={`p-3 rounded-lg border transition-colors ${
                              playing
                                ? 'bg-emerald-950/40 border-emerald-500/40'
                                : 'bg-black/30 border-yellow-500/10'
                            }`}
                          >
                            <div className="flex items-center gap-2">
                              <button
                                onClick={() => togglePlaying(player.name)}
                                className={`w-5 h-5 rounded border-2 flex items-center justify-center flex-shrink-0 transition-colors ${
                                  playing
                                    ? 'bg-emerald-500 border-emerald-400'
                                    : 'border-yellow-100/30'
                                }`}
                              >
                                {playing && (
                                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="black" strokeWidth="3">
                                    <polyline points="20 6 9 17 4 12" />
                                  </svg>
                                )}
                              </button>
                              <button
                                onClick={() => togglePlaying(player.name)}
                                className={`flex-1 text-left ${playing ? 'text-emerald-100' : 'text-yellow-100/50'}`}
                              >
                                {player.name}
                              </button>
                              <button
                                onClick={() => removeFromRoster(player.name)}
                                className="text-yellow-100/30 hover:text-red-400"
                                title="Remove from roster"
                              >
                                <Trash2 size={14} />
                              </button>
                            </div>
                            {playing && (
                              <>
                                <div className="flex gap-2 mt-2 ml-7">
                                  <select
                                    value={player.sound || 'none'}
                                    onChange={(e) => updatePlayerSound(player.name, e.target.value)}
                                    className="flex-1 px-2 py-1 rounded bg-black/40 border border-yellow-500/20 text-yellow-100/80 text-xs focus:outline-none focus:border-yellow-500/50"
                                  >
                                    <option value="none" style={{ background: '#0a3d1f' }}>None</option>
                                    {Object.keys(customSounds || {}).length > 0 && (
                                      <optgroup label="Your sounds">
                                        {Object.entries(customSounds).map(([key, s]) => (
                                          <option key={`c-${key}`} value={key} style={{ background: '#0a3d1f' }}>
                                            {s.label}
                                          </option>
                                        ))}
                                      </optgroup>
                                    )}
                                    <optgroup label="Built-in (synth or file)">
                                      {Object.entries(SOUND_LIBRARY).filter(([k, s]) => k !== 'none' && !s.system).map(([key, s]) => (
                                        <option key={key} value={key} style={{ background: '#0a3d1f' }}>
                                          {s.label}
                                        </option>
                                      ))}
                                    </optgroup>
                                  </select>
                                  <button
                                    onClick={() => playSound(player.sound || 'none', customSounds, player.customSoundUrl || null)}
                                    disabled={!player.sound || player.sound === 'none'}
                                    className="px-3 py-1 rounded bg-yellow-500/10 border border-yellow-500/30 text-yellow-100 text-xs disabled:opacity-30"
                                    title="Preview sound"
                                  >
                                    <Music size={12} />
                                  </button>
                                </div>
                                {/* League-only: capture buy-in + subs payment
                                    state as each player arrives. Tap a chip
                                    to flip its state. Subs hidden on finals. */}
                                {gameType === 'league' && (() => {
                                  const buyInOk = buyInsPaidByName[player.name] === true;
                                  const subsOk = subsPaidByName[player.name] === true;
                                  const playerPid = slugifyName(player.name);
                                  const isUpfront = localUpfrontSet.has(playerPid);
                                  return (
                                    <div className="flex gap-2 mt-2 ml-7 flex-wrap">
                                      <button
                                        onClick={() => setBuyInsPaidByName((m) => ({ ...m, [player.name]: !buyInOk }))}
                                        className={`px-2 py-1 rounded text-[11px] font-mono border ${
                                          buyInOk
                                            ? 'bg-emerald-600/25 border-emerald-400/50 text-emerald-100'
                                            : 'bg-red-900/40 border-red-400/60 text-red-100'
                                        }`}
                                        title="Tap when this player has paid their buy-in"
                                      >
                                        💷 buy-in {buyInOk ? 'paid' : 'OWES'}
                                      </button>
                                      {!isFinal && (
                                        isUpfront ? (
                                          <button
                                            onClick={() => fbUser && setPendingUpfrontToggle({ pid: playerPid, name: player.name, nextIsUpfront: false })}
                                            disabled={!fbUser}
                                            className="px-2 py-1 rounded text-[11px] font-mono border bg-emerald-700/40 border-emerald-300/70 text-emerald-50 disabled:opacity-60"
                                            title={fbUser
                                              ? 'Paid £18 upfront for the whole round — tap to undo (with confirm)'
                                              : 'Paid for the whole round upfront (sign in as admin to edit)'}
                                          >
                                            🪙 paid for round
                                          </button>
                                        ) : (
                                          <>
                                            <button
                                              onClick={() => setSubsPaidByName((m) => ({ ...m, [player.name]: !subsOk }))}
                                              className={`px-2 py-1 rounded text-[11px] font-mono border ${
                                                subsOk
                                                  ? 'bg-emerald-600/25 border-emerald-400/50 text-emerald-100'
                                                  : 'bg-red-900/40 border-red-400/60 text-red-100'
                                              }`}
                                              title="Tap when this player has paid their £3 subs for tonight only"
                                            >
                                              🪙 £3 subs {subsOk ? 'paid' : 'OWES'}
                                            </button>
                                            {fbUser && (
                                              <button
                                                onClick={() => setPendingUpfrontToggle({ pid: playerPid, name: player.name, nextIsUpfront: true })}
                                                className="px-2 py-1 rounded text-[11px] font-mono border border-yellow-500/30 text-yellow-100/60 hover:bg-yellow-500/10 hover:border-yellow-500/60 hover:text-yellow-100"
                                                title="Mark this player as having paid £18 for the whole round upfront. Locks the £3 chip and applies to every regular game in this round."
                                              >
                                                + round paid
                                              </button>
                                            )}
                                          </>
                                        )
                                      )}
                                    </div>
                                  );
                                })()}
                              </>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </>
                )}

                {playersArray.length >= 2 && (
                  <div className="text-center mt-6 font-mono text-xs text-emerald-300/70">
                    Prize pool: <span className="text-emerald-200">£{(parseFloat(buyIn) * playersArray.length).toFixed(0)}</span>
                  </div>
                )}
              </div>
            )}

            {step === 3 && (
              <div>
                <div className="font-mono text-xs text-yellow-500/60 tracking-widest mb-2 text-center">STEP 4 OF 5</div>
                <div className="font-display text-3xl gold-text text-center mb-2">HOW LONG?</div>
                <div className="text-yellow-100/50 text-center mb-8 text-sm">Target tournament duration in minutes</div>
                <div className="max-w-xs mx-auto">
                  <input
                    type="number"
                    value={duration}
                    onChange={(e) => setDuration(e.target.value)}
                    autoFocus
                    className="input-large text-5xl"
                  />
                  <div className="text-center font-mono text-yellow-100/40 text-xs mt-2">
                    {duration && parseInt(duration) >= 60 ? `≈ ${Math.floor(parseInt(duration) / 60)}h ${parseInt(duration) % 60}m` : ''}
                  </div>
                </div>
                <div className="flex gap-2 justify-center mt-4 flex-wrap">
                  {[
                    { label: '1h', v: '60' },
                    { label: '2h', v: '120' },
                    { label: '3h', v: '180' },
                    { label: '4h', v: '240' },
                    { label: '5h', v: '300' },
                  ].map(({ label, v }) => (
                    <button key={v} onClick={() => setDuration(v)} className="px-4 py-1.5 rounded-full bg-black/30 border border-yellow-500/20 text-yellow-100/70 font-mono text-sm hover:border-yellow-500/50">{label}</button>
                  ))}
                </div>
                <div className="mt-8 max-w-md mx-auto flex items-center justify-between p-4 rounded-xl bg-black/30 border border-yellow-500/10">
                  <div>
                    <div className="text-yellow-100 text-sm">Include antes</div>
                    <div className="text-yellow-100/40 text-xs font-mono mt-0.5">Off by default</div>
                  </div>
                  <button
                    onClick={() => setIncludeAntes(!includeAntes)}
                    className={`relative w-12 h-6 rounded-full transition-colors ${includeAntes ? 'bg-yellow-500' : 'bg-yellow-500/20'}`}
                  >
                    <div className={`absolute top-0.5 w-5 h-5 rounded-full bg-white transition-transform ${includeAntes ? 'translate-x-6' : 'translate-x-0.5'}`} />
                  </button>
                </div>
              </div>
            )}

            {step === 4 && (
              <div>
                <div className="font-mono text-xs text-yellow-500/60 tracking-widest mb-2 text-center">STEP 5 OF 5</div>
                <div className="font-display text-3xl gold-text text-center mb-6">READY TO PLAY</div>
                <div className="grid grid-cols-2 gap-3 mb-4">
                  <div className="p-4 rounded-xl bg-black/30 border border-yellow-500/10">
                    <div className="font-mono text-xs text-yellow-500/60 tracking-widest">BUY-IN</div>
                    <div className="font-display text-3xl gold-text">£{buyIn}</div>
                  </div>
                  <div className="p-4 rounded-xl bg-black/30 border border-yellow-500/10">
                    <div className="font-mono text-xs text-yellow-500/60 tracking-widest">PRIZE POOL</div>
                    <div className="font-display text-3xl gold-text">£{(parseFloat(buyIn) * playersArray.length).toFixed(0)}</div>
                  </div>
                  <div className="p-4 rounded-xl bg-black/30 border border-yellow-500/10">
                    <div className="font-mono text-xs text-yellow-500/60 tracking-widest">STACK</div>
                    <div className="font-display text-3xl text-emerald-200">{parseInt(stackSize).toLocaleString()}</div>
                  </div>
                  <div className="p-4 rounded-xl bg-black/30 border border-yellow-500/10">
                    <div className="font-mono text-xs text-yellow-500/60 tracking-widest">PLAYERS</div>
                    <div className="font-display text-3xl text-emerald-200">{playersArray.length}</div>
                  </div>
                </div>
                <div className="p-4 rounded-xl bg-black/30 border border-yellow-500/10 mb-4">
                  <div className="font-mono text-xs text-yellow-500/60 tracking-widest mb-2">TARGET DURATION</div>
                  <div className="font-display text-2xl text-emerald-200">
                    {Math.floor(parseInt(duration) / 60)}h {parseInt(duration) % 60}m

                  </div>
                </div>
                <div className="text-center text-xs font-mono text-yellow-100/40">
                  Blind structure will be generated for these settings.<br/>You can edit it after starting.
                </div>
              </div>
            )}
          </div>
        </div>

        <div className="flex gap-3 mt-6">
          {step > 0 && (
            <button onClick={() => setStep(step - 1)} className="px-6 py-3 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100 font-mono text-sm hover:border-yellow-500/50 flex items-center gap-2">
              <ChevronLeft size={16} /> BACK
            </button>
          )}
          <button
            onClick={step === 4 ? finish : () => setStep(step + 1)}
            disabled={!canAdvance()}
            className="flex-1 px-6 py-3 rounded-full font-display text-xl text-black disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center gap-2"
            style={{ background: 'linear-gradient(135deg, #f4d03f, #d4ac0d)' }}
          >
            {step === 4 ? 'START TOURNAMENT' : <>NEXT <ChevronRight size={18} /></>}
          </button>
        </div>
      </div>

      {showPlayerPicker && (
        <PlayerPickerModal
          allPlayers={allGrpPlayers}
          alreadyAdded={hrRegulars}
          onAdd={addFromPicker}
          onClose={() => setShowPlayerPicker(false)}
        />
      )}

      {pendingUpfrontToggle && (
        <ConfirmDialog
          title={pendingUpfrontToggle.nextIsUpfront
            ? `Mark ${pendingUpfrontToggle.name} as paid for the round?`
            : `Undo paid-for-round for ${pendingUpfrontToggle.name}?`}
          message={pendingUpfrontToggle.nextIsUpfront
            ? `They'll be flagged as having paid £18 upfront for the entire round. Every regular game in this round will treat their £3 subs as covered.`
            : `They'll go back to owing £3 per game for this round. Only tap CONFIRM if they never actually paid the £18 upfront.`}
          onConfirm={() => {
            toggleUpfrontFor(pendingUpfrontToggle.pid);
            setPendingUpfrontToggle(null);
          }}
          onCancel={() => setPendingUpfrontToggle(null)}
        />
      )}
    </div>
  );
}

// ============ PLAYER PICKER MODAL (HR setup) ============
// Used in High Rollers setup to add players to the regulars list. Shows every
// GRP-roster player not already on the list (checkbox select-multiple) plus a
// text field for adding a new (non-GRP) name.
function PlayerPickerModal({ allPlayers, alreadyAdded, onAdd, onClose }) {
  const [selected, setSelected] = useState(new Set());
  const [newName, setNewName] = useState('');

  const available = allPlayers.filter((p) => !alreadyAdded.includes(p.name));

  const toggle = (name) => {
    setSelected((prev) => {
      const next = new Set(prev);
      if (next.has(name)) next.delete(name);
      else next.add(name);
      return next;
    });
  };

  const commit = () => {
    const names = [...selected];
    const extra = newName.trim();
    if (extra && !names.includes(extra) && !alreadyAdded.includes(extra)) {
      names.push(extra);
    }
    onAdd(names);
  };

  const total = selected.size + (newName.trim() && !alreadyAdded.includes(newName.trim()) ? 1 : 0);

  return (
    <div onClick={onClose} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="gold-border rounded-3xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-md w-full max-h-[90vh] flex flex-col">
        <div className="font-display text-2xl gold-text mb-1">ADD PLAYERS</div>
        <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-4">
          Pick from your GRP roster or add a new name
        </div>

        <div className="flex-1 overflow-y-auto pr-1 mb-4">
          {available.length > 0 ? (
            <>
              <div className="font-mono text-xs text-emerald-300 tracking-widest mb-2">FROM GRP ROSTER</div>
              <div className="space-y-1 mb-4">
                {available.map((p) => {
                  const isSelected = selected.has(p.name);
                  return (
                    <button
                      key={p.name}
                      onClick={() => toggle(p.name)}
                      className={`w-full flex items-center gap-3 p-2.5 rounded-lg border transition-colors ${
                        isSelected
                          ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-100'
                          : 'bg-black/30 border-yellow-500/10 text-yellow-100/80 hover:border-yellow-500/30'
                      }`}
                    >
                      <span className={`w-5 h-5 rounded border-2 flex items-center justify-center flex-shrink-0 ${
                        isSelected ? 'bg-emerald-500 border-emerald-400' : 'border-yellow-100/30'
                      }`}>
                        {isSelected && (
                          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="black" strokeWidth="3">
                            <polyline points="20 6 9 17 4 12" />
                          </svg>
                        )}
                      </span>
                      <span className="flex-1 text-left">{p.name}</span>
                    </button>
                  );
                })}
              </div>
            </>
          ) : (
            <div className="text-yellow-100/40 text-sm text-center py-4 mb-2">
              All GRP players are already on the regulars list.
            </div>
          )}

          <div className="font-mono text-xs text-emerald-300 tracking-widest mb-2 mt-4">OR ADD A NEW NAME</div>
          <input
            type="text"
            value={newName}
            onChange={(e) => setNewName(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter' && total > 0) commit(); }}
            placeholder="New player name"
            className="w-full px-3 py-2 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 text-sm focus:outline-none focus:border-yellow-500/50"
          />
        </div>

        <div className="flex gap-2">
          <button
            onClick={onClose}
            className="flex-1 px-4 py-2.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100 font-mono text-sm"
          >
            CANCEL
          </button>
          <button
            onClick={commit}
            disabled={total === 0}
            className="flex-1 px-4 py-2.5 rounded-full font-display text-base text-black disabled:opacity-30"
            style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
          >
            ADD{total > 0 ? ` (${total})` : ''}
          </button>
        </div>
      </div>
    </div>
  );
}

// ============ WLED EFFECT RECIPES ============
// Maps event names to either:
//   - { payload, holdMs? }  — single POST, optionally auto-return to idle
//   - { steps: [{ payload, holdMs }, ...] } — multi-step sequence, each step
//     POSTs its payload then waits holdMs before firing the next step
//
// `holdMs` is in milliseconds. The sequence runner cancels itself if a newer
// effect fires (sequence ID check), so eliminations during eliminations don't
// stack — the newer one replaces the older.
//
// Colours come from Mark's spec:
//   BROWN  #62462b — standard game colour (idle baseline)
//   GREEN  #2b6237 — blinds-increase glow
//   RED    #86000c — elimination
//
// WLED effect IDs used (built-in, stable across versions):
//   0 = Solid    2 = Breathe    9 = Rainbow    28 = Chase
// `transition` is in tenths of a second on the firmware side (so 20 = 2s
// fade, 100 = 10s fade). `i` sets specific pixel ranges: [start, end, [r,g,b]].
const BROWN = [98, 70, 43];
const GREEN_GLOW = [43, 98, 55];
const RED = [134, 0, 12];
const WLED_RECIPES = {
  // Standard game colour — solid brown, the baseline between events.
  idle: { payload: { on: true, bri: 200, transition: 5, seg: [{ fx: 0, col: [BROWN] }] } },

  // Welcome — same as idle for now (brown solid).
  gameStart: { payload: { on: true, bri: 200, transition: 10, seg: [{ fx: 0, col: [BROWN] }] } },

  // Blinds increase — fade to forest green over 2 s, then fade back to
  // brown over 10 s. WLED's native `transition` does the smooth interpolation.
  levelChange: {
    steps: [
      { payload: { on: true, bri: 220, transition: 20, seg: [{ fx: 0, col: [GREEN_GLOW] }] }, holdMs: 2000 },
      { payload: { on: true, bri: 200, transition: 100, seg: [{ fx: 0, col: [BROWN] }] } },
    ],
  },

  // 5-second countdown — five explicit bright/dim brown pulses, one per
  // second. Done as a multi-step sequence rather than a single Breathe
  // POST because the WLED's stored palette (pal:50 by default) can blend
  // colours into Breathe's interpolation, making a brown breath barely
  // visible against the brown idle. Sequence below forces fx:0 (Solid),
  // pal:0 (no blend), and toggles brightness directly.
  countdown: {
    steps: [
      { payload: { on: true, bri: 255, transition: 2, seg: [{ fx: 0, pal: 0, col: [BROWN] }] }, holdMs: 500 },
      { payload: { on: true, bri: 80,  transition: 2, seg: [{ fx: 0, pal: 0, col: [BROWN] }] }, holdMs: 500 },
      { payload: { on: true, bri: 255, transition: 2, seg: [{ fx: 0, pal: 0, col: [BROWN] }] }, holdMs: 500 },
      { payload: { on: true, bri: 80,  transition: 2, seg: [{ fx: 0, pal: 0, col: [BROWN] }] }, holdMs: 500 },
      { payload: { on: true, bri: 255, transition: 2, seg: [{ fx: 0, pal: 0, col: [BROWN] }] }, holdMs: 500 },
      { payload: { on: true, bri: 80,  transition: 2, seg: [{ fx: 0, pal: 0, col: [BROWN] }] }, holdMs: 500 },
      { payload: { on: true, bri: 255, transition: 2, seg: [{ fx: 0, pal: 0, col: [BROWN] }] }, holdMs: 500 },
      { payload: { on: true, bri: 80,  transition: 2, seg: [{ fx: 0, pal: 0, col: [BROWN] }] }, holdMs: 500 },
      { payload: { on: true, bri: 255, transition: 2, seg: [{ fx: 0, pal: 0, col: [BROWN] }] }, holdMs: 500 },
      { payload: { on: true, bri: 80,  transition: 2, seg: [{ fx: 0, pal: 0, col: [BROWN] }] } },
    ],
  },

  // Elimination — three-stage:
  //   1. Wipe red from the END of the strip (~2 s, 8 frames @ 250 ms each)
  //   2. Pulse red for 10 s (Breathe at fast speed, ~0.5 s cycle)
  //   3. Wipe brown from the START of the strip (~2 s, 8 frames @ 250 ms)
  // Total: ~14 s before returning fully to idle. The sequence-ID guard in
  // sendWledEffect means a second elimination cleanly cancels the first.
  elimination: {
    // Strip is 300 LEDs (indices 0..299). Wipes use 8 frames of ~37 LEDs
    // each so the animation looks the same regardless of which end you're
    // standing at. If the physical strip changes length later, update the
    // ranges below (or refactor to query /json/info at runtime).
    steps: [
      // Reset baseline so individual-pixel writes layer on top correctly.
      { payload: { on: true, bri: 220, transition: 0, seg: [{ fx: 0, pal: 0, col: [BROWN] }] }, holdMs: 60 },
      // Wipe red from the end — ~37 LEDs per frame, 300 LEDs total = 8 frames.
      { payload: { seg: [{ i: [263, 299, RED] }] }, holdMs: 250 },
      { payload: { seg: [{ i: [225, 299, RED] }] }, holdMs: 250 },
      { payload: { seg: [{ i: [188, 299, RED] }] }, holdMs: 250 },
      { payload: { seg: [{ i: [150, 299, RED] }] }, holdMs: 250 },
      { payload: { seg: [{ i: [113, 299, RED] }] }, holdMs: 250 },
      { payload: { seg: [{ i: [75, 299, RED] }] }, holdMs: 250 },
      { payload: { seg: [{ i: [38, 299, RED] }] }, holdMs: 250 },
      { payload: { seg: [{ i: [0, 299, RED] }] }, holdMs: 150 },
      // Pulse red 10 s — one POST, WLED's Breathe effect cycles ~500 ms.
      { payload: { on: true, bri: 255, transition: 0, seg: [{ fx: 2, pal: 0, sx: 230, ix: 200, col: [RED] }] }, holdMs: 10000 },
      // Stop Breathe, freeze solid red so the brown wipe can layer on top.
      { payload: { on: true, bri: 220, transition: 0, seg: [{ fx: 0, pal: 0, col: [RED] }] }, holdMs: 60 },
      // Wipe brown from the start — same 8-frame structure, opposite end.
      { payload: { seg: [{ i: [0, 37, BROWN] }] }, holdMs: 250 },
      { payload: { seg: [{ i: [0, 74, BROWN] }] }, holdMs: 250 },
      { payload: { seg: [{ i: [0, 111, BROWN] }] }, holdMs: 250 },
      { payload: { seg: [{ i: [0, 149, BROWN] }] }, holdMs: 250 },
      { payload: { seg: [{ i: [0, 186, BROWN] }] }, holdMs: 250 },
      { payload: { seg: [{ i: [0, 223, BROWN] }] }, holdMs: 250 },
      { payload: { seg: [{ i: [0, 261, BROWN] }] }, holdMs: 250 },
      { payload: { seg: [{ i: [0, 299, BROWN] }] }, holdMs: 150 },
      // Clean idle state — reaffirm fx=0 and brown so subsequent effects start clean.
      { payload: { on: true, bri: 200, transition: 5, seg: [{ fx: 0, pal: 0, col: [BROWN] }] } },
    ],
  },

  // 5 minutes remaining in the level — slow yellow pulse.
  fiveMinWarning: { payload: { on: true, bri: 220, transition: 7, seg: [{ fx: 2, pal: 0, sx: 50, ix: 128, col: [[244, 208, 63]] }] } },

  // 1 minute remaining — fast yellow pulse.
  oneMinWarning: { payload: { on: true, bri: 220, transition: 3, seg: [{ fx: 2, pal: 0, sx: 200, ix: 200, col: [[244, 208, 63]] }] } },

  // Break level — calm blue, slow breathing.
  break: { payload: { on: true, bri: 180, transition: 15, seg: [{ fx: 2, pal: 0, sx: 40, ix: 100, col: [[59, 130, 246]] }] } },

  // Final 3 players left — purple theatre chase.
  finalThree: { payload: { on: true, bri: 255, transition: 7, seg: [{ fx: 28, pal: 0, sx: 150, ix: 180, col: [[168, 85, 247], [60, 30, 90], [0, 0, 0]] }] } },

  // Tournament winner — rainbow celebration (palette IS the point here, keep WLED's default rainbow).
  winner: { payload: { on: true, bri: 255, transition: 7, seg: [{ fx: 9, sx: 200, ix: 255 }] } },
};

// ============ MAIN TIMER ============
function PokerTimerMain({ config, onReset, customSounds, onViewLeague, fbUser }) {
  // Resume hydration: when the app boots into an in-progress game, App
  // injects the last saved snapshot at config._resume so we restore state
  // instead of starting fresh.
  const resume = config._resume || null;
  const [levels, setLevels] = useState(resume?.levels || config.levels);
  const [players, setPlayers] = useState(resume?.players || config.players); // [{name, sound}, ...]
  const [currentLevel, setCurrentLevel] = useState(resume?.currentLevel ?? 0);
  const [timeLeft, setTimeLeft] = useState(
    resume?.timeLeft != null ? resume.timeLeft : config.levels[0].duration * 60
  );
  const [isRunning, setIsRunning] = useState(false); // always resume paused so user reviews
  const [voiceEnabled, setVoiceEnabled] = useState(true);
  const [eliminatedPlayers, setEliminatedPlayers] = useState(resume?.eliminatedPlayers || []); // names, in elimination order
  const [rebuyCounts, setRebuyCounts] = useState(resume?.rebuyCounts || {}); // { playerName: number }
  const [payoutKey, setPayoutKey] = useState(() => defaultPayoutKey((resume?.players || config.players).length));
  const [newPlayerName, setNewPlayerName] = useState('');
  const [activePanel, setActivePanel] = useState(null);
  // Per-user preference for the two side rails on the timer screen.
  // Persisted so a hidden rail stays hidden next session. Default: on.
  const [showBountiesRail, setShowBountiesRail] = useState(() => {
    try { return localStorage.getItem('grp-rail-bounties') !== '0'; } catch (_) { return true; }
  });
  const [showStandingsRail, setShowStandingsRail] = useState(() => {
    try { return localStorage.getItem('grp-rail-standings') !== '0'; } catch (_) { return true; }
  });
  useEffect(() => {
    try { localStorage.setItem('grp-rail-bounties', showBountiesRail ? '1' : '0'); } catch (_) {}
  }, [showBountiesRail]);
  useEffect(() => {
    try { localStorage.setItem('grp-rail-standings', showStandingsRail ? '1' : '0'); } catch (_) {}
  }, [showStandingsRail]);
  const [hasStarted, setHasStarted] = useState(!!resume);
  // ms-since-epoch when the user first pressed PLAY on this game. Persisted
  // in the live snapshot so it survives a resume. Used by SaveGameModal to
  // default the DATE field to the *play* date rather than "today on this
  // device when SAVE was tapped" — important for late-night games that
  // end after midnight, where saving on the next calendar day would
  // otherwise stamp the wrong date (and miss the morning-after cron).
  const [gameStartedAt, setGameStartedAt] = useState(resume?.gameStartedAt || null);
  const [voices, setVoices] = useState([]);
  const [selectedVoiceURI, setSelectedVoiceURI] = useState(null);
  const [showHomeConfirm, setShowHomeConfirm] = useState(false);
  const [showEliminate, setShowEliminate] = useState(false);
  // Shortcut modal opened when an admin taps a player's name on the LIVE
  // STANDINGS rail. Skips the "which player" step of the full eliminate
  // modal — the player is already known — and just asks OUT vs REBUY.
  const [standingsAction, setStandingsAction] = useState(null); // { player } | null
  // Rail top offset — measured once from the timer container's document-Y
  // position so the desktop side rail sits aligned with the timer's top
  // edge and scrolls naturally with the page (position: absolute inside
  // <body>, not fixed).
  const timerBoxRef = useRef(null);
  const [railTopPx, setRailTopPx] = useState(128);
  useEffect(() => {
    const measure = () => {
      if (!timerBoxRef.current) return;
      const rect = timerBoxRef.current.getBoundingClientRect();
      setRailTopPx(Math.round(rect.top + window.scrollY));
    };
    measure();
    const t1 = setTimeout(measure, 100);
    const t2 = setTimeout(measure, 500);
    window.addEventListener('resize', measure);
    return () => {
      clearTimeout(t1); clearTimeout(t2);
      window.removeEventListener('resize', measure);
    };
  }, []);
  // If resuming and only one player remains active, infer the winner so the
  // overlay surfaces immediately and the save flow is reachable.
  const [winner, setWinner] = useState(() => {
    if (!resume) return null;
    const eliminated = new Set(resume.eliminatedPlayers || []);
    const active = (resume.players || config.players).filter(p => !eliminated.has(p.name));
    return active.length === 1 ? active[0] : null;
  });
  const [fullRoster, setFullRoster] = useState([]); // [{ name, sound }, ...] — for late-entry picker
  const [knockedOutBy, setKnockedOutBy] = useState(resume?.knockedOutBy || {}); // { eliminatedPlayerName: knockerOuterName } — back-compat, last knocker per name
  // Chronological KO log — supports multiple knockouts of the same player
  // when they rebuy. v2 scoring (Round 2 2026+) uses this for KO bonuses
  // and bounty respawn resolution. Each entry: { eliminated, knocker, rebought }
  // where `rebought: true` means the player bought back in immediately
  // (so they stayed in the active pool — not in eliminatedPlayers).
  const [knockouts, setKnockouts] = useState(resume?.knockouts || []);
  // Standings-rail delayed reveal: lag the visible knockouts log by a few
  // seconds so the room can look up after a KO and *watch* the points move.
  // The real `knockouts` state stays authoritative for the save flow /
  // eliminate modal / bounty sound — only the standings render uses this
  // delayed copy. Must be declared AFTER `knockouts` — it references it.
  const [displayedKnockouts, setDisplayedKnockouts] = useState(resume?.knockouts || []);
  useEffect(() => {
    if (knockouts === displayedKnockouts) return;
    const t = setTimeout(() => setDisplayedKnockouts(knockouts), 3000);
    return () => clearTimeout(t);
  }, [knockouts, displayedKnockouts]);
  // Per-attendee payment status (keyed by displayName). Seeded from the
  // setup wizard's captured state; late-entry players default to paid
  // (admin can correct via the Subs Ledger after the fact).
  const [buyInsPaidByName, setBuyInsPaidByName] = useState(resume?.buyInsPaidByName || config.buyInsPaidByName || {});
  const [subsPaidByName, setSubsPaidByName] = useState(resume?.subsPaidByName || config.subsPaidByName || {});
  const [pendingKnockout, setPendingKnockout] = useState(null); // { player, intent: 'out' | 'rebuy' } — awaiting "who knocked them out?"
  // Confirmation gate for the trash-can in the players panel. Removing a
  // player wipes all the per-attendee state (rebuys, payment chips,
  // elimination order) so this needs a tap-twice guardrail.
  const [pendingRemove, setPendingRemove] = useState(null); // { idx, name } | null

  // ---- WLED (optional LED strip controlled by an ESP32 on the local LAN) ----
  // Settings live in localStorage only — no events are wired up yet, this just
  // captures the user's config so a future step can fire effects.
  const [wledEnabled, setWledEnabled] = useState(false);
  const [wledIp, setWledIp] = useState('');
  const [wledTestStatus, setWledTestStatus] = useState(null); // null | 'testing' | 'ok' | 'fail'
  const [wledTestMessage, setWledTestMessage] = useState('');
  const [wledHelpOpen, setWledHelpOpen] = useState(false);

  // Normalise the WLED address field. Two valid shapes:
  //   - Bare host[:port] (e.g. "192.168.86.164") — we'll prepend http:// at
  //     fetch time. Only works when the app and the controller are both on
  //     plain HTTP (i.e. the app served locally — not via GitHub Pages).
  //   - Full HTTPS URL (e.g. "https://abc.trycloudflare.com") — passed
  //     through verbatim. Required when the app is on HTTPS because
  //     browsers block mixed content.
  // The normaliser strips `http://` (we add it back) and trailing slashes,
  // but preserves `https://` so HTTPS URLs survive round-trip.
  const normalizeWledIp = (raw) => {
    let s = (raw || '').trim();
    s = s.replace(/^http:\/\//i, '');  // strip plain http only
    s = s.replace(/\/+$/, '');         // strip trailing slashes
    return s;
  };

  // Build the base URL for WLED API calls. Detects whether the stored value
  // already includes a scheme (https://, http://) and falls back to http://
  // for bare host values.
  const wledBaseUrl = (ip) => /^https?:\/\//i.test(ip) ? ip : `http://${ip}`;
  const [showSaveModal, setShowSaveModal] = useState(false);
  const [fullRosterFromDB, setFullRosterFromDB] = useState([]); // raw player docs from Firestore — for bounty calc
  // Season totals BEFORE this game — { pid: totalPoints }. Sums pointsAwarded
  // across every prior game in the current season, excluding this game's own
  // id (in case an admin re-opened a saved game). Loaded once when the timer
  // mounts; used by the BONUS POINTS panel to show live rank + delta.
  const [seasonPreGameTotals, setSeasonPreGameTotals] = useState(null);

  const intervalRef = useRef(null);
  const scrubDraggingRef = useRef(false);
  // Refs to the latest levels / currentLevel so the interval callback (set
  // up once per isRunning change) and the announce callbacks read fresh
  // values, even after a manual level edit changes the state.
  const levelsRef = useRef(levels);
  const currentLevelRef = useRef(currentLevel);
  // Sync refs on every render — synchronous, so even effects/handlers that
  // fire before the useEffect commits read the latest values.
  levelsRef.current = levels;
  currentLevelRef.current = currentLevel;
  // timeLeft is read by the live-save snapshot. We don't want every second
  // tick to fire a save, so we keep timeLeft out of the save effect's deps
  // and read its current value from this ref instead. Synced synchronously.
  const timeLeftRef = useRef(timeLeft);
  timeLeftRef.current = timeLeft;
  // Sequence ID for multi-step WLED effects. Each call increments. Any
  // pending setTimeout from an older sequence checks this and bails out
  // if a newer one has taken over.
  const wledSeqRef = useRef(0);

  // WLED settings — hydrate from localStorage on mount, persist on change.
  useEffect(() => {
    try {
      const raw = localStorage.getItem('grp-wled-settings');
      if (!raw) return;
      const s = JSON.parse(raw);
      if (typeof s.enabled === 'boolean') setWledEnabled(s.enabled);
      if (typeof s.ip === 'string') setWledIp(s.ip);
    } catch (_) { /* ignore corrupt blob */ }
  }, []);
  useEffect(() => {
    try {
      localStorage.setItem(
        'grp-wled-settings',
        JSON.stringify({ enabled: wledEnabled, ip: wledIp })
      );
    } catch (_) {}
  }, [wledEnabled, wledIp]);

  // Probe the WLED controller's /json/state to confirm reachability. WLED
  // firmware exposes CORS headers on /json/* so a regular fetch works. If
  // the stored value is a bare IP (http) but the app is served over HTTPS
  // the browser will block as mixed content — set up a Cloudflare Tunnel
  // (cloudflared tunnel --url http://192.168.x.x) and paste the resulting
  // https://*.trycloudflare.com URL into the field instead.
  const testWLED = useCallback(async () => {
    const ip = wledIp.trim();
    if (!ip) return;
    setWledTestStatus('testing');
    setWledTestMessage(`Reaching ${ip}…`);
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 5000);
      const res = await fetch(`${wledBaseUrl(ip)}/json/state`, { signal: ctrl.signal });
      clearTimeout(timer);
      if (!res.ok) {
        setWledTestStatus('fail');
        setWledTestMessage(`HTTP ${res.status} from ${ip}`);
        return;
      }
      const data = await res.json();
      setWledTestStatus('ok');
      setWledTestMessage(`Connected · LEDs are currently ${data.on ? 'ON' : 'OFF'}`);
    } catch (e) {
      setWledTestStatus('fail');
      const msg = (e && e.message) ? e.message : 'Connection failed';
      // Mixed-content blocks land as a generic TypeError. Surface the
      // Cloudflare Tunnel recommendation directly so the user knows what
      // to do, not just what went wrong.
      const isMixed = !(/^https:\/\//i.test(ip)) && msg.toLowerCase().includes('failed to fetch');
      const hint = isMixed
        ? ' — Browser blocked HTTP from this HTTPS page. Set up a Cloudflare Tunnel and paste the https://*.trycloudflare.com URL here.'
        : '';
      setWledTestMessage(msg + hint);
    }
  }, [wledIp]);

  // Fire a WLED effect for a game event. Silent no-op when disabled or
  // unconfigured — never throws, never logs. The helper handles the
  // optional auto-return-to-idle for "flash" recipes (holdMs).
  //
  // Known limitations (v1, accepted trade-offs):
  //
  //   1. Flashes always return to `idle`, even if a sustained warning
  //      (fiveMinWarning / oneMinWarning) was active before the flash.
  //      So an elimination during the last minute of a level resets the
  //      LED state — the on-screen timer still shows the real time so
  //      nothing is *lost*, just the LED state regresses. Could be fixed
  //      with a `lastSustainedRef` that captures the most recent non-
  //      flash recipe and gets replayed instead of `idle`.
  //
  //   2. Final 3 → elimination → idle → winner has a noticeable gap
  //      because the winner recipe fires several seconds after the last
  //      elimination flash returns to idle. Acceptable for v1; could be
  //      smoothed by gating the auto-return on `remainingAfter > 1`.
  const sendWledEffect = useCallback((eventType) => {
    if (!wledEnabled) return;
    const ip = wledIp.trim();
    if (!ip) return;
    const recipe = WLED_RECIPES[eventType];
    if (!recipe) return;
    const base = wledBaseUrl(ip);
    // Auto-unfreeze segments unless the payload is using `i` (individual
    // pixel writes). WLED auto-sets `frz: true` when `i` is used, and any
    // later effect/colour change is silently ignored until frz is reset.
    // Bake `frz: false` into every non-`i` payload so callers don't have
    // to remember.
    const post = (payload) => {
      const augmented = { ...payload };
      if (augmented.seg && Array.isArray(augmented.seg)) {
        augmented.seg = augmented.seg.map((s) => {
          const usesI = Array.isArray(s && s.i) && s.i.length > 0;
          return usesI ? s : { frz: false, ...s };
        });
      }
      return fetch(`${base}/json/state`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(augmented),
      }).catch(() => {});
    };

    // Cancel any in-flight sequence by bumping the sequence ID. Old
    // setTimeouts compare their captured ID to this and bail.
    const mySeq = ++wledSeqRef.current;
    const stillCurrent = () => mySeq === wledSeqRef.current && wledEnabled && wledIp.trim();

    // Single-payload recipe (used by most one-shot effects).
    if (recipe.payload) {
      post(recipe.payload);
      if (recipe.holdMs) {
        setTimeout(() => {
          if (!stillCurrent()) return;
          post(WLED_RECIPES.idle.payload);
        }, recipe.holdMs);
      }
      return;
    }

    // Multi-step recipe — fire each step at its accumulated offset.
    if (recipe.steps && recipe.steps.length) {
      let delay = 0;
      for (const step of recipe.steps) {
        const at = delay;
        setTimeout(() => {
          if (!stillCurrent()) return;
          post(step.payload);
        }, at);
        delay += (step.holdMs || 0);
      }
    }
  }, [wledEnabled, wledIp]);

  // Live-game persistence. Writes the in-progress tournament state to
  // localStorage on every change (always) and to Firestore liveGames/current
  // when signed in. Resilient to refresh, browser crash, battery failure
  // and device swap. Cleared on successful saveGame in SaveGameModal.
  // Fires on discrete events (eliminations, rebuys, level changes, pause/play)
  // — timeLeft is NOT in deps to avoid a write every second; instead we read
  // its current value via timeLeftRef in the snapshot.
  useEffect(() => {
    if (!hasStarted || winner) return;
    const snapshot = {
      gameType: config.gameType,
      leagueContext: config.leagueContext || null,
      origConfig: {
        buyIn: config.buyIn,
        stackSize: config.stackSize,
        playerStartingStacks: config.playerStartingStacks || null,
        format: config.format || 'rebuy',
      },
      levels,
      players,
      currentLevel,
      timeLeft: timeLeftRef.current,
      isRunning,
      eliminatedPlayers,
      rebuyCounts,
      knockedOutBy,
      knockouts,
      buyInsPaidByName,
      subsPaidByName,
      payoutKey,
      gameStartedAt,
      savedAtClient: Date.now(),
    };
    try { localStorage.setItem('grp-live-game', JSON.stringify(snapshot)); } catch (e) {}
    // Skip the Firestore sync entirely in test mode — localStorage is enough
    // to survive a refresh, and we don't want test games leaking into the
    // cross-device resume snapshot.
    if (!readTestMode() && fbUser && window.GRP_DB && window.GRP_DB.saveLiveGame) {
      window.GRP_DB.saveLiveGame(snapshot).catch((e) => {
        console.error('[grp] live save to Firestore failed:', e);
      });
    }
  }, [hasStarted, winner, levels, players, currentLevel, isRunning, eliminatedPlayers, rebuyCounts, knockedOutBy, knockouts, buyInsPaidByName, subsPaidByName, payoutKey, gameStartedAt, fbUser, config]);

  // Load the full club roster from Firestore so late-entry can suggest existing names
  useEffect(() => {
    let cancelled = false;
    const doLoad = async () => {
      try {
        const allPlayers = await window.GRP_DB.getAllPlayers();
        if (cancelled) return;
        const active = (allPlayers || [])
          .filter((p) => p.active !== false)
          .map((p) => ({
            name: p.displayName,
            sound: p.sound || 'none',
            customSoundUrl: p.customSoundUrl || null,
          }));
        setFullRoster(active);
        setFullRosterFromDB(allPlayers || []); // raw, for bounty calc
      } catch (e) { /* silent — late-entry falls back to free text */ }
    };
    if (window.GRP_DB) doLoad();
    else {
      const onReady = () => doLoad();
      window.addEventListener('firebase-ready', onReady);
      return () => {
        cancelled = true;
        window.removeEventListener('firebase-ready', onReady);
      };
    }
    return () => { cancelled = true; };
  }, []);

  // Load season pointsAwarded totals from Firestore so the BONUS POINTS panel
  // can show each attendee's live rank + delta vs. going in. League games only.
  useEffect(() => {
    if (config.gameType !== 'league') return;
    const seasonId = config.leagueContext?.seasonId;
    if (!seasonId) return;
    let cancelled = false;
    const currentGameId = `${seasonId}-g${config.leagueContext.gameNumber}`;
    const doLoad = async () => {
      try {
        const games = await window.GRP_DB.getGamesForSeason(seasonId);
        if (cancelled) return;
        const totals = {};
        (games || []).forEach((g) => {
          if (g.id === currentGameId) return; // exclude current game (in case a saved copy exists)
          Object.entries(g.pointsAwarded || {}).forEach(([pid, pts]) => {
            totals[pid] = (totals[pid] || 0) + (pts || 0);
          });
        });
        setSeasonPreGameTotals(totals);
      } catch (e) { /* silent — panel falls back to zero pre-game totals */ }
    };
    if (window.GRP_DB) doLoad();
    else {
      const onReady = () => doLoad();
      window.addEventListener('firebase-ready', onReady);
      return () => {
        cancelled = true;
        window.removeEventListener('firebase-ready', onReady);
      };
    }
    return () => { cancelled = true; };
  }, [config.gameType, config.leagueContext?.seasonId, config.leagueContext?.gameNumber]);

  // Load available voices. They load asynchronously in some browsers.
  useEffect(() => {
    if (typeof window === 'undefined' || !window.speechSynthesis) return;
    const loadVoices = () => {
      const all = window.speechSynthesis.getVoices();
      // Prefer English voices, but show all
      const sorted = [...all].sort((a, b) => {
        const aEn = a.lang.startsWith('en') ? 0 : 1;
        const bEn = b.lang.startsWith('en') ? 0 : 1;
        if (aEn !== bEn) return aEn - bEn;
        return a.name.localeCompare(b.name);
      });
      setVoices(sorted);
      if (sorted.length > 0 && !selectedVoiceURI) {
        // Default: Google US English. Fall back through other Google voices, then anything en.
        const best = sorted.find(v => /google.*us english/i.test(v.name))
          || sorted.find(v => /google/i.test(v.name) && v.lang === 'en-US')
          || sorted.find(v => /google/i.test(v.name) && v.lang.startsWith('en'))
          || sorted.find(v => /natural|premium|enhanced|neural/i.test(v.name) && v.lang.startsWith('en'))
          || sorted.find(v => v.lang === 'en-US')
          || sorted.find(v => v.lang.startsWith('en'))
          || sorted[0];
        setSelectedVoiceURI(best.voiceURI);
      }
    };
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
    return () => { window.speechSynthesis.onvoiceschanged = null; };
  }, [selectedVoiceURI]);

  const getVoice = useCallback(() => {
    if (!selectedVoiceURI) return null;
    return voices.find(v => v.voiceURI === selectedVoiceURI) || null;
  }, [voices, selectedVoiceURI]);

  const speak = useCallback((text) => {
    if (!voiceEnabled || typeof window === 'undefined' || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    const v = getVoice();
    if (v) utterance.voice = v;
    utterance.rate = 0.95;
    utterance.pitch = 1;
    utterance.volume = 1;
    window.speechSynthesis.speak(utterance);
  }, [voiceEnabled, getVoice]);

  // Pre-recorded voice clip with Web Speech fallback.
  // key = filename (without .mp3) under sounds/voice/, e.g. 'final-3', 'goodbye-cactus'.
  const speakClip = useCallback(async (key, fallbackText) => {
    if (!voiceEnabled) return;
    if (typeof window !== 'undefined' && window.speechSynthesis) window.speechSynthesis.cancel();
    try { await playVoiceClip(key); }
    catch (e) { if (fallbackText) speak(fallbackText); }
  }, [voiceEnabled, speak]);

  // Play a sequence of pre-recorded clips. items: [{ key, fallback }, ...].
  const speakClipQueue = useCallback(async (items) => {
    if (!voiceEnabled) return;
    if (typeof window !== 'undefined' && window.speechSynthesis) window.speechSynthesis.cancel();
    for (const item of items) {
      try { await playVoiceClip(item.key); }
      catch (e) {
        if (item.fallback) {
          speak(item.fallback);
          await new Promise((r) => setTimeout(r, 2000));
        }
      }
    }
  }, [voiceEnabled, speak]);

  // Queue multiple lines so they play in sequence (longer welcome message)
  const speakQueue = useCallback((lines) => {
    if (!voiceEnabled || typeof window === 'undefined' || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const v = getVoice();
    lines.forEach((text) => {
      const u = new SpeechSynthesisUtterance(text);
      if (v) u.voice = v;
      u.rate = 0.95;
      u.pitch = 1;
      u.volume = 1;
      window.speechSynthesis.speak(u);
    });
  }, [voiceEnabled, getVoice]);

  // Read levels via levelsRef rather than closure so a stale-closure capture
  // (e.g. timer's interval set up before a manual level edit) doesn't read
  // out the previous BB/SB values after the user changed them.
  //
  // opts.silentIfNoClip: when true and we don't have a pre-recorded clip for
  // this specific blind level (e.g. a mid-game custom edit), skip the Web
  // Speech read-out. Used by announceLevelTransition where "Blinds up!" has
  // already played as a standalone clip — robotically reading out arbitrary
  // numbers afterwards sounds worse than just stopping there.
  const announceLevel = useCallback((levelIdx, opts = {}) => {
    const level = (levelsRef.current || [])[levelIdx];
    if (!level) return;
    if (level.isBreak) {
      speakClip(`break-${level.duration}`, `Break time. ${level.duration} minute break. Stretch your legs.`);
    } else {
      const anteText = level.ante > 0 ? `, with an ante of ${level.ante}` : '';
      const key = level.ante > 0 ? `blinds-${level.bb}-ante` : `blinds-${level.bb}`;
      const fallback = opts.silentIfNoClip
        ? ''
        : `Blinds are now ${level.sb} and ${level.bb}${anteText}.`;
      speakClip(key, fallback);
    }
  }, [speakClip]);

  // Welcome message — only when starting from level 1 for the first time.
  // Plays the pre-recorded Adam clip, then announces the opening blinds.
  // Falls back to Web Speech for the welcome if the clip fails.
  const speakWelcome = useCallback(async () => {
    const level = (levelsRef.current || [])[0];
    if (!level || level.isBreak) return;
    await speakClip('welcome', 'Welcome to the home game, everyone. Best of luck.');
    // Brief pause then announce the starting blinds for level 1.
    await new Promise((r) => setTimeout(r, 400));
    announceLevel(0);
  }, [speakClip, announceLevel]);

  // Mid-game level transition: "Blinds Up!" then the new blinds. Breaks skip
  // the "Blinds Up" prefix. Used for both the automatic timer roll-over and
  // the manual NEXT button. Reads via levelsRef for the same reason as above.
  const announceLevelTransition = useCallback(async (levelIdx) => {
    const lvl = (levelsRef.current || [])[levelIdx];
    if (!lvl) return;
    if (lvl.isBreak) {
      sendWledEffect('break');
      announceLevel(levelIdx);
      return;
    }
    sendWledEffect('levelChange');
    await speakClip('blinds-up', 'Blinds up!');
    await new Promise((r) => setTimeout(r, 200));
    // silentIfNoClip: "Blinds up!" was the main announcement — if we don't
    // have a recorded clip for this exact blind level (mid-game edits often
    // create non-standard amounts), don't read the numbers via Web Speech.
    announceLevel(levelIdx, { silentIfNoClip: true });
  }, [speakClip, announceLevel, sendWledEffect]);

  useEffect(() => {
    if (!isRunning) return;
    intervalRef.current = setInterval(() => {
      setTimeLeft((t) => {
        if (t > 1) {
          // Mid-round warnings — read fresh values via refs.
          const lvls = levelsRef.current || [];
          const cl = currentLevelRef.current;
          const curLvl = lvls[cl];
          if (curLvl && !curLvl.isBreak) {
            if (t === 301 && curLvl.duration > 5) {
              speakClip('five-min', 'Five minutes remaining in this round.');
              sendWledEffect('fiveMinWarning');
            } else if (t === 61) {
              speakClip('one-min', 'One minute remaining.');
              sendWledEffect('oneMinWarning');
            } else if (t === 6) {
              // 5-second countdown before the blinds change — pulse the
              // standard colour once per second for the remaining 5 ticks.
              // Fires at t=6 so the breath starts as "5" is first displayed.
              sendWledEffect('countdown');
            }
          }
          return t - 1;
        }
        // t <= 1 — level expired. Defer the level transition to a microtask
        // so we're not mutating other state from inside this setTimeLeft
        // updater (which caused a black-screen crash in v7.47 when the
        // auto-extend race left currentLevel pointing past levels[]).
        setTimeout(() => handleLevelExpiry(), 0);
        return 0;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [isRunning]);

  // Single source of truth for "the level timer just hit zero". Reads
  // current state via refs so it always sees fresh values, then does its
  // state mutations as plain (auto-batched) setState calls.
  const handleLevelExpiry = useCallback(() => {
    const lvls = levelsRef.current || [];
    const lvl = currentLevelRef.current;
    const atLast = lvl >= lvls.length - 1;

    if (!atLast) {
      const nextIdx = lvl + 1;
      setCurrentLevel(nextIdx);
      setTimeLeft(lvls[nextIdx].duration * 60);
      setTimeout(() => announceLevelTransition(nextIdx), 100);
      return;
    }
    // Past the last preset level — auto-append a new one with the next
    // blind step so blinds keep climbing while the game is still going.
    // (Winner detection in doEliminate ends the tournament cleanly.)
    const cur = lvls[lvl];
    if (!cur || cur.isBreak) {
      setIsRunning(false);
      return;
    }
    const newBB = nextBlindStep(cur.bb);
    const newSB = Math.floor(newBB / 2);
    const newAnte = cur.ante > 0 ? Math.floor(newBB / 4) : 0;
    const newLevel = { sb: newSB, bb: newBB, ante: newAnte, duration: cur.duration, isBreak: false };
    // Append BEFORE bumping currentLevel — React 18 auto-batches these
    // sequential calls so they commit together (the v7.47 crash came from
    // calling setLevels from INSIDE setCurrentLevel's updater).
    setLevels((prev) => [...prev, newLevel]);
    setCurrentLevel(lvl + 1);
    setTimeLeft(newLevel.duration * 60);
    sendWledEffect('levelChange');
    setTimeout(async () => {
      try {
        await speakClip('blinds-up', 'Blinds up!');
        await new Promise((r) => setTimeout(r, 200));
        const anteText = newAnte > 0 ? `, with an ante of ${newAnte}` : '';
        const key = newAnte > 0 ? `blinds-${newBB}-ante` : `blinds-${newBB}`;
        speakClip(key, `Blinds are now ${newSB} and ${newBB}${anteText}.`);
      } catch (e) { /* ignore */ }
    }, 100);
  }, [announceLevelTransition, speakClip, sendWledEffect]);

  const togglePlay = () => {
    // iOS / Safari requires the very first speak() call to happen synchronously
    // inside a user gesture. Fire a silent priming utterance to unlock the engine.
    if (voiceEnabled && typeof window !== 'undefined' && window.speechSynthesis) {
      try {
        const prime = new SpeechSynthesisUtterance('');
        prime.volume = 0;
        window.speechSynthesis.speak(prime);
      } catch (e) { /* ignore */ }
    }
    // Welcome message only on the very first start (level 1, full time, not yet started)
    if (!isRunning && !hasStarted && currentLevel === 0 && timeLeft === levels[0].duration * 60) {
      speakWelcome();
      sendWledEffect('gameStart');
      setHasStarted(true);
      // Stamp the game's actual start time so SaveGameModal can default to
      // the play date (not the device's "today" when SAVE is tapped).
      if (!gameStartedAt) setGameStartedAt(Date.now());
    }
    setIsRunning(!isRunning);
  };

  const nextLevel = () => {
    if (currentLevel < levels.length - 1) {
      const next = currentLevel + 1;
      setCurrentLevel(next);
      setTimeLeft(levels[next].duration * 60);
      if (isRunning) announceLevelTransition(next);
      return;
    }
    // Already at the last preset level — append a new one with the next
    // blind step so the tournament can keep going.
    const cur = levels[currentLevel];
    if (!cur || cur.isBreak) return;
    const newBB = nextBlindStep(cur.bb);
    const newSB = Math.floor(newBB / 2);
    const newAnte = cur.ante > 0 ? Math.floor(newBB / 4) : 0;
    const newLevel = { sb: newSB, bb: newBB, ante: newAnte, duration: cur.duration, isBreak: false };
    const nextIdx = currentLevel + 1;
    setLevels((prev) => [...prev, newLevel]);
    setCurrentLevel(nextIdx);
    setTimeLeft(newLevel.duration * 60);
    if (isRunning) {
      sendWledEffect('levelChange');
      setTimeout(async () => {
        try {
          await speakClip('blinds-up', 'Blinds up!');
          await new Promise((r) => setTimeout(r, 200));
          const anteText = newAnte > 0 ? `, with an ante of ${newAnte}` : '';
          const key = newAnte > 0 ? `blinds-${newBB}-ante` : `blinds-${newBB}`;
          speakClip(key, `Blinds are now ${newSB} and ${newBB}${anteText}.`);
        } catch (e) { /* ignore */ }
      }, 100);
    }
  };

  const prevLevel = () => {
    if (currentLevel > 0) {
      const prev = currentLevel - 1;
      setCurrentLevel(prev);
      setTimeLeft(levels[prev].duration * 60);
    }
  };

  // Add a player to the live game. If `pick` is supplied (from the roster typeahead),
  // use that name + sound. Otherwise use whatever's in the text field as a free-text fallback.
  const addPlayer = (pick) => {
    let name, sound;
    if (pick) {
      name = pick.name;
      sound = pick.sound || 'none';
    } else {
      name = newPlayerName.trim();
      sound = 'none';
    }
    if (!name) return;
    // Skip if already in this game
    if (players.find((p) => p.name === name)) {
      setNewPlayerName('');
      return;
    }
    setPlayers([...players, { name, sound }]);
    setNewPlayerName('');
    // Default a late-entry player to "paid" — common case. Admin can
    // un-tick them after the fact via the Subs Ledger.
    setBuyInsPaidByName((m) => ({ ...m, [name]: false }));
    setSubsPaidByName((m) => ({ ...m, [name]: false }));
    // Late-join welcome announcement. Per-player clip lives at
    // sounds/voice/welcome-{slug}.mp3; falls back to Web Speech if missing.
    if (voiceEnabled && hasStarted) {
      const slug = slugifyName(name);
      speakClip(`welcome-${slug}`, `Welcome to the game, ${name}.`);
    }
  };

  const togglePlayerEliminated = (name) => {
    setEliminatedPlayers((prev) => prev.includes(name) ? prev.filter((p) => p !== name) : [...prev, name]);
  };

  const removePlayer = (idx) => setPlayers(players.filter((_, i) => i !== idx));

  // Rebuy: a player who'd lost all chips is buying back in. For league
  // games, route through the knocker picker first — the previous stack
  // had a knocker who's now entitled to the +1k KO bonus (and the +2k
  // bounty if the player was bountied). HR games skip the picker and
  // just bump the count, since HR doesn't track KO / bounty points.
  const requestRebuy = (player) => {
    setShowEliminate(false);
    if (config.gameType === 'league') {
      setPendingKnockout({ player, intent: 'rebuy' });
    } else {
      applyRebuy(player.name, null);
    }
  };

  // Apply the rebuy: increment count, log the KO event (with optional
  // knocker), announce. Player stays in the active pool.
  const applyRebuy = (name, knockerOuterName) => {
    setRebuyCounts((prev) => ({ ...prev, [name]: (prev[name] || 0) + 1 }));
    if (knockerOuterName) {
      setKnockedOutBy((prev) => ({ ...prev, [name]: knockerOuterName }));
    }
    setKnockouts((prev) => [
      ...prev,
      { eliminated: name, knocker: knockerOuterName || null, rebought: true },
    ]);
    if (voiceEnabled) speakClip(`rebuy-${slugifyName(name)}`, `Rebuy for ${name}.`);
  };

  const removeRebuy = (name) => {
    setRebuyCounts((prev) => {
      const next = { ...prev };
      const cur = next[name] || 0;
      if (cur <= 1) delete next[name];
      else next[name] = cur - 1;
      return next;
    });
    // Also drop the most recent rebuy entry for this player from the
    // chronological log (so KO-bonus / bounty-claim accounting stays
    // honest if an admin un-does a rebuy).
    setKnockouts((prev) => {
      let removed = false;
      const next = [];
      for (let i = prev.length - 1; i >= 0; i--) {
        if (!removed && prev[i].eliminated === name && prev[i].rebought) {
          removed = true;
          continue;
        }
        next.unshift(prev[i]);
      }
      return next;
    });
  };

  const totalRebuys = Object.values(rebuyCounts).reduce((a, b) => a + b, 0);

  // Eliminate a player: voice "Goodbye <name>", then play their sound.
  // Also triggers "final 3" announcement and winner announcement when appropriate.
  // Step 1: user taps OUT in the eliminate modal. For league games, open the
  // "who knocked them out?" picker (for bounty credit). High Rollers has no
  // bounties, so skip straight to elimination.
  const requestEliminate = (player) => {
    setShowEliminate(false);
    // Guard: once a winner is declared OR the player is already out, ignore
    // further OUT taps. Stops a stale tap (e.g. admin double-clicking
    // because the announcement felt slow) from recording the winner as
    // also eliminated, which would scramble finishOrder.
    if (winner) return;
    if (eliminatedPlayers.includes(player.name)) return;
    if (config.gameType === 'league') {
      setPendingKnockout({ player, intent: 'out' });
    } else {
      doEliminate(player);
    }
  };

  // Step 2: user has chosen a knocker-outer (or skipped). Apply the right
  // action depending on whether they tapped OUT or REBUY.
  const confirmEliminate = (knockerOuterName) => {
    const pending = pendingKnockout;
    if (!pending) return;
    setPendingKnockout(null);
    const { player, intent } = pending;

    // Cha-ching if this KO claims a bounty (bountied player + a knocker).
    // Fires on BOTH rebuy and permanent-out paths — v2 rules credit the
    // claim regardless of whether the bountied player buys back in.
    if (knockerOuterName && config.gameType === 'league') {
      const gameDate = gameStartedAt
        ? new Date(gameStartedAt).toISOString().slice(0, 10)
        : new Date().toISOString().slice(0, 10);
      const bountyIds = computeBountyHolders(fullRosterFromDB, gameDate);
      const isBountied = fullRosterFromDB.some(
        (p) => bountyIds.includes(p.id) && p.displayName === player.name
      );
      if (isBountied) {
        playSound('bountyClaimed', customSounds);
      }
    }

    if (intent === 'rebuy') {
      applyRebuy(player.name, knockerOuterName);
      return;
    }
    if (knockerOuterName) {
      setKnockedOutBy((prev) => ({ ...prev, [player.name]: knockerOuterName }));
    }
    setKnockouts((prev) => [
      ...prev,
      { eliminated: player.name, knocker: knockerOuterName || null, rebought: false },
    ]);
    doEliminate(player);
  };

  const doEliminate = (player) => {
    // Idempotency guards — see requestEliminate for why these matter.
    if (winner) return;
    if (eliminatedPlayers.includes(player.name)) return;

    const remainingAfter = activePlayers.length - 1;
    setEliminatedPlayers((prev) => [...prev, player.name]);

    // Red flash on every elimination. Auto-returns to idle after holdMs.
    // For the final-3 / winner cases, the subsequent LED effect fires later
    // and overrides idle — so this brief flash is safe to fire unconditionally.
    sendWledEffect('elimination');

    // Always: goodbye + their sound. Capture the player-sound promise so we
    // can chain the winner announcement off it on the final elimination.
    let playerSoundPromise;
    if (voiceEnabled) {
      speakClip(`goodbye-${slugifyName(player.name)}`, `Goodbye, ${player.name}.`);
      playerSoundPromise = new Promise((resolve) => {
        setTimeout(() => { resolve(playSound(player.sound, customSounds, player.customSoundUrl || null)); }, 1400);
      });
    } else {
      playerSoundPromise = playSound(player.sound, customSounds, player.customSoundUrl || null);
    }

    // Final 3: announcement (only if we just dropped TO 3, and only when starting field was >3)
    if (remainingAfter === 3 && players.length > 3) {
      setTimeout(() => {
        if (voiceEnabled) speakClip('final-3', 'We are down to the final three!');
        sendWledEffect('finalThree');
      }, 3000);
    }

    // Winner: 1 player left. Show the winner overlay IMMEDIATELY so the
    // admin has visual confirmation the game is over — long eliminated-
    // player sounds used to delay this by 5+ seconds, which looked like a
    // stall and led admins to tap OUT on the actual winner. The sound
    // chain still plays in the background, just after the overlay is up.
    if (remainingAfter === 1) {
      setIsRunning(false);
      const winnerObj = activePlayers.find((p) => p.name !== player.name);
      setWinner(winnerObj);
      (async () => {
        try { await playerSoundPromise; } catch (e) { /* ignore */ }
        // Small breath between the player's sound ending and the fanfare
        await new Promise((r) => setTimeout(r, 400));
        sendWledEffect('winner');
        playSound('fanfare', customSounds);
        // Let fanfare lead for ~2.2s before the winner announcement
        await new Promise((r) => setTimeout(r, 2200));
        if (voiceEnabled && winnerObj) {
          const slug = slugifyName(winnerObj.name);
          speakClipQueue([
            { key: `winner-${slug}`, fallback: `And the winner is... ${winnerObj.name}!` },
            { key: `congrats-${slug}`, fallback: `Congratulations, ${winnerObj.name}!` },
          ]);
        }
      })();
    }
  };

  // Keep `eliminatePlayer` as a back-compat alias used by some places (e.g. eliminate modal OUT button).
  // It now goes through the picker flow.
  const eliminatePlayer = requestEliminate;

  // Un-eliminate (in case of misclick)
  const restorePlayer = (name) => {
    setEliminatedPlayers((prev) => prev.filter((p) => p !== name));
    // Reverse the corresponding KO event: drop the most recent OUT
    // entry (rebought:false) for this player from the chronological
    // log. Without this, an accidental OUT + Restore leaves an orphan
    // knockouts entry that dirties the audit trail forever (and any
    // knocker who was tagged silently keeps their +1k KO bonus).
    setKnockouts((prev) => {
      let removed = false;
      const next = [];
      for (let i = prev.length - 1; i >= 0; i--) {
        if (!removed && prev[i].eliminated === name && !prev[i].rebought) {
          removed = true;
          continue;
        }
        next.unshift(prev[i]);
      }
      return next;
    });
    // Legacy last-knocker map — clear too so bounty math doesn't linger.
    setKnockedOutBy((prev) => {
      if (!(name in prev)) return prev;
      const next = { ...prev };
      delete next[name];
      return next;
    });
  };

  const updateLevel = (idx, field, value) => {
    const newLevels = [...levels];
    const oldVal = newLevels[idx][field];
    newLevels[idx] = { ...newLevels[idx], [field]: value };
    setLevels(newLevels);
    // Extending (or shrinking) the duration of the CURRENT level needs to
    // bleed into the clock — otherwise the new value sits in state but
    // timeLeft keeps ticking down with the old remaining. We apply the
    // delta additively (so a +5 min change adds 5 min to whatever's left,
    // rather than resetting progress for the level). Future levels don't
    // need this because the transition handler reads the fresh duration
    // when it sets timeLeft on roll-over. Read currentLevel via the ref
    // so a stale closure can't apply the delta to the wrong row.
    if (field === 'duration' && idx === currentLevelRef.current) {
      const delta = (Number(value) - Number(oldVal || 0)) * 60;
      if (delta !== 0) setTimeLeft((t) => Math.max(0, t + delta));
    }
  };

  const addLevel = () => {
    const last = levels[levels.length - 1];
    // Skip back past any trailing break to find the last play level for doubling.
    const lastPlay = [...levels].reverse().find((l) => !l.isBreak) || last;
    setLevels([...levels, { ...lastPlay, sb: lastPlay.sb * 2, bb: lastPlay.bb * 2, isBreak: false }]);
  };

  const addBreak = () => {
    // 10-minute break by default. Sits at the end of the structure; user can
    // drag... well, edit duration or delete. (No reordering UI yet.)
    setLevels([...levels, { sb: 0, bb: 0, ante: 0, duration: 10, isBreak: true }]);
  };

  const removeLevel = (idx) => {
    if (levels.length > 1) {
      setLevels(levels.filter((_, i) => i !== idx));
      if (currentLevel >= levels.length - 1) setCurrentLevel(Math.max(0, levels.length - 2));
    }
  };

  // Defensive: if currentLevel ever points past the array (e.g. a brief
  // race during the auto-extend), fall back to the last available level
  // instead of crashing the whole timer screen.
  const level = levels[currentLevel] || levels[levels.length - 1] || { sb: 0, bb: 0, ante: 0, duration: 1, isBreak: false };
  const nextLvl = levels[currentLevel + 1];
  const activePlayers = players.filter((p) => !eliminatedPlayers.includes(p.name));
  const progress = 1 - timeLeft / ((level.duration || 1) * 60);
  // Prize pool includes rebuys
  const totalEntries = players.length + totalRebuys;
  const prizePool = config.buyIn * totalEntries;
  // Avg stack: sum of all starting stacks (per-player if set, else config.stackSize) + rebuy chips, ÷ active players
  const baseChipsFromStarting = config.playerStartingStacks
    ? Object.values(config.playerStartingStacks).reduce((a, b) => a + b, 0)
    : config.stackSize * players.length;
  const totalChipsInPlay = baseChipsFromStarting + (config.stackSize * totalRebuys);
  const avgStack = activePlayers.length > 0 ? Math.round(totalChipsInPlay / activePlayers.length) : 0;

  // ===== End-time projection =====
  // Minute-by-minute simulation. At each minute we compute the current
  // average stack in BBs and translate that to a bust-out rate (empirically
  // tuned for an amateur club: ~1 bust per (avgBB/2 + 2) minutes). Players
  // decrement until only one is left, then we report the wall-clock time
  // at that point.
  //
  // Why this beats the simpler "find the level where BB ≥ totalChips/N/15"
  // heuristic: that approach fires when blinds first get punishing, but
  // doesn't model the actual cascade that happens once they do. The
  // simulation captures the self-reinforcing acceleration — as players
  // bust, avg stack grows slowly, but BB grows much faster across level
  // changes, so avgBB drops over time and busts speed up.
  const endProjection = (() => {
    if (!levels || levels.length === 0) return null;
    if (activePlayers.length <= 1) return null;

    // Worst-case "latest end": every remaining level plays in full.
    let latestEndSec = timeLeft;
    for (let i = currentLevel + 1; i < levels.length; i++) {
      latestEndSec += levels[i].duration * 60;
    }

    // Simulate forward in 60-second steps.
    let alive = activePlayers.length;
    let levelIdx = currentLevel;
    let secsLeftInLevel = timeLeft;
    let elapsedSec = 0;
    let bustAccum = 0;
    const MAX_SIM_SEC = 12 * 60 * 60; // 12-hour safety net
    while (alive > 1 && levelIdx < levels.length && elapsedSec < MAX_SIM_SEC) {
      const lvl = levels[levelIdx];
      const step = Math.min(60, Math.max(1, secsLeftInLevel));
      if (lvl && !lvl.isBreak && lvl.bb > 0) {
        const avgStack = totalChipsInPlay / alive;
        const avgBB = Math.max(1, avgStack / lvl.bb);
        // Two effects compose:
        //   stackPressure — busts speed up as avgBB shrinks (calibrated
        //     against amateur-club play; ~1 bust per (avgBB/2 + 2) min).
        //   playerDamper — small fields play SLOWER per-bust than big ones:
        //     deep stacks relative to chips-in-play, tighter ranges as the
        //     bubble approaches, and a long heads-up grind. Damper drops
        //     linearly from 1 at 6+ players down to 0.2 at heads-up.
        const stackPressure = 1 / (avgBB / 2 + 2);
        const playerDamper = Math.max(0.2, Math.min(1, (alive - 1) / 5));
        const elimsPerMin = stackPressure * playerDamper;
        bustAccum += elimsPerMin * (step / 60);
        while (bustAccum >= 1 && alive > 1) {
          alive -= 1;
          bustAccum -= 1;
        }
      }
      elapsedSec += step;
      secsLeftInLevel -= step;
      if (secsLeftInLevel <= 0) {
        levelIdx += 1;
        if (levels[levelIdx]) secsLeftInLevel = levels[levelIdx].duration * 60;
      }
    }
    // If we ran out of levels with players left, fall back to latest.
    const projectedSec = alive > 1 ? latestEndSec : elapsedSec;

    const now = Date.now();
    const fmt = (d) => d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    return {
      likely: fmt(new Date(now + projectedSec * 1000)),
      latest: fmt(new Date(now + latestEndSec * 1000)),
    };
  })();

  // Final 3 dramatic mode: when 3 or fewer remain and the field started larger.
  const finalThreeMode = activePlayers.length <= 3 && players.length > 3 && !winner;

            const preTotals = seasonPreGameTotals || {};

              const preGame = pid ? (preTotals[pid] || 0) : 0;
              return { name: pl.name, pid, isBountied: bountyNameSet.has(pl.name), liveTotal: preGame + liveTonight, preGame };
            });
            const attendeePidSet = new Set(attendeeInfo.map((a) => a.pid).filter(Boolean));

            // Non-attendees hold their pre-game total (their live total
            // doesn't change tonight — attendees just slide past them).
            const nonAttendees = Object.entries(preTotals)
              .filter(([pid]) => !attendeePidSet.has(pid))
              .map(([pid, pts]) => {
                const p = fullRosterFromDB.find((x) => x.id === pid);

            const universe = [...attendeeInfo, ...nonAttendees];

            const rankMap = (key) => {

              const ranks = {};
              let lastScore = null, lastRank = 0;
              sorted.forEach((row, i) => {

            const preRanks = rankMap('preGame');

            const standings = universe

                liveTotal: row.liveTotal,

                delta: (preRanks[row.name] || 0) - (liveRanks[row.name] || 0),

            const bountiedMissing = bountyIds

                onPointerDown={(e) => {
                  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
                  scrubDraggingRef.current = true;
                  const rect = e.currentTarget.getBoundingClientRect();
                  const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                  const total = level.duration * 60;
                  setTimeLeft(Math.max(0, Math.min(total, Math.round(total - ratio * total))));
                }}
                onPointerMove={(e) => {
                  if (!scrubDraggingRef.current) return;
                  const rect = e.currentTarget.getBoundingClientRect();
                  const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                  const total = level.duration * 60;
                  setTimeLeft(Math.max(0, Math.min(total, Math.round(total - ratio * total))));
                }}
                onPointerUp={(e) => {
                  scrubDraggingRef.current = false;
                  try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
                }}
                onPointerCancel={() => { scrubDraggingRef.current = false; }}
                onPointerLeave={() => { scrubDraggingRef.current = false; }}
                className="h-3 bg-black/40 rounded-full overflow-hidden mt-4 mx-auto max-w-md cursor-pointer relative group touch-none"
