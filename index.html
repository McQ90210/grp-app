          <button onClick={onClose} className="text-yellow-100/60 hover:text-yellow-100"><X size={20} /></button>
        </div>

        {perGame.length === 0 ? (
          <div className="text-yellow-100/60 font-mono text-sm text-center py-6">
            {mode === 'game' ? 'Player didn\'t attend this game.' : 'No qualifying games yet.'}
          </div>
        ) : (
          <>
            <div className="space-y-3">
              {perGame.map(({ game, breakdown }) => (
                <div key={game.id} className="rounded-xl bg-black/30 border border-yellow-500/15 p-3">
                  <div className="flex items-center justify-between mb-2">
                    <div className="font-mono text-xs text-yellow-100/70 tracking-widest">
                      G{game.gameNumber}{game.isFinal ? ' · FINAL' : ''} · {game.date}
                    </div>
                    <div className="font-display text-xl gold-text">
                      {breakdown.total.toLocaleString()}
                    </div>
                  </div>
                  {breakdown.isFinal ? (
                    <div className="text-xs font-mono text-yellow-100/50 italic">
                      Finals don't award league points.
                    </div>
                  ) : (
                    <div className="space-y-1">
                      {breakdown.parts.map((p, i) => (
                        <div key={i} className="flex justify-between items-baseline gap-3 py-0.5">
                          <div className="min-w-0">
                            <div className="text-emerald-100 text-sm">{p.label}</div>
                            {p.detail && (
                              <div className="text-yellow-100/40 font-mono text-[10px] truncate">{p.detail}</div>
                            )}
                          </div>
                          <div className="text-yellow-100 font-mono text-sm shrink-0">
                            +{p.points.toLocaleString()}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              ))}
            </div>
            {mode === 'season' && perGame.length > 1 && (
              <div className="mt-4 p-3 rounded-xl bg-black/40 border border-yellow-500/30 flex justify-between items-baseline">
                <div className="font-mono text-xs text-yellow-100/60 tracking-widest">SEASON TOTAL</div>
                <div className="font-display text-3xl gold-text">{grandTotal.toLocaleString()}</div>
              </div>
            )}
          </>
        )}

        <button
          onClick={onClose}
          className="mt-4 w-full px-4 py-2.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100 font-mono text-sm"
        >
          CLOSE
        </button>
      </div>
    </div>
  );
}

// ============ MANAGE PLAYERS MODAL ============
// Admin bulk-edit screen for player email addresses. Useful for collecting
// emails from the whole roster at once when first setting up the results-
// email pipeline, and for occasional updates after.
function ManagePlayersModal({ onClose, onSaved }) {
  const [players, setPlayers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [edits, setEdits] = useState({}); // { [id]: { email?, sound? } } — pending changes
  const [customSounds, setCustomSounds] = useState({});
  const [saving, setSaving] = useState(false);
  const [savedCount, setSavedCount] = useState(0);
  const [error, setError] = useState(null);
  // New-player form: collected separately from `edits` since it doesn't have
  // an id yet. Cleared on successful add.
  const [newName, setNewName] = useState('');
  const [newSound, setNewSound] = useState('none');
  const [adding, setAdding] = useState(false);
  const [addJustOk, setAddJustOk] = useState(null); // displayName of last successful add (for confirmation)
  // Per-row custom-sound upload state. { [pid]: 'idle' | 'uploading' | 'error message' }
  const [uploadState, setUploadState] = useState({});
  // Hidden file inputs — one per row keyed by pid, plus one for the ADD
  // PLAYER form. Populated as rows render. The sound dropdown's
  // "＋ Upload…" option programmatically clicks the matching input.
  const rowFileInputs = useRef({});
  const addFileInput = useRef(null);

  // Trigger a per-player MP3/WAV upload. File comes from a hidden <input
  // type="file"> tied to a click on the "Upload" button. On success the
  // player doc gets a `customSoundUrl` field and we refresh the local
  // roster so the row re-renders with the custom-sound indicator.
  const handleUpload = async (pid, file) => {
    if (!file) return;
    setUploadState((s) => ({ ...s, [pid]: 'uploading' }));
    try {
      await window.GRP_DB.uploadPlayerSound(pid, file);
      const all = await window.GRP_DB.getAllPlayers();
      all.sort((a, b) => (a.displayName || '').localeCompare(b.displayName || ''));
      setPlayers(all);
      setUploadState((s) => { const n = { ...s }; delete n[pid]; return n; });
      if (onSaved) onSaved(1);
    } catch (e) {
      setUploadState((s) => ({ ...s, [pid]: e.message || 'Upload failed' }));
    }
  };

  const handleRemoveCustom = async (pid) => {
    setUploadState((s) => ({ ...s, [pid]: 'uploading' }));
    try {
      await window.GRP_DB.removePlayerSound(pid);
      const all = await window.GRP_DB.getAllPlayers();
      all.sort((a, b) => (a.displayName || '').localeCompare(b.displayName || ''));
      setPlayers(all);
      setUploadState((s) => { const n = { ...s }; delete n[pid]; return n; });
      if (onSaved) onSaved(1);
    } catch (e) {
      setUploadState((s) => ({ ...s, [pid]: e.message || 'Remove failed' }));
    }
  };

  useEffect(() => {
    let cancelled = false;
    const doLoad = async () => {
      try {
        const all = await window.GRP_DB.getAllPlayers();
        if (cancelled) return;
        all.sort((a, b) => (a.displayName || '').localeCompare(b.displayName || ''));
        setPlayers(all);
        setLoading(false);
      } catch (e) {
        if (!cancelled) { setError(e.message); setLoading(false); }
      }
    };
    if (window.GRP_DB) doLoad();
    else {
      const onReady = () => doLoad();
      window.addEventListener('firebase-ready', onReady);
      return () => { cancelled = true; window.removeEventListener('firebase-ready', onReady); };
    }
    // Load custom sounds in parallel so the dropdown can show them.
    loadCustomSounds().then((cs) => { if (!cancelled) setCustomSounds(cs || {}); }).catch(() => {});
    return () => { cancelled = true; };
  }, []);

  // Generic field setter — same code path for email and sound.
  const setField = (id, field, val) => {
    setEdits((e) => ({ ...e, [id]: { ...(e[id] || {}), [field]: val } }));
  };

  // "Dirty" = the value in `edits` differs from the saved one in `players`.
  // Need to consider both email and sound now.
  const isFieldDirty = (id, field, defaultVal = '') => {
    const ed = edits[id];
    if (!ed || ed[field] === undefined) return false;
    const before = (players.find((p) => p.id === id)?.[field] ?? defaultVal);
    const after = ed[field];
    if (field === 'email') {
      return (before || '').trim() !== (after || '').trim();
    }
    if (field === 'hrRegular') {
      return (!!before) !== (!!after);
    }
    // sound
    return (before || 'none') !== (after || 'none');
  };
  const isRowDirty = (id) =>
    isFieldDirty(id, 'email') ||
    isFieldDirty(id, 'sound') ||
    isFieldDirty(id, 'hrRegular', false);
  const dirtyCount = Object.keys(edits).filter(isRowDirty).length;

  // Add a brand-new player. Slug is derived from displayName via the same
  // rule the rest of the app uses, so any in-game PID that was auto-saved
  // earlier (e.g. game docs referencing `ben`) will line up automatically
  // once a player doc with the matching displayName exists.
  const addPlayer = async () => {
    const name = newName.trim();
    if (!name) return;
    setError(null);
    setAdding(true);
    try {
      const id = slugifyName(name);
      if (players.find((p) => p.id === id)) {
        throw new Error(`A player with id "${id}" already exists.`);
      }
      await window.GRP_DB.upsertPlayer({
        displayName: name,
        sound: newSound || 'none',
        active: true,
      });
      // Refresh the roster so the new row shows up immediately.
      const all = await window.GRP_DB.getAllPlayers();
      all.sort((a, b) => (a.displayName || '').localeCompare(b.displayName || ''));
      setPlayers(all);
      setAddJustOk(name);
      setNewName('');
      setNewSound('none');
      if (onSaved) onSaved(1);
    } catch (e) {
      setError(e.message || 'Could not add player.');
    } finally {
      setAdding(false);
    }
  };

  const save = async () => {
    setError(null);
    setSaving(true);
    setSavedCount(0);
    try {
      // Validate emails first so nothing partial gets written.
      for (const [id, ed] of Object.entries(edits)) {
        if (ed.email !== undefined) {
          const v = (ed.email || '').trim();
          if (v && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
            throw new Error(`Invalid email for "${id}": ${v}`);
          }
        }
      }
      let n = 0;
      for (const [id, ed] of Object.entries(edits)) {
        if (!isRowDirty(id)) continue;
        const update = { id };
        if (ed.email !== undefined) update.email = (ed.email || '').trim() || null;
        if (ed.sound !== undefined) update.sound = ed.sound || 'none';
        if (ed.hrRegular !== undefined) update.hrRegular = !!ed.hrRegular;
        await window.GRP_DB.upsertPlayer(update);
        n += 1;
      }
      setSavedCount(n);
      setEdits({});
      const all = await window.GRP_DB.getAllPlayers();
      all.sort((a, b) => (a.displayName || '').localeCompare(b.displayName || ''));
      setPlayers(all);
      if (onSaved) onSaved(n);
    } catch (e) {
      setError(e.message || 'Save failed.');
    } finally {
      setSaving(false);
    }
  };

  return (
    <div onClick={onClose} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="gold-border rounded-3xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
        <div className="flex justify-between items-start mb-4">
          <div>
            <div className="font-display text-3xl gold-text">MANAGE PLAYERS</div>
            <div className="text-yellow-100/60 font-mono text-xs mt-1">Edit emails (for the morning-after results email) and elimination sounds.</div>
          </div>
          <button onClick={onClose} className="text-yellow-100/60 hover:text-yellow-100"><X size={20} /></button>
        </div>

        {loading ? (
          <div className="text-center py-12 text-emerald-200/60 font-mono">Loading…</div>
        ) : (
          <>
            {error && (
              <div className="mb-3 p-3 rounded-lg bg-red-950/40 border border-red-500/40 text-red-200 font-mono text-xs">{error}</div>
            )}
            {savedCount > 0 && (
              <div className="mb-3 p-3 rounded-lg bg-emerald-950/40 border border-emerald-500/40 text-emerald-200 font-mono text-xs">
                ✓ Saved {savedCount} player{savedCount === 1 ? '' : 's'}.
              </div>
            )}
            {addJustOk && (
              <div className="mb-3 p-3 rounded-lg bg-emerald-950/40 border border-emerald-500/40 text-emerald-200 font-mono text-xs">
                ✓ Added <span className="text-emerald-100">{addJustOk}</span>.
              </div>
            )}

            {/* Add a brand-new player. PID is auto-derived from the display
                name (lowercase, hyphenated) so any past in-game references
                to a slug like "ben" will line up once the row is created. */}
            <div className="mb-5 p-3 rounded-lg bg-emerald-950/30 border border-emerald-500/20">
              <div className="font-mono text-[11px] text-emerald-300/80 tracking-widest mb-2">+ ADD PLAYER</div>
              <div className="flex flex-wrap items-center gap-2">
                <input
                  type="text"
                  value={newName}
                  onChange={(e) => { setNewName(e.target.value); if (addJustOk) setAddJustOk(null); }}
                  onKeyDown={(e) => { if (e.key === 'Enter') addPlayer(); }}
                  placeholder="Display name (e.g. Ben)"
                  className="flex-1 min-w-[180px] px-2 py-1.5 rounded bg-black/40 border border-emerald-500/30 text-yellow-50 placeholder-yellow-100/30 font-mono text-xs focus:outline-none focus:border-emerald-400/60"
                />
                <select
                  value={newSound}
                  onChange={(e) => {
                    if (e.target.value === '__upload__') {
                      const name = newName.trim();
                      if (!name) {
                        setError('Type a display name first, then pick "＋ Upload MP3/WAV…".');
                        return;
                      }
                      setError(null);
                      addFileInput.current?.click();
                      return;
                    }
                    setNewSound(e.target.value);
                  }}
                  className="w-36 px-1.5 py-1.5 rounded bg-black/40 border border-emerald-500/30 text-yellow-50 font-mono text-xs focus:outline-none focus:border-emerald-400/60"
                  title="Elimination sound"
                >
                  <option value="none" style={{ background: '#0a3d1f' }}>None</option>
                  <option value="__upload__" style={{ background: '#0a3d1f', color: '#f4d03f' }}>＋ Upload MP3/WAV…</option>
                  {Object.keys(customSounds).length > 0 && (
                    <optgroup label="Your sounds">
                      {Object.entries(customSounds).map(([key, s]) => (
                        <option key={`c-${key}`} value={key} style={{ background: '#0a3d1f' }}>
                          {s.label}
                        </option>
                      ))}
                    </optgroup>
                  )}
                  <optgroup label="Built-in">
                    {Object.entries(SOUND_LIBRARY).filter(([k, s]) => k !== 'none' && !s.system).map(([key, s]) => (
                      <option key={key} value={key} style={{ background: '#0a3d1f' }}>
                        {s.label}
                      </option>
                    ))}
                  </optgroup>
                </select>
                <input
                  ref={addFileInput}
                  type="file"
                  accept="audio/*"
                  className="hidden"
                  onChange={async (e) => {
                    const f = e.target.files && e.target.files[0];
                    e.target.value = '';
                    if (!f) return;
                    // "＋ Upload…" flow from the ADD form: create the player
                    // doc with sound=none, then upload the audio for the
                    // newly-derived PID. Wraps both operations in the same
                    // busy/error surface as the ordinary ADD button.
                    const name = newName.trim();
                    if (!name) { setError('Type a display name first.'); return; }
                    const id = slugifyName(name);
                    if (players.find((p) => p.id === id)) {
                      setError(`A player with id "${id}" already exists.`);
                      return;
                    }
                    setError(null);
                    setAdding(true);
                    try {
                      await window.GRP_DB.upsertPlayer({ displayName: name, sound: 'none', active: true });
                      await window.GRP_DB.uploadPlayerSound(id, f);
                      const all = await window.GRP_DB.getAllPlayers();
                      all.sort((a, b) => (a.displayName || '').localeCompare(b.displayName || ''));
                      setPlayers(all);
                      setAddJustOk(name);
                      setNewName('');
                      setNewSound('none');
                      if (onSaved) onSaved(1);
                    } catch (err) {
                      setError(err.message || 'Add + upload failed.');
                    } finally {
                      setAdding(false);
                    }
                  }}
                />
                <button
                  onClick={addPlayer}
                  disabled={!newName.trim() || adding}
                  className="px-4 py-1.5 rounded-full font-display text-sm text-black disabled:opacity-30"
                  style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
                >
                  {adding ? 'Adding…' : 'ADD'}
                </button>
              </div>
            </div>

            <div className="space-y-1 mb-5 max-h-[60vh] overflow-y-auto pr-2">
              {players.map((p) => {
                const currentEmail = edits[p.id]?.email !== undefined ? edits[p.id].email : (p.email || '');
                const currentSound = edits[p.id]?.sound !== undefined ? edits[p.id].sound : (p.sound || 'none');
                const currentHrRegular = edits[p.id]?.hrRegular !== undefined ? edits[p.id].hrRegular : !!p.hrRegular;
                const isDirty = isRowDirty(p.id);
                return (
                  <div
                    key={p.id}
                    className={`flex flex-wrap items-center gap-2 px-2 py-1.5 rounded border ${isDirty ? 'bg-yellow-500/10 border-yellow-500/40' : 'border-transparent'}`}
                  >
                    <div className="w-32 font-mono text-sm text-emerald-100 truncate" title={p.realName || p.displayName}>
                      {p.displayName}
                    </div>
                    <label
                      className="flex items-center gap-1 px-2 py-1 rounded bg-black/40 border border-yellow-500/15 cursor-pointer hover:border-yellow-500/40"
                      title="High Rollers regular — receives the morning-after HR results email"
                    >
                      <input
                        type="checkbox"
                        checked={currentHrRegular}
                        onChange={(e) => setField(p.id, 'hrRegular', e.target.checked)}
                        className="accent-emerald-500"
                      />
                      <span className="font-mono text-[10px] text-yellow-100/70 tracking-widest">HR</span>
                    </label>
                    <input
                      type="email"
                      value={currentEmail}
                      onChange={(e) => setField(p.id, 'email', e.target.value)}
                      placeholder="player@example.com"
                      className="flex-1 min-w-[180px] px-2 py-1 rounded bg-black/40 border border-yellow-500/15 text-yellow-50 placeholder-yellow-100/30 font-mono text-xs focus:outline-none focus:border-yellow-500/40"
                    />
                    {p.customSoundUrl ? (
                      <div className="w-36 flex items-center gap-1 px-1.5 py-1 rounded bg-emerald-700/25 border border-emerald-400/60 text-emerald-100 font-mono text-xs">
                        <Music size={11} />
                        <span className="flex-1 truncate">{uploadState[p.id] === 'uploading' ? '...' : 'Custom'}</span>
                        <button
                          onClick={() => handleRemoveCustom(p.id)}
                          disabled={uploadState[p.id] === 'uploading'}
                          className="text-red-300 hover:text-red-100 disabled:opacity-40"
                          title="Remove custom sound (reverts to dropdown selection)"
                        >
                          <X size={11} />
                        </button>
                      </div>
                    ) : (
                      <select
                        value={currentSound}
                        onChange={(e) => {
                          if (e.target.value === '__upload__') {
                            const input = rowFileInputs.current[p.id];
                            if (input) input.click();
                            // Don't touch state — select re-renders with previous value.
                            return;
                          }
                          setField(p.id, 'sound', e.target.value);
                        }}
                        className="w-36 px-1.5 py-1 rounded bg-black/40 border border-yellow-500/15 text-yellow-50 font-mono text-xs focus:outline-none focus:border-yellow-500/40"
                        title="Elimination sound"
                      >
                        <option value="none" style={{ background: '#0a3d1f' }}>None</option>
                        <option value="__upload__" style={{ background: '#0a3d1f', color: '#f4d03f' }}>＋ Upload MP3/WAV…</option>
                        {Object.keys(customSounds).length > 0 && (
                          <optgroup label="Your sounds">
                            {Object.entries(customSounds).map(([key, s]) => (
                              <option key={`c-${key}`} value={key} style={{ background: '#0a3d1f' }}>
                                {s.label}
                              </option>
                            ))}
                          </optgroup>
                        )}
                        <optgroup label="Built-in">
                          {Object.entries(SOUND_LIBRARY).filter(([k, s]) => k !== 'none' && !s.system).map(([key, s]) => (
                            <option key={key} value={key} style={{ background: '#0a3d1f' }}>
                              {s.label}
                            </option>
                          ))}
                        </optgroup>
                      </select>
                    )}
                    <button
                      onClick={() => playSound(currentSound || 'none', customSounds, p.customSoundUrl || null)}
                      disabled={!p.customSoundUrl && (!currentSound || currentSound === 'none')}
                      className="px-2 py-1 rounded bg-yellow-500/10 border border-yellow-500/30 text-yellow-100 text-xs disabled:opacity-30"
                      title="Preview sound"
                    >
                      <Music size={12} />
                    </button>
                    {/* Hidden file input tied to the "＋ Upload…" dropdown
                        option for this row. Not itself visible. */}
                    <input
                      ref={(el) => { rowFileInputs.current[p.id] = el; }}
                      type="file"
                      accept="audio/*"
                      className="hidden"
                      disabled={uploadState[p.id] === 'uploading'}
                      onChange={(e) => {
                        const f = e.target.files && e.target.files[0];
                        if (f) handleUpload(p.id, f);
                        e.target.value = '';
                      }}
                    />
                    {uploadState[p.id] === 'uploading' && (
                      <span className="font-mono text-[10px] text-yellow-100/60 whitespace-nowrap">uploading…</span>
                    )}
                    {uploadState[p.id] && uploadState[p.id] !== 'uploading' && (
                      <div className="w-full text-red-300 font-mono text-[10px] mt-1">
                        {uploadState[p.id]}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            <div className="flex gap-2">
              <button
                onClick={onClose}
                disabled={saving}
                className="flex-1 px-4 py-2.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100 font-mono text-sm disabled:opacity-30"
              >
                CLOSE
              </button>
              <button
                onClick={save}
                disabled={saving || dirtyCount === 0}
                className="flex-1 px-4 py-2.5 rounded-full font-display text-lg text-black disabled:opacity-30"
                style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
              >
                {saving ? 'SAVING…' : dirtyCount > 0 ? `SAVE ${dirtyCount} CHANGE${dirtyCount === 1 ? '' : 'S'}` : 'SAVE'}
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ============ CONFIRM DIALOG (shared) ============
// For destructive ops: requires typing "DELETE" to confirm.
function ConfirmDialog({ title, message, requireType, onConfirm, onCancel }) {
  const [typed, setTyped] = useState('');
  const ok = requireType ? typed === requireType : true;
  return (
    <div onClick={onCancel} className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="rounded-2xl bg-gradient-to-br from-red-950/40 to-black p-6 max-w-sm w-full" style={{ border: '1px solid rgba(239, 68, 68, 0.3)' }}>
        <div className="font-display text-2xl text-red-300 mb-2">{title}</div>
        <div className="text-yellow-100/80 text-sm mb-4">{message}</div>
        {requireType && (
          <>
            <div className="text-yellow-100/40 text-xs font-mono mb-2">
              Type <span className="text-red-300 font-bold">{requireType}</span> to confirm:
            </div>
            <input
              type="text"
              value={typed}
              onChange={(e) => setTyped(e.target.value)}
              autoFocus
              className="w-full px-3 py-2 mb-4 rounded-lg bg-black/40 border border-red-500/30 text-red-100 font-mono focus:outline-none focus:border-red-400"
            />
          </>
        )}
        <div className="flex gap-2">
          <button
            onClick={onCancel}
            className="flex-1 px-4 py-2.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100 font-mono text-sm"
          >
            CANCEL
          </button>
          <button
            onClick={onConfirm}
            disabled={!ok}
            className="flex-1 px-4 py-2.5 rounded-full font-display text-base bg-red-600 text-white disabled:opacity-30"
          >
            CONFIRM
          </button>
        </div>
      </div>
    </div>
  );
}

// ============ EDIT GAME MODAL ============
// ============ SAVE GAME MODAL ============
// Opens after a tournament finishes (from the winner overlay). Auto-populates
// all the league/HR fields from the live game state, lets the admin review &
// tweak, then writes to Firestore. Requires sign-in.
function SaveGameModal({
  // Game data from the timer
  gameType,        // 'league' | 'highrollers'
  leagueContext,   // { seasonId, gameNumber, isFinal, season } | null
  config,          // { buyIn, ... }
  players,         // [{ name, sound }, ...]
  finishOrder,     // [name, name, ...] in finishing order, 1st first
  totalRebuys,
  rebuyCounts,     // { name: count }
  knockedOutBy,    // { eliminatedName: knockerOuterName } — legacy single-shot map
  knockouts,       // [{ eliminated, knocker, rebought }] — chronological log (v2)
  buyInsPaidByName, // { displayName: bool } — per-attendee buy-in paid (league)
  subsPaidByName,   // { displayName: bool } — per-attendee subs paid (league, non-final)
  payoutKey,
  gameStartedAt,   // ms-since-epoch when first PLAY was pressed (or null)
  // UI
  fbUser,
  fullRosterFromDB,
  onClose,
  onSaved,
}) {
  const playersById = {};
  fullRosterFromDB.forEach((p) => { playersById[p.id] = p; });
  const playersByName = {};
  fullRosterFromDB.forEach((p) => { playersByName[p.displayName] = p; });

  // Helper: resolve a display name to a Firestore player ID (or slugify as fallback)
  const resolvePid = (name) => {
    const exact = playersByName[name];
    if (exact) return exact.id;
    return slugifyName(name);
  };

  const isFinal = leagueContext?.isFinal === true;
  // Default the DATE field to the date the game *started* in UK time, not
  // the device's "today" when SAVE was tapped. Important for late-night
  // games that finish after midnight — saving at 1 AM Saturday should
  // still stamp the game as Friday (when it was actually played). en-CA
  // locale gives YYYY-MM-DD format directly; the Europe/London timeZone
  // keeps the date right across UTC midnight rollovers.
  const today = new Date(gameStartedAt || Date.now()).toLocaleDateString(
    'en-CA',
    { timeZone: 'Europe/London' }
  );

  // Auto-compute defaults from live game state
  const initialAttendees = players.map((p) => resolvePid(p.name));
  const initialFinishOrder = finishOrder.map(resolvePid);
  const initialPlayerCount = players.length;
  const initialPot = config.buyIn * (initialPlayerCount + totalRebuys);

  // Bountied for today
  const bountyIds = computeBountyHolders(fullRosterFromDB, today);
  const bountyNames = new Set(
    fullRosterFromDB.filter((p) => bountyIds.includes(p.id)).map((p) => p.displayName)
  );

  // Rules version for this game (v1 for pre-Jul-2026 games, v2 onwards).
  const rulesVersion = rulesVersionForGame({ date: today });

  // First out = last name in finishOrder (1st-place is first, so last = first eliminated).
  // null if no one was eliminated (shouldn't happen — winner overlay requires it).
  // First-out = first player ever knocked out, even if they later rebought
  // and finished mid-pack. Prefer the knockouts log; fall back to
  // finishOrder[last] (legacy games).
  const firstOutName = (Array.isArray(knockouts) && knockouts.length > 0)
    ? knockouts[0].eliminated
    : (finishOrder.length > 0 ? finishOrder[finishOrder.length - 1] : null);
  const winnerName = finishOrder.length > 0 ? finishOrder[0] : null;

  // Resolve bounty claims (v2): each live bounty (initial + one per rebuy)
  // either claimed by a knocker or self-claimed by the bountied player if
  // they survived to game end. v1 games derive claims from knockedOutBy
  // inside computePointsAwarded.
  const initialBountyClaimsByName = rulesVersion === 'v2'
    ? resolveBountyClaims({
        bountiedNames: bountyNames,
        knockouts,
        rebuyCounts,
        winnerName,
      })
    : (() => {
        // v1: each KO of a bountied player by a known knocker = one claim.
        const out = [];
        Object.entries(knockedOutBy || {}).forEach(([eliminated, knocker]) => {
          if (bountyNames.has(eliminated) && knocker) {
            out.push({ bountied: eliminated, claimedBy: knocker });
          }
        });
        return out;
      })();

  // Compute points
  const initialPointsByName = computePointsAwarded({
    attendees: players,
    finishOrder,
    bountiedNames: bountyNames,
    knockedOutBy,
    knockouts,
    bountyClaims: initialBountyClaimsByName,
    firstOut: firstOutName,
    isFinal,
    date: today,
    rulesVersion,
  });
  // Convert to PIDs
  const initialPoints = {};
  Object.entries(initialPointsByName).forEach(([name, pts]) => {
    initialPoints[resolvePid(name)] = pts;
  });

  // Payouts (new rule: last paid place gets buy-in, rest split remaining)
  const splits = PAYOUT_STRUCTURES[payoutKey].splits;
  const payoutAmounts = computePayouts(initialPot, config.buyIn, splits.length);
  const initialPayouts = {};
  payoutAmounts.forEach((amt, i) => {
    if (amt > 0) initialPayouts[String(i + 1)] = amt;
  });

  // Per-player rebuys (mapped to PIDs)
  const initialRebuysByPid = {};
  Object.entries(rebuyCounts || {}).forEach(([name, count]) => {
    if (count > 0) initialRebuysByPid[resolvePid(name)] = count;
  });

  // Form state. High Rollers has no league money, no subs, no points.
  const isLeague = gameType === 'league';
  const [date, setDate] = useState(today);
  const [pot, setPot] = useState(String(initialPot));
  // League money is 10% of the pot, rounded to the nearest £10 (the club
  // rarely holds change smaller than that; over a season the rounding
  // averages out). Finals collect no league money.
  const [leagueMoney, setLeagueMoney] = useState(
    !isLeague || isFinal ? '0' : String(Math.round(initialPot * 0.1 / 10) * 10)
  );
  const [subs, setSubs] = useState(isLeague ? String(initialPlayerCount * 3) : '0');
  const [pointsAwarded, setPointsAwarded] = useState(initialPoints);
  const [payouts, setPayouts] = useState(initialPayouts);
  const [bountyClaims, setBountyClaims] = useState(() =>
    initialBountyClaimsByName.map((c) => ({
      bountied: resolvePid(c.bountied),
      claimedBy: resolvePid(c.claimedBy),
    }))
  );
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [savedOk, setSavedOk] = useState(false);
  const [savedId, setSavedId] = useState(null);
  const [showSignIn, setShowSignIn] = useState(false);
  // Capture test-mode state when the modal mounts. Sticky for the lifetime
  // of the modal — toggling test mode mid-save shouldn't change behaviour
  // once FINISH TEST / SAVE has been tapped.
  const testMode = readTestMode();

  // Compute game ID. League games are deterministic from season+game number.
  // HR games use the date — if multiple games are played the same day, a
  // numeric suffix is appended at save time (-2, -3, ...) to avoid clashes.
  const gameId = gameType === 'league'
    ? `${leagueContext?.seasonId}-g${leagueContext?.gameNumber}`
    : `hr-${date}`;

  const updatePoints = (pid, val) => {
    const num = parseInt(val);
    const updated = { ...pointsAwarded };
    if (isNaN(num) || num === 0) delete updated[pid];
    else updated[pid] = num;
    setPointsAwarded(updated);
  };

  const updatePayout = (place, val) => {
    const num = parseFloat(val);
    const updated = { ...payouts };
    if (isNaN(num) || num === 0) delete updated[place];
    else updated[place] = num;
    setPayouts(updated);
  };

  const save = async () => {
    // Test mode shortcut: skip all Firestore writes, clear the live-game
    // snapshot, and land on the savedOk screen with a "TEST RUN COMPLETE"
    // message. No auth required for test runs.
    if (testMode) {
      setBusy(true);
      try { localStorage.removeItem('grp-live-game'); } catch (_) {}
      if (window.GRP_DB && window.GRP_DB.clearLiveGame) {
        window.GRP_DB.clearLiveGame().catch(() => {});
      }
      setSavedId(gameId);
      setSavedOk(true);
      setBusy(false);
      return;
    }
    if (!fbUser) {
      setError('You must be signed in to save games.');
      return;
    }
    setBusy(true);
    setError(null);
    try {
      // Auto-create Firestore player docs for any in-game players not yet
      // in the database. Late-entries and wizard-adds otherwise save into
      // the game doc as slug PIDs ("ben") with no matching `players/ben`
      // — so the dashboard falls back to the raw slug (lowercase) and
      // Manage Players can't see them. Preserve original capitalisation
      // and the per-player sound they were assigned in the game.
      const missingFromDb = players.filter((p) => !playersByName[p.name]);
      for (const p of missingFromDb) {
        try {
          await window.GRP_DB.upsertPlayer({
            displayName: p.name,
            sound: p.sound || 'none',
            active: true,
          });
        } catch (_) { /* non-fatal; game save still proceeds */ }
      }

      // Resolve the final game ID. League IDs are deterministic and clash =
      // error (means that season+game number is already saved). HR IDs are
      // date-based and clash = same-day repeat → append -2, -3, ...
      let finalId = gameId;
      if (isLeague) {
        const existing = await window.GRP_DB.getGameById(gameId);
        if (existing) {
          setError(
            `A game with ID "${gameId}" is already saved. Edit it via the league dashboard, or delete it first.`
          );
          setBusy(false);
          return;
        }
      } else {
        const allHr = await window.GRP_DB.getAllHighRollerGames();
        const sameDay = allHr.filter(
          (g) => g.id === gameId || (g.id && g.id.startsWith(`${gameId}-`))
        );
        if (sameDay.length > 0) {
          finalId = `${gameId}-${sameDay.length + 1}`;
        }
      }

      // Convert in-game knockouts log (names) to PID form for storage. Each
      // entry: { eliminated: pid, knocker: pid|null, rebought: bool }.
      const knockoutsByPid = (knockouts || []).map((k) => ({
        eliminated: resolvePid(k.eliminated),
        knocker: k.knocker ? resolvePid(k.knocker) : null,
        rebought: !!k.rebought,
      }));

      // Per-attendee payment status — convert name-keyed maps to PID-keyed
      // maps so they line up with attendees/finishOrder/etc. Stored on the
      // game doc; admin can edit later via the Subs Ledger.
      const buyInsPaidByPid = {};
      const subsPaidByPid = {};
      players.forEach((p) => {
        const pid = resolvePid(p.name);
        buyInsPaidByPid[pid] = (buyInsPaidByName || {})[p.name] === true;
        subsPaidByPid[pid] = (subsPaidByName || {})[p.name] === true;
      });

      const gameDoc = {
        id: finalId,
        type: gameType,
        seasonId: isLeague ? leagueContext.seasonId : null,
        date,
        gameNumber: isLeague ? leagueContext.gameNumber : null,
        isFinal: isFinal,
        format: config.format || 'rebuy',
        rulesVersion,
        buyIn: config.buyIn,
        attendees: isLeague ? Object.keys(pointsAwarded) : initialAttendees,
        rebuys: initialRebuysByPid,
        totalRebuys,
        finishOrder: initialFinishOrder,
        firstOut: firstOutName ? resolvePid(firstOutName) : null,
        knockouts: isLeague ? knockoutsByPid : [],
        // League-only payment tracking. Falsy maps for HR + finals'
        // subs are still written (as empty objects) so the read-side
        // always sees a defined shape.
        buyInsPaid: isLeague ? buyInsPaidByPid : {},
        subsPaid: (isLeague && !isFinal) ? subsPaidByPid : {},
        pot: parseFloat(pot) || 0,
        payouts,
        leagueMoney: isLeague ? (parseFloat(leagueMoney) || 0) : 0,
        // Prize pool = pot minus league money. Subs (£3/attendee) are
        // collected SEPARATELY from the pot, not deducted from it — see
        // CLAUDE.md "Money" rules. HR has no league money so collapses
        // to raw pot.
        prizePool: (() => {
          const p = parseFloat(pot) || 0;
          const lm = isLeague ? (parseFloat(leagueMoney) || 0) : 0;
          return Math.max(0, p - lm);
        })(),
        subs: isLeague ? (parseFloat(subs) || 0) : 0,
        pointsAwarded: isLeague ? pointsAwarded : {},
        bountyHolders: isLeague ? bountyIds : [],
        bountyClaims: isLeague ? bountyClaims : [],
        notes: 'Saved from live timer.',
      };

      await window.GRP_DB.saveGame(gameDoc);
      // Game is now persisted in the games collection — clear the in-progress
      // snapshot so the resume banner doesn't reappear next session.
      try { localStorage.removeItem('grp-live-game'); } catch (_) {}
      if (window.GRP_DB && window.GRP_DB.clearLiveGame) {
        window.GRP_DB.clearLiveGame().catch(() => {});
      }
      setSavedId(finalId);
      setSavedOk(true);
      setBusy(false);
      // Don't auto-close — let user see confirmation and tap done
    } catch (e) {
      setError(e.message);
      setBusy(false);
    }
  };

  if (savedOk) {
    return (
      <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div className="gold-border rounded-2xl bg-gradient-to-br from-emerald-950 to-black p-8 max-w-md w-full text-center">
          {testMode ? (
            <>
              <div className="font-display text-4xl text-red-300 mb-3">🧪 TEST COMPLETE</div>
              <div className="text-yellow-100/80 mb-2">
                Nothing was saved to the database.
              </div>
              <div className="text-yellow-100/50 text-sm mb-6">
                Points, knockouts, bounty claims and payouts were all computed using the live rules — but the game doc was discarded.
              </div>
            </>
          ) : (
            <>
              <div className="font-display text-4xl gold-text mb-3">✓ SAVED</div>
              <div className="text-emerald-100 mb-2">
                Game <span className="font-mono text-emerald-300">{savedId || gameId}</span> recorded.
              </div>
              <div className="text-yellow-100/60 text-sm mb-6">
                {gameType === 'league'
                  ? 'League standings will reflect this game.'
                  : 'High Rollers history updated.'}
              </div>
            </>
          )}
          <button
            onClick={onSaved}
            className="w-full px-6 py-3 rounded-full font-display text-xl text-black"
            style={{ background: testMode
              ? 'linear-gradient(135deg, #ef4444, #b91c1c)'
              : 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
          >
            DONE
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div className="gold-border rounded-2xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-2xl w-full max-h-[92vh] overflow-y-auto">
        <div className="flex justify-between items-start mb-4">
          <div>
            <div className={`font-display text-3xl ${testMode ? 'text-red-300' : 'gold-text'}`}>
              {testMode ? '🧪 TEST ' : 'SAVE '}{gameType === 'league' ? 'LEAGUE' : 'HIGH ROLLERS'} GAME
            </div>
            <div className="text-yellow-100/40 font-mono text-xs mt-1">
              {testMode
                ? <>Nothing will be saved · would have been <span className="text-emerald-300">{gameId}</span></>
                : <>Will save as <span className="text-emerald-300">{gameId}</span></>}
              {isFinal && <span className="text-yellow-300 ml-2">FINAL — no league points</span>}
            </div>
          </div>
          <button onClick={onClose} disabled={busy} className="text-yellow-100/60 hover:text-yellow-100"><X size={20} /></button>
        </div>

        {!fbUser && !testMode && (
          <div className="mb-4 p-3 rounded-lg bg-red-950/30 border border-red-500/30 flex items-center justify-between gap-3">
            <div className="text-red-200 font-mono text-sm">
              ⚠ You must be signed in as admin to save this game.
            </div>
            <button
              onClick={() => setShowSignIn(true)}
              className="shrink-0 px-4 py-2 rounded-full font-display text-sm text-black"
              style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
            >
              SIGN IN
            </button>
          </div>
        )}

        {/* Date + money */}

                <input

                />

        {/* Points awarded — league only, never on finals */}
        {isLeague && !isFinal && (
          <div className="mb-5">
            <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-1">
              POINTS BY PLAYER
            </div>
            <div className="text-yellow-100/40 text-xs mb-2">
              {rulesVersion === 'v2'
                ? 'Auto-calculated: 2k attendance + position [10k/8k/6k/5k/4k/3k] + 1k per KO + 1k first-out + 2k per bounty claim. Tweak if needed.'
                : 'Auto-calculated from finish order + bounty awards. Tweak if needed.'}
            </div>

            {/* v2 breakdown — read-only summary of KOs, first-out, bounty claims */}
            {rulesVersion === 'v2' && (
              <div className="mb-3 p-3 rounded-lg bg-emerald-950/30 border border-emerald-500/15 space-y-1.5">
                {firstOutName && (
                  <div className="flex items-center gap-2 text-xs font-mono">
                    <span className="text-yellow-100/40 tracking-widest min-w-[80px]">FIRST OUT</span>
                    <span className="text-emerald-100">{firstOutName}</span>
                    <span className="text-yellow-300/60 ml-auto">+1,000</span>
                  </div>
                )}
                {(() => {
                  // Tally knockouts per knocker for display.
                  const koCounts = {};
                  (knockouts || []).forEach((k) => {
                    if (k.knocker) koCounts[k.knocker] = (koCounts[k.knocker] || 0) + 1;
                  });
                  const entries = Object.entries(koCounts).sort((a, b) => b[1] - a[1]);
                  if (!entries.length) return null;
                  return (
                    <div className="flex items-start gap-2 text-xs font-mono">
                      <span className="text-yellow-100/40 tracking-widest min-w-[80px] pt-0.5">KNOCKOUTS</span>
                      <div className="flex-1 flex flex-wrap gap-x-3 gap-y-0.5">
                        {entries.map(([name, n]) => (
                          <span key={name} className="text-emerald-100">
                            {name} <span className="text-yellow-300/60">×{n}</span>
                          </span>

                      </div>
                    </div>
                  );
                })()}
                {initialBountyClaimsByName.length > 0 && (
                  <div className="flex items-start gap-2 text-xs font-mono">
                    <span className="text-yellow-100/40 tracking-widest min-w-[80px] pt-0.5">BOUNTIES</span>
                    <div className="flex-1 space-y-0.5">

                        <div key={i} className="text-emerald-100">
                          🎯 {c.bountied}

                          {c.claimedBy === c.bountied
                            ? <span className="text-yellow-300/80">survived (self-claim)</span>
                            : <span>{c.claimedBy}</span>}
                          <span className="text-yellow-300/60 ml-2">+2,000</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

            <div className="max-h-64 overflow-y-auto space-y-1 pr-1">
              {Object.keys(pointsAwarded).map((pid) => {
                const p = playersById[pid] || { displayName: pid };
                const pos = initialFinishOrder.indexOf(pid);
                const posLabel = pos >= 0 && pos < 6 ? ['1st', '2nd', '3rd', '4th', '5th', '6th'][pos] : '';
                const isBountied = bountyIds.includes(pid);
                return (
                  <div key={pid} className="flex items-center gap-2 p-2 rounded bg-black/30">
                    <span className="flex-1 text-emerald-100 text-sm truncate">
                      {p.displayName}
                      {posLabel && <span className="text-yellow-300/60 ml-2 font-mono text-xs">{posLabel}</span>}
                      {isBountied && <span className="text-yellow-300/80 ml-2">🎯</span>}
                    </span>
                    <input
                      type="number"
                      value={pointsAwarded[pid] || ''}
                      onChange={(e) => updatePoints(pid, e.target.value)}
                      className="w-24 px-2 py-1 rounded bg-black/40 border border-yellow-500/20 text-yellow-50 font-mono text-sm text-right focus:outline-none focus:border-yellow-500/50"
                    />
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {isFinal && (
          <div className="mb-5 p-3 rounded-lg bg-yellow-950/30 border border-yellow-500/20">
            <div className="font-mono text-xs text-yellow-300 tracking-widest mb-1">FINAL — NO LEAGUE POINTS</div>
            <div className="text-yellow-100/60 text-sm">
              Finals don't award league points. Only the finish order, pot, and payouts will be saved.
            </div>
          </div>
        )}

        {error && (
          <div className="mb-3 p-3 rounded-lg bg-red-950/40 border border-red-500/40 text-red-200 font-mono text-sm">

        <div className="flex gap-2">
          <button
            onClick={onClose}
            disabled={busy}
            className="flex-1 px-4 py-2.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100 font-mono text-sm disabled:opacity-30"
          >
            CANCEL
