              placeholder="—"
              onChange={(e) => setLeagueMoney(e.target.value)}
              className="w-full px-3 py-2 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 font-mono text-sm focus:outline-none focus:border-yellow-500/50"
            />
          </div>
          <div>
            <div className="flex justify-between items-baseline mb-1">
              <span className="font-mono text-xs text-yellow-100/40 tracking-widest">SUBS £</span>
              <button
                onClick={fillSubsFromPlayers}
                disabled={!playerCount}
                className="text-[10px] font-mono text-emerald-400 hover:text-emerald-300 disabled:opacity-30 disabled:cursor-not-allowed"
                title={`Set to £3 × ${playerCount} players`}
              >
                = £3 × {playerCount}
              </button>
            </div>
            <input
              type="number"
              value={subs}
              placeholder="—"
              onChange={(e) => setSubs(e.target.value)}
              className="w-full px-3 py-2 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 font-mono text-sm focus:outline-none focus:border-yellow-500/50"
            />
          </div>
        </div>

        {/* Payouts */}
        <div className="mb-5">
          <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">PAYOUTS</div>
          <div className="grid grid-cols-5 gap-2">
            {[1, 2, 3, 4, 5].map((place) => (
              <div key={place}>
                <div className="font-mono text-xs text-yellow-100/40 mb-1">{place === 1 ? '1st' : place === 2 ? '2nd' : place === 3 ? '3rd' : `${place}th`} £</div>
                <input
                  type="number"
                  value={payouts[String(place)] || ''}
                  onChange={(e) => updatePayout(String(place), e.target.value)}
                  className="w-full px-2 py-1.5 rounded bg-black/40 border border-yellow-500/20 text-yellow-50 font-mono text-sm focus:outline-none focus:border-yellow-500/50"
                />
              </div>
            ))}
          </div>
        </div>

        {/* Points awarded (per-player) */}
        <div className="mb-5">
          <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">POINTS BY PLAYER</div>
          <div className="text-yellow-100/40 text-xs mb-2">Set 0 or blank to remove the player from this game.</div>
          <div className="max-h-64 overflow-y-auto space-y-1 pr-1">
            {attendees.map((pid) => {
              const p = playersById[pid] || { displayName: pid };
              return (
                <div key={pid} className="flex items-center gap-2 p-2 rounded bg-black/30">
                  <span className="flex-1 text-emerald-100 text-sm truncate">{p.displayName}</span>
                  <input
                    type="number"
                    value={pointsAwarded[pid] || ''}
                    onChange={(e) => updatePoints(pid, e.target.value)}
                    className="w-24 px-2 py-1 rounded bg-black/40 border border-yellow-500/20 text-yellow-50 font-mono text-sm text-right focus:outline-none focus:border-yellow-500/50"
                  />
                </div>
              );
            })}
          </div>
        </div>

        {error && <div className="text-red-400 font-mono text-sm mb-3">Error: {error}</div>}

        <div className="flex gap-2 mb-3">
          <button
            onClick={onClose}
            disabled={busy}
            className="flex-1 px-4 py-2.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100 font-mono text-sm disabled:opacity-30"
          >
            CANCEL
          </button>
          <button
            onClick={save}
            disabled={busy}
            className="flex-1 px-4 py-2.5 rounded-full font-display text-lg text-black disabled:opacity-30"
            style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
          >
            {busy ? 'Saving...' : 'SAVE CHANGES'}
          </button>
        </div>

        <div className="border-t border-red-500/10 mt-4 pt-4 space-y-2">
          <div className="text-yellow-100/30 text-xs font-mono tracking-widest mb-1">DESTRUCTIVE</div>
          <button
            onClick={() => setShowDeleteConfirm(true)}
            disabled={busy}
            className="w-full px-4 py-2 rounded-full bg-red-950/40 border border-red-500/30 text-red-300 font-mono text-xs hover:bg-red-900/60 disabled:opacity-30"
          >
            DELETE THIS GAME
          </button>
          {onRequestDeleteSeason && (
            <button
              onClick={() => { onClose(); onRequestDeleteSeason(); }}
              disabled={busy}
              className="w-full px-4 py-2 rounded-full bg-red-950/40 border border-red-500/30 text-red-300 font-mono text-xs hover:bg-red-900/60 disabled:opacity-30"
            >
              DELETE ENTIRE SEASON
            </button>
          )}
        </div>

        {showDeleteConfirm && (
          <ConfirmDialog
            title="Delete game?"
            message={`This will permanently remove Game ${game.gameNumber} from ${game.seasonId}. Player points and history for this game will be lost.`}
            requireType="DELETE"
            onConfirm={doDelete}
            onCancel={() => setShowDeleteConfirm(false)}
          />
        )}
      </div>
    </div>
  );
}

// ============ IMPORT MODAL (Admin only) ============
function ImportModal({ onClose, onDone }) {
  const [busy, setBusy] = useState(false);
  const [progress, setProgress] = useState('');
  const [error, setError] = useState(null);

  const runImport = async () => {
    setBusy(true);
    setError(null);
    try {
      setProgress('Loading import data...');
      const res = await fetch('import-data.json');
      if (!res.ok) throw new Error('Could not load import-data.json');
      const data = await res.json();

      setProgress(`Importing ${data.players.length} players, ${data.seasons.length} seasons, ${data.games.length} games...`);
      await window.GRP_DB.bulkImport(data);

      setProgress('Done!');
      setTimeout(onDone, 800);
    } catch (e) {
      setError(e.message);
      setBusy(false);
    }
  };

  return (
    <div onClick={busy ? null : onClose} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="gold-border rounded-2xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-md w-full">
        <div className="flex justify-between items-center mb-4">
          <div className="font-display text-2xl gold-text">IMPORT HISTORY</div>
          {!busy && <button onClick={onClose} className="text-yellow-100/60 hover:text-yellow-100"><X size={18} /></button>}
        </div>
        <div className="text-yellow-100/70 text-sm mb-4">
          This will load the 2025–2026 league history into Firestore: 32 players, 2 seasons (R1 + R2), and 17 games.
        </div>
        <div className="text-yellow-100/40 text-xs font-mono mb-4">
          Note: finish-order positions are best-effort inferred from points. Points themselves are exact.
        </div>
        {progress && <div className="text-emerald-300 font-mono text-sm mb-4">{progress}</div>}
        {error && <div className="text-red-400 font-mono text-sm mb-4">Error: {error}</div>}
        <div className="flex gap-2 mt-2">
          <button
            onClick={onClose}
            disabled={busy}
            className="flex-1 px-4 py-2.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100 font-mono text-sm disabled:opacity-30"
          >
            CANCEL
          </button>
          <button
            onClick={runImport}
            disabled={busy}
            className="flex-1 px-4 py-2.5 rounded-full font-display text-lg text-black disabled:opacity-30"
            style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
          >
            {busy ? 'Importing...' : 'Import now'}
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  // Route state: 'home' | 'league-context' | 'setup' | 'timer' | 'league-info' | 'highrollers-info'
  const [route, setRoute] = useState('home');
  const [gameType, setGameType] = useState(null);
  const [leagueContext, setLeagueContext] = useState(null);
  const [config, setConfig] = useState(null);
  const [customSounds, setCustomSounds] = useState({});
  const [showSignIn, setShowSignIn] = useState(false);
  const { ready: fbReady, user: fbUser } = useFirebase();

  useEffect(() => {
    loadCustomSounds().then(setCustomSounds);
  }, []);

  const handlePick = (type, action) => {
    setGameType(type);
    if (action === 'setup') {
      // League games go through context confirmation first
      setRoute(type === 'league' ? 'league-context' : 'setup');
    } else if (action === 'info') {
      setRoute(type === 'highrollers' ? 'highrollers-info' : 'league-info');
    }
  };

  const goHome = () => {
    setRoute('home');
    setGameType(null);
    setConfig(null);
    setLeagueContext(null);
  };

  // Home: show picker + sign in
  if (route === 'home') {
    return (
      <>
        <GameTypePicker onPick={handlePick} />
        <div className="fixed bottom-4 right-4 z-40">
          {fbUser ? (
            <button
              onClick={() => window.GRP_FIREBASE?.signOut(window.GRP_FIREBASE.auth)}
              className="px-3 py-1.5 rounded-full bg-black/40 border border-emerald-500/30 text-emerald-300 font-mono text-xs hover:bg-black/60"
              title={`Signed in as ${fbUser.email}`}
            >
              Signed in
            </button>
          ) : fbReady ? (
            <button
              onClick={() => setShowSignIn(true)}
              className="px-3 py-1.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100/60 font-mono text-xs hover:bg-black/60"
            >
              Sign in
            </button>
          ) : null}
        </div>
        {showSignIn && <SignInModal onClose={() => setShowSignIn(false)} />}
      </>
    );
  }

  // League info or High Rollers info — different components for each
  if (route === 'league-info') {
    return <LeagueDashboard onBack={goHome} fbUser={fbUser} />;
  }
  if (route === 'highrollers-info') {
    return <HighRollersHistory onBack={goHome} fbUser={fbUser} />;
  }

  // League context confirmation (before setup wizard, for league games only)
  if (route === 'league-context') {
    return (
      <LeagueContextScreen
        onConfirm={(ctx) => {
          setLeagueContext(ctx);
          setRoute('setup');
        }}
        onBack={goHome}
      />
    );
  }

  // Setup or playing
  return config
    ? <PokerTimerMain
        config={config}
        customSounds={customSounds}
        onReset={goHome}
        onViewLeague={() => { setConfig(null); setRoute('league-info'); }}
        gameType={gameType}
        fbUser={fbUser}
      />
    : <SetupWizard
        customSounds={customSounds}
        gameType={gameType}
        leagueContext={leagueContext}
        onStart={setConfig}
        onBack={goHome}
        fbUser={fbUser}
      />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
