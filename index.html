                  const durationWarn = !lvl.duration || lvl.duration <= 0;
                  const rowClass = `grid grid-cols-12 gap-2 items-center p-2 rounded-lg ${
                    idx === currentLevel ? 'bg-yellow-500/10 border border-yellow-500/30' :
                    lvl.isBreak ? 'bg-blue-500/10 border border-blue-500/20' :
                    'bg-black/20'
                  }`;
                  return (
                    <div key={idx}>
                      <div className={rowClass}>
                        <div className="col-span-1 font-mono text-yellow-100/60 text-sm">{idx + 1}</div>
                        {lvl.isBreak ? (
                          <div className="col-span-8 font-mono text-blue-200 text-sm tracking-widest text-center">
                            ☕ BREAK
                          </div>
                        ) : (
                          <>
                            <input type="number" inputMode="numeric" value={lvl.sb} onChange={(e) => updateLevel(idx, 'sb', parseInt(e.target.value) || 0)} className="col-span-3 min-w-0 px-2 py-1 rounded bg-black/40 border border-yellow-500/20 text-yellow-50 text-sm" />
                            <input type="number" inputMode="numeric" value={lvl.bb} onChange={(e) => updateLevel(idx, 'bb', parseInt(e.target.value) || 0)} className="col-span-3 min-w-0 px-2 py-1 rounded bg-black/40 border border-yellow-500/20 text-yellow-50 text-sm" />
                            <input type="number" inputMode="numeric" value={lvl.ante} onChange={(e) => updateLevel(idx, 'ante', parseInt(e.target.value) || 0)} className="col-span-2 min-w-0 px-2 py-1 rounded bg-black/40 border border-yellow-500/20 text-yellow-50 text-sm" />
                          </>

                          type="number"
                          inputMode="numeric"
                          value={durationDisplay}
                          onChange={onDurationChange}
                          placeholder="min"
                          className={`col-span-2 min-w-0 px-2 py-1 rounded bg-black/40 border text-yellow-50 text-sm ${durationWarn ? 'border-red-500/60' : 'border-yellow-500/20'}`}

                          Set a time or delete this level (the timer can't run a 0-minute level).
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
              <div className="flex gap-2 mt-3">
                <button onClick={addLevel} className="control-btn flex-1 py-2 rounded-lg bg-yellow-500/10 border border-yellow-500/30 text-yellow-100 font-mono text-sm">

        </div>
      </div>

      {/* Home confirmation modal */}
      {showHomeConfirm && (
        <div

            <div className="max-w-md mx-auto space-y-2 mb-8">
              {(() => {
                const splits = PAYOUT_STRUCTURES[payoutKey].splits;
                const paidCount = splits.length;
                const amounts = computePayouts(prizePool, config.buyIn, paidCount);
                const places = ['1st', '2nd', '3rd', '4th', '5th'];
                const colors = ['text-yellow-300', 'text-gray-300', 'text-amber-600', 'text-emerald-300', 'text-blue-300'];
                return splits.map((pct, i) => {
                  let placeName;
                  if (i === 0) placeName = winner.name;

                        <div className="font-mono text-sm text-yellow-100/80">{placeName}</div>
                      </div>
                      <div className="font-display text-2xl gold-text">£{amounts[i].toLocaleString()}</div>
                    </div>
                  );
                });
              })()}
            </div>

            <div className="flex flex-col sm:flex-row gap-3 justify-center flex-wrap">
              <button
                onClick={() => setShowSaveModal(true)}
                className="control-btn px-8 py-3 rounded-full font-display text-xl text-white"
                style={{ background: 'linear-gradient(135deg, #1ec890, #14a37b)' }}

                SAVE GAME
              </button>
              {config.gameType === 'league' && onViewLeague && (
                <button
                  onClick={() => { setWinner(null); onViewLeague(); }}
                  className="control-btn px-8 py-3 rounded-full font-display text-xl text-black"

              <button
                onClick={() => { setWinner(null); onReset(); }}
                className="control-btn px-8 py-3 rounded-full font-display text-xl text-black"
                style={{ background: 'linear-gradient(135deg, #f4d03f, #d4ac0d)' }}
              >
                NEW TOURNAMENT
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Save game modal */}
      {showSaveModal && winner && (
        <SaveGameModal
          gameType={config.gameType}
          leagueContext={config.leagueContext}
          config={config}
          players={players}
          finishOrder={[winner.name, ...[...eliminatedPlayers].reverse()]}
          totalRebuys={totalRebuys}
          rebuyCounts={rebuyCounts}
          knockedOutBy={knockedOutBy}
          knockouts={knockouts}
          buyInsPaidByName={buyInsPaidByName}
          subsPaidByName={subsPaidByName}
          payoutKey={payoutKey}
          gameStartedAt={gameStartedAt}
          fbUser={fbUser}
          fullRosterFromDB={fullRosterFromDB}
          onClose={() => setShowSaveModal(false)}
          onSaved={() => {
            setShowSaveModal(false);
            setWinner(null);
            if (config.gameType === 'league' && onViewLeague) {
              onViewLeague();
            } else {
              onReset();
            }
          }}
        />
      )}
    </div>
  );
}

// ============ FIREBASE HOOKS ============
// Wrapper so the app works even if Firebase fails to load.
function useFirebase() {
  const [ready, setReady] = useState(!!window.GRP_FIREBASE);
  const [user, setUser] = useState(null);
  useEffect(() => {
    const onReady = () => setReady(true);
    if (!window.GRP_FIREBASE) {
      window.addEventListener('firebase-ready', onReady);
      return () => window.removeEventListener('firebase-ready', onReady);
    }
    setReady(true);
  }, []);
  useEffect(() => {
    if (!ready || !window.GRP_FIREBASE) return;
    const { auth, onAuthStateChanged } = window.GRP_FIREBASE;
    const unsub = onAuthStateChanged(auth, (u) => setUser(u));
    return unsub;
  }, [ready]);
  return { ready, user, fb: window.GRP_FIREBASE || null };
}

// ============ SIGN IN MODAL ============
function SignInModal({ onClose }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setError('');
    setBusy(true);
    try {
      const { auth, signInWithEmailAndPassword } = window.GRP_FIREBASE;
      await signInWithEmailAndPassword(auth, email, password);
      onClose();
    } catch (e) {
      setError(e.message.replace(/^Firebase:\s*/, '').replace(/\(auth\/[^)]+\)\.?$/, ''));
    } finally {
      setBusy(false);
    }
  };

  return (
    <div onClick={onClose} className="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="gold-border rounded-2xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-sm w-full">
        <div className="flex justify-between items-center mb-4">
          <div className="font-display text-2xl gold-text">SIGN IN</div>
          <button onClick={onClose} className="text-yellow-100/60 hover:text-yellow-100"><X size={18} /></button>
        </div>
        <div className="text-yellow-100/60 text-xs mb-4 font-mono">Admins only — for recording game results.</div>
        <input
          type="email"
          value={email}
          onChange={(e) => setEmail(e.target.value)}
          placeholder="Email"
          autoFocus
          className="w-full px-3 py-2 mb-2 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 placeholder-yellow-100/30 focus:outline-none focus:border-yellow-500/50"
        />
        <input
          type="password"
          value={password}
          onChange={(e) => setPassword(e.target.value)}
          onKeyDown={(e) => e.key === 'Enter' && submit()}
          placeholder="Password"
          className="w-full px-3 py-2 mb-3 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 placeholder-yellow-100/30 focus:outline-none focus:border-yellow-500/50"
        />
        {error && <div className="text-red-400 text-xs mb-3 font-mono">{error}</div>}
        <button
          onClick={submit}
          disabled={busy || !email || !password}
          className="control-btn w-full px-6 py-2.5 rounded-full font-display text-xl text-black disabled:opacity-30"
          style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
        >
          {busy ? 'Signing in...' : 'Sign in'}
        </button>
      </div>
    </div>
  );
}

// ============ HIGH ROLLERS HISTORY ============
// Simpler view: just buy-in, position, winnings per player across all High Rollers games.
function HighRollersHistory({ onBack, fbUser }) {
  const [games, setGames] = useState([]);
  const [players, setPlayers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [selectedPlayerId, setSelectedPlayerId] = useState(null);
  const [timeRange, setTimeRange] = useState('all'); // 'all' | '12m' | '6m'
  // Admin tools — only shown when signed in
  const [showAdminTools, setShowAdminTools] = useState(false);
  const [adminBusy, setAdminBusy] = useState(null); // 'resendHR' | null
  const [adminMessage, setAdminMessage] = useState(null);
  const [showResendHRConfirm, setShowResendHRConfirm] = useState(false);
  const [showManagePlayers, setShowManagePlayers] = useState(false);

  const announceAdmin = (kind, text) => {
    setAdminMessage({ kind, text });
    setTimeout(() => setAdminMessage(null), 8000);
  };

  const doResendHR = async () => {
    setShowResendHRConfirm(false);
    setAdminBusy('resendHR');
    setAdminMessage(null);
    try {
      const r = await window.GRP_DB.resendLatestHRResults();
      if (r && r.ok) {
        announceAdmin('ok', `✓ Resent HR results for ${r.gameId} to ${r.sent} recipients.`);
      } else if (r && r.skipped) {
        announceAdmin('err', `Skipped: ${r.reason || 'unknown reason'}`);
      } else {
        announceAdmin('err', 'Resend returned an unexpected response.');
      }
    } catch (e) {
      announceAdmin('err', e.message || 'Resend failed.');
    } finally { setAdminBusy(null); }
  };

  // Game being edited (admin only). Reuses the league EditGameModal which
  // is type-aware (hides league-only sections for HR).
  const [editingGame, setEditingGame] = useState(null);

  const refreshGames = async () => {
    try {
      const fresh = await window.GRP_DB.getAllHighRollerGames();
      setGames(fresh || []);
    } catch (_) {}
  };

  useEffect(() => {
    let cancelled = false;
    const doLoad = async () => {
      try {
        const [allGames, allPlayers] = await Promise.all([
          window.GRP_DB.getAllHighRollerGames(),
          window.GRP_DB.getAllPlayers(),
        ]);
        if (cancelled) return;
        setGames(allGames);
        setPlayers(allPlayers);
        setLoading(false);
      } catch (e) {
        if (!cancelled) {
          setError(e.message);
          setLoading(false);
        }
      }
    };
    if (window.GRP_DB) doLoad();
    else {
      const onReady = () => doLoad();
      window.addEventListener('firebase-ready', onReady);
      const t = setTimeout(() => {
        if (!cancelled && !window.GRP_DB) {
          setError('Firebase did not load.');
          setLoading(false);
        }
      }, 8000);
      return () => {
        cancelled = true;
        window.removeEventListener('firebase-ready', onReady);
        clearTimeout(t);
      };
    }
    return () => { cancelled = true; };
  }, []);

  const playersById = {};
  players.forEach((p) => { playersById[p.id] = p; });

  // Filter games for the standings table by the selected time range.
  // Game dates are stored as ISO date strings ("YYYY-MM-DD") so they sort
  // lexicographically — comparing strings is equivalent to comparing dates.
  const filteredGames = (() => {
    if (timeRange === 'all') return games;
    const cutoff = new Date();
    if (timeRange === '6m') cutoff.setMonth(cutoff.getMonth() - 6);
    else if (timeRange === '12m') cutoff.setMonth(cutoff.getMonth() - 12);
    const cutoffStr = cutoff.toISOString().slice(0, 10);
    return games.filter((g) => g.date && g.date >= cutoffStr);
  })();

  // Compute per-player stats across the filtered set of HR games. Tracks
  // per-place counts (p1/p2/p3) so the standings can show medals the same
  // way the morning-after email does.
  const playerStats = {};
  filteredGames.forEach((g) => {
    (g.attendees || []).forEach((pid) => {
      if (!playerStats[pid]) playerStats[pid] = { gamesPlayed: 0, buyIns: 0, winnings: 0, p1: 0, p2: 0, p3: 0 };
      playerStats[pid].gamesPlayed += 1;
      playerStats[pid].buyIns += (g.buyIn || 30) * (1 + (g.rebuys?.[pid] || 0));
    });
    // Per-place counts come from finishOrder (canonical), winnings from payouts.
    [1, 2, 3].forEach((place) => {
      const pid = (g.finishOrder || [])[place - 1];
      if (pid && playerStats[pid]) {
        if (place === 1) playerStats[pid].p1 += 1;
        else if (place === 2) playerStats[pid].p2 += 1;
        else if (place === 3) playerStats[pid].p3 += 1;
      }
    });
    Object.entries(g.payouts || {}).forEach(([place, amount]) => {
      const pos = parseInt(place);
      const pid = (g.finishOrder || [])[pos - 1];
      if (pid && playerStats[pid]) {
        playerStats[pid].winnings += amount || 0;
      }
    });
  });

  const playerRows = Object.entries(playerStats)
    .map(([pid, stats]) => ({
      player: playersById[pid] || { displayName: pid, id: pid },
      ...stats,
      net: stats.winnings - stats.buyIns,

    }}>
      <style>{`

        }
        .gold-border {

      <div className="p-4 sm:p-8 max-w-[1200px] mx-auto">
        <div className="mb-6">
          <button onClick={onBack} className="font-mono text-xs text-yellow-100/40 hover:text-yellow-100/80 mb-2">

          </button>
          <div className="flex items-center gap-3">
            <img src="logos/GreeneRoomPokerLogo-02.svg" alt="" className="h-10 w-10 shrink-0" />
            <div className="font-display text-4xl gold-text">HIGH ROLLERS</div>
          </div>
          <div className="font-mono text-xs text-emerald-200/60 tracking-widest mt-1">

          </div>
        </div>

        {/* Admin tooling — destructive wipe sits where the data lives */}
        {fbUser && (
          <div className="mb-4">
            <button
              onClick={() => setShowAdminTools(!showAdminTools)}
              className="font-mono text-[10px] tracking-widest text-yellow-100/40 hover:text-yellow-100/70"
            >
              {showAdminTools ? '▼' : '▶'} ADMIN TOOLS
            </button>
            {showAdminTools && (
              <div className="mt-2 p-3 rounded-lg bg-black/30 border border-yellow-500/15 flex flex-wrap gap-2">
                <button
                  onClick={() => setShowManagePlayers(true)}
                  className="px-3 py-1.5 rounded font-mono text-xs border border-emerald-500/40 text-emerald-100 hover:bg-emerald-500/15"
                  title="Edit player emails and elimination sounds."
                >
                  ✉ MANAGE PLAYERS
                </button>
                <button
                  onClick={() => setShowResendHRConfirm(true)}
                  disabled={adminBusy !== null || games.length === 0}
                  className="px-3 py-1.5 rounded font-mono text-xs border border-emerald-500/40 text-emerald-100 hover:bg-emerald-500/15 disabled:opacity-40"
                  title="Re-send the morning-after email for the most recent HR game."

// ============ HIGH ROLLERS PLAYER PROFILE ============
// Click a player row in HR history to see their per-game record, cumulative
// net profit chart, and finishing-position chart.
function HighRollersPlayerProfile({ playerId, players, games, onClose }) {
  const player = players.find((p) => p.id === playerId);
  if (!player) return null;

  // Per-game history, sorted by date ascending so charts read left → right in time
  const sorted = [...games]
    .filter((g) => (g.attendees || []).includes(playerId))
    .sort((a, b) => (a.date || '').localeCompare(b.date || ''));

  const history = sorted.map((g) => {
    const buyIn = (g.buyIn || 30) * (1 + (g.rebuys?.[playerId] || 0));
    const pos = (g.finishOrder || []).indexOf(playerId);
    const place = pos >= 0 ? pos + 1 : null;
    const winnings = place ? (g.payouts?.[String(place)] || 0) : 0;
    return {
      date: g.date,
      gameId: g.id,
      buyIn,
      winnings,
      net: winnings - buyIn,
      place,
      totalPlayers: (g.attendees || []).length,
      paidCount: Object.keys(g.payouts || {}).length,
    };
  });

  // Cumulative net for the line chart
  let cum = 0;
  const cumulative = history.map((h) => { cum += h.net; return cum; });

  // Stats
  const gamesPlayed = history.length;
  const wins = history.filter((h) => h.place === 1).length;
  // "In the Money" — uses the actual number of paid places per game (top 3 for
  // small fields, top 4 for bigger fields) rather than a hardcoded top-3.
  const podiums = history.filter((h) => h.place && h.paidCount > 0 && h.place <= h.paidCount).length;
  const totalBuyIns = history.reduce((s, h) => s + h.buyIn, 0);
  const totalWinnings = history.reduce((s, h) => s + h.winnings, 0);
  const netTotal = totalWinnings - totalBuyIns;
  const placedGames = history.filter((h) => h.place);
  const avgPosition = placedGames.length
    ? (placedGames.reduce((s, h) => s + h.place, 0) / placedGames.length).toFixed(1)
    : '—';

  // ----- Cumulative profit line chart -----
  const W = 600, H = 160, PAD = 24;
  const xs = history.length > 1
    ? history.map((_, i) => PAD + (i * (W - 2 * PAD)) / (history.length - 1))
    : [W / 2];
  const minCum = Math.min(0, ...cumulative);
  const maxCum = Math.max(0, ...cumulative);
  const range = (maxCum - minCum) || 1;
  const ys = cumulative.map((v) => H - PAD - ((v - minCum) / range) * (H - 2 * PAD));
  const zeroY = H - PAD - ((0 - minCum) / range) * (H - 2 * PAD);
  const pathD = history.length === 0
    ? ''
    : xs.map((x, i) => `${i === 0 ? 'M' : 'L'} ${x} ${ys[i]}`).join(' ');
  const areaD = history.length === 0
    ? ''
    : `${pathD} L ${xs[xs.length - 1]} ${zeroY} L ${xs[0]} ${zeroY} Z`;

  // ----- Position bar chart -----
  // Each bar's height = (totalPlayers − place + 1) / totalPlayers (so 1st = full bar)
  const PH = 120;

  return (
    <div onClick={onClose} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="gold-border rounded-3xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-3xl w-full max-h-[92vh] overflow-y-auto">
        <div className="flex justify-between items-start mb-4">
          <div>
            <div className="font-display text-4xl gold-text">{player.displayName}</div>
            {player.realName && player.realName !== player.displayName && (
              <div className="text-yellow-100/60 font-mono text-sm">{player.realName}</div>
            )}
            <div className="text-emerald-300/60 font-mono text-xs mt-1">High Rollers history</div>
          </div>
          <button onClick={onClose} className="text-yellow-100/60 hover:text-yellow-100">
            <X size={20} />
          </button>
        </div>

        {/* Stats grid */}
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-6">
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">GAMES</div>
            <div className="font-display text-2xl text-emerald-200">{gamesPlayed}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">WINS</div>
            <div className="font-display text-2xl text-emerald-200">{wins}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">IN THE MONEY</div>
            <div className="font-display text-2xl text-emerald-200">{podiums}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">AVG POS</div>
            <div className="font-display text-2xl text-emerald-200">{avgPosition}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">BUY-INS</div>
            <div className="font-display text-2xl text-yellow-200">£{totalBuyIns}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">WINNINGS</div>
            <div className="font-display text-2xl text-emerald-300">£{Math.round(totalWinnings)}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20 col-span-2">
            <div className="font-mono text-xs text-yellow-100/40">NET PROFIT</div>
            <div className={`font-display text-3xl ${netTotal >= 0 ? 'text-emerald-300' : 'text-red-400'}`}>
              {netTotal >= 0 ? '+' : ''}£{Math.round(netTotal)}
            </div>
          </div>
        </div>

        {/* Cumulative profit chart */}
        <div className="mb-5">
          <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">
            CUMULATIVE NET PROFIT (over time)
          </div>
          {history.length === 0 ? (
            <div className="text-yellow-100/40 font-mono text-sm py-6 text-center">No games yet.</div>
          ) : (() => {
            // Y-axis: max profit at top, zero (or midpoint) in middle, min at bottom.
            const fmt = (v) => `${v >= 0 ? '+' : ''}£${Math.round(v)}`;
            const yLabels = [maxCum, (maxCum + minCum) / 2, minCum];
            return (
              <div className="flex">
                {/* Y-axis labels */}
                <div className="flex flex-col justify-between items-end pr-2 py-3 font-mono text-[10px] text-yellow-100/40 tracking-wider" style={{ height: 'auto', minHeight: '120px' }}>
                  <span>{fmt(yLabels[0])}</span>
                  <span className="text-yellow-100/25">{fmt(yLabels[1])}</span>
                  <span className="text-yellow-100/25">{fmt(yLabels[2])}</span>
                </div>
                {/* Chart area */}
                <div className="flex-1 p-3 rounded-lg bg-black/40 border border-emerald-500/10">
                  <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height: 'auto' }}>
                    {/* zero line */}
                    <line x1={PAD} x2={W - PAD} y1={zeroY} y2={zeroY} stroke="rgba(255,255,255,0.15)" strokeDasharray="3 3" />
                    {/* area fill */}
                    <path d={areaD} fill={netTotal >= 0 ? 'rgba(20,163,123,0.18)' : 'rgba(239,68,68,0.18)'} />
                    {/* line */}
                    <path d={pathD} fill="none" stroke={netTotal >= 0 ? '#1ec890' : '#ef4444'} strokeWidth="2" />
                    {/* points + labels */}
                    {history.map((h, i) => (
                      <g key={h.gameId}>
                        <circle cx={xs[i]} cy={ys[i]} r="3" fill={cumulative[i] >= 0 ? '#1ec890' : '#ef4444'} />
                        <title>{`${h.date}: ${h.net >= 0 ? '+' : ''}£${h.net} (running ${cumulative[i] >= 0 ? '+' : ''}£${cumulative[i]})`}</title>
                      </g>
                    ))}
                  </svg>
                  <div className="flex justify-between text-[10px] font-mono text-yellow-100/30 mt-1 px-2">
                    {history.map((h, i) => (
                      <span key={i}>{h.date?.slice(5) || ''}</span>
                    ))}
                  </div>
                </div>
              </div>
            );
          })()}
        </div>

        {/* Position chart */}
        {history.length > 0 && (() => {
          // Max field size across this player's HR games. Sensible default: 5.
          const maxField = Math.max(5, ...history.map((h) => h.totalPlayers || 0));
          const ordinal = (n) => {
            const s = ['th','st','nd','rd'];
            const v = n % 100;
            return n + (s[(v - 20) % 10] || s[v] || s[0]);
          };
          const midTick = Math.ceil(maxField / 2);
          return (
            <div className="mb-2">
              <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">
                FINAL POSITION
              </div>
              <div className="flex">
                {/* Y-axis labels */}
                <div className="flex flex-col justify-between items-end pr-2 py-3 font-mono text-[10px] text-yellow-100/40 tracking-wider" style={{ height: `${PH}px` }}>
                  <span>{ordinal(1)}</span>
                  <span className="text-yellow-100/25">{ordinal(midTick)}</span>
                  <span className="text-yellow-100/25">{ordinal(maxField)}</span>
                </div>
                <div className="flex-1 p-3 rounded-lg bg-black/40 border border-emerald-500/10">
                  {/* Subtle horizontal grid lines */}
                  <div className="relative" style={{ height: `${PH - 24}px` }}>
                    <div className="absolute inset-0 pointer-events-none flex flex-col justify-between">
                      <div className="border-t border-yellow-500/10" />
                      <div className="border-t border-yellow-500/5" />
                      <div className="border-t border-yellow-500/10" />
                    </div>
                    <div className="flex gap-1.5 h-full relative">
                      {history.map((h) => {
                        const tp = h.totalPlayers || maxField;
                        const heightPct = h.place
                          ? Math.max(8, Math.round(((maxField - h.place + 1) / maxField) * 100))
                          : 0;
                        const color = h.place === 1
                          ? 'linear-gradient(180deg, #f4d03f, #d4ac0d)'
                          : h.place === 2
                            ? 'linear-gradient(180deg, #d6d6d6, #a0a0a0)'
                            : h.place === 3
                              ? 'linear-gradient(180deg, #cd7f32, #8a5a23)'
                              : 'linear-gradient(180deg, #14a37b, #0a6e52)';
                        return (
                          <div
                            key={h.gameId}
                            className="flex-1 relative h-full"
                            title={`${h.date}: ${h.place ? `${ordinal(h.place)} of ${tp}` : 'no position'}`}
                          >
                            {h.place && (
                              <>
                                <div
                                  className="absolute inset-x-0 rounded-t"
                                  style={{
                                    bottom: 0,
                                    height: `${heightPct}%`,
                                    minHeight: '4px',
                                    background: color,
                                  }}
                                />
                                <div
                                  className="absolute inset-x-0 text-center font-mono text-[10px] text-yellow-100/60"
                                  style={{ bottom: `calc(${heightPct}% + 2px)` }}
                                >
                                  {h.place}
                                </div>
                              </>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  </div>
                  <div className="flex justify-between text-[10px] font-mono text-yellow-100/30 mt-1 px-2">
                    {history.map((h, i) => (
                      <span key={i}>{h.place ? `${h.place}/${h.totalPlayers}` : '—'}</span>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          );
        })()}
      </div>
    </div>
  );
}

// ============ LEAGUE DASHBOARD ============
// Shows the season-by-season standings table — spreadsheet-style view of all games.
function LeagueDashboard({ onBack, fbUser }) {
  const [seasons, setSeasons] = useState([]);
  const [activeSeasonId, setActiveSeasonId] = useState(null);
  const [players, setPlayers] = useState([]);
  const [games, setGames] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [selectedPlayerId, setSelectedPlayerId] = useState(null);
  const [breakdown, setBreakdown] = useState(null); // { playerId, mode: 'season'|'game', gameId? }
  const [showImport, setShowImport] = useState(false);
  const [editingGame, setEditingGame] = useState(null);
  const [showDeleteSeasonConfirm, setShowDeleteSeasonConfirm] = useState(false);
  // Manual "Resend results" button state
  const [resendBusy, setResendBusy] = useState(false);
  const [resendMessage, setResendMessage] = useState(null); // { kind: 'ok'|'err', text }
  const [showResendConfirm, setShowResendConfirm] = useState(false);
  // Sandbox / admin tooling
  const [showAdminTools, setShowAdminTools] = useState(false);
  const [showManagePlayers, setShowManagePlayers] = useState(false);
  const [showSubsLedger, setShowSubsLedger] = useState(false);
  const [showSeasonManager, setShowSeasonManager] = useState(false);

  const doResend = async () => {
    setShowResendConfirm(false);
    setResendBusy(true);
    setResendMessage(null);
    try {
      const res = await window.GRP_DB.resendLatestResults();
      if (res && res.ok) {
        setResendMessage({ kind: 'ok', text: `Sent to ${res.sent} recipient${res.sent === 1 ? '' : 's'} (game ${res.gameId}).` });
      } else if (res && res.skipped) {
        setResendMessage({ kind: 'err', text: `Skipped: ${res.reason}` });
      } else {
        setResendMessage({ kind: 'err', text: 'Email send returned an unknown result.' });
      }
    } catch (e) {
      setResendMessage({ kind: 'err', text: e.message || 'Failed to send.' });
    } finally {
      setResendBusy(false);
      // Auto-clear after 8s so message doesn't linger forever.
      setTimeout(() => setResendMessage(null), 8000);
    }
  };

  // Load seasons + players on mount — wait for Firebase if it hasn't loaded yet
  useEffect(() => {
    let cancelled = false;

    const doLoad = async () => {
      try {
        const [allSeasons, allPlayers, allLeagueGames] = await Promise.all([
          window.GRP_DB.getAllSeasons(),
          window.GRP_DB.getAllPlayers(),
          window.GRP_DB.getAllLeagueGames(),
        ]);
        if (cancelled) return;
        setSeasons(allSeasons);
        setPlayers(allPlayers);
        // Pass per-season games to the status check so a season whose
        // final has been played mid-month reads as `complete` even
        // though today's still inside its date range — otherwise the
        // dashboard would keep defaulting to last round when the user
        // arrives here straight after finishing a game in the new one.
        const gamesBySeasonId = {};
        for (const g of allLeagueGames) {
          if (!g.seasonId) continue;
          (gamesBySeasonId[g.seasonId] = gamesBySeasonId[g.seasonId] || []).push(g);
        }
        const statusOf = (s) => computeSeasonStatus(s, gamesBySeasonId[s.id] || []);
        // Selection priority: live round first → upcoming round (so a
        // newly-created season with no games yet still wins over a
        // complete one) → most recent with games → fall back to latest.
        let chosen = allSeasons.find(s => statusOf(s) === 'active');
        if (!chosen) chosen = allSeasons.find(s => statusOf(s) === 'upcoming');
        if (!chosen) chosen = allSeasons.find(s => (gamesBySeasonId[s.id] || []).length > 0);
        if (!chosen) chosen = allSeasons[0];
        if (chosen) setActiveSeasonId(chosen.id);
        setLoading(false);
      } catch (e) {
        if (!cancelled) {
          setError(e.message);
          setLoading(false);
        }
      }
    };

    if (window.GRP_DB) {
      doLoad();
    } else {
      // Firebase still loading — wait for the ready event
      const onReady = () => doLoad();
      window.addEventListener('firebase-ready', onReady);
      // Safety: if no Firebase after 8 seconds, show error
      const timeout = setTimeout(() => {
        if (!cancelled && !window.GRP_DB) {
          setError('Firebase did not load. Check your internet connection.');
          setLoading(false);
        }
      }, 8000);
      return () => {
        cancelled = true;
        window.removeEventListener('firebase-ready', onReady);
        clearTimeout(timeout);
      };
    }
    return () => { cancelled = true; };
  }, []);

  // Load games for the selected season
  useEffect(() => {
    if (!activeSeasonId || !window.GRP_DB) return;
    (async () => {
      try {
        const seasonGames = await window.GRP_DB.getGamesForSeason(activeSeasonId);
        setGames(seasonGames);
      } catch (e) {
        setError(e.message);
      }
    })();
  }, [activeSeasonId]);

  // Compute totals per player for the active season
  const playerTotals = {};
  const playersById = {};
  players.forEach(p => { playersById[p.id] = p; });
  games.forEach(g => {
    Object.entries(g.pointsAwarded || {}).forEach(([pid, pts]) => {
      playerTotals[pid] = (playerTotals[pid] || 0) + (pts || 0);
    });
  });

  // Sort players by total points (descending), only show those who played at least one game
  const playerRows = Object.entries(playerTotals)
    .filter(([_, pts]) => pts > 0)
    .sort((a, b) => b[1] - a[1])
    .map(([pid, total]) => ({
      player: playersById[pid] || { displayName: pid, id: pid },
      total,
      gamePoints: games.map(g => g.pointsAwarded?.[pid] || null),
    }));

  // Aggregate stats at the bottom (subs, league money, etc.). Player count
  // reads from attendees (the ground truth for who was at the table);
  // pointsAwarded is a fallback for legacy imports that predated the
  // attendees field. Using attendees also means the FINAL column shows
  // the right count — pointsAwarded is empty for finals since they don't
  // award league points, so the pointsAwarded-length approach printed 0.
  const aggregates = {
    playersPerGame: games.map(g =>
      (g.attendees || []).length
      || Object.values(g.pointsAwarded || {}).filter(p => p > 0).length
    ),
    rebuys: games.map(g => g.totalRebuys || 0),
    pot: games.map(g => g.pot),
    leagueMoney: games.map(g => g.leagueMoney),
    prizePool: games.map(g => g.prizePool),
    subs: games.map(g => g.subs),
  };

  const activeSeason = seasons.find(s => s.id === activeSeasonId);

  return (
    <div className="min-h-screen w-full" style={{
      background: 'radial-gradient(ellipse at top, #0a3d1f 0%, #062815 40%, #020a06 100%)',
      fontFamily: "'Inter', system-ui, sans-serif",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
        .font-display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .gold-text {
          background: linear-gradient(135deg, #14a37b 0%, #1ec890 50%, #0e8c69 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }
        .gold-border {
          border: 1px solid rgba(20, 163, 123, 0.4);
          box-shadow: 0 0 40px rgba(20, 163, 123, 0.15), inset 0 0 60px rgba(20, 163, 123, 0.05);
        }
        .league-table { border-collapse: collapse; width: 100%; }
        .league-table th, .league-table td {
          padding: 10px 14px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 14px;
          border-right: 1px solid rgba(255, 255, 255, 0.05);
          white-space: nowrap;
        }
        .league-table th {
          background: rgba(0, 0, 0, 0.5);
          color: #14a37b;
          font-weight: 700;
          font-size: 13px;
          text-transform: uppercase;
          letter-spacing: 0.1em;
          position: sticky;
          top: 0;
          z-index: 10;
        }
        .league-table th.sticky-col, .league-table td.sticky-col {
          position: sticky;
          left: 0;
          background: #020a06;
          z-index: 5;
          /* Right-edge mask so scrolled content can't peek through during
             momentum scroll on iOS, and a hard left-edge cover so the rounded
             corner area of the wrapper doesn't leak content either. */
          box-shadow: 6px 0 8px -4px rgba(0, 0, 0, 0.7);
        }
        .league-table th.sticky-col { z-index: 11; }
        .league-table .total-col {
          background: rgba(20, 163, 123, 0.12);
          font-weight: 700;
          color: #1ec890;
          font-size: 15px;
        }
        .league-table tr:hover td:not(.sticky-col):not(.total-col) {
          background: rgba(20, 163, 123, 0.06);
        }
        .league-table tr.totals-row td {
          background: rgba(20, 163, 123, 0.08);
          color: #1ec890;
          border-top: 1px solid rgba(20, 163, 123, 0.3);
          font-size: 12px;
        }
        /* Header recap row: rendered between the last player and the aggregate
           rows so column labels (G1/G2/.../Total) stay visible on long lists. */
        .league-table tr.header-recap td {
          background: rgba(0, 0, 0, 0.5);
          color: #14a37b;
          font-weight: 700;
          font-size: 13px;
          text-transform: uppercase;
          letter-spacing: 0.1em;
          border-top: 1px solid rgba(20, 163, 123, 0.3);
        }
        .league-table tr.header-recap td.sticky-col {
          background: #020a06;
          color: #14a37b;
        }
        /* Totals rows: keep the sticky first column fully opaque so scrolled
           cells never show through "Players / Rebuys / Pot / League £ / ..." */
        .league-table tr.totals-row td.sticky-col {
          background: #020a06;
          color: #1ec890;
        }
        /* Per-cell finishing-position colours — only the PAID positions in
           each individual game get a medal colour; everyone else who played
           renders in a muted grey so admin can see at a glance who cashed. */
        .league-table td.place-1 { color: #f4d03f; font-weight: 700; }
        .league-table td.place-2 { color: #d4d4d4; font-weight: 700; }
        .league-table td.place-3 { color: #d4924a; font-weight: 700; }
        .league-table td.place-4 { color: #818cf8; font-weight: 600; }
        .league-table td.place-unpaid { color: #6b7280; font-weight: 500; }
        /* Coloured leaderboard rank numbers (top 3 only) */
        .pos-num-1 { color: #f4d03f; font-weight: 700; }
        .pos-num-2 { color: #d4d4d4; font-weight: 700; }
        .pos-num-3 { color: #d4924a; font-weight: 700; }
        .player-link {
          cursor: pointer;
        }
        .player-link:hover { color: #1ec890 !important; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(20, 163, 123, 0.4); border-radius: 4px; }
      `}</style>

      <div className="p-3 sm:p-6 max-w-[1800px] mx-auto">
        {/* Header */}
        <div className="flex justify-between items-start mb-6 gap-4 flex-wrap">
          <div>
            <button onClick={onBack} className="font-mono text-xs text-yellow-100/40 hover:text-yellow-100/80 mb-2">

            </button>
            <div className="flex items-center gap-3">

          </div>

            >
              {seasons.map(s => (

          >
            {resendMessage.kind === 'ok' ? '✓ ' : '⚠ '}{resendMessage.text}

        {/* Admin tooling — sandbox simulation and destructive wipes */}

              <div className="mt-2 p-3 rounded-lg bg-black/30 border border-yellow-500/15 flex flex-wrap gap-2">
                <button
                  onClick={() => setShowManagePlayers(true)}
                  className="px-3 py-1.5 rounded font-mono text-xs border border-emerald-500/40 text-emerald-100 hover:bg-emerald-500/15"
                  title="Edit player email addresses for the morning-after results email."

                  ✉ MANAGE PLAYERS

                <button
                  onClick={() => setShowSubsLedger(true)}
                  disabled={!activeSeasonId}
                  className="px-3 py-1.5 rounded font-mono text-xs border border-emerald-500/40 text-emerald-100 hover:bg-emerald-500/15 disabled:opacity-40"
                  title="View / edit who's paid £3 subs across this season's regular games."
                >
                  🪙 SUBS LEDGER
                </button>
                <button
                  onClick={() => setShowSeasonManager(true)}

                  🗓 SEASONS
                </button>
                <TestModeToggle />
              </div>
            )}
          </div>
        )}

        {loading ? (
          <div className="text-center py-16 text-emerald-200/60 font-mono">Loading...</div>
        ) : error ? (
          <div className="text-center py-16">
            <div className="text-red-400 font-mono mb-2">Error: {error}</div>
          </div>
        ) : seasons.length === 0 ? (
          <div className="text-center py-16">
            <div className="text-yellow-100/60 font-mono mb-4">No league data yet.</div>
            {fbUser ? (
              <button
                onClick={() => setShowImport(true)}
                className="px-6 py-3 rounded-full font-display text-xl text-black"
                style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
              >
                IMPORT SPREADSHEET
              </button>
            ) : (
              <div className="text-xs font-mono text-yellow-100/40">
                Sign in to import historical data.
              </div>
            )}
          </div>
        ) : games.length === 0 ? (
          <div className="text-center py-16 text-yellow-100/60 font-mono">
            No games yet in this season.
          </div>
        ) : (
          <div className="gold-border rounded-2xl bg-black/40 backdrop-blur p-4 overflow-x-auto" style={{ overscrollBehaviorX: 'contain', WebkitOverflowScrolling: 'touch' }}>
            <table className="league-table">
              <thead>
                <tr>
                  <th className="sticky-col text-left">Player</th>
                  {games.map(g => (
                    <th
                      key={g.id}
                      className="text-center"
                      title={fbUser ? `Edit game ${g.gameNumber}` : g.date}
                      style={fbUser ? { cursor: 'pointer' } : {}}
                      onClick={fbUser ? () => setEditingGame(g) : null}
                    >
                      {g.isFinal ? 'FINAL' : `G${g.gameNumber}`}
                      <div className="text-[9px] text-yellow-100/30 font-normal normal-case tracking-normal">
                        {g.date?.slice(5)}
                      </div>
                      {fbUser && (
                        <div className="text-[9px] text-emerald-400/60 font-normal normal-case tracking-normal mt-0.5">
                          edit
                        </div>
                      )}
                    </th>
                  ))}
                  <th className="total-col text-center">Total</th>
                </tr>
              </thead>
              <tbody>
                {playerRows.map((row, i) => {
                  const pos = i + 1;
                  return (
                    <tr key={row.player.id}>
                      <td className="sticky-col">
                        <span className="player-link text-emerald-100" onClick={() => setSelectedPlayerId(row.player.id)}>
                          <span className={`inline-block w-7 text-right mr-2 ${pos <= 3 ? `pos-num-${pos}` : 'text-yellow-100/40'}`}>
                            {pos}.
                          </span>
                          {row.player.displayName}
                        </span>
                      </td>
                      {row.gamePoints.map((pts, gi) => {
                        const g = games[gi];
                        const openGameBreakdown = () => setBreakdown({ playerId: row.player.id, mode: 'game', gameId: g.id });
                        // Finals don't award league points (pointsAwarded is empty).
                        // Show finishing label for top 3, blank for everyone else.
                        if (g.isFinal) {
                          const finishPos = (g.finishOrder || []).indexOf(row.player.id);
                          if (finishPos === 0) return <td key={gi} className="text-center place-1">Winner</td>;
                          if (finishPos === 1) return <td key={gi} className="text-center place-2">2nd Place</td>;
                          if (finishPos === 2) return <td key={gi} className="text-center place-3">3rd Place</td>;
                          return <td key={gi} className="text-center text-yellow-100/30">—</td>;
                        }
                        if (pts === null) {
                          return <td key={gi} className="text-center text-yellow-100/30">—</td>;
                        }
                        // Regular games: only PAID positions get a medal
                        // colour (top-3 for ≤10-player games, top-4 for
                        // 11+). Everyone else who played renders muted grey
                        // so it's obvious at a glance who cashed.
                        const finishPos = (g.finishOrder || []).indexOf(row.player.id);
                        const paidCount = Object.keys(g.payouts || {}).length || 3;
                        const posClass = finishPos >= 0 && finishPos < paidCount && finishPos < 4
                          ? `place-${finishPos + 1}`
                          : 'place-unpaid';
                        return (
                          <td
                            key={gi}
                            className={`text-center cursor-pointer hover:brightness-125 ${posClass}`}
                            onClick={openGameBreakdown}
                            title="Tap to see how these points were earned"
                          >
                            {pts.toLocaleString()}
                          </td>
                        );
                      })}
                      <td
                        className="total-col text-center cursor-pointer hover:brightness-125"
                        onClick={() => setBreakdown({ playerId: row.player.id, mode: 'season' })}
                        title="Tap for a season-wide breakdown"
                      >
                        {row.total.toLocaleString()}
                      </td>
                    </tr>
                  );
                })}
                {/* Repeat the column header above the aggregates so you can read
                    G1/G2/... without scrolling back up on long player lists. */}
                {games.length > 0 && (
                  <tr className="header-recap">
                    <td className="sticky-col text-left"></td>
                    {games.map((g) => (
                      <td key={g.id} className="text-center">
                        {g.isFinal ? 'FINAL' : `G${g.gameNumber}`}
                      </td>
                    ))}
                    <td className="total-col text-center">Total</td>
                  </tr>
                )}
                {/* Aggregate rows */}
                <tr className="totals-row">
                  <td className="sticky-col">Players</td>
                  {aggregates.playersPerGame.map((v, i) => <td key={i} className="text-center">{v || '—'}</td>)}
                  <td className="total-col text-center">—</td>
                </tr>
                <tr className="totals-row">
                  <td className="sticky-col">Rebuys</td>
                  {aggregates.rebuys.map((v, i) => <td key={i} className="text-center">{v || 0}</td>)}
                  <td className="total-col text-center">{aggregates.rebuys.reduce((a, b) => a + (b || 0), 0)}</td>
                </tr>
                <tr className="totals-row">
                  <td className="sticky-col">Pot (£)</td>
                  {aggregates.pot.map((v, i) => <td key={i} className="text-center">{v || '—'}</td>)}
                  <td className="total-col text-center">{aggregates.pot.reduce((a, b) => a + (b || 0), 0)}</td>
                </tr>
                <tr className="totals-row">
                  <td className="sticky-col">League £</td>
                  {aggregates.leagueMoney.map((v, i) => <td key={i} className="text-center">{v || 0}</td>)}
                  <td className="total-col text-center">{aggregates.leagueMoney.reduce((a, b) => a + (b || 0), 0)}</td>
                </tr>
                <tr className="totals-row">
                  <td className="sticky-col">Prize £</td>
                  {aggregates.prizePool.map((v, i) => <td key={i} className="text-center">{v || '—'}</td>)}
                  <td className="total-col text-center">—</td>
                </tr>
                <tr className="totals-row">
                  <td className="sticky-col">Subs £</td>
                  {aggregates.subs.map((v, i) => <td key={i} className="text-center">{v == null ? '—' : v}</td>)}
                  <td className="total-col text-center">{aggregates.subs.reduce((a, b) => a + (b || 0), 0)}</td>
                </tr>
                {/* Payouts: 1st-5th */}
                {[1, 2, 3, 4, 5].map(place => (
                  <tr key={place} className="totals-row">
                    <td className="sticky-col">{place === 1 ? '1st £' : place === 2 ? '2nd £' : place === 3 ? '3rd £' : `${place}th £`}</td>
                    {games.map((g, i) => (
                      <td key={i} className="text-center">{g.payouts?.[String(place)] || '—'}</td>
                    ))}
                    <td className="total-col text-center">—</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        <div className="text-center mt-4 text-xs font-mono text-yellow-100/30">
          Tap a player name for their profile.
        </div>
      </div>

      {/* Player profile modal */}
      {selectedPlayerId && (
        <PlayerProfile
          playerId={selectedPlayerId}
          players={players}
          games={games}
          season={activeSeason}
          fbUser={fbUser}
          onPlayerUpdated={() => {
            // Refetch player roster so the edited email is reflected.
            if (window.GRP_DB) {
              window.GRP_DB.getAllPlayers().then(setPlayers).catch(() => {});
            }
          }}
          onClose={() => setSelectedPlayerId(null)}
        />
      )}

      {/* Points breakdown modal */}
      {breakdown && (() => {
        const player = players.find((p) => p.id === breakdown.playerId);
        if (!player) return null;
        const playersById = {};
        players.forEach((p) => { playersById[p.id] = p; });
        return (
          <PointsBreakdownModal
            player={player}
            games={games}
            playersById={playersById}
            mode={breakdown.mode}
            gameId={breakdown.gameId}
            onClose={() => setBreakdown(null)}
          />
        );
      })()}

      {/* Edit game modal */}
      {editingGame && (
        <EditGameModal
          game={editingGame}
          players={players}
          onClose={() => setEditingGame(null)}
          onSaved={() => {
            setEditingGame(null);
            // Refresh games for the active season
            if (activeSeasonId && window.GRP_DB) {
              window.GRP_DB.getGamesForSeason(activeSeasonId).then(setGames);
            }
          }}
          onRequestDeleteSeason={() => setShowDeleteSeasonConfirm(true)}
        />
      )}

      {/* Delete season confirm */}
      {/* Manage Players (bulk email edit) */}
      {showManagePlayers && (
        <ManagePlayersModal
          onClose={() => setShowManagePlayers(false)}
          onSaved={() => {
            // Refresh local players list so any other UI reflects new emails immediately.
            if (window.GRP_DB) window.GRP_DB.getAllPlayers().then(setPlayers).catch(() => {});
          }}
        />
      )}

      {/* Subs Ledger — per-season grid of who paid / who owes */}
      {showSubsLedger && activeSeasonId && (
        <SubsLedgerModal
          season={seasons.find((s) => s.id === activeSeasonId)}
          games={games}
          players={players}
          onClose={() => setShowSubsLedger(false)}
          onSaved={() => {
            // Refresh both games (subsPaid edits) and seasons (upfrontSubs
            // edits) so the ledger reflects saved state on its next open.
            if (!window.GRP_DB || !activeSeasonId) return;
            window.GRP_DB.getGamesForSeason(activeSeasonId)
              .then(setGames)
              .catch(() => {});
            window.GRP_DB.getAllSeasons()
              .then(setSeasons)
              .catch(() => {});
          }}
        />
      )}

      {/* Season Manager — create / edit / rename / archive seasons */}
      {showSeasonManager && (
        <SeasonManagerModal
          seasons={seasons}
          onClose={() => setShowSeasonManager(false)}
          onChanged={() => {
            if (!window.GRP_DB) return;
            window.GRP_DB.getAllSeasons().then(setSeasons).catch(() => {});
          }}
        />
      )}

      {/* Confirm before re-sending results email to everyone */}
      {showResendConfirm && (
        <ConfirmDialog
          title="Resend latest results?"
          message="This will email the most recent league game's results + standings to ALL active players who have an email on file. Use this if the morning email didn't go out or you want to re-send with corrections."
          onConfirm={doResend}
          onCancel={() => setShowResendConfirm(false)}
        />
      )}

      {showDeleteSeasonConfirm && activeSeason && (
        <ConfirmDialog
          title={`Delete ${activeSeason.name}?`}
          message={`This will permanently delete the season and all ${games.length} games in it. Player records will not be deleted, but all points and game history for this season will be lost.`}
          requireType="DELETE"
          onConfirm={async () => {
            try {
              // Delete each game, then the season doc
              const fb = window.GRP_FIREBASE;
              for (const g of games) {
                await window.GRP_DB.deleteGame(g.id);
              }
              await fb.deleteDoc(fb.doc(fb.db, 'seasons', activeSeason.id));
              setShowDeleteSeasonConfirm(false);
              window.location.reload();
            } catch (e) {
              setError(e.message);
              setShowDeleteSeasonConfirm(false);
            }
          }}
          onCancel={() => setShowDeleteSeasonConfirm(false)}
        />
      )}

      {/* Import modal */}
      {showImport && (
        <ImportModal
          onClose={() => setShowImport(false)}
          onDone={() => {
            setShowImport(false);
            // Reload page to fetch newly imported data
            window.location.reload();
          }}
        />
      )}
    </div>
  );
}

// ============ PLAYER PROFILE MODAL ============
function PlayerProfile({ playerId, players, games, season, fbUser, onPlayerUpdated, onClose }) {
  const player = players.find(p => p.id === playerId);
  if (!player) return null;

  // Email editing has moved to the MANAGE PLAYERS admin screen. Profile view
  // now matches the cleaner High Rollers profile layout (no email row).

  // Birthday display
  const monthNames = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const bdayStr = player.birthday ? `${monthNames[player.birthday.month]} ${player.birthday.day}` : null;

  // ===== Chart + stats source toggle =====
  // CURRENT SEASON uses the games prop. ALL TIME lazy-fetches every league
  // game across every season. Stats blocks above the chart and the chart
  // itself both pull from the same `chartGames` array so the toggle drives
  // the whole profile.
  const [chartView, setChartView] = useState('season');
  const [allGames, setAllGames] = useState(null);
  useEffect(() => {
    if (chartView === 'all' && !allGames && window.GRP_DB) {
      window.GRP_DB.getAllLeagueGames().then(setAllGames).catch(() => {});
    }
  }, [chartView, allGames]);
  const chartGames = chartView === 'all' ? (allGames || []) : games;

  // Compute stats from whichever set is selected.
  const gamesPlayed = chartGames.filter(g => g.pointsAwarded?.[playerId] > 0 || (g.finishOrder || []).includes(playerId));
  const totalPoints = gamesPlayed.reduce((sum, g) => sum + (g.pointsAwarded?.[playerId] || 0), 0);
  const wins = gamesPlayed.filter(g => g.finishOrder?.[0] === playerId).length;
  // "In the Money" — uses the actual payouts on each game rather than a fixed
  // top-3, so 4-paid games correctly credit a 4th place finish.
  const podiums = gamesPlayed.filter(g => {
    const paidCount = Object.keys(g.payouts || {}).length;
    if (paidCount === 0) return false;
    const pos = (g.finishOrder || []).indexOf(playerId);
    return pos >= 0 && pos < paidCount;
  }).length;
  // Buy-in per game: use the game's own buyIn field (varies now — R2 has
  // some £5 nights, £40 freezeouts, £40 final), multiplied by 1 + rebuys
  // for this player. Fallback £30 for very old games that pre-date the
  // buyIn field.
  const totalBuyIns = gamesPlayed.reduce(
    (sum, g) => sum + (g.buyIn || 30) * (1 + ((g.rebuys && g.rebuys[playerId]) || 0)),
    0
  );
  const winnings = gamesPlayed.reduce((sum, g) => {
    const pos = (g.finishOrder || []).indexOf(playerId);
    if (pos < 0 || pos > 4) return sum;
    return sum + (g.payouts?.[String(pos + 1)] || 0);
  }, 0);

  // v2-era stats — tallied from the chronological KO log + bounty claims list.
  // Older v1 games don't have a full knockouts log, so this collapses to 0 for
  // pre-v2 games and only starts counting from R2 2026 onwards.
  const kos = gamesPlayed.reduce(
    (sum, g) => sum + (g.knockouts || []).filter((k) => k.knocker === playerId).length,
    0
  );
  const bountyClaims = gamesPlayed.reduce(
    (sum, g) => sum + (g.bountyClaims || []).filter((c) => c.claimedBy === playerId).length,
    0
  );
  const firstOuts = gamesPlayed.reduce((sum, g) => {
    if (g.isFinal) return sum;
    const knockouts = g.knockouts || [];
    const firstOutId = g.firstOut
      || (knockouts.length > 0 ? knockouts[0].eliminated : null);
    return firstOutId === playerId ? sum + 1 : sum;
  }, 0);

  // Position distribution — count how many times this player finished in
  // each place. Non-final games only (finals skew the histogram since only
  // 3 positions are meaningful and the field is 6ish).
  const positionCounts = {};
  gamesPlayed.forEach((g) => {
    if (g.isFinal) return;
    const pos = (g.finishOrder || []).indexOf(playerId);
    if (pos < 0) return;
    positionCounts[pos + 1] = (positionCounts[pos + 1] || 0) + 1;
  });
  const maxFieldForDist = Math.max(
    6,
    ...gamesPlayed.filter((g) => !g.isFinal).map((g) => (g.finishOrder || []).length || 0)
  );

  return (
    <div onClick={onClose} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="gold-border rounded-3xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
        <div className="flex justify-between items-start mb-4">
          <div>
            <div className="font-display text-4xl gold-text">{player.displayName}</div>
            {player.realName && player.realName !== player.displayName && (
              <div className="text-yellow-100/60 font-mono text-sm">{player.realName}</div>
            )}
            {bdayStr && (
              <div className="text-emerald-300/60 font-mono text-xs mt-1">Birthday: {bdayStr}</div>
            )}
            {/* Email: read-only for non-admins (only shown if set), editable for admins */}
          </div>
          <button onClick={onClose} className="text-yellow-100/60 hover:text-yellow-100">
            <X size={20} />
          </button>
        </div>

        {/* Stats grid */}
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-6">
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">POINTS</div>
            <div className="font-display text-2xl gold-text">{totalPoints.toLocaleString()}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">GAMES</div>
            <div className="font-display text-2xl text-emerald-200">{gamesPlayed.length}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">WINS</div>
            <div className="font-display text-2xl text-emerald-200">{wins}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">IN THE MONEY</div>
            <div className="font-display text-2xl text-emerald-200">{podiums}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">BUY-INS</div>
            <div className="font-display text-2xl text-yellow-200">£{totalBuyIns}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">WINNINGS</div>
            <div className="font-display text-2xl text-emerald-300">£{Math.round(winnings)}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">NET</div>
            <div className={`font-display text-2xl ${winnings - totalBuyIns >= 0 ? 'text-emerald-300' : 'text-red-400'}`}>
              £{Math.round(winnings - totalBuyIns)}
            </div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">AVG PTS</div>
            <div className="font-display text-2xl text-emerald-200">
              {gamesPlayed.length ? Math.round(totalPoints / gamesPlayed.length).toLocaleString() : '0'}
            </div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">KOs</div>
            <div className="font-display text-2xl text-emerald-200">{kos}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">🎯 CLAIMS</div>
            <div className="font-display text-2xl text-yellow-300">{bountyClaims}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">1ST OUT</div>
            <div className="font-display text-2xl text-red-300">{firstOuts}</div>
          </div>
        </div>

        {/* Toggle: shared between the two charts below */}
        <div className="flex justify-end gap-1.5 mb-3">
          {[
            { key: 'season', label: 'CURRENT SEASON' },
            { key: 'all', label: 'ALL TIME' },
          ].map(({ key, label }) => (
            <button
              key={key}
              onClick={() => setChartView(key)}
              className={`px-2 py-0.5 rounded font-mono text-[10px] tracking-widest transition-colors ${
                chartView === key
                  ? 'bg-emerald-500/25 border border-emerald-400/50 text-emerald-100'
                  : 'border border-yellow-500/15 text-yellow-100/50 hover:text-yellow-100/80 hover:border-yellow-500/30'
              }`}
            >
              {label}
            </button>
          ))}
        </div>

        {/* Cumulative-points line chart */}
        {(() => {
          const safeGames = Array.isArray(chartGames) ? chartGames : [];
          if (safeGames.length === 0) {
            return (
              <div className="mb-5">
                <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">CUMULATIVE POINTS (over time)</div>
                <div className="text-yellow-100/40 font-mono text-sm py-6 text-center">
                  {chartView === 'all' ? 'Loading…' : 'No games yet'}
                </div>
              </div>
            );
          }
          const pointsPerGame = safeGames.map(g => (g.pointsAwarded || {})[playerId] || 0);
          const cumPoints = [];
          let running = 0;
          pointsPerGame.forEach(p => { running += p; cumPoints.push(running); });
          const cpW = 600, cpH = 160, cpPAD = 24;
          const cpXs = safeGames.length > 1
            ? safeGames.map((_, i) => cpPAD + (i * (cpW - 2 * cpPAD)) / (safeGames.length - 1))
            : [cpW / 2];
          const cpMax = Math.max(1, ...cumPoints);
          const cpYs = cumPoints.map(v => cpH - cpPAD - (v / cpMax) * (cpH - 2 * cpPAD));
          const cpPath = cpXs.map((x, i) => `${i === 0 ? 'M' : 'L'} ${x} ${cpYs[i]}`).join(' ');
          const cpArea = `${cpPath} L ${cpXs[cpXs.length-1]} ${cpH - cpPAD} L ${cpXs[0]} ${cpH - cpPAD} Z`;
          const fmtPts = (v) => v >= 1000 ? `${(v/1000).toFixed(v >= 10000 ? 0 : 1)}k` : String(Math.round(v));
          return (
            <div className="mb-5">
              <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">CUMULATIVE POINTS (over time)</div>
              <div className="flex">
                <div className="flex flex-col justify-between items-end pr-2 py-3 font-mono text-[10px] text-yellow-100/40 tracking-wider" style={{ minHeight: '120px' }}>
                  <span>{fmtPts(cpMax)}</span>
                  <span className="text-yellow-100/25">{fmtPts(cpMax / 2)}</span>
                  <span className="text-yellow-100/25">0</span>
                </div>
                <div className="flex-1 p-3 rounded-lg bg-black/40 border border-emerald-500/10">
                  <svg viewBox={`0 0 ${cpW} ${cpH}`} className="w-full" style={{ height: 'auto' }}>
                    <path d={cpArea} fill="rgba(20,163,123,0.18)" />
                    <path d={cpPath} fill="none" stroke="#1ec890" strokeWidth="2" />
                    {safeGames.map((g, i) => (
                      <g key={g.id}>
                        <circle cx={cpXs[i]} cy={cpYs[i]} r="3" fill="#1ec890" />
                        <title>{`${g.isFinal ? 'FINAL' : 'G' + g.gameNumber} (${g.date}): +${pointsPerGame[i].toLocaleString()} pts (running ${cumPoints[i].toLocaleString()})`}</title>
                      </g>
                    ))}
                  </svg>
                  {chartView === 'season' && (
                    <div className="flex justify-between text-[10px] font-mono text-yellow-100/30 mt-1 px-2">
                      {safeGames.map((g) => (
                        <span key={g.id}>{g.isFinal ? 'FINAL' : `G${g.gameNumber}`}</span>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        })()}

        {/* Finishing-position bar chart */}
        {(() => {
          // Compute the max field size across the visible games (default to 9
          // if we have no data yet). The y-axis uses this as the scale so a
          // bar's height directly corresponds to a position number.
          const safeGames = Array.isArray(chartGames) ? chartGames : [];
          const maxField = Math.max(
            9,
            ...safeGames.map((g) => (g?.finishOrder || []).length || 0)
          );
          const ordinal = (n) => {
            const s = ['th','st','nd','rd'];
            const v = n % 100;
            return n + (s[(v - 20) % 10] || s[v] || s[0]);
          };
          // Y-axis ticks: 1st, middle, last
          const midTick = Math.ceil(maxField / 2);
          return (
            <div className="mb-4">
              <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">FINISHING POSITION</div>
              <div className="flex">
                {/* Y-axis labels */}
                <div className="flex flex-col justify-between items-end h-40 pr-2 py-3 font-mono text-[10px] text-yellow-100/40 tracking-wider">
                  <span>{ordinal(1)}</span>
                  <span className="text-yellow-100/25">{ordinal(midTick)}</span>
                  <span className="text-yellow-100/25">{ordinal(maxField)}</span>
                </div>
                {/* Chart area */}
                <div className="flex-1 relative h-40 p-3 rounded-lg bg-black/40 border border-emerald-500/10">
                  {/* Subtle horizontal grid lines at top, middle, bottom */}
                  <div className="absolute inset-3 pointer-events-none flex flex-col justify-between">
                    <div className="border-t border-yellow-500/10" />
                    <div className="border-t border-yellow-500/5" />
                    <div className="border-t border-yellow-500/10" />
                  </div>
                  {safeGames.length === 0 ? (
                    <div className="h-full flex items-center justify-center font-mono text-xs text-yellow-100/30">
                      {chartView === 'all' ? 'Loading…' : 'No games yet'}
                    </div>
                  ) : (
                    <div className="flex gap-1.5 h-full relative">
                      {safeGames.map((g) => {
                        const finishOrder = (g && g.finishOrder) || [];
                        const pos = finishOrder.indexOf(playerId); // 0-indexed; -1 if didn't play
                        const heightPct = pos < 0
                          ? 0
                          : Math.max(8, Math.round(((maxField - pos) / maxField) * 100));
                        let bg = 'linear-gradient(180deg, #404040, #2a2a2a)';
                        if (pos === 0) bg = 'linear-gradient(180deg, #f4d03f, #d4ac0d)';
                        else if (pos === 1) bg = 'linear-gradient(180deg, #d4d4d4, #9ca3af)';
                        else if (pos === 2) bg = 'linear-gradient(180deg, #d4924a, #a06334)';
                        else if (pos === 3) bg = 'linear-gradient(180deg, #5eead4, #14b8a6)';
                        else if (pos === 4) bg = 'linear-gradient(180deg, #93c5fd, #3b82f6)';
                        else if (pos > 0) bg = 'linear-gradient(180deg, #14a37b, #0a6e52)';
                        const fieldSize = finishOrder.length || 0;
                        const gameLabel = g.isFinal ? 'FINAL' : `G${g.gameNumber}`;
                        let tip;
                        if (pos < 0) tip = `${gameLabel} (${g.date || '?'}): did not play`;
                        else if (g.isFinal) {
                          const labels = ['Winner', '2nd Place', '3rd Place'];
                          tip = `${gameLabel} (${g.date || '?'}): ${labels[pos] || `${ordinal(pos + 1)} of ${fieldSize}`}`;
                        } else {
                          tip = `${gameLabel} (${g.date || '?'}): ${ordinal(pos + 1)} of ${fieldSize}`;
                        }
                        return (
                          <div key={g.id} className="flex-1 relative h-full" title={tip}>
                            {pos >= 0 && (
                              <>
                                {/* Bar — absolute-positioned from the bottom so heightPct is relative to the chart area */}
                                <div
                                  className="absolute inset-x-0 rounded-t"
                                  style={{
                                    bottom: 0,
                                    height: `${heightPct}%`,
                                    minHeight: '3px',
                                    background: bg,
                                  }}
                                />
                                {/* Position number sits just above the bar */}
                                <div
                                  className="absolute inset-x-0 text-center font-mono text-[10px] text-yellow-100/60"
                                  style={{ bottom: `calc(${heightPct}% + 2px)` }}
                                >
                                  {pos + 1}
                                </div>
                              </>
                            )}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              </div>

              {/* X-axis labels — only show in season view (all-time has too many to fit) */}
              {chartView === 'season' && (
                <div className="flex pl-8 mt-1">
                  <div className="flex-1 flex justify-between text-[10px] font-mono text-yellow-100/30 px-2">
                    {safeGames.map((g) => (
                      <span key={g.id}>{g.isFinal ? 'FINAL' : `G${g.gameNumber}`}</span>
                    ))}
                  </div>
                </div>
              )}
            </div>
          );
        })()}

        {/* Position distribution — how often they land in each place. */}
        {(() => {
          const totalRegular = Object.values(positionCounts).reduce((a, b) => a + b, 0);
          if (totalRegular === 0) return null;
          const maxCount = Math.max(1, ...Object.values(positionCounts));
          const places = Array.from({ length: maxFieldForDist }, (_, i) => i + 1);
          const colorFor = (pos) => {
            if (pos === 1) return 'linear-gradient(180deg, #f4d03f, #d4ac0d)';
            if (pos === 2) return 'linear-gradient(180deg, #d4d4d4, #9ca3af)';
            if (pos === 3) return 'linear-gradient(180deg, #d4924a, #a06334)';
            if (pos === 4) return 'linear-gradient(180deg, #5eead4, #14b8a6)';
            if (pos === 5) return 'linear-gradient(180deg, #93c5fd, #3b82f6)';
            return 'linear-gradient(180deg, #14a37b, #0a6e52)';
          };
          const ordinal = (n) => {
            const s = ['th', 'st', 'nd', 'rd'];
            const v = n % 100;
            return n + (s[(v - 20) % 10] || s[v] || s[0]);
          };
          return (
            <div className="mb-4 mt-5">
              <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">POSITION DISTRIBUTION · REGULAR GAMES</div>
              <div className="flex gap-1.5 h-32 p-3 rounded-lg bg-black/40 border border-emerald-500/10">
                {places.map((place) => {
                  const count = positionCounts[place] || 0;
                  const heightPct = count > 0 ? Math.max(6, Math.round((count / maxCount) * 100)) : 0;
                  return (
                    <div key={place} className="flex-1 relative h-full flex flex-col items-center" title={`${ordinal(place)}: ${count} game${count === 1 ? '' : 's'}`}>
                      {count > 0 && (
                        <div
                          className="absolute inset-x-1 rounded-t"
                          style={{ bottom: 18, height: `calc(${heightPct}% - 18px)`, minHeight: '3px', background: colorFor(place) }}
                        />
                      )}
                      {count > 0 && (
                        <div
                          className="absolute inset-x-0 text-center font-mono text-[10px] text-yellow-100/70"
                          style={{ bottom: `calc(${heightPct}% - 2px)` }}
                        >
                          {count}
                        </div>
                      )}
                      <div className="absolute inset-x-0 bottom-0 text-center font-mono text-[10px] text-yellow-100/40">
                        {ordinal(place)}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })()}

        <div className="text-xs font-mono text-yellow-100/40 text-center">
          {chartView === 'season'
            ? (season ? `Stats for ${season.name}` : '')
            : `${(chartGames || []).filter(g => (g?.finishOrder || []).includes(playerId)).length} games across all seasons`}
        </div>
      </div>
    </div>
  );
}

// ============ POINTS BREAKDOWN MODAL ============
// Click a total-points cell or a per-game cell on the league table to open
// this. Splits the player's points into attendance / position / KO / bounty
// claim / first-out, per game. Season mode aggregates + lists every game;
// game mode focuses on one game only.
function PointsBreakdownModal({ player, games, playersById, mode, gameId, onClose }) {
  const relevant = mode === 'game' && gameId
    ? games.filter((g) => g.id === gameId)
    : games;
  const perGame = relevant
    .slice()
    .sort((a, b) => (a.gameNumber || 0) - (b.gameNumber || 0))
    .map((game) => ({ game, breakdown: computePointsBreakdownForGame(player.id, game, playersById) }))
    .filter((row) => row.breakdown !== null);

  const grandTotal = perGame.reduce((s, r) => s + r.breakdown.total, 0);

  return (
    <div onClick={onClose} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="gold-border rounded-3xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-lg w-full max-h-[92vh] overflow-y-auto">
        <div className="flex justify-between items-start mb-4 gap-3">
          <div className="min-w-0">
            <div className="font-display text-3xl gold-text">POINTS BREAKDOWN</div>
            <div className="text-yellow-100/60 font-mono text-xs mt-1">
              {player.displayName} · {mode === 'game' ? `Game ${relevant[0]?.gameNumber || '?'}` : 'Season'}
            </div>
          </div>
