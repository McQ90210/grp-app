          <div className="gold-border rounded-3xl bg-gradient-to-br from-emerald-950/80 to-black/80 backdrop-blur p-8 sm:p-12 mb-6">
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-6">
              <div className="text-center">
                <div className="font-mono text-[11px] sm:text-xs text-yellow-500/70 tracking-widest mb-1">LEVEL</div>
                <div className="font-display text-5xl sm:text-6xl gold-text leading-none">

                </div>
              </div>
              <div className="text-center">
                <div className="font-mono text-[11px] sm:text-xs text-yellow-500/70 tracking-widest mb-1">REMAINING</div>
                <div className="font-display text-5xl sm:text-6xl gold-text leading-none">
                  {activePlayers.length.toString().padStart(2, '0')}
                  <span className="text-2xl sm:text-3xl text-yellow-500/40"> / {players.length}</span>
                </div>
              </div>
              <div className="text-center">
                <div className="font-mono text-[11px] sm:text-xs text-yellow-500/70 tracking-widest mb-1">AVG STACK</div>
                <div className="font-display text-5xl sm:text-6xl gold-text leading-none">
                  {activePlayers.length > 0 ? avgStack.toLocaleString() : '—'}
                </div>
              </div>
              <div className="text-center">
                <div className="font-mono text-[11px] sm:text-xs text-yellow-300/80 tracking-widest mb-1">POT</div>
                <div className="font-display text-5xl sm:text-6xl gold-text leading-none">
                  £{prizePool.toLocaleString()}
                </div>
                {totalRebuys > 0 && (
                  <div className="font-mono text-[11px] text-yellow-300/50 mt-1">
                    +{totalRebuys} rebuy{totalRebuys === 1 ? '' : 's'}
                  </div>
                )}
              </div>
            </div>

            <div className="text-center my-12">
              <div className={`font-mono font-bold tracking-tighter ${timeLeft <= 60 && timeLeft > 0 && !level.isBreak ? 'warning' : 'text-yellow-50'}`} style={{ fontSize: 'clamp(5rem, 18vw, 11rem)', lineHeight: 1 }}>
                {formatTime(timeLeft)}
              </div>
              <div
                role="slider"
                aria-label="Scrub round time"
                onPointerDown={(e) => {
                  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
                  scrubDraggingRef.current = true;
                  const rect = e.currentTarget.getBoundingClientRect();
                  const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                  const total = level.duration * 60;
                  setTimeLeft(Math.max(0, Math.min(total, Math.round(total - ratio * total))));
                }}
                onPointerMove={(e) => {
                  if (!scrubDraggingRef.current) return;
                  const rect = e.currentTarget.getBoundingClientRect();
                  const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
                  const total = level.duration * 60;
                  setTimeLeft(Math.max(0, Math.min(total, Math.round(total - ratio * total))));
                }}
                onPointerUp={(e) => {
                  scrubDraggingRef.current = false;
                  try { e.currentTarget.releasePointerCapture(e.pointerId); } catch (_) {}
                }}
                onPointerCancel={() => { scrubDraggingRef.current = false; }}
                onPointerLeave={() => { scrubDraggingRef.current = false; }}
                className="h-3 bg-black/40 rounded-full overflow-hidden mt-4 mx-auto max-w-md cursor-pointer relative group touch-none"
              >
                <div className="h-full" style={{
                  width: `${progress * 100}%`,
                  background: level.isBreak ? 'linear-gradient(90deg, #3b82f6, #60a5fa)' : 'linear-gradient(90deg, #f4d03f, #d4ac0d)',
                  transition: 'background 0.2s',

                {/* scrub handle */}
                <div
                  className="absolute top-1/2 -translate-y-1/2 w-4 h-4 rounded-full bg-yellow-100 border-2 border-yellow-600 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none shadow-lg"
                  style={{ left: `calc(${progress * 100}% - 8px)` }}
                />
              </div>
            </div>

            <div className="grid grid-cols-3 gap-4 mb-8">

                <div className="col-span-3 text-center py-6">

                </div>

                <>
                  <div className="text-center">
                    <div className="font-mono text-xs text-yellow-500/60 tracking-widest mb-1">SMALL BLIND</div>
                    <div className="font-display text-4xl sm:text-5xl text-yellow-50">{level.sb.toLocaleString()}</div>
                  </div>
                  <div className="text-center border-x border-yellow-500/10">
                    <div className="font-mono text-xs text-yellow-500/60 tracking-widest mb-1">BIG BLIND</div>
                    <div className="font-display text-4xl sm:text-5xl text-yellow-50">{level.bb.toLocaleString()}</div>
                  </div>
                  <div className="text-center">
                    <div className="font-mono text-xs text-yellow-500/60 tracking-widest mb-1">ANTE</div>
                    <div className="font-display text-4xl sm:text-5xl text-yellow-50">{level.ante > 0 ? level.ante.toLocaleString() : '—'}</div>
                  </div>

            {nextLvl && (

            </button>
            <button onClick={nextLevel} className="control-btn p-4 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100">
              <SkipForward size={20} />
            </button>
          </div>

          {/* Eliminate button */}
          <div className="flex justify-center mb-6">
            <button
              onClick={() => setShowEliminate(true)}
              disabled={activePlayers.length === 0}
              className="control-btn px-6 py-2.5 rounded-full bg-red-900/30 border border-red-500/40 text-red-200 font-mono text-sm flex items-center gap-2 hover:bg-red-900/50 disabled:opacity-30"
            >
              <UserMinus size={16} /> ELIMINATE PLAYER
            </button>
          </div>

          {activePanel === 'players' && (
            <div className="gold-border rounded-2xl bg-black/60 backdrop-blur p-6 mb-6">
              <div className="flex justify-between items-center mb-4">
                <div className="font-display text-2xl gold-text">PLAYERS & REBUYS</div>
                <button onClick={() => setActivePanel(null)} className="text-yellow-100/60 hover:text-yellow-100"><X size={18} /></button>
              </div>
              {/* Late-entry typeahead — suggests existing roster members */}
              {(() => {
                const search = newPlayerName.trim().toLowerCase();
                const inGameNames = new Set(players.map((p) => p.name));
                const available = fullRoster.filter((p) => !inGameNames.has(p.name));
                const suggestions = search
                  ? available.filter((p) => p.name.toLowerCase().includes(search))
                  : available;
                const exactMatch = available.some((p) => p.name.toLowerCase() === search);
                const showNewFallback = search && !exactMatch;
                return (
                  <div className="mb-4">
                    <div className="flex gap-2 mb-2">
                      <input

                        value={newPlayerName}
                        onChange={(e) => setNewPlayerName(e.target.value)}
                        placeholder="Add late entry — search or pick below..."
                        className="flex-1 px-4 py-2 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 placeholder-yellow-100/30 focus:outline-none focus:border-yellow-500/50"
                      />
                    </div>
                    <div className="max-h-44 overflow-y-auto pr-1 space-y-1">
                      {suggestions.length === 0 && !showNewFallback && (

                      {suggestions.slice(0, 30).map((p) => (

                          className="w-full flex items-center justify-between px-3 py-2 rounded-lg bg-emerald-950/40 border border-emerald-500/20 hover:bg-emerald-900/50 hover:border-emerald-500/50 text-left transition-colors"
                        >

                          {p.sound && p.sound !== 'none' && (

                            </span>

                      {showNewFallback && (

              <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
                {players.map((player, idx) => {

                  return (

                const places = ['1st', '2nd', '3rd', '4th', '5th'];
                const colors = ['text-yellow-300', 'text-gray-300', 'text-amber-600', 'text-emerald-300', 'text-blue-300'];
                return splits.map((pct, i) => {

            <div className="flex flex-col sm:flex-row gap-3 justify-center flex-wrap">
              <button
                onClick={() => setShowSaveModal(true)}

                  onClick={() => { setWinner(null); onViewLeague(); }}

      )}

      {/* Save game modal */}
      {showSaveModal && winner && (
        <SaveGameModal

          knockedOutBy={knockedOutBy}

          fbUser={fbUser}

            setShowSaveModal(false);
            setWinner(null);
            if (config.gameType === 'league' && onViewLeague) {
              onViewLeague();
            } else {
              onReset();
            }
          }}
        />
      )}
    </div>
  );
}

// ============ FIREBASE HOOKS ============
// Wrapper so the app works even if Firebase fails to load.
function useFirebase() {
  const [ready, setReady] = useState(!!window.GRP_FIREBASE);
  const [user, setUser] = useState(null);
  useEffect(() => {
    const onReady = () => setReady(true);
    if (!window.GRP_FIREBASE) {
      window.addEventListener('firebase-ready', onReady);
      return () => window.removeEventListener('firebase-ready', onReady);
    }
    setReady(true);
  }, []);
  useEffect(() => {
    if (!ready || !window.GRP_FIREBASE) return;
    const { auth, onAuthStateChanged } = window.GRP_FIREBASE;
    const unsub = onAuthStateChanged(auth, (u) => setUser(u));
    return unsub;
  }, [ready]);
  return { ready, user, fb: window.GRP_FIREBASE || null };
}

// ============ SIGN IN MODAL ============
function SignInModal({ onClose }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setError('');
    setBusy(true);
    try {
      const { auth, signInWithEmailAndPassword } = window.GRP_FIREBASE;
      await signInWithEmailAndPassword(auth, email, password);
      onClose();
    } catch (e) {
      setError(e.message.replace(/^Firebase:\s*/, '').replace(/\(auth\/[^)]+\)\.?$/, ''));
    } finally {
      setBusy(false);
    }
  };

  return (
    <div onClick={onClose} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="gold-border rounded-2xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-sm w-full">
        <div className="flex justify-between items-center mb-4">
          <div className="font-display text-2xl gold-text">SIGN IN</div>
          <button onClick={onClose} className="text-yellow-100/60 hover:text-yellow-100"><X size={18} /></button>
        </div>
        <div className="text-yellow-100/60 text-xs mb-4 font-mono">Admins only — for recording game results.</div>
        <input
          type="email"
          value={email}
          onChange={(e) => setEmail(e.target.value)}
          placeholder="Email"
          autoFocus
          className="w-full px-3 py-2 mb-2 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 placeholder-yellow-100/30 focus:outline-none focus:border-yellow-500/50"
        />
        <input
          type="password"
          value={password}
          onChange={(e) => setPassword(e.target.value)}
          onKeyDown={(e) => e.key === 'Enter' && submit()}
          placeholder="Password"
          className="w-full px-3 py-2 mb-3 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 placeholder-yellow-100/30 focus:outline-none focus:border-yellow-500/50"
        />
        {error && <div className="text-red-400 text-xs mb-3 font-mono">{error}</div>}
        <button
          onClick={submit}
          disabled={busy || !email || !password}
          className="control-btn w-full px-6 py-2.5 rounded-full font-display text-xl text-black disabled:opacity-30"
          style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
        >
          {busy ? 'Signing in...' : 'Sign in'}
        </button>
      </div>
    </div>
  );
}

// ============ HIGH ROLLERS HISTORY ============
// Simpler view: just buy-in, position, winnings per player across all High Rollers games.
function HighRollersHistory({ onBack, fbUser }) {
  const [games, setGames] = useState([]);
  const [players, setPlayers] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [selectedPlayerId, setSelectedPlayerId] = useState(null);
  const [timeRange, setTimeRange] = useState('all'); // 'all' | '12m' | '6m'

  useEffect(() => {
    let cancelled = false;
    const doLoad = async () => {
      try {
        const [allGames, allPlayers] = await Promise.all([
          window.GRP_DB.getAllHighRollerGames(),
          window.GRP_DB.getAllPlayers(),
        ]);
        if (cancelled) return;
        setGames(allGames);
        setPlayers(allPlayers);
        setLoading(false);
      } catch (e) {
        if (!cancelled) {
          setError(e.message);
          setLoading(false);
        }
      }
    };
    if (window.GRP_DB) doLoad();
    else {
      const onReady = () => doLoad();
      window.addEventListener('firebase-ready', onReady);
      const t = setTimeout(() => {
        if (!cancelled && !window.GRP_DB) {
          setError('Firebase did not load.');
          setLoading(false);
        }
      }, 8000);
      return () => {
        cancelled = true;
        window.removeEventListener('firebase-ready', onReady);
        clearTimeout(t);
      };
    }
    return () => { cancelled = true; };
  }, []);

  const playersById = {};
  players.forEach((p) => { playersById[p.id] = p; });

  // Filter games for the standings table by the selected time range.
  // Game dates are stored as ISO date strings ("YYYY-MM-DD") so they sort
  // lexicographically — comparing strings is equivalent to comparing dates.
  const filteredGames = (() => {
    if (timeRange === 'all') return games;
    const cutoff = new Date();
    if (timeRange === '6m') cutoff.setMonth(cutoff.getMonth() - 6);
    else if (timeRange === '12m') cutoff.setMonth(cutoff.getMonth() - 12);
    const cutoffStr = cutoff.toISOString().slice(0, 10);
    return games.filter((g) => g.date && g.date >= cutoffStr);
  })();

  // Compute per-player stats across the filtered set of HR games
  const playerStats = {};
  filteredGames.forEach((g) => {
    (g.attendees || []).forEach((pid) => {
      if (!playerStats[pid]) playerStats[pid] = { gamesPlayed: 0, buyIns: 0, winnings: 0, wins: 0 };
      playerStats[pid].gamesPlayed += 1;
      playerStats[pid].buyIns += (g.buyIn || 30) * (1 + (g.rebuys?.[pid] || 0));
    });
    Object.entries(g.payouts || {}).forEach(([place, amount]) => {
      const pos = parseInt(place);
      const pid = (g.finishOrder || [])[pos - 1];
      if (pid && playerStats[pid]) {
        playerStats[pid].winnings += amount || 0;
        if (pos === 1) playerStats[pid].wins += 1;
      }
    });
  });

  const playerRows = Object.entries(playerStats)
    .map(([pid, stats]) => ({
      player: playersById[pid] || { displayName: pid, id: pid },
      ...stats,
      net: stats.winnings - stats.buyIns,
    }))
    .sort((a, b) => b.net - a.net);

  return (
    <div className="min-h-screen w-full" style={{
      background: 'radial-gradient(ellipse at top, #0a3d1f 0%, #062815 40%, #020a06 100%)',
      fontFamily: "'Inter', system-ui, sans-serif",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
        .font-display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .gold-text {
          background: linear-gradient(135deg, #14a37b 0%, #1ec890 50%, #0e8c69 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }
        .gold-border {
          border: 1px solid rgba(20, 163, 123, 0.4);
          box-shadow: 0 0 40px rgba(20, 163, 123, 0.15);
        }
      `}</style>
      <div className="p-4 sm:p-8 max-w-[1200px] mx-auto">
        <div className="mb-6">
          <button onClick={onBack} className="font-mono text-xs text-yellow-100/40 hover:text-yellow-100/80 mb-2">
            ← back
          </button>
          <div className="flex items-center gap-3">
            <img src="logos/GreeneRoomPokerLogo-02.svg" alt="" className="h-10 w-10 shrink-0" />
            <div className="font-display text-4xl gold-text">HIGH ROLLERS</div>
          </div>
          <div className="font-mono text-xs text-emerald-200/60 tracking-widest mt-1">
            CASUAL SIDE GAMES · {games.length} GAME{games.length === 1 ? '' : 'S'}
          </div>
        </div>

        {loading ? (
          <div className="text-center py-16 text-emerald-200/60 font-mono">Loading...</div>
        ) : error ? (
          <div className="text-center py-16 text-red-400 font-mono">Error: {error}</div>
        ) : games.length === 0 ? (
          <div className="text-center py-20">
            <div className="font-display text-3xl text-yellow-100/40 mb-3">NO GAMES YET</div>
            <div className="text-yellow-100/60 font-mono text-sm max-w-md mx-auto">
              High Rollers games will appear here once you've played some.
              Run a tournament from the home screen with "High Rollers" selected.
            </div>
          </div>
        ) : (
          <div className="gold-border rounded-2xl bg-black/40 backdrop-blur p-6">
            <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
              <div className="font-mono text-xs text-yellow-100/40 tracking-widest">PLAYER STANDINGS BY NET PROFIT</div>
              <div className="flex gap-1.5">
                {[
                  { key: 'all', label: 'All time' },
                  { key: '12m', label: 'Last 12 mo' },
                  { key: '6m', label: 'Last 6 mo' },
                ].map(({ key, label }) => (
                  <button
                    key={key}
                    onClick={() => setTimeRange(key)}
                    className={`px-3 py-1 rounded-full font-mono text-xs tracking-widest transition-colors ${
                      timeRange === key
                        ? 'bg-emerald-500/30 border border-emerald-400/60 text-emerald-100'
                        : 'bg-black/30 border border-yellow-500/20 text-yellow-100/60 hover:border-yellow-500/40'
                    }`}
                  >
                    {label}
                  </button>
                ))}
              </div>
            </div>
            {filteredGames.length < games.length && (
              <div className="font-mono text-[11px] text-emerald-200/60 mb-3">
                Showing {filteredGames.length} of {games.length} game{games.length === 1 ? '' : 's'} in this range
              </div>
            )}
            <div className="overflow-x-auto">
              <table className="w-full" style={{ borderCollapse: 'collapse' }}>
                <thead>
                  <tr className="text-left font-mono text-xs text-emerald-300 uppercase tracking-widest">
                    <th className="py-3 px-4">Player</th>
                    <th className="py-3 px-4 text-right">Games</th>
                    <th className="py-3 px-4 text-right">Wins</th>
                    <th className="py-3 px-4 text-right">Buy-ins</th>
                    <th className="py-3 px-4 text-right">Winnings</th>
                    <th className="py-3 px-4 text-right">Net</th>
                  </tr>
                </thead>
                <tbody>
                  {playerRows.map((r) => (
                    <tr
                      key={r.player.id}
                      onClick={() => setSelectedPlayerId(r.player.id)}
                      className="border-t border-emerald-500/10 font-mono text-sm cursor-pointer hover:bg-emerald-500/5 transition-colors"
                    >
                      <td className="py-3 px-4 text-emerald-100">{r.player.displayName}</td>
                      <td className="py-3 px-4 text-right text-yellow-100/80">{r.gamesPlayed}</td>
                      <td className="py-3 px-4 text-right text-yellow-100/80">{r.wins}</td>
                      <td className="py-3 px-4 text-right text-yellow-100/80">£{r.buyIns}</td>
                      <td className="py-3 px-4 text-right text-emerald-300">£{Math.round(r.winnings)}</td>
                      <td className={`py-3 px-4 text-right font-bold ${r.net >= 0 ? 'text-emerald-300' : 'text-red-400'}`}>
                        {r.net >= 0 ? '+' : ''}£{Math.round(r.net)}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div className="mt-6 pt-4 border-t border-emerald-500/10">
              <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">RECENT GAMES</div>
              <div className="space-y-3">
                {games.slice(0, 10).map((g) => {
                  const podium = [1, 2, 3].map((place) => {
                    const pid = (g.finishOrder || [])[place - 1];
                    return {
                      place,
                      name: pid ? (playersById[pid]?.displayName || pid) : null,
                      payout: g.payouts?.[String(place)] || 0,
                      pid,
                    };
                  });
                  const medal = ['🥇', '🥈', '🥉'];
                  return (
                    <div key={g.id} className="p-3 rounded-lg bg-black/40 border border-emerald-500/10 font-mono text-sm">
                      <div className="flex justify-between items-center mb-2">
                        <div className="text-yellow-100/80">{g.date || 'unknown date'}</div>
                        <div className="text-emerald-100/80 text-xs">
                          {g.attendees?.length || 0} players · £{g.pot || 0} pot
                        </div>
                      </div>
                      <div className="grid grid-cols-3 gap-2">
                        {podium.map((p) => (
                          <div
                            key={p.place}
                            onClick={() => p.pid && setSelectedPlayerId(p.pid)}
                            className={`flex items-center justify-between px-2 py-1.5 rounded bg-black/30 ${p.pid ? 'cursor-pointer hover:bg-emerald-500/10' : ''}`}
                          >
                            <span className="flex items-center gap-1.5 text-emerald-100">
                              <span>{medal[p.place - 1]}</span>
                              <span className="truncate">{p.name || '—'}</span>
                            </span>
                            {p.payout > 0 && (
                              <span className="text-emerald-300/80 text-xs">£{p.payout}</span>
                            )}
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        )}

        {selectedPlayerId && (
          <HighRollersPlayerProfile
            playerId={selectedPlayerId}
            players={players}
            games={games}
            onClose={() => setSelectedPlayerId(null)}
          />
        )}
      </div>
    </div>
  );
}

// ============ HIGH ROLLERS PLAYER PROFILE ============
// Click a player row in HR history to see their per-game record, cumulative
// net profit chart, and finishing-position chart.
function HighRollersPlayerProfile({ playerId, players, games, onClose }) {
  const player = players.find((p) => p.id === playerId);
  if (!player) return null;

  // Per-game history, sorted by date ascending so charts read left → right in time
  const sorted = [...games]
    .filter((g) => (g.attendees || []).includes(playerId))
    .sort((a, b) => (a.date || '').localeCompare(b.date || ''));

  const history = sorted.map((g) => {
    const buyIn = (g.buyIn || 30) * (1 + (g.rebuys?.[playerId] || 0));
    const pos = (g.finishOrder || []).indexOf(playerId);
    const place = pos >= 0 ? pos + 1 : null;
    const winnings = place ? (g.payouts?.[String(place)] || 0) : 0;
    return {
      date: g.date,
      gameId: g.id,
      buyIn,
      winnings,
      net: winnings - buyIn,
      place,
      totalPlayers: (g.attendees || []).length,
    };
  });

  // Cumulative net for the line chart
  let cum = 0;
  const cumulative = history.map((h) => { cum += h.net; return cum; });

  // Stats
  const gamesPlayed = history.length;
  const wins = history.filter((h) => h.place === 1).length;
  const podiums = history.filter((h) => h.place && h.place <= 3).length;
  const totalBuyIns = history.reduce((s, h) => s + h.buyIn, 0);
  const totalWinnings = history.reduce((s, h) => s + h.winnings, 0);
  const netTotal = totalWinnings - totalBuyIns;
  const placedGames = history.filter((h) => h.place);
  const avgPosition = placedGames.length
    ? (placedGames.reduce((s, h) => s + h.place, 0) / placedGames.length).toFixed(1)
    : '—';

  // ----- Cumulative profit line chart -----
  const W = 600, H = 160, PAD = 24;
  const xs = history.length > 1
    ? history.map((_, i) => PAD + (i * (W - 2 * PAD)) / (history.length - 1))
    : [W / 2];
  const minCum = Math.min(0, ...cumulative);
  const maxCum = Math.max(0, ...cumulative);
  const range = (maxCum - minCum) || 1;
  const ys = cumulative.map((v) => H - PAD - ((v - minCum) / range) * (H - 2 * PAD));
  const zeroY = H - PAD - ((0 - minCum) / range) * (H - 2 * PAD);
  const pathD = history.length === 0
    ? ''
    : xs.map((x, i) => `${i === 0 ? 'M' : 'L'} ${x} ${ys[i]}`).join(' ');
  const areaD = history.length === 0
    ? ''
    : `${pathD} L ${xs[xs.length - 1]} ${zeroY} L ${xs[0]} ${zeroY} Z`;

  // ----- Position bar chart -----
  // Each bar's height = (totalPlayers − place + 1) / totalPlayers (so 1st = full bar)
  const PH = 120;

  return (
    <div onClick={onClose} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="gold-border rounded-3xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-3xl w-full max-h-[92vh] overflow-y-auto">
        <div className="flex justify-between items-start mb-4">
          <div>
            <div className="font-display text-4xl gold-text">{player.displayName}</div>
            {player.realName && player.realName !== player.displayName && (
              <div className="text-yellow-100/60 font-mono text-sm">{player.realName}</div>
            )}
            <div className="text-emerald-300/60 font-mono text-xs mt-1">High Rollers history</div>
          </div>
          <button onClick={onClose} className="text-yellow-100/60 hover:text-yellow-100">
            <X size={20} />
          </button>
        </div>

        {/* Stats grid */}
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-6">
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">GAMES</div>
            <div className="font-display text-2xl text-emerald-200">{gamesPlayed}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">WINS</div>
            <div className="font-display text-2xl text-emerald-200">{wins}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">PODIUMS</div>
            <div className="font-display text-2xl text-emerald-200">{podiums}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">AVG POS</div>
            <div className="font-display text-2xl text-emerald-200">{avgPosition}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">BUY-INS</div>
            <div className="font-display text-2xl text-yellow-200">£{totalBuyIns}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">WINNINGS</div>
            <div className="font-display text-2xl text-emerald-300">£{Math.round(totalWinnings)}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20 col-span-2">
            <div className="font-mono text-xs text-yellow-100/40">NET PROFIT</div>
            <div className={`font-display text-3xl ${netTotal >= 0 ? 'text-emerald-300' : 'text-red-400'}`}>
              {netTotal >= 0 ? '+' : ''}£{Math.round(netTotal)}
            </div>
          </div>
        </div>

        {/* Cumulative profit chart */}
        <div className="mb-5">
          <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">
            CUMULATIVE NET PROFIT (over time)
          </div>
          {history.length === 0 ? (
            <div className="text-yellow-100/40 font-mono text-sm py-6 text-center">No games yet.</div>
          ) : (
            <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/10">
              <svg viewBox={`0 0 ${W} ${H}`} className="w-full" style={{ height: 'auto' }}>
                {/* zero line */}
                <line x1={PAD} x2={W - PAD} y1={zeroY} y2={zeroY} stroke="rgba(255,255,255,0.15)" strokeDasharray="3 3" />
                {/* area fill */}
                <path d={areaD} fill={netTotal >= 0 ? 'rgba(20,163,123,0.18)' : 'rgba(239,68,68,0.18)'} />
                {/* line */}
                <path d={pathD} fill="none" stroke={netTotal >= 0 ? '#1ec890' : '#ef4444'} strokeWidth="2" />
                {/* points + labels */}
                {history.map((h, i) => (
                  <g key={h.gameId}>
                    <circle cx={xs[i]} cy={ys[i]} r="3" fill={cumulative[i] >= 0 ? '#1ec890' : '#ef4444'} />
                    <title>{`${h.date}: ${h.net >= 0 ? '+' : ''}£${h.net} (running ${cumulative[i] >= 0 ? '+' : ''}£${cumulative[i]})`}</title>
                  </g>
                ))}
              </svg>
              <div className="flex justify-between text-[10px] font-mono text-yellow-100/30 mt-1 px-2">
                {history.map((h, i) => (
                  <span key={i}>{h.date?.slice(5) || ''}</span>
                ))}
              </div>
            </div>
          )}
        </div>

        {/* Position chart */}
        {history.length > 0 && (
          <div className="mb-2">
            <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">
              FINAL POSITION (1st = tallest)
            </div>
            <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/10">
              <div className="flex items-end gap-1.5" style={{ height: `${PH}px` }}>
                {history.map((h) => {
                  const tp = h.totalPlayers || 1;
                  const heightPct = h.place
                    ? ((tp - h.place + 1) / tp) * 100
                    : 0;
                  const color = h.place === 1
                    ? 'linear-gradient(180deg, #f4d03f, #d4ac0d)'
                    : h.place === 2
                      ? 'linear-gradient(180deg, #d6d6d6, #a0a0a0)'
                      : h.place === 3
                        ? 'linear-gradient(180deg, #cd7f32, #8a5a23)'
                        : 'linear-gradient(180deg, #14a37b, #0a6e52)';
                  return (
                    <div
                      key={h.gameId}
                      className="flex-1 rounded-t relative"
                      style={{
                        height: `${heightPct}%`,
                        minHeight: h.place ? '4px' : '0',
                        background: color,
                      }}
                      title={`${h.date}: ${h.place ? `${h.place}/${tp}` : 'no position'}`}
                    />
                  );
                })}
              </div>
              <div className="flex justify-between text-[10px] font-mono text-yellow-100/30 mt-1 px-2">
                {history.map((h, i) => (
                  <span key={i}>{h.place ? `${h.place}/${h.totalPlayers}` : '—'}</span>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

// ============ LEAGUE DASHBOARD ============
// Shows the season-by-season standings table — spreadsheet-style view of all games.
function LeagueDashboard({ onBack, fbUser }) {
  const [seasons, setSeasons] = useState([]);
  const [activeSeasonId, setActiveSeasonId] = useState(null);
  const [players, setPlayers] = useState([]);
  const [games, setGames] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [selectedPlayerId, setSelectedPlayerId] = useState(null);
  const [showImport, setShowImport] = useState(false);
  const [editingGame, setEditingGame] = useState(null);
  const [showDeleteSeasonConfirm, setShowDeleteSeasonConfirm] = useState(false);

  // Load seasons + players on mount — wait for Firebase if it hasn't loaded yet
  useEffect(() => {
    let cancelled = false;

    const doLoad = async () => {
      try {
        const [allSeasons, allPlayers] = await Promise.all([
          window.GRP_DB.getAllSeasons(),
          window.GRP_DB.getAllPlayers(),
        ]);
        if (cancelled) return;
        setSeasons(allSeasons);
        setPlayers(allPlayers);
        // Prefer the season whose date range contains today (see notes in
        // LeagueContextScreen); fall back to status='active', then first.
        const today = new Date().toISOString().slice(0, 10);
        const byDate = allSeasons.find(s => s.startDate && s.endDate && s.startDate <= today && s.endDate >= today);
        const active = byDate || allSeasons.find(s => s.status === 'active') || allSeasons[0];
        if (active) setActiveSeasonId(active.id);
        setLoading(false);
      } catch (e) {
        if (!cancelled) {
          setError(e.message);
          setLoading(false);
        }
      }
    };

    if (window.GRP_DB) {
      doLoad();
    } else {
      // Firebase still loading — wait for the ready event
      const onReady = () => doLoad();
      window.addEventListener('firebase-ready', onReady);
      // Safety: if no Firebase after 8 seconds, show error
      const timeout = setTimeout(() => {
        if (!cancelled && !window.GRP_DB) {
          setError('Firebase did not load. Check your internet connection.');
          setLoading(false);
        }
      }, 8000);
      return () => {
        cancelled = true;
        window.removeEventListener('firebase-ready', onReady);
        clearTimeout(timeout);
      };
    }
    return () => { cancelled = true; };
  }, []);

  // Load games for the selected season
  useEffect(() => {
    if (!activeSeasonId || !window.GRP_DB) return;
    (async () => {
      try {
        const seasonGames = await window.GRP_DB.getGamesForSeason(activeSeasonId);
        setGames(seasonGames);
      } catch (e) {
        setError(e.message);
      }
    })();
  }, [activeSeasonId]);

  // Compute totals per player for the active season
  const playerTotals = {};
  const playersById = {};
  players.forEach(p => { playersById[p.id] = p; });
  games.forEach(g => {
    Object.entries(g.pointsAwarded || {}).forEach(([pid, pts]) => {
      playerTotals[pid] = (playerTotals[pid] || 0) + (pts || 0);
    });
  });

  // Sort players by total points (descending), only show those who played at least one game
  const playerRows = Object.entries(playerTotals)
    .filter(([_, pts]) => pts > 0)
    .sort((a, b) => b[1] - a[1])
    .map(([pid, total]) => ({
      player: playersById[pid] || { displayName: pid, id: pid },
      total,
      gamePoints: games.map(g => g.pointsAwarded?.[pid] || null),
    }));

  // Aggregate stats at the bottom (subs, league money, etc.)
  const aggregates = {
    playersPerGame: games.map(g => Object.values(g.pointsAwarded || {}).filter(p => p > 0).length),
    rebuys: games.map(g => g.totalRebuys || 0),
    pot: games.map(g => g.pot),
    leagueMoney: games.map(g => g.leagueMoney),
    prizePool: games.map(g => g.prizePool),
    subs: games.map(g => g.subs),
  };

  const activeSeason = seasons.find(s => s.id === activeSeasonId);

  return (
    <div className="min-h-screen w-full" style={{
      background: 'radial-gradient(ellipse at top, #0a3d1f 0%, #062815 40%, #020a06 100%)',
      fontFamily: "'Inter', system-ui, sans-serif",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
        .font-display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .gold-text {
          background: linear-gradient(135deg, #14a37b 0%, #1ec890 50%, #0e8c69 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }
        .gold-border {
          border: 1px solid rgba(20, 163, 123, 0.4);
          box-shadow: 0 0 40px rgba(20, 163, 123, 0.15), inset 0 0 60px rgba(20, 163, 123, 0.05);
        }
        .league-table { border-collapse: collapse; width: 100%; }
        .league-table th, .league-table td {
          padding: 10px 14px;
          font-family: 'JetBrains Mono', monospace;
          font-size: 14px;
          border-right: 1px solid rgba(255, 255, 255, 0.05);
          white-space: nowrap;
        }
        .league-table th {
          background: rgba(0, 0, 0, 0.5);
          color: #14a37b;
          font-weight: 700;
          font-size: 13px;
          text-transform: uppercase;
          letter-spacing: 0.1em;
          position: sticky;
          top: 0;
          z-index: 10;
        }
        .league-table th.sticky-col, .league-table td.sticky-col {
          position: sticky;
          left: 0;
          background: #020a06;
          z-index: 5;
        }
        .league-table th.sticky-col { z-index: 11; }
        .league-table .total-col {
          background: rgba(20, 163, 123, 0.12);
          font-weight: 700;
          color: #1ec890;
          font-size: 15px;
        }
        .league-table tr:hover td:not(.sticky-col):not(.total-col) {
          background: rgba(20, 163, 123, 0.06);
        }
        .league-table tr.totals-row td {
          background: rgba(20, 163, 123, 0.08);
          color: #1ec890;
          border-top: 1px solid rgba(20, 163, 123, 0.3);
          font-size: 12px;
        }
        /* Per-cell finishing-position colours (1st-5th in each individual game) */
        .league-table td.place-1 { color: #f4d03f; font-weight: 700; }
        .league-table td.place-2 { color: #d4d4d4; font-weight: 700; }
        .league-table td.place-3 { color: #d4924a; font-weight: 700; }
        .league-table td.place-4 { color: #5eead4; font-weight: 600; }
        .league-table td.place-5 { color: #93c5fd; font-weight: 600; }
        /* Coloured leaderboard rank numbers (top 3 only) */
        .pos-num-1 { color: #f4d03f; font-weight: 700; }
        .pos-num-2 { color: #d4d4d4; font-weight: 700; }
        .pos-num-3 { color: #d4924a; font-weight: 700; }
        .player-link {
          cursor: pointer;
        }
        .player-link:hover { color: #1ec890 !important; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(20, 163, 123, 0.4); border-radius: 4px; }
      `}</style>

      <div className="p-3 sm:p-6 max-w-[1800px] mx-auto">
        {/* Header */}
        <div className="flex justify-between items-start mb-6 gap-4 flex-wrap">
          <div>
            <button onClick={onBack} className="font-mono text-xs text-yellow-100/40 hover:text-yellow-100/80 mb-2">
              ← back
            </button>
            <div className="flex items-center gap-3">
              <img src="logos/GreeneRoomPokerLogo-02.svg" alt="" className="h-10 w-10 shrink-0" />
              <div className="font-display text-4xl gold-text">
                LEAGUE STANDINGS
              </div>
            </div>
            {activeSeason && (
              <div className="font-mono text-xs text-emerald-200/60 tracking-widest mt-1">
                {activeSeason.name}
              </div>
            )}
          </div>

          {/* Season picker */}
          {seasons.length > 1 && (
            <select
              value={activeSeasonId || ''}
              onChange={(e) => setActiveSeasonId(e.target.value)}
              className="px-3 py-2 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 text-sm focus:outline-none focus:border-yellow-500/50"
            >
              {seasons.map(s => (
                <option key={s.id} value={s.id} style={{ background: '#0a3d1f' }}>
                  {s.name} {s.status === 'active' ? '(active)' : ''}
                </option>
              ))}
            </select>
          )}

          {/* Admin: Import button (only when signed in and no data yet) */}
          {fbUser && seasons.length === 0 && (
            <button
              onClick={() => setShowImport(true)}
              className="px-4 py-2 rounded-lg bg-yellow-500/20 border border-yellow-500/40 text-yellow-100 font-mono text-xs hover:bg-yellow-500/30"
            >
              IMPORT SPREADSHEET
            </button>
          )}
        </div>

        {loading ? (
          <div className="text-center py-16 text-emerald-200/60 font-mono">Loading...</div>
        ) : error ? (
          <div className="text-center py-16">
            <div className="text-red-400 font-mono mb-2">Error: {error}</div>
          </div>
        ) : seasons.length === 0 ? (
          <div className="text-center py-16">
            <div className="text-yellow-100/60 font-mono mb-4">No league data yet.</div>
            {fbUser ? (
              <button
                onClick={() => setShowImport(true)}
                className="px-6 py-3 rounded-full font-display text-xl text-black"
                style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
              >
                IMPORT SPREADSHEET
              </button>
            ) : (
              <div className="text-xs font-mono text-yellow-100/40">
                Sign in to import historical data.
              </div>
            )}
          </div>
        ) : games.length === 0 ? (
          <div className="text-center py-16 text-yellow-100/60 font-mono">
            No games yet in this season.
          </div>
        ) : (
          <div className="gold-border rounded-2xl bg-black/40 backdrop-blur p-4 overflow-x-auto">
            <table className="league-table">
              <thead>
                <tr>
                  <th className="sticky-col text-left">Player</th>
                  {games.map(g => (
                    <th
                      key={g.id}
                      className="text-center"
                      title={fbUser ? `Edit game ${g.gameNumber}` : g.date}
                      style={fbUser ? { cursor: 'pointer' } : {}}
                      onClick={fbUser ? () => setEditingGame(g) : null}
                    >
                      G{g.gameNumber}
                      <div className="text-[9px] text-yellow-100/30 font-normal normal-case tracking-normal">
                        {g.date?.slice(5)}
                      </div>
                      {fbUser && (
                        <div className="text-[9px] text-emerald-400/60 font-normal normal-case tracking-normal mt-0.5">
                          edit
                        </div>
                      )}
                    </th>
                  ))}
                  <th className="total-col text-right">Total</th>
                </tr>
              </thead>
              <tbody>
                {playerRows.map((row, i) => {
                  const pos = i + 1;
                  return (
                    <tr key={row.player.id}>
                      <td className="sticky-col">
                        <span className="player-link text-emerald-100" onClick={() => setSelectedPlayerId(row.player.id)}>
                          <span className={pos <= 3 ? `pos-num-${pos} mr-2` : 'text-yellow-100/40 mr-2'}>
                            {pos}.
                          </span>
                          {row.player.displayName}
                        </span>
                      </td>
                      {row.gamePoints.map((pts, gi) => {
                        if (pts === null) {
                          return <td key={gi} className="text-center text-yellow-100/30">—</td>;
                        }
                        // Find this player's finishing position in this game (from finishOrder)
                        const g = games[gi];
                        const finishPos = (g.finishOrder || []).indexOf(row.player.id);
                        const posClass = finishPos >= 0 && finishPos < 5 ? `place-${finishPos + 1}` : '';
                        return (
                          <td key={gi} className={`text-center ${posClass || 'text-emerald-100/80'}`}>
                            {pts.toLocaleString()}
                          </td>
                        );
                      })}
                      <td className="total-col text-right">{row.total.toLocaleString()}</td>
                    </tr>
                  );
                })}
                {/* Aggregate rows */}
                <tr className="totals-row">
                  <td className="sticky-col">Players</td>
                  {aggregates.playersPerGame.map((v, i) => <td key={i} className="text-center">{v || '—'}</td>)}
                  <td className="total-col text-right">—</td>
                </tr>
                <tr className="totals-row">
                  <td className="sticky-col">Rebuys</td>
                  {aggregates.rebuys.map((v, i) => <td key={i} className="text-center">{v || 0}</td>)}
                  <td className="total-col text-right">{aggregates.rebuys.reduce((a, b) => a + (b || 0), 0)}</td>
                </tr>
                <tr className="totals-row">
                  <td className="sticky-col">Pot (£)</td>
                  {aggregates.pot.map((v, i) => <td key={i} className="text-center">{v || '—'}</td>)}
                  <td className="total-col text-right">{aggregates.pot.reduce((a, b) => a + (b || 0), 0)}</td>
                </tr>
                <tr className="totals-row">
                  <td className="sticky-col">League £</td>
                  {aggregates.leagueMoney.map((v, i) => <td key={i} className="text-center">{v || 0}</td>)}
                  <td className="total-col text-right">{aggregates.leagueMoney.reduce((a, b) => a + (b || 0), 0)}</td>
                </tr>
                <tr className="totals-row">
                  <td className="sticky-col">Prize £</td>
                  {aggregates.prizePool.map((v, i) => <td key={i} className="text-center">{v || '—'}</td>)}
                  <td className="total-col text-right">—</td>
                </tr>
                <tr className="totals-row">
                  <td className="sticky-col">Subs £</td>
                  {aggregates.subs.map((v, i) => <td key={i} className="text-center">{v == null ? '—' : v}</td>)}
                  <td className="total-col text-right">{aggregates.subs.reduce((a, b) => a + (b || 0), 0)}</td>
                </tr>
                {/* Payouts: 1st-5th */}
                {[1, 2, 3, 4, 5].map(place => (
                  <tr key={place} className="totals-row">
                    <td className="sticky-col">{place === 1 ? '1st £' : place === 2 ? '2nd £' : place === 3 ? '3rd £' : `${place}th £`}</td>
                    {games.map((g, i) => (
                      <td key={i} className="text-center">{g.payouts?.[String(place)] || '—'}</td>
                    ))}
                    <td className="total-col text-right">—</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        <div className="text-center mt-4 text-xs font-mono text-yellow-100/30">
          Tap a player name for their profile.
        </div>
      </div>

      {/* Player profile modal */}
      {selectedPlayerId && (
        <PlayerProfile
          playerId={selectedPlayerId}
          players={players}
          games={games}
          season={activeSeason}
          onClose={() => setSelectedPlayerId(null)}
        />
      )}

      {/* Edit game modal */}
      {editingGame && (
        <EditGameModal
          game={editingGame}
          players={players}
          onClose={() => setEditingGame(null)}
          onSaved={() => {
            setEditingGame(null);
            // Refresh games for the active season
            if (activeSeasonId && window.GRP_DB) {
              window.GRP_DB.getGamesForSeason(activeSeasonId).then(setGames);
            }
          }}
          onRequestDeleteSeason={() => setShowDeleteSeasonConfirm(true)}
        />
      )}

      {/* Delete season confirm */}
      {showDeleteSeasonConfirm && activeSeason && (
        <ConfirmDialog
          title={`Delete ${activeSeason.name}?`}
          message={`This will permanently delete the season and all ${games.length} games in it. Player records will not be deleted, but all points and game history for this season will be lost.`}
          requireType="DELETE"
          onConfirm={async () => {
            try {
              // Delete each game, then the season doc
              const fb = window.GRP_FIREBASE;
              for (const g of games) {
                await window.GRP_DB.deleteGame(g.id);
              }
              await fb.deleteDoc(fb.doc(fb.db, 'seasons', activeSeason.id));
              setShowDeleteSeasonConfirm(false);
              window.location.reload();
            } catch (e) {
              setError(e.message);
              setShowDeleteSeasonConfirm(false);
            }
          }}
          onCancel={() => setShowDeleteSeasonConfirm(false)}
        />
      )}

      {/* Import modal */}
      {showImport && (
        <ImportModal
          onClose={() => setShowImport(false)}
          onDone={() => {
            setShowImport(false);
            // Reload page to fetch newly imported data
            window.location.reload();
          }}
        />
      )}
    </div>
  );
}

// ============ PLAYER PROFILE MODAL ============
function PlayerProfile({ playerId, players, games, season, onClose }) {
  const player = players.find(p => p.id === playerId);
  if (!player) return null;

  // Compute stats
  const gamesPlayed = games.filter(g => g.pointsAwarded?.[playerId] > 0);
  const totalPoints = gamesPlayed.reduce((sum, g) => sum + (g.pointsAwarded[playerId] || 0), 0);
  const wins = gamesPlayed.filter(g => g.finishOrder?.[0] === playerId).length;
  const podiums = gamesPlayed.filter(g => (g.finishOrder || []).slice(0, 3).includes(playerId)).length;
  const totalBuyIns = gamesPlayed.length * 30; // £30 buy-in standard; doesn't include rebuys
  const winnings = gamesPlayed.reduce((sum, g) => {
    const pos = (g.finishOrder || []).indexOf(playerId);
    if (pos < 0 || pos > 4) return sum;
    return sum + (g.payouts?.[String(pos + 1)] || 0);
  }, 0);

  // Birthday display
  const monthNames = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const bdayStr = player.birthday ? `${monthNames[player.birthday.month]} ${player.birthday.day}` : null;

  // Points per game for the chart (max for scaling)
  const maxPoints = Math.max(1, ...gamesPlayed.map(g => g.pointsAwarded[playerId] || 0));

  return (
    <div onClick={onClose} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="gold-border rounded-3xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
        <div className="flex justify-between items-start mb-4">
          <div>
            <div className="font-display text-4xl gold-text">{player.displayName}</div>
            {player.realName && player.realName !== player.displayName && (
              <div className="text-yellow-100/60 font-mono text-sm">{player.realName}</div>
            )}
            {bdayStr && (
              <div className="text-emerald-300/60 font-mono text-xs mt-1">Birthday: {bdayStr}</div>
            )}
          </div>
          <button onClick={onClose} className="text-yellow-100/60 hover:text-yellow-100">
            <X size={20} />
          </button>
        </div>

        {/* Stats grid */}
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-6">
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">POINTS</div>
            <div className="font-display text-2xl gold-text">{totalPoints.toLocaleString()}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">GAMES</div>
            <div className="font-display text-2xl text-emerald-200">{gamesPlayed.length}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">WINS</div>
            <div className="font-display text-2xl text-emerald-200">{wins}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">PODIUMS</div>
            <div className="font-display text-2xl text-emerald-200">{podiums}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">BUY-INS</div>
            <div className="font-display text-2xl text-yellow-200">£{totalBuyIns}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">WINNINGS</div>
            <div className="font-display text-2xl text-emerald-300">£{Math.round(winnings)}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">NET</div>
            <div className={`font-display text-2xl ${winnings - totalBuyIns >= 0 ? 'text-emerald-300' : 'text-red-400'}`}>
              £{Math.round(winnings - totalBuyIns)}
            </div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">AVG PTS</div>
            <div className="font-display text-2xl text-emerald-200">
              {gamesPlayed.length ? Math.round(totalPoints / gamesPlayed.length).toLocaleString() : '0'}
            </div>
          </div>
        </div>

        {/* Points per game bar chart */}
        <div className="mb-4">
          <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">POINTS BY GAME</div>
          <div className="relative h-40 p-3 rounded-lg bg-black/40 border border-emerald-500/10">
            <div className="flex items-end gap-1.5 h-full">
              {games.map((g) => {
                const pts = g.pointsAwarded?.[playerId];
                const heightPct = pts ? Math.max(2, (pts / maxPoints) * 100) : 0;
                return (
                  <div
                    key={g.id}
                    className="flex-1 rounded-t transition-all relative group"
                    style={{
                      height: `${heightPct}%`,
                      minHeight: pts ? '3px' : '0',
                      background: pts === maxPoints
                        ? 'linear-gradient(180deg, #f4d03f, #d4ac0d)'
                        : pts && pts >= 10000
                          ? 'linear-gradient(180deg, #1ec890, #0e8c69)'
                          : 'linear-gradient(180deg, #14a37b, #0a6e52)',
                    }}
                    title={pts ? `G${g.gameNumber}: ${pts.toLocaleString()} pts` : `G${g.gameNumber}: did not play`}
                  />
                );
              })}
            </div>

          <div className="flex justify-between text-[10px] font-mono text-yellow-100/30 mt-1 px-2">
            {games.map((g) => (

  );
}

// ============ SAVE GAME MODAL ============
// Opens after a tournament finishes (from the winner overlay). Auto-populates
// all the league/HR fields from the live game state, lets the admin review &
// tweak, then writes to Firestore. Requires sign-in.
function SaveGameModal({
  // Game data from the timer
  gameType,        // 'league' | 'highrollers'
  leagueContext,   // { seasonId, gameNumber, isFinal, season } | null
  config,          // { buyIn, ... }
  players,         // [{ name, sound }, ...]
  finishOrder,     // [name, name, ...] in finishing order, 1st first
  totalRebuys,
  rebuyCounts,     // { name: count }
  knockedOutBy,    // { eliminatedName: knockerOuterName }
  payoutKey,
  // UI
  fbUser,
  fullRosterFromDB,
  onClose,
  onSaved,
}) {
  const playersById = {};
  fullRosterFromDB.forEach((p) => { playersById[p.id] = p; });
  const playersByName = {};
  fullRosterFromDB.forEach((p) => { playersByName[p.displayName] = p; });

  // Helper: resolve a display name to a Firestore player ID (or slugify as fallback)
  const resolvePid = (name) => {
    const exact = playersByName[name];
    if (exact) return exact.id;
    return slugifyName(name);
  };

  const isFinal = leagueContext?.isFinal === true;
  const today = new Date().toISOString().slice(0, 10);

  // Auto-compute defaults from live game state
  const initialAttendees = players.map((p) => resolvePid(p.name));
  const initialFinishOrder = finishOrder.map(resolvePid);
  const initialPlayerCount = players.length;
  const initialPot = config.buyIn * (initialPlayerCount + totalRebuys);

  // Bountied for today
  const bountyIds = computeBountyHolders(fullRosterFromDB, today);
  const bountyNames = new Set(
    fullRosterFromDB.filter((p) => bountyIds.includes(p.id)).map((p) => p.displayName)
  );

  // Compute points
  const initialPointsByName = computePointsAwarded({
    attendees: players,
    finishOrder,
    bountiedNames: bountyNames,
    knockedOutBy,
    isFinal,
  });
  // Convert to PIDs
  const initialPoints = {};
  Object.entries(initialPointsByName).forEach(([name, pts]) => {
    initialPoints[resolvePid(name)] = pts;
  });

  // Payouts (new rule: last paid place gets buy-in, rest split remaining)
  const splits = PAYOUT_STRUCTURES[payoutKey].splits;
  const payoutAmounts = computePayouts(initialPot, config.buyIn, splits.length);
  const initialPayouts = {};
  payoutAmounts.forEach((amt, i) => {
    if (amt > 0) initialPayouts[String(i + 1)] = amt;
  });

  // Per-player rebuys (mapped to PIDs)
  const initialRebuysByPid = {};
  Object.entries(rebuyCounts || {}).forEach(([name, count]) => {
    if (count > 0) initialRebuysByPid[resolvePid(name)] = count;
  });

  // Form state. High Rollers has no league money, no subs, no points.
  const isLeague = gameType === 'league';
  const [date, setDate] = useState(today);
  const [pot, setPot] = useState(String(initialPot));
  const [leagueMoney, setLeagueMoney] = useState(
    !isLeague || isFinal ? '0' : String(Math.round(initialPot * 0.1))
  );
  const [subs, setSubs] = useState(isLeague ? String(initialPlayerCount * 3) : '0');
  const [pointsAwarded, setPointsAwarded] = useState(initialPoints);
  const [payouts, setPayouts] = useState(initialPayouts);
  const [bountyClaims, setBountyClaims] = useState(() => {
    // Auto-credit knockouts of bountied players
    const claims = [];
    Object.entries(knockedOutBy || {}).forEach(([eliminated, knocker]) => {
      if (bountyNames.has(eliminated) && knocker) {
        claims.push({
          bountied: resolvePid(eliminated),
          claimedBy: resolvePid(knocker),
        });
      }
    });
    return claims;
  });
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [savedOk, setSavedOk] = useState(false);
  const [savedId, setSavedId] = useState(null);

  // Compute game ID. League games are deterministic from season+game number.
  // HR games use the date — if multiple games are played the same day, a
  // numeric suffix is appended at save time (-2, -3, ...) to avoid clashes.
  const gameId = gameType === 'league'
    ? `${leagueContext?.seasonId}-g${leagueContext?.gameNumber}`
    : `hr-${date}`;

  const updatePoints = (pid, val) => {
    const num = parseInt(val);
    const updated = { ...pointsAwarded };
    if (isNaN(num) || num === 0) delete updated[pid];
    else updated[pid] = num;
    setPointsAwarded(updated);
  };

  const updatePayout = (place, val) => {
    const num = parseFloat(val);
    const updated = { ...payouts };
    if (isNaN(num) || num === 0) delete updated[place];
    else updated[place] = num;
    setPayouts(updated);
  };

  const save = async () => {
    if (!fbUser) {
      setError('You must be signed in to save games.');
      return;
    }
    setBusy(true);
    setError(null);
    try {
      // Resolve the final game ID. League IDs are deterministic and clash =
      // error (means that season+game number is already saved). HR IDs are
      // date-based and clash = same-day repeat → append -2, -3, ...
      let finalId = gameId;
      if (isLeague) {
        const existing = await window.GRP_DB.getGameById(gameId);
        if (existing) {
          setError(
            `A game with ID "${gameId}" is already saved. Edit it via the league dashboard, or delete it first.`
          );
          setBusy(false);
          return;
        }
      } else {
        const allHr = await window.GRP_DB.getAllHighRollerGames();
        const sameDay = allHr.filter(
          (g) => g.id === gameId || (g.id && g.id.startsWith(`${gameId}-`))
        );
        if (sameDay.length > 0) {
          finalId = `${gameId}-${sameDay.length + 1}`;
        }
      }

      const gameDoc = {
        id: finalId,
        type: gameType,
        seasonId: isLeague ? leagueContext.seasonId : null,
        date,
        gameNumber: isLeague ? leagueContext.gameNumber : null,
        isFinal: isFinal,
        buyIn: config.buyIn,
        attendees: isLeague ? Object.keys(pointsAwarded) : initialAttendees,
        rebuys: initialRebuysByPid,
        totalRebuys,
        finishOrder: initialFinishOrder,
        pot: parseFloat(pot) || 0,
        payouts,
        leagueMoney: isLeague ? (parseFloat(leagueMoney) || 0) : 0,
        prizePool: parseFloat(pot) || 0,
        subs: isLeague ? (parseFloat(subs) || 0) : 0,
        pointsAwarded: isLeague ? pointsAwarded : {},
        bountyHolders: isLeague ? bountyIds : [],
        bountyClaims: isLeague ? bountyClaims : [],
        notes: 'Saved from live timer.',
      };

      await window.GRP_DB.saveGame(gameDoc);
      setSavedId(finalId);
      setSavedOk(true);
      setBusy(false);
      // Don't auto-close — let user see confirmation and tap done
    } catch (e) {
      setError(e.message);
      setBusy(false);
    }
  };

  if (savedOk) {
    return (
      <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div className="gold-border rounded-2xl bg-gradient-to-br from-emerald-950 to-black p-8 max-w-md w-full text-center">
          <div className="font-display text-4xl gold-text mb-3">✓ SAVED</div>
          <div className="text-emerald-100 mb-2">
            Game <span className="font-mono text-emerald-300">{savedId || gameId}</span> recorded.
          </div>
          <div className="text-yellow-100/60 text-sm mb-6">
            {gameType === 'league'
              ? 'League standings will reflect this game.'
              : 'High Rollers history updated.'}
          </div>
          <button
            onClick={onSaved}
            className="w-full px-6 py-3 rounded-full font-display text-xl text-black"
            style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
          >
            DONE
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div className="gold-border rounded-2xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-2xl w-full max-h-[92vh] overflow-y-auto">
        <div className="flex justify-between items-start mb-4">
          <div>
            <div className="font-display text-3xl gold-text">
              SAVE {gameType === 'league' ? 'LEAGUE' : 'HIGH ROLLERS'} GAME
            </div>
            <div className="text-yellow-100/40 font-mono text-xs mt-1">
              Will save as <span className="text-emerald-300">{gameId}</span>
              {isFinal && <span className="text-yellow-300 ml-2">FINAL — no league points</span>}
            </div>
          </div>
          <button onClick={onClose} disabled={busy} className="text-yellow-100/60 hover:text-yellow-100"><X size={20} /></button>
        </div>

        {!fbUser && (
          <div className="mb-4 p-3 rounded-lg bg-red-950/30 border border-red-500/30 text-red-200 font-mono text-sm">
            ⚠ You must be signed in as admin to save games. Sign in from the home page first.
          </div>
        )}

        {/* Date + money */}
        <div className="grid grid-cols-2 gap-3 mb-5">
          <div>
            <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-1">DATE</div>
            <input
              type="text"
              value={date}
              onChange={(e) => setDate(e.target.value)}
              className="w-full px-3 py-2 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 font-mono text-sm focus:outline-none focus:border-yellow-500/50"
            />
          </div>
          <div>
            <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-1">REBUYS</div>
            <div className="w-full px-3 py-2 rounded-lg bg-black/40 border border-yellow-500/10 text-yellow-100/60 font-mono text-sm">
              {totalRebuys} <span className="text-yellow-100/30">(read-only, from game)</span>
            </div>
          </div>
          <div>
            <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-1">POT £</div>
            <input
              type="number"
              value={pot}
              onChange={(e) => setPot(e.target.value)}
              className="w-full px-3 py-2 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 font-mono text-sm focus:outline-none focus:border-yellow-500/50"
            />
          </div>
          {isLeague && (
            <>
              <div>
                <div className="flex justify-between items-baseline mb-1">
                  <span className="font-mono text-xs text-yellow-100/40 tracking-widest">LEAGUE £</span>
                  <button
                    onClick={() => setLeagueMoney(String(Math.round((parseFloat(pot) || 0) * 0.1)))}
                    className="text-[10px] font-mono text-emerald-400 hover:text-emerald-300"
                  >
                    = 10% pot
                  </button>
                </div>
                <input
                  type="number"
                  value={leagueMoney}
                  onChange={(e) => setLeagueMoney(e.target.value)}
                  className="w-full px-3 py-2 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 font-mono text-sm focus:outline-none focus:border-yellow-500/50"
                />
              </div>
              <div>
                <div className="flex justify-between items-baseline mb-1">
                  <span className="font-mono text-xs text-yellow-100/40 tracking-widest">SUBS £</span>
                  <button
                    onClick={() => setSubs(String(initialPlayerCount * 3))}
                    className="text-[10px] font-mono text-emerald-400 hover:text-emerald-300"
                  >
                    = £3 × {initialPlayerCount}
                  </button>
                </div>
                <input
                  type="number"
                  value={subs}
                  onChange={(e) => setSubs(e.target.value)}
                  className="w-full px-3 py-2 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 font-mono text-sm focus:outline-none focus:border-yellow-500/50"
                />
              </div>
            </>
          )}
        </div>

        {/* Payouts */}
        <div className="mb-5">
          <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">PAYOUTS (£10 rounded)</div>
          <div className="grid grid-cols-5 gap-2">
            {[1, 2, 3, 4, 5].map((place) => (
              <div key={place}>
                <div className="font-mono text-xs text-yellow-100/40 mb-1">{place === 1 ? '1st' : place === 2 ? '2nd' : place === 3 ? '3rd' : `${place}th`} £</div>
                <input
                  type="number"
                  value={payouts[String(place)] || ''}
                  onChange={(e) => updatePayout(String(place), e.target.value)}
                  className="w-full px-2 py-1.5 rounded bg-black/40 border border-yellow-500/20 text-yellow-50 font-mono text-sm focus:outline-none focus:border-yellow-500/50"
                />
              </div>
            ))}
          </div>
        </div>

        {/* Points awarded — league only, never on finals */}
        {isLeague && !isFinal && (
          <div className="mb-5">
            <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-1">
              POINTS BY PLAYER
            </div>
            <div className="text-yellow-100/40 text-xs mb-2">
              Auto-calculated from finish order + bounty awards. Tweak if needed.
            </div>
            <div className="max-h-64 overflow-y-auto space-y-1 pr-1">
              {Object.keys(pointsAwarded).map((pid) => {
                const p = playersById[pid] || { displayName: pid };
                const pos = initialFinishOrder.indexOf(pid);
                const posLabel = pos >= 0 && pos < 5 ? ['1st', '2nd', '3rd', '4th', '5th'][pos] : '';
                const isBountied = bountyIds.includes(pid);
                return (
                  <div key={pid} className="flex items-center gap-2 p-2 rounded bg-black/30">
                    <span className="flex-1 text-emerald-100 text-sm truncate">
                      {p.displayName}
                      {posLabel && <span className="text-yellow-300/60 ml-2 font-mono text-xs">{posLabel}</span>}
                      {isBountied && <span className="text-yellow-300/80 ml-2">🎯</span>}
                    </span>
                    <input
                      type="number"
                      value={pointsAwarded[pid] || ''}
                      onChange={(e) => updatePoints(pid, e.target.value)}
                      className="w-24 px-2 py-1 rounded bg-black/40 border border-yellow-500/20 text-yellow-50 font-mono text-sm text-right focus:outline-none focus:border-yellow-500/50"
                    />
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {isFinal && (
          <div className="mb-5 p-3 rounded-lg bg-yellow-950/30 border border-yellow-500/20">
            <div className="font-mono text-xs text-yellow-300 tracking-widest mb-1">FINAL — NO LEAGUE POINTS</div>
            <div className="text-yellow-100/60 text-sm">
              Finals don't award league points. Only the finish order, pot, and payouts will be saved.
            </div>
          </div>
        )}

        {error && (
          <div className="mb-3 p-3 rounded-lg bg-red-950/40 border border-red-500/40 text-red-200 font-mono text-sm">
            {error}
          </div>
        )}

        <div className="flex gap-2">
          <button
            onClick={onClose}
            disabled={busy}
            className="flex-1 px-4 py-2.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100 font-mono text-sm disabled:opacity-30"
          >
            CANCEL
          </button>
          <button
            onClick={save}
            disabled={busy || !fbUser}
            className="flex-1 px-4 py-2.5 rounded-full font-display text-lg text-black disabled:opacity-30"
            style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
          >
            {busy ? 'SAVING...' : 'SAVE GAME'}
          </button>
        </div>
      </div>
    </div>
  );
}
