// Generate a blind structure from buy-in, stack, players, and target duration.
function generateBlindStructure(buyIn, stackSize, numPlayers, durationMinutes, includeAntes) {
  const targetFinalBB = Math.max(stackSize / 15, stackSize / 10);

  let levelLength;
  if (durationMinutes <= 90) levelLength = 15;
  else if (durationMinutes <= 240) levelLength = 20;
  else levelLength = 25;

  const breakEveryNLevels = Math.max(3, Math.round(90 / levelLength));
  const breakLength = 10;

  let nPlayLevels = Math.floor(durationMinutes / levelLength);
  const estimatedBreaks = Math.floor(nPlayLevels / breakEveryNLevels);
  nPlayLevels = Math.max(4, Math.floor((durationMinutes - estimatedBreaks * breakLength) / levelLength));

  // Natural poker BB schedule — strictly increasing, no awkward jumps,
  // and once we pass 1000, no trailing 50s (1000/1500/2000/3000/5000/8000...).
  const BB_SCHEDULE = [
    100, 200, 300, 400, 500, 600, 800, 1000,
    1500, 2000, 3000, 4000, 5000, 6000, 8000,
    10000, 15000, 20000, 30000, 40000, 50000,
    60000, 80000, 100000, 150000, 200000,
  ];

  // Pick a start index and end index into the schedule, then sample evenly.
  const startBB = Math.max(100, BB_SCHEDULE.find((v) => v >= stackSize / 100) || 100);
  const endBB = BB_SCHEDULE.find((v) => v >= targetFinalBB) || BB_SCHEDULE[BB_SCHEDULE.length - 1];

  const startIdx = BB_SCHEDULE.indexOf(startBB);
  const endIdx = Math.max(startIdx + 1, BB_SCHEDULE.indexOf(endBB));

  const levels = [];
  let playLevelCount = 0;
  let lastBB = 0;
  for (let i = 0; i < nPlayLevels; i++) {
    // Linear interpolation through the schedule, ensuring strict increase.
    const t = nPlayLevels === 1 ? 0 : i / (nPlayLevels - 1);
    let idx = Math.round(startIdx + t * (endIdx - startIdx));
    let bb = BB_SCHEDULE[Math.min(idx, BB_SCHEDULE.length - 1)];
    if (bb <= lastBB) {
      // Find the next schedule entry above lastBB
      bb = BB_SCHEDULE.find((v) => v > lastBB) || lastBB + 1000;
    }
    lastBB = bb;
    const sb = bb / 2;
    const ante = includeAntes && i >= Math.floor(nPlayLevels / 3) ? bb / 4 : 0;
    levels.push({ sb, bb, ante, duration: levelLength, isBreak: false });
    playLevelCount++;
    if (playLevelCount % breakEveryNLevels === 0 && i < nPlayLevels - 1) {
      levels.push({ sb: 0, bb: 0, ante: 0, duration: breakLength, isBreak: true });
    }
  }
  return levels;
}

// Step to the next sensible blind value above the given one (used for manual "add level")
function nextBlindStep(current) {
  const SCHEDULE = [100, 200, 300, 400, 500, 600, 800, 1000, 1500, 2000, 3000, 4000, 5000, 6000, 8000, 10000, 15000, 20000, 30000, 40000, 50000, 60000, 80000, 100000];
  const next = SCHEDULE.find((v) => v > current);
  return next || current * 2;
}

// (Retained for any legacy callers — not used by the generator any more)
function roundBlind(value) {
  if (value < 100) return Math.max(100, Math.round(value / 50) * 50);
  if (value < 1000) return Math.round(value / 100) * 100;
  if (value < 5000) return Math.round(value / 500) * 500;
  if (value < 10000) return Math.round(value / 1000) * 1000;
  return Math.round(value / 1000) * 1000;
}

const formatTime = (seconds) => {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
};

// Synthesised animal sounds using Web Audio API. No external files.
// Each sound is a function that takes an AudioContext and plays.

let sharedAudioCtx = null;
function getAudioCtx() {
  if (sharedAudioCtx) return sharedAudioCtx;
  try {
    sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { return null; }
  return sharedAudioCtx;
}

// --- Audio synthesis helpers ---

// Filtered tone with proper ADSR. Used as a basic voiced-formant building block.
function tone(ctx, { type = 'sine', freq = 440, freqEnd = null, freqCurve = null,
                     start = 0, duration = 0.2, gain = 0.3,
                     attack = 0.01, decay = 0.05, sustain = 0.7, release = 0.05,
                     filterType = null, filterFreq = 2000, filterQ = 1, dest = null }) {
  const t0 = ctx.currentTime + start;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (Array.isArray(freqCurve)) {
    // freqCurve: [[time, freq], ...] relative to start
    freqCurve.forEach(([dt, f]) => osc.frequency.linearRampToValueAtTime(f, t0 + dt));
  } else if (freqEnd !== null) {
    osc.frequency.linearRampToValueAtTime(freqEnd, t0 + duration);
  }
  // ADSR
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + attack);
  g.gain.linearRampToValueAtTime(gain * sustain, t0 + attack + decay);
  g.gain.setValueAtTime(gain * sustain, t0 + duration - release);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);

  let last = g;
  if (filterType) {
    const filter = ctx.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.value = filterFreq;
    filter.Q.value = filterQ;
    g.connect(filter);
    last = filter;
  }
  last.connect(dest || ctx.destination);
  osc.connect(g);
  osc.start(t0);
  osc.stop(t0 + duration + 0.1);
  return { osc, gain: g };
}

// Filtered noise burst — for breath, consonants, animal texture
function noise(ctx, { start = 0, duration = 0.1, gain = 0.15,
                      filterType = 'lowpass', filterFreq = 2000, filterQ = 1,
                      attack = 0.005, release = 0.02, dest = null }) {
  const t0 = ctx.currentTime + start;
  const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * duration)), ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filter = ctx.createBiquadFilter();
  filter.type = filterType;
  filter.frequency.value = filterFreq;
  filter.Q.value = filterQ;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + attack);
  g.gain.setValueAtTime(gain, t0 + duration - release);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  src.connect(filter);
  filter.connect(g);
  g.connect(dest || ctx.destination);
  src.start(t0);
  src.stop(t0 + duration);
  return { source: src, gain: g, filter };
}

// FM synthesis — modulator changes the carrier frequency, creating rich timbres
function fmTone(ctx, { carrierFreq = 200, modFreq = 300, modDepth = 100, modDepthCurve = null,
                       freqCurve = null, start = 0, duration = 0.3, gain = 0.3,
                       attack = 0.01, release = 0.05, dest = null }) {
  const t0 = ctx.currentTime + start;
  const carrier = ctx.createOscillator();
  const modulator = ctx.createOscillator();
  const modGain = ctx.createGain();
  const out = ctx.createGain();
  carrier.frequency.setValueAtTime(carrierFreq, t0);
  if (Array.isArray(freqCurve)) {
    freqCurve.forEach(([dt, f]) => carrier.frequency.linearRampToValueAtTime(f, t0 + dt));
  }
  modulator.frequency.setValueAtTime(modFreq, t0);
  modGain.gain.setValueAtTime(modDepth, t0);
  if (Array.isArray(modDepthCurve)) {
    modDepthCurve.forEach(([dt, d]) => modGain.gain.linearRampToValueAtTime(d, t0 + dt));
  }
  modulator.connect(modGain);
  modGain.connect(carrier.frequency);
  out.gain.setValueAtTime(0, t0);
  out.gain.linearRampToValueAtTime(gain, t0 + attack);
  out.gain.setValueAtTime(gain, t0 + duration - release);
  out.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  carrier.connect(out);
  out.connect(dest || ctx.destination);
  carrier.start(t0);
  modulator.start(t0);
  carrier.stop(t0 + duration + 0.1);
  modulator.stop(t0 + duration + 0.1);
  return { carrier, modulator, gain: out };
}

// Formant — vocal-tract resonance, used to give voiced sounds character.
// Creates a bandpass-filtered noise+tone hybrid.
function formant(ctx, { fundamental = 200, formantFreqs = [800, 1200], start = 0,
                        duration = 0.3, gain = 0.2, attack = 0.02, release = 0.05,
                        pitchCurve = null }) {
  const t0 = ctx.currentTime + start;
  // Build harmonic-rich source (sawtooth)
  const src = ctx.createOscillator();
  src.type = 'sawtooth';
  src.frequency.setValueAtTime(fundamental, t0);
  if (Array.isArray(pitchCurve)) {
    pitchCurve.forEach(([dt, f]) => src.frequency.linearRampToValueAtTime(f, t0 + dt));
  }
  const srcGain = ctx.createGain();
  srcGain.gain.setValueAtTime(0, t0);
  srcGain.gain.linearRampToValueAtTime(gain, t0 + attack);
  srcGain.gain.setValueAtTime(gain, t0 + duration - release);
  srcGain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  src.connect(srcGain);
  // Run through multiple bandpass formants in parallel
  formantFreqs.forEach((ff) => {
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = ff;
    filter.Q.value = 8;
    srcGain.connect(filter);
    filter.connect(ctx.destination);
  });
  src.start(t0);
  src.stop(t0 + duration + 0.1);
  return { src, gain: srcGain };
}

//   - play: synthesised fallback (improved with formants + FM)
// =========================================================================

// Buffer cache for loaded MP3s
const audioBufferCache = new Map();
const audioFailedCache = new Set(); // paths we've already failed to load

async function loadAudioBuffer(path) {
  // Try the given path first, then swap mp3<->wav as fallback so users can drop in either format
  const tryPaths = [path];
  if (path.endsWith('.mp3')) tryPaths.push(path.replace(/\.mp3$/, '.wav'));
  else if (path.endsWith('.wav')) tryPaths.push(path.replace(/\.wav$/, '.mp3'));

  for (const p of tryPaths) {
    if (audioBufferCache.has(p)) return audioBufferCache.get(p);
    if (audioFailedCache.has(p)) continue;
    const ctx = getAudioCtx();
    if (!ctx) return null;
    try {
      const res = await fetch(p);
      if (!res.ok) throw new Error('not ok');
      const arr = await res.arrayBuffer();
      const buffer = await ctx.decodeAudioData(arr);
      audioBufferCache.set(p, buffer);
      return buffer;
    } catch (e) {
      audioFailedCache.add(p);
    }
  }
  return null;
}

      // Sustained baa with vibrato

      carrier.connect(car);

// Play a sound. Tries to use the bundled MP3 file first; falls back to synthesis.
async function playSound(soundKey, customSounds = {}) {
  if (!soundKey || soundKey === 'none') return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  if (ctx.state === 'suspended') {
    try { await ctx.resume(); } catch (e) {}
  }

  // Look in custom sounds (from sounds.json) first
  const custom = customSounds[soundKey];
  if (custom && custom.file) {
    const buffer = await loadAudioBuffer(custom.file);
    if (buffer) {
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const g = ctx.createGain();
      g.gain.value = 0.9;
      src.connect(g);
      g.connect(ctx.destination);
      src.start();
      return;
    }
    return; // Custom sound failed — don't fall through to synth
  }

  // Built-in library
  const sound = SOUND_LIBRARY[soundKey];
  if (!sound) return;
  if (sound.file) {
    const buffer = await loadAudioBuffer(sound.file);
    if (buffer) {
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const g = ctx.createGain();
      g.gain.value = 0.9;
      src.connect(g);
      g.connect(ctx.destination);
      src.start();
      return;
    }
  }
  sound.play(ctx);
}

// Load the optional sounds.json manifest, which lets users add their own
// sounds without code changes. Format:
// {
//   "beans": { "label": "Beans", "file": "sounds/beans.mp3" },
//   "horse-laugh": { "label": "Horse laugh", "file": "sounds/horse-laugh.mp3" }
// }
async function loadCustomSounds() {
  try {
    const res = await fetch('sounds/sounds.json');
    if (!res.ok) return {};
    const data = await res.json();
    // Validate shape
    const out = {};
    for (const [key, val] of Object.entries(data)) {
      if (val && typeof val.file === 'string') {
        out[key] = { label: val.label || key, file: val.file };
      }
    }
    return out;
  } catch (e) {
    return {};
  }
}

// ============ PAYOUT LOGIC ============
// Standard small-field payout structures by number of payable places.
const PAYOUT_STRUCTURES = {
  '1': { label: 'Winner takes all', splits: [100] },
  '2': { label: 'Top 2 (60/40)', splits: [60, 40] },
  '3': { label: 'Top 3 (50/30/20)', splits: [50, 30, 20] },
  '4': { label: 'Top 4 (45/25/18/12)', splits: [45, 25, 18, 12] },
  '5': { label: 'Top 5 (40/25/17/12/6)', splits: [40, 25, 17, 12, 6] },
};

function defaultPayoutKey(numPlayers) {
  if (numPlayers <= 10) return '3';
  return '4';
}

// Round payout amounts to the nearest £10 while preserving the total prize pool.
// Strategy: round all positions to nearest 10, then absorb any rounding difference
// onto 1st place (so the winner gets the leftover, keeps the total honest).
function roundPayoutsToTens(splits, prizePool) {
  if (!prizePool || prizePool <= 0) return splits.map(() => 0);
  // Round prize pool itself to nearest 10 first (anything below isn't paid out cleanly)
  const targetTotal = Math.round(prizePool / 10) * 10;
  // Compute raw amounts, then round each to nearest 10
  const raw = splits.map((pct) => (prizePool * pct) / 100);
  const rounded = raw.map((v) => Math.round(v / 10) * 10);
  const sum = rounded.reduce((a, b) => a + b, 0);
  const diff = targetTotal - sum; // could be negative
  // Add the difference onto 1st place
  if (rounded.length > 0) rounded[0] += diff;
  // Safety: ensure no negative payouts
  return rounded.map((v) => Math.max(0, v));
}

// ============ SETUP WIZARD ============

  const [step, setStep] = useState(0);
  const [buyIn, setBuyIn] = useState('20');
  const [stackSize, setStackSize] = useState('10000');
  const [roster, setRoster] = useState([]); // every club member, persisted
  const [playingTonight, setPlayingTonight] = useState(new Set()); // names selected for this game
  const [newPlayer, setNewPlayer] = useState('');
  const [duration, setDuration] = useState('180');
  const [includeAntes, setIncludeAntes] = useState(false);
  const [rosterLoaded, setRosterLoaded] = useState(false);

  // Load saved roster on mount
  useEffect(() => {
    (async () => {
      try {
        const saved = ({ value: localStorage.getItem("poker-roster") });
        if (saved && saved.value) {
          const parsed = JSON.parse(saved.value);
          if (Array.isArray(parsed) && parsed.length > 0) {
            // Backward compat: if old format (array of strings), convert to objects
            const migrated = parsed.map((p) =>
              typeof p === 'string' ? { name: p, sound: 'none' } : { name: p.name, sound: p.sound || 'none' }
            );
            setRoster(migrated);
            setPlayingTonight(new Set(migrated.map((p) => p.name)));
          }
        }
      } catch (e) { /* no saved roster yet */ }
      setRosterLoaded(true);
    })();
  }, []);

  // Persist roster whenever it changes
  useEffect(() => {
    if (!rosterLoaded) return;
    (async () => {
      try {
        localStorage.setItem("poker-roster", JSON.stringify(roster));
      } catch (e) { /* fail silently */ }
    })();
  }, [roster, rosterLoaded]);

  const addPlayer = () => {
    const name = newPlayer.trim();
    if (!name) return;
    const existing = roster.find((p) => p.name === name);
    if (existing) {
      // Already in roster — just make sure they're selected
      setPlayingTonight((prev) => new Set([...prev, name]));
    } else {
      setRoster([...roster, { name, sound: 'none' }]);
      setPlayingTonight((prev) => new Set([...prev, name]));
    }
    setNewPlayer('');
  };

  const togglePlaying = (name) => {
    setPlayingTonight((prev) => {
      const next = new Set(prev);
      if (next.has(name)) next.delete(name);
      else next.add(name);
      return next;
    });
  };

  const updatePlayerSound = (name, soundKey) => {
    setRoster(roster.map((p) => (p.name === name ? { ...p, sound: soundKey } : p)));
  };

  // Remove from roster entirely
  const removeFromRoster = (name) => {
    setRoster(roster.filter((p) => p.name !== name));
    setPlayingTonight((prev) => {
      const next = new Set(prev);
      next.delete(name);
      return next;
    });
  };

  const selectAll = () => setPlayingTonight(new Set(roster.map((p) => p.name)));
  const selectNone = () => setPlayingTonight(new Set());

  const playersArray = roster.filter((p) => playingTonight.has(p.name));

  const canAdvance = () => {
    if (step === 0) return parseFloat(buyIn) > 0;
    if (step === 1) return parseInt(stackSize) > 0;
    if (step === 2) return playersArray.length >= 2;
    if (step === 3) return parseInt(duration) >= 30;
    return true;
  };

  const finish = () => {
    const levels = generateBlindStructure(
      parseFloat(buyIn),
      parseInt(stackSize),
      playersArray.length,
      parseInt(duration),
      includeAntes
    );
    onStart({
      gameType, // 'league' | 'highrollers'
      buyIn: parseFloat(buyIn),
      stackSize: parseInt(stackSize),
      players: playersArray, // now objects with name + sound
      duration: parseInt(duration),
      levels,
    });

        .font-display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .gold-text {

          -webkit-text-fill-color: transparent;

        }

                  >
                    <div className={`absolute top-0.5 w-5 h-5 rounded-full bg-white transition-transform ${includeAntes ? 'translate-x-6' : 'translate-x-0.5'}`} />

            {step === 4 && (
              <div>
                <div className="font-mono text-xs text-yellow-500/60 tracking-widest mb-2 text-center">STEP 5 OF 5</div>
                <div className="font-display text-3xl gold-text text-center mb-6">READY TO PLAY</div>
                <div className="grid grid-cols-2 gap-3 mb-4">
                  <div className="p-4 rounded-xl bg-black/30 border border-yellow-500/10">
                    <div className="font-mono text-xs text-yellow-500/60 tracking-widest">BUY-IN</div>
                    <div className="font-display text-3xl gold-text">£{buyIn}</div>
                  </div>
                  <div className="p-4 rounded-xl bg-black/30 border border-yellow-500/10">
                    <div className="font-mono text-xs text-yellow-500/60 tracking-widest">PRIZE POOL</div>
                    <div className="font-display text-3xl gold-text">£{(parseFloat(buyIn) * playersArray.length).toFixed(0)}</div>
                  </div>
                  <div className="p-4 rounded-xl bg-black/30 border border-yellow-500/10">
                    <div className="font-mono text-xs text-yellow-500/60 tracking-widest">STACK</div>
                    <div className="font-display text-3xl text-emerald-200">{parseInt(stackSize).toLocaleString()}</div>
                  </div>
                  <div className="p-4 rounded-xl bg-black/30 border border-yellow-500/10">
                    <div className="font-mono text-xs text-yellow-500/60 tracking-widest">PLAYERS</div>
                    <div className="font-display text-3xl text-emerald-200">{playersArray.length}</div>
                  </div>
                </div>
                <div className="p-4 rounded-xl bg-black/30 border border-yellow-500/10 mb-4">
                  <div className="font-mono text-xs text-yellow-500/60 tracking-widest mb-2">TARGET DURATION</div>
                  <div className="font-display text-2xl text-emerald-200">
                    {Math.floor(parseInt(duration) / 60)}h {parseInt(duration) % 60}m
                    {!includeAntes && <span className="text-sm text-yellow-100/40 ml-3 font-sans">• no antes</span>}
                    {includeAntes && <span className="text-sm text-yellow-100/40 ml-3 font-sans">• with antes</span>}
                  </div>
                </div>
                <div className="text-center text-xs font-mono text-yellow-100/40">
                  Blind structure will be generated for these settings.<br/>You can edit it after starting.
                </div>
              </div>
            )}
          </div>
        </div>

        <div className="flex gap-3 mt-6">
          {step > 0 && (
            <button onClick={() => setStep(step - 1)} className="px-6 py-3 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100 font-mono text-sm hover:border-yellow-500/50 flex items-center gap-2">
              <ChevronLeft size={16} /> BACK
            </button>
          )}
          <button
            onClick={step === 4 ? finish : () => setStep(step + 1)}
            disabled={!canAdvance()}
            className="flex-1 px-6 py-3 rounded-full font-display text-xl text-black disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center gap-2"
            style={{ background: 'linear-gradient(135deg, #f4d03f, #d4ac0d)' }}
          >
            {step === 4 ? 'START TOURNAMENT' : <>NEXT <ChevronRight size={18} /></>}
          </button>
        </div>
      </div>
    </div>
  );
}

// ============ MAIN TIMER ============
function PokerTimerMain({ config, onReset, customSounds, onViewLeague }) {
  const [levels, setLevels] = useState(config.levels);
  const [players, setPlayers] = useState(config.players); // [{name, sound}, ...]
  const [currentLevel, setCurrentLevel] = useState(0);
  const [timeLeft, setTimeLeft] = useState(config.levels[0].duration * 60);
  const [isRunning, setIsRunning] = useState(false);
  const [voiceEnabled, setVoiceEnabled] = useState(true);
  const [eliminatedPlayers, setEliminatedPlayers] = useState([]); // names, in elimination order
  const [rebuyCounts, setRebuyCounts] = useState({}); // { playerName: number }
  const [payoutKey, setPayoutKey] = useState(() => defaultPayoutKey(config.players.length));
  const [newPlayerName, setNewPlayerName] = useState('');
  const [activePanel, setActivePanel] = useState(null);
  const [hasStarted, setHasStarted] = useState(false);
  const [voices, setVoices] = useState([]);
  const [selectedVoiceURI, setSelectedVoiceURI] = useState(null);
  const [showHomeConfirm, setShowHomeConfirm] = useState(false);
  const [showEliminate, setShowEliminate] = useState(false);
  const [winner, setWinner] = useState(null);

  const intervalRef = useRef(null);

  // Load available voices. They load asynchronously in some browsers.
  useEffect(() => {
    if (typeof window === 'undefined' || !window.speechSynthesis) return;
    const loadVoices = () => {
      const all = window.speechSynthesis.getVoices();
      // Prefer English voices, but show all
      const sorted = [...all].sort((a, b) => {
        const aEn = a.lang.startsWith('en') ? 0 : 1;
        const bEn = b.lang.startsWith('en') ? 0 : 1;
        if (aEn !== bEn) return aEn - bEn;
        return a.name.localeCompare(b.name);
      });
      setVoices(sorted);
      if (sorted.length > 0 && !selectedVoiceURI) {
        // Default: Google US English. Fall back through other Google voices, then anything en.
        const best = sorted.find(v => /google.*us english/i.test(v.name))
          || sorted.find(v => /google/i.test(v.name) && v.lang === 'en-US')
          || sorted.find(v => /google/i.test(v.name) && v.lang.startsWith('en'))
          || sorted.find(v => /natural|premium|enhanced|neural/i.test(v.name) && v.lang.startsWith('en'))
          || sorted.find(v => v.lang === 'en-US')
          || sorted.find(v => v.lang.startsWith('en'))
          || sorted[0];
        setSelectedVoiceURI(best.voiceURI);
      }
    };
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
    return () => { window.speechSynthesis.onvoiceschanged = null; };
  }, [selectedVoiceURI]);

  const getVoice = useCallback(() => {
    if (!selectedVoiceURI) return null;
    return voices.find(v => v.voiceURI === selectedVoiceURI) || null;
  }, [voices, selectedVoiceURI]);

  const speak = useCallback((text) => {
    if (!voiceEnabled || typeof window === 'undefined' || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    const v = getVoice();
    if (v) utterance.voice = v;
    utterance.rate = 0.95;
    utterance.pitch = 1;
    utterance.volume = 1;
    window.speechSynthesis.speak(utterance);
  }, [voiceEnabled, getVoice]);

  // Queue multiple lines so they play in sequence (longer welcome message)
  const speakQueue = useCallback((lines) => {
    if (!voiceEnabled || typeof window === 'undefined' || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const v = getVoice();
    lines.forEach((text) => {
      const u = new SpeechSynthesisUtterance(text);
      if (v) u.voice = v;
      u.rate = 0.95;
      u.pitch = 1;
      u.volume = 1;
      window.speechSynthesis.speak(u);
    });
  }, [voiceEnabled, getVoice]);

  const announceLevel = useCallback((levelIdx) => {
    const level = levels[levelIdx];
    if (!level) return;
    if (level.isBreak) {
      speak(`Break time. ${level.duration} minute break. Stretch your legs.`);
    } else {
      const anteText = level.ante > 0 ? `, with an ante of ${level.ante}` : '';
      speakQueue([
        `Starting level ${levelIdx + 1}.`,
        `Blinds are now ${level.sb} and ${level.bb}${anteText}.`,
        `This round runs for ${level.duration} minutes.`,
      ]);
    }
  }, [levels, speak, speakQueue]);

  // Welcome message — only when starting from level 1 for the first time
  const speakWelcome = useCallback(() => {
    const level = levels[0];
    if (!level || level.isBreak) return;
    const anteText = level.ante > 0 ? `, with an ante of ${level.ante}` : '';
    const playerCount = players.length;
    const prizePool = config.buyIn * playerCount;
    speakQueue([
      `Welcome to the home game, everyone.`,
      `We've got ${playerCount} players battling for a prize pool of ${prizePool} pounds.`,
      `Starting blinds are ${level.sb} and ${level.bb}${anteText}.`,
      `This first round runs for ${level.duration} minutes.`,
      `Good luck everyone.`,
    ]);
  }, [levels, players.length, config.buyIn, speakQueue]);

  useEffect(() => {
    if (!isRunning) return;
    intervalRef.current = setInterval(() => {
      setTimeLeft((t) => {
        if (t <= 1) {
          setCurrentLevel((lvl) => {
            const next = Math.min(lvl + 1, levels.length - 1);
            if (next !== lvl) {
              setTimeout(() => announceLevel(next), 100);
              setTimeout(() => setTimeLeft(levels[next].duration * 60), 0);
            } else {
              setIsRunning(false);
              setTimeout(() => speak('Tournament complete. Well played.'), 100);
            }
            return next;
          });
          return 0;
        }
        // Only fire the 5-min warning if the round itself is longer than 5 min
        if (t === 301 && levels[currentLevel].duration > 5 && !levels[currentLevel].isBreak) {
          speak('Five minutes remaining in this round.');
        }
        if (t === 61 && !levels[currentLevel].isBreak) {
          speak('One minute remaining.');
        }
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, [isRunning, levels, currentLevel, announceLevel, speak]);

  const togglePlay = () => {
    // iOS / Safari requires the very first speak() call to happen synchronously
    // inside a user gesture. Fire a silent priming utterance to unlock the engine.
    if (voiceEnabled && typeof window !== 'undefined' && window.speechSynthesis) {
      try {
        const prime = new SpeechSynthesisUtterance('');
        prime.volume = 0;
        window.speechSynthesis.speak(prime);
      } catch (e) { /* ignore */ }
    }
    // Welcome message only on the very first start (level 1, full time, not yet started)
    if (!isRunning && !hasStarted && currentLevel === 0 && timeLeft === levels[0].duration * 60) {
      speakWelcome();
      setHasStarted(true);
    }
    setIsRunning(!isRunning);
  };

  const nextLevel = () => {
    if (currentLevel < levels.length - 1) {
      const next = currentLevel + 1;
      setCurrentLevel(next);
      setTimeLeft(levels[next].duration * 60);
      if (isRunning) announceLevel(next);
    }
  };

  const prevLevel = () => {
    if (currentLevel > 0) {
      const prev = currentLevel - 1;
      setCurrentLevel(prev);
      setTimeLeft(levels[prev].duration * 60);
    }
  };

  const addPlayer = () => {
    if (newPlayerName.trim()) {
      setPlayers([...players, { name: newPlayerName.trim(), sound: 'none' }]);
      setNewPlayerName('');
    }
  };

  const togglePlayerEliminated = (name) => {
    setEliminatedPlayers((prev) => prev.includes(name) ? prev.filter((p) => p !== name) : [...prev, name]);
  };

  const removePlayer = (idx) => setPlayers(players.filter((_, i) => i !== idx));

  // Rebuy: add 1 to rebuy count for this player
  const addRebuy = (name) => {
    setRebuyCounts((prev) => ({ ...prev, [name]: (prev[name] || 0) + 1 }));
  };

  const removeRebuy = (name) => {
    setRebuyCounts((prev) => {
      const next = { ...prev };
      const cur = next[name] || 0;
      if (cur <= 1) delete next[name];
      else next[name] = cur - 1;
      return next;
    });
  };

  const totalRebuys = Object.values(rebuyCounts).reduce((a, b) => a + b, 0);

  // Eliminate a player: voice "Goodbye <name>", then play their sound.
  // Also triggers "final 3" announcement and winner announcement when appropriate.
  const eliminatePlayer = (player) => {
    setShowEliminate(false);
    const remainingAfter = activePlayers.length - 1;
    setEliminatedPlayers((prev) => [...prev, player.name]);

    // Always: goodbye + their sound
    if (voiceEnabled) {
      speak(`Goodbye, ${player.name}.`);
      setTimeout(() => playSound(player.sound, customSounds), 1400);
    } else {
      playSound(player.sound, customSounds);
    }

    // Final 3: announcement (only if we just dropped TO 3, and only when starting field was >3)
    if (remainingAfter === 3 && players.length > 3) {
      setTimeout(() => {
        if (voiceEnabled) speak(`We are down to the final three!`);
      }, 3000);
    }

    // Winner: 1 player left
    if (remainingAfter === 1) {
      // Stop the timer
      setIsRunning(false);
      // Find the winner
      const winnerObj = activePlayers.find((p) => p.name !== player.name);
      setTimeout(() => {
        setWinner(winnerObj);
        // Fanfare sound, then announce winner
        playSound('fanfare', customSounds);
        setTimeout(() => {
          if (voiceEnabled && winnerObj) {
            speakQueue([
              `And the winner is... ${winnerObj.name}!`,
              `Congratulations, ${winnerObj.name}!`,
            ]);
          }
        }, 2200);
      }, 2500);
    }
  };

  // Un-eliminate (in case of misclick)
  const restorePlayer = (name) => {
    setEliminatedPlayers((prev) => prev.filter((p) => p !== name));
  };

  const updateLevel = (idx, field, value) => {
    const newLevels = [...levels];
    newLevels[idx] = { ...newLevels[idx], [field]: value };
    setLevels(newLevels);
  };

  const addLevel = () => {
    const last = levels[levels.length - 1];
    setLevels([...levels, { ...last, sb: last.sb * 2, bb: last.bb * 2 }]);
  };

  const removeLevel = (idx) => {
    if (levels.length > 1) {
      setLevels(levels.filter((_, i) => i !== idx));
      if (currentLevel >= levels.length - 1) setCurrentLevel(Math.max(0, levels.length - 2));
    }
  };

  const level = levels[currentLevel];
  const nextLvl = levels[currentLevel + 1];
  const activePlayers = players.filter((p) => !eliminatedPlayers.includes(p.name));
  const progress = 1 - timeLeft / (level.duration * 60);
  // Prize pool includes rebuys
  const totalEntries = players.length + totalRebuys;
  const prizePool = config.buyIn * totalEntries;
  // Avg stack: total chips in play / players still in
  const totalChipsInPlay = config.stackSize * totalEntries;
  const avgStack = activePlayers.length > 0 ? Math.round(totalChipsInPlay / activePlayers.length) : 0;

  // Final 3 dramatic mode: when 3 or fewer remain and the field started larger.
  const finalThreeMode = activePlayers.length <= 3 && players.length > 3 && !winner;

  return (
    <div className="min-h-screen w-full relative overflow-hidden" style={{
      background: finalThreeMode
        ? 'radial-gradient(ellipse at top, #4a0e1a 0%, #2a0712 40%, #100308 100%)'
        : 'radial-gradient(ellipse at top, #0a3d1f 0%, #062815 40%, #020a06 100%)',
      fontFamily: "'Inter', system-ui, sans-serif",
      transition: 'background 1.2s ease',
    }}>
      {/* Final-3 floating money symbols */}
      {finalThreeMode && (
        <div className="pointer-events-none fixed inset-0 z-0" aria-hidden="true">
          {Array.from({ length: 18 }).map((_, i) => (
            <div
              key={i}
              className="absolute font-display text-yellow-400/30"
              style={{
                left: `${(i * 53) % 100}%`,
                top: '-10%',
                fontSize: `${24 + (i % 4) * 12}px`,
                animation: `floatMoney ${10 + (i % 5) * 2}s linear ${i * 0.7}s infinite`,
              }}
            >
              {['£', '$', '£', '€', '$'][i % 5]}
            </div>
          ))}
        </div>
      )}
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
        .font-display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .felt-texture {
          background-image:
            radial-gradient(circle at 25% 25%, rgba(255,255,255,0.03) 1px, transparent 1px),
            radial-gradient(circle at 75% 75%, rgba(255,255,255,0.02) 1px, transparent 1px);
          background-size: 24px 24px;
        }
        .gold-text {
          background: linear-gradient(135deg, #f4d03f 0%, #f7dc6f 50%, #d4ac0d 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }
        .gold-border {
          border: 1px solid rgba(244, 208, 63, 0.3);
          box-shadow: 0 0 40px rgba(244, 208, 63, 0.1), inset 0 0 60px rgba(244, 208, 63, 0.05);
        }
        @keyframes pulse-warning {
          0%, 100% { color: #ef4444; text-shadow: 0 0 30px rgba(239, 68, 68, 0.6); }

      `}</style>

      <div className="felt-texture min-h-screen p-4 sm:p-8">
        <div className="max-w-4xl mx-auto">
          <div className="flex justify-between items-center mb-8">

                    const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
                    // ratio = elapsed, so timeLeft = total - elapsed
                    const total = level.duration * 60;
                    const newTimeLeft = Math.round(total - ratio * total);
                    setTimeLeft(Math.max(0, Math.min(total, newTimeLeft)));
                  };
                  const rect = e.currentTarget.getBoundingClientRect();
                  updateFromEvent(e.clientX, rect);
                  e.currentTarget.onpointermove = (ev) => updateFromEvent(ev.clientX, rect);
                  e.currentTarget.onpointerup = (ev) => {
                    e.currentTarget.onpointermove = null;
                    e.currentTarget.onpointerup = null;
                  };

// ============ FIREBASE HOOKS ============
// Wrapper so the app works even if Firebase fails to load.
function useFirebase() {
  const [ready, setReady] = useState(!!window.GRP_FIREBASE);
  const [user, setUser] = useState(null);
  useEffect(() => {
    const onReady = () => setReady(true);
    if (!window.GRP_FIREBASE) {
      window.addEventListener('firebase-ready', onReady);
      return () => window.removeEventListener('firebase-ready', onReady);
    }
    setReady(true);
  }, []);
  useEffect(() => {
    if (!ready || !window.GRP_FIREBASE) return;
    const { auth, onAuthStateChanged } = window.GRP_FIREBASE;
    const unsub = onAuthStateChanged(auth, (u) => setUser(u));
    return unsub;
  }, [ready]);
  return { ready, user, fb: window.GRP_FIREBASE || null };
}

// ============ SIGN IN MODAL ============
function SignInModal({ onClose }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setError('');
    setBusy(true);
    try {
      const { auth, signInWithEmailAndPassword } = window.GRP_FIREBASE;
      await signInWithEmailAndPassword(auth, email, password);
      onClose();
    } catch (e) {
      setError(e.message.replace(/^Firebase:\s*/, '').replace(/\(auth\/[^)]+\)\.?$/, ''));
    } finally {
      setBusy(false);
    }
  };

  return (
    <div onClick={onClose} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="gold-border rounded-2xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-sm w-full">
        <div className="flex justify-between items-center mb-4">
          <div className="font-display text-2xl gold-text">SIGN IN</div>
          <button onClick={onClose} className="text-yellow-100/60 hover:text-yellow-100"><X size={18} /></button>
        </div>
        <div className="text-yellow-100/60 text-xs mb-4 font-mono">Admins only — for recording game results.</div>
        <input
          type="email"
          value={email}
          onChange={(e) => setEmail(e.target.value)}
          placeholder="Email"
          autoFocus
          className="w-full px-3 py-2 mb-2 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 placeholder-yellow-100/30 focus:outline-none focus:border-yellow-500/50"
        />
        <input
          type="password"
          value={password}
          onChange={(e) => setPassword(e.target.value)}
          onKeyDown={(e) => e.key === 'Enter' && submit()}
          placeholder="Password"
          className="w-full px-3 py-2 mb-3 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 placeholder-yellow-100/30 focus:outline-none focus:border-yellow-500/50"
        />
        {error && <div className="text-red-400 text-xs mb-3 font-mono">{error}</div>}
        <button
          onClick={submit}
          disabled={busy || !email || !password}
          className="control-btn w-full px-6 py-2.5 rounded-full font-display text-xl text-black disabled:opacity-30"
          style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
        >
          {busy ? 'Signing in...' : 'Sign in'}
        </button>
      </div>
    </div>
  );
}

// Shows the season-by-season standings table — spreadsheet-style view of all games.
function LeagueDashboard({ onBack, fbUser, gameType }) {
  const [seasons, setSeasons] = useState([]);
  const [activeSeasonId, setActiveSeasonId] = useState(null);
  const [players, setPlayers] = useState([]);
  const [games, setGames] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [selectedPlayerId, setSelectedPlayerId] = useState(null);
  const [showImport, setShowImport] = useState(false);

  // Load seasons + players on mount — wait for Firebase if it hasn't loaded yet
  useEffect(() => {
    let cancelled = false;

    const doLoad = async () => {
      try {
        const [allSeasons, allPlayers] = await Promise.all([
          window.GRP_DB.getAllSeasons(),
          window.GRP_DB.getAllPlayers(),
        ]);
        if (cancelled) return;
        setSeasons(allSeasons);
        setPlayers(allPlayers);
        const active = allSeasons.find(s => s.status === 'active') || allSeasons[0];
        if (active) setActiveSeasonId(active.id);
        setLoading(false);
      } catch (e) {
        if (!cancelled) {
          setError(e.message);
          setLoading(false);
        }
      }
    };

    if (window.GRP_DB) {
      doLoad();
    } else {
      // Firebase still loading — wait for the ready event
      const onReady = () => doLoad();
      window.addEventListener('firebase-ready', onReady);
      // Safety: if no Firebase after 8 seconds, show error
      const timeout = setTimeout(() => {
        if (!cancelled && !window.GRP_DB) {
          setError('Firebase did not load. Check your internet connection.');
          setLoading(false);
        }
      }, 8000);
      return () => {
        cancelled = true;
        window.removeEventListener('firebase-ready', onReady);
        clearTimeout(timeout);
      };
    }
    return () => { cancelled = true; };
  }, []);

  // Load games for the selected season
  useEffect(() => {
    if (!activeSeasonId || !window.GRP_DB) return;
    (async () => {
      try {
        const seasonGames = await window.GRP_DB.getGamesForSeason(activeSeasonId);
        setGames(seasonGames);
      } catch (e) {
        setError(e.message);
      }
    })();
  }, [activeSeasonId]);

  // Compute totals per player for the active season
  const playerTotals = {};
  const playersById = {};
  players.forEach(p => { playersById[p.id] = p; });
  games.forEach(g => {
    Object.entries(g.pointsAwarded || {}).forEach(([pid, pts]) => {
      playerTotals[pid] = (playerTotals[pid] || 0) + (pts || 0);
    });
  });

  // Sort players by total points (descending), only show those who played at least one game
  const playerRows = Object.entries(playerTotals)
    .filter(([_, pts]) => pts > 0)
    .sort((a, b) => b[1] - a[1])
    .map(([pid, total]) => ({
      player: playersById[pid] || { displayName: pid, id: pid },
      total,
      gamePoints: games.map(g => g.pointsAwarded?.[pid] || null),
    }));

  // Aggregate stats at the bottom (subs, league money, etc.)
  const aggregates = {
    playersPerGame: games.map(g => Object.values(g.pointsAwarded || {}).filter(p => p > 0).length),
    rebuys: games.map(g => g.totalRebuys || 0),
    pot: games.map(g => g.pot),
    leagueMoney: games.map(g => g.leagueMoney),
    prizePool: games.map(g => g.prizePool),
    subs: games.map(g => g.subs),
  };

  const activeSeason = seasons.find(s => s.id === activeSeasonId);

  return (
    <div className="min-h-screen w-full" style={{
      background: 'radial-gradient(ellipse at top, #0a3d1f 0%, #062815 40%, #020a06 100%)',
      fontFamily: "'Inter', system-ui, sans-serif",

                        {i === 1 && <span className="text-gray-300 mr-1 font-bold">2.</span>}
                        {i === 2 && <span className="text-amber-600 mr-1 font-bold">3.</span>}
                        {i > 2 && <span className="text-yellow-100/40 mr-1">{i + 1}.</span>}
                        {row.player.displayName}
                      </span>
                    </td>
                    {row.gamePoints.map((pts, gi) => (
                      <td key={gi} className="text-center text-emerald-100/80">
                        {pts === null ? '—' : pts >= 10000 ? <span className="text-emerald-300 font-bold">{pts.toLocaleString()}</span> : pts.toLocaleString()}
                      </td>
                    ))}
                    <td className="total-col text-right">{row.total.toLocaleString()}</td>
                  </tr>
                ))}
                {/* Aggregate rows */}
                <tr className="totals-row">
                  <td className="sticky-col">Players</td>
                  {aggregates.playersPerGame.map((v, i) => <td key={i} className="text-center">{v || '—'}</td>)}
                  <td className="total-col text-right">—</td>
                </tr>
                <tr className="totals-row">
                  <td className="sticky-col">Rebuys</td>
                  {aggregates.rebuys.map((v, i) => <td key={i} className="text-center">{v || 0}</td>)}
                  <td className="total-col text-right">{aggregates.rebuys.reduce((a, b) => a + (b || 0), 0)}</td>
                </tr>
                <tr className="totals-row">
                  <td className="sticky-col">Pot (£)</td>
                  {aggregates.pot.map((v, i) => <td key={i} className="text-center">{v || '—'}</td>)}
                  <td className="total-col text-right">{aggregates.pot.reduce((a, b) => a + (b || 0), 0)}</td>
                </tr>
                <tr className="totals-row">
                  <td className="sticky-col">League £</td>
                  {aggregates.leagueMoney.map((v, i) => <td key={i} className="text-center">{v || 0}</td>)}
                  <td className="total-col text-right">{aggregates.leagueMoney.reduce((a, b) => a + (b || 0), 0)}</td>
                </tr>
                <tr className="totals-row">
                  <td className="sticky-col">Prize £</td>
                  {aggregates.prizePool.map((v, i) => <td key={i} className="text-center">{v || '—'}</td>)}
                  <td className="total-col text-right">—</td>
                </tr>
                <tr className="totals-row">
                  <td className="sticky-col">Subs £</td>
                  {aggregates.subs.map((v, i) => <td key={i} className="text-center">{v == null ? '—' : v}</td>)}
                  <td className="total-col text-right">{aggregates.subs.reduce((a, b) => a + (b || 0), 0)}</td>
                </tr>
                {/* Payouts: 1st-5th */}
                {[1, 2, 3, 4, 5].map(place => (
                  <tr key={place} className="totals-row">
                    <td className="sticky-col">{place === 1 ? '1st £' : place === 2 ? '2nd £' : place === 3 ? '3rd £' : `${place}th £`}</td>
                    {games.map((g, i) => (
                      <td key={i} className="text-center">{g.payouts?.[String(place)] || '—'}</td>
                    ))}
                    <td className="total-col text-right">—</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}

        <div className="text-center mt-4 text-xs font-mono text-yellow-100/30">
          Tap a player name for their profile.
        </div>
      </div>

      {/* Player profile modal */}
      {selectedPlayerId && (
        <PlayerProfile
          playerId={selectedPlayerId}
          players={players}
          games={games}
          season={activeSeason}
          onClose={() => setSelectedPlayerId(null)}
        />
      )}

      {/* Import modal */}
      {showImport && (
        <ImportModal
          onClose={() => setShowImport(false)}
          onDone={() => {
            setShowImport(false);
            // Reload page to fetch newly imported data
            window.location.reload();
          }}
        />
      )}
    </div>
  );
}

// ============ PLAYER PROFILE MODAL ============
function PlayerProfile({ playerId, players, games, season, onClose }) {
  const player = players.find(p => p.id === playerId);
  if (!player) return null;

  // Compute stats
  const gamesPlayed = games.filter(g => g.pointsAwarded?.[playerId] > 0);
  const totalPoints = gamesPlayed.reduce((sum, g) => sum + (g.pointsAwarded[playerId] || 0), 0);
  const wins = gamesPlayed.filter(g => g.finishOrder?.[0] === playerId).length;
  const podiums = gamesPlayed.filter(g => (g.finishOrder || []).slice(0, 3).includes(playerId)).length;
  const totalBuyIns = gamesPlayed.length * 30; // £30 buy-in standard; doesn't include rebuys
  const winnings = gamesPlayed.reduce((sum, g) => {
    const pos = (g.finishOrder || []).indexOf(playerId);
    if (pos < 0 || pos > 4) return sum;
    return sum + (g.payouts?.[String(pos + 1)] || 0);
  }, 0);

  // Birthday display
  const monthNames = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const bdayStr = player.birthday ? `${monthNames[player.birthday.month]} ${player.birthday.day}` : null;

  // Points per game for the chart (max for scaling)
  const maxPoints = Math.max(1, ...gamesPlayed.map(g => g.pointsAwarded[playerId] || 0));

  return (
    <div onClick={onClose} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="gold-border rounded-3xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
        <div className="flex justify-between items-start mb-4">
          <div>
            <div className="font-display text-4xl gold-text">{player.displayName}</div>
            {player.realName && player.realName !== player.displayName && (
              <div className="text-yellow-100/60 font-mono text-sm">{player.realName}</div>
            )}
            {bdayStr && (
              <div className="text-emerald-300/60 font-mono text-xs mt-1">Birthday: {bdayStr}</div>
            )}
          </div>
          <button onClick={onClose} className="text-yellow-100/60 hover:text-yellow-100">
            <X size={20} />
          </button>
        </div>

        {/* Stats grid */}
        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-6">
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">POINTS</div>
            <div className="font-display text-2xl gold-text">{totalPoints.toLocaleString()}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">GAMES</div>
            <div className="font-display text-2xl text-emerald-200">{gamesPlayed.length}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">WINS</div>
            <div className="font-display text-2xl text-emerald-200">{wins}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">PODIUMS</div>
            <div className="font-display text-2xl text-emerald-200">{podiums}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">BUY-INS</div>
            <div className="font-display text-2xl text-yellow-200">£{totalBuyIns}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">WINNINGS</div>
            <div className="font-display text-2xl text-emerald-300">£{Math.round(winnings)}</div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">NET</div>
            <div className={`font-display text-2xl ${winnings - totalBuyIns >= 0 ? 'text-emerald-300' : 'text-red-400'}`}>
              £{Math.round(winnings - totalBuyIns)}
            </div>
          </div>
          <div className="p-3 rounded-lg bg-black/40 border border-emerald-500/20">
            <div className="font-mono text-xs text-yellow-100/40">AVG PTS</div>
            <div className="font-display text-2xl text-emerald-200">
              {gamesPlayed.length ? Math.round(totalPoints / gamesPlayed.length).toLocaleString() : '0'}
            </div>
          </div>
        </div>

        {/* Points per game bar chart */}
        <div className="mb-4">
          <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">POINTS BY GAME</div>
          <div className="flex items-end gap-1 h-32 p-2 rounded-lg bg-black/40 border border-emerald-500/10">
            {games.map((g, i) => {
              const pts = g.pointsAwarded?.[playerId];
              const heightPct = pts ? (pts / maxPoints) * 100 : 0;
              return (
                <div key={g.id} className="flex-1 flex flex-col justify-end items-center relative group">
                  <div
                    className="w-full rounded-t transition-all"
                    style={{
                      height: `${heightPct}%`,
                      background: pts === maxPoints ? 'linear-gradient(180deg, #f4d03f, #d4ac0d)' : 'linear-gradient(180deg, #14a37b, #0e8c69)',
                      minHeight: pts ? '2px' : '0',
                    }}
                    title={pts ? `Game ${g.gameNumber}: ${pts.toLocaleString()}` : `Game ${g.gameNumber}: didn't play`}
                  />
                </div>
              );
            })}
          </div>
          <div className="flex justify-between text-[9px] font-mono text-yellow-100/30 mt-1 px-2">
            <span>G1</span>
            <span>G{games.length}</span>
          </div>
        </div>

        <div className="text-xs font-mono text-yellow-100/40 text-center">
          {season ? `Stats for ${season.name}` : ''}
        </div>
      </div>
    </div>
  );
}

// ============ IMPORT MODAL (Admin only) ============
function ImportModal({ onClose, onDone }) {
  const [busy, setBusy] = useState(false);
  const [progress, setProgress] = useState('');
  const [error, setError] = useState(null);

  const runImport = async () => {
    setBusy(true);
    setError(null);
    try {
      setProgress('Loading import data...');
      const res = await fetch('import-data.json');
      if (!res.ok) throw new Error('Could not load import-data.json');
      const data = await res.json();

      setProgress(`Importing ${data.players.length} players, ${data.seasons.length} seasons, ${data.games.length} games...`);
      await window.GRP_DB.bulkImport(data);

      setProgress('Done!');
      setTimeout(onDone, 800);
    } catch (e) {
      setError(e.message);
      setBusy(false);
    }
  };

  return (
    <div onClick={busy ? null : onClose} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="gold-border rounded-2xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-md w-full">
        <div className="flex justify-between items-center mb-4">
          <div className="font-display text-2xl gold-text">IMPORT HISTORY</div>
          {!busy && <button onClick={onClose} className="text-yellow-100/60 hover:text-yellow-100"><X size={18} /></button>}
        </div>
        <div className="text-yellow-100/70 text-sm mb-4">
          This will load the 2025–2026 league history into Firestore: 32 players, 2 seasons (R1 + R2), and 17 games.
        </div>
        <div className="text-yellow-100/40 text-xs font-mono mb-4">
          Note: finish-order positions are best-effort inferred from points. Points themselves are exact.
        </div>
        {progress && <div className="text-emerald-300 font-mono text-sm mb-4">{progress}</div>}
        {error && <div className="text-red-400 font-mono text-sm mb-4">Error: {error}</div>}
        <div className="flex gap-2 mt-2">
          <button
            onClick={onClose}
            disabled={busy}
            className="flex-1 px-4 py-2.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100 font-mono text-sm disabled:opacity-30"
          >
            CANCEL
          </button>
          <button
            onClick={runImport}
            disabled={busy}
            className="flex-1 px-4 py-2.5 rounded-full font-display text-lg text-black disabled:opacity-30"
            style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
          >
            {busy ? 'Importing...' : 'Import now'}
          </button>
        </div>
      </div>
    </div>
  );
}

function App() {
  // Route state: 'home' | 'setup' | 'timer' | 'league-info' | 'highrollers-info'
  const [route, setRoute] = useState('home');
  const [gameType, setGameType] = useState(null);
  const [config, setConfig] = useState(null);
  const [customSounds, setCustomSounds] = useState({});
  const [showSignIn, setShowSignIn] = useState(false);
  const { ready: fbReady, user: fbUser } = useFirebase();

  useEffect(() => {
    loadCustomSounds().then(setCustomSounds);
  }, []);

  const handlePick = (type, action) => {
    setGameType(type);
    if (action === 'setup') setRoute('setup');
    else if (action === 'info') setRoute(type === 'highrollers' ? 'highrollers-info' : 'league-info');
  };

  const goHome = () => {
    setRoute('home');
    setGameType(null);
    setConfig(null);
  };

  // Home: show picker + sign in
  if (route === 'home') {
    return (
      <>
        <GameTypePicker onPick={handlePick} />
        <div className="fixed bottom-4 right-4 z-40">
          {fbUser ? (
            <button
              onClick={() => window.GRP_FIREBASE?.signOut(window.GRP_FIREBASE.auth)}
              className="px-3 py-1.5 rounded-full bg-black/40 border border-emerald-500/30 text-emerald-300 font-mono text-xs hover:bg-black/60"
              title={`Signed in as ${fbUser.email}`}
            >
              Signed in
            </button>
          ) : fbReady ? (
            <button
              onClick={() => setShowSignIn(true)}
              className="px-3 py-1.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100/60 font-mono text-xs hover:bg-black/60"
            >
              Sign in
            </button>
          ) : null}
        </div>
        {showSignIn && <SignInModal onClose={() => setShowSignIn(false)} />}
      </>
    );
  }

  // League info or High Rollers info
  if (route === 'league-info' || route === 'highrollers-info') {
    return <LeagueDashboard onBack={goHome} fbUser={fbUser} gameType={gameType} />;
  }

  // Setup or playing
  return config
    ? <PokerTimerMain
        config={config}
        customSounds={customSounds}
        onReset={goHome}
        onViewLeague={() => { setConfig(null); setRoute('league-info'); }}
        gameType={gameType}
        fbUser={fbUser}
      />
    : <SetupWizard customSounds={customSounds} gameType={gameType} onStart={setConfig} onBack={goHome} />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

  </script>

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
