          <button
            onClick={save}
            disabled={busy || (!testMode && !fbUser)}
            className="flex-1 px-4 py-2.5 rounded-full font-display text-lg text-black disabled:opacity-30"
            style={{ background: testMode
              ? 'linear-gradient(135deg, #ef4444, #b91c1c)'
              : 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
          >
            {busy
              ? (testMode ? 'FINISHING...' : 'SAVING...')
              : (testMode ? 'FINISH TEST' : 'SAVE GAME')}
          </button>
        </div>
      </div>
      {showSignIn && <SignInModal onClose={() => setShowSignIn(false)} />}
    </div>
  );
}

// ============ EDIT GAME MODAL ============
function EditGameModal({ game, players, onClose, onSaved, onRequestDeleteSeason }) {
  const isLeague = game.type !== 'highrollers';
  const playersById = {};
  players.forEach(p => { playersById[p.id] = p; });

  const [date, setDate] = useState(game.date || '');
  // Preserve null/undefined as empty string so admin sees blank not 0 when data is missing
  const [pot, setPot] = useState(game.pot == null ? '' : String(game.pot));
  const [leagueMoney, setLeagueMoney] = useState(game.leagueMoney == null ? '' : String(game.leagueMoney));
  const [subs, setSubs] = useState(game.subs == null ? '' : String(game.subs));
  const [totalRebuys, setTotalRebuys] = useState(game.totalRebuys == null ? '' : String(game.totalRebuys));
  const [payouts, setPayouts] = useState({ ...(game.payouts || {}) });
  const [pointsAwarded, setPointsAwarded] = useState({ ...(game.pointsAwarded || {}) });
  const [finishOrder, setFinishOrder] = useState([...(game.finishOrder || [])]);
  // Per-player rebuy counts. Needed for HR so the profit/loss math
  // (buyIns += buyIn * (1 + rebuys[pid])) lands correctly per player.
  const [rebuys, setRebuys] = useState({ ...(game.rebuys || {}) });
  // Per-player buy-in. HR profit/loss is driven by this directly, so the
  // modal exposes BUY IN (not POT) for HR; pot is derived on save from
  // buyIn × (attendees + totalRebuys). League keeps POT editable.
  const [buyIn, setBuyIn] = useState(game.buyIn == null ? '' : String(game.buyIn));

  // Adjust one player's rebuy count. Negative count is clamped to 0.
  const bumpRebuy = (pid, delta) => {
    setRebuys((prev) => {
      const next = { ...prev };
      const cur = (next[pid] || 0) + delta;
      if (cur <= 0) delete next[pid];
      else next[pid] = cur;
      return next;
    });
  };
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);

  // League uses pointsAwarded keys as the attendee list (since points = played);
  // HR has an explicit attendees array on the doc instead.
  const attendees = isLeague ? Object.keys(pointsAwarded) : (game.attendees || []);
  const playerCount = attendees.length;

  // True if any PID appears in more than one slot of the VISIBLE
  // finishOrder. Only scans the first attendees.length entries — a
  // scrambled save can leave stale trailing entries past the rendered
  // rows that the admin can't see or fix from the UI; flagging those
  // as duplicates would be a false positive. The trailing entries are
  // dropped on save (see save()).
  const finishOrderHasDupes = (() => {
    const seen = new Set();
    const visible = (finishOrder || []).slice(0, attendees.length);
    for (const pid of visible) {
      if (!pid) continue;
      if (seen.has(pid)) return true;
      seen.add(pid);
    }
    return false;
  })();

  // Assign a player to a position. Guarantees the resulting finishOrder
  // contains the picked player in exactly one slot.
  //
  // - newPid not in array → plain set
  // - newPid in exactly one other slot → swap (the existing player at
  //   placeIdx moves to where newPid was)
  // - newPid in multiple other slots (scrambled save data) → existing
  //   moves into the first duplicate slot; the rest are cleared. Admin
  //   then fills the empty slots manually.
  const setPlaceTo = (placeIdx, newPid) => {
    if (!newPid) return;
    const next = [...finishOrder];
    while (next.length <= placeIdx) next.push(null);
    const existing = next[placeIdx];
    const otherIdxs = [];
    for (let i = 0; i < next.length; i++) {
      if (i !== placeIdx && next[i] === newPid) otherIdxs.push(i);
    }
    if (otherIdxs.length === 1) {
      next[otherIdxs[0]] = existing;
    } else if (otherIdxs.length > 1) {
      next[otherIdxs[0]] = existing;
      for (let j = 1; j < otherIdxs.length; j++) next[otherIdxs[j]] = '';
    }
    next[placeIdx] = newPid;
    setFinishOrder(next);
  };

  // Quick-fill helpers
  const fillLeagueFromPot = () => {
    const p = parseFloat(pot);
    if (!isNaN(p)) setLeagueMoney(String(Math.round(p * 0.1 / 10) * 10));
  };
  const fillSubsFromPlayers = () => {
    setSubs(String(playerCount * 3));
  };

  const updatePoints = (pid, val) => {
    const num = parseInt(val);
    const updated = { ...pointsAwarded };
    if (isNaN(num) || num === 0) delete updated[pid];
    else updated[pid] = num;
    setPointsAwarded(updated);
  };
  const updatePayout = (place, val) => {
    const num = parseFloat(val);
    const updated = { ...payouts };
    if (isNaN(num) || num === 0) delete updated[place];
    else updated[place] = num;
    setPayouts(updated);
  };

  const save = async () => {
    setBusy(true);
    setError(null);
    try {
      // Trim finishOrder to exactly attendees.length so a scrambled save
      // (with extra trailing entries that the UI couldn't render or fix)
      // can be cleaned up by re-saving from this modal.
      const trimmedFinishOrder = (finishOrder || []).slice(0, attendees.length);
      // First-out = the FIRST player knocked out (even if they later
      // rebought). Prefer the game's knockouts log; only fall back to
      // finishOrder[last] if there's no log (pre-v7.60 imports). Do NOT
      // overwrite an existing firstOut with the finishOrder fallback if
      // it's already been manually set — losing an intentional value on
      // an unrelated edit would be an easy mistake to make.
      const knockoutsLog = Array.isArray(game.knockouts) ? game.knockouts : [];
      const firstFromLog = knockoutsLog.length > 0 ? knockoutsLog[0].eliminated : null;
      const newFirstOut = game.firstOut
        || firstFromLog
        || (trimmedFinishOrder.length > 0 ? trimmedFinishOrder[trimmedFinishOrder.length - 1] : null);
      const updates = {
        ...game,
        date,
        payouts,
        finishOrder: trimmedFinishOrder,
        firstOut: newFirstOut,
      };
      if (isLeague) {
        updates.pot = parseFloat(pot) || 0;
        updates.totalRebuys = parseInt(totalRebuys) || 0;
        updates.leagueMoney = parseFloat(leagueMoney) || 0;
        updates.subs = parseFloat(subs) || 0;
        updates.pointsAwarded = pointsAwarded;
        updates.attendees = Object.keys(pointsAwarded);
        // Keep per-player rebuys in sync (we only edit them for HR, but
        // store the existing value for league untouched).
        updates.rebuys = rebuys;
        // Prize pool = pot minus league money. Subs are collected
        // separately (never in the pot), so they don't reduce the
        // prize pool. Recompute on every league save so an edit to
        // either pot or leagueMoney keeps prizePool honest.
        updates.prizePool = Math.max(0, (updates.pot || 0) - (updates.leagueMoney || 0));
      } else {
        // HR: BUY IN is the editable field; derive the pot from it.
        const newBuyIn = parseFloat(buyIn) || 0;
        const totalR = Object.values(rebuys).reduce((a, b) => a + (b || 0), 0);
        updates.buyIn = newBuyIn;
        updates.attendees = attendees;
        updates.rebuys = rebuys;
        updates.totalRebuys = totalR;
        updates.pot = newBuyIn * (attendees.length + totalR);
        // HR has no league money / subs — prize pool = pot.
        updates.prizePool = updates.pot;
      }
      await window.GRP_DB.saveGame(updates);
      onSaved();
    } catch (e) {
      setError(e.message);
      setBusy(false);
    }
  };

  const doDelete = async () => {
    setBusy(true);
    try {
      await window.GRP_DB.deleteGame(game.id);
      onSaved();
    } catch (e) {
      setError(e.message);
      setBusy(false);
    }
  };

  return (
    <div onClick={busy ? null : onClose} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="gold-border rounded-2xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-2xl w-full max-h-[90vh] overflow-y-auto">
        <div className="flex justify-between items-start mb-4">
          <div>
            <div className="font-display text-3xl gold-text">
              {isLeague
                ? <>EDIT GAME {game.gameNumber}{game.isFinal && <span className="text-yellow-300 ml-2 text-xl">— FINAL</span>}</>
                : <>EDIT HR GAME</>}
            </div>
            <div className="text-yellow-100/40 font-mono text-xs mt-1">{game.id}</div>
          </div>
          <button onClick={onClose} className="text-yellow-100/60 hover:text-yellow-100"><X size={20} /></button>
        </div>

        {/* Date + money */}
        <div className="grid grid-cols-2 gap-3 mb-5">
          <div>
            <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-1">DATE</div>
            <input
              type="text"
              value={date}
              onChange={(e) => setDate(e.target.value)}
              placeholder="2026-05-12"
              className="w-full px-3 py-2 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 font-mono text-sm focus:outline-none focus:border-yellow-500/50"
            />
          </div>
          {isLeague && (
            <div>
              <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-1">REBUYS</div>
              <input
                type="number"
                value={totalRebuys}
                onChange={(e) => setTotalRebuys(e.target.value)}
                className="w-full px-3 py-2 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 font-mono text-sm focus:outline-none focus:border-yellow-500/50"
              />
            </div>
          )}
          <div>
            <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-1">
              {isLeague ? 'POT £' : 'BUY IN £'}
            </div>
            <input
              type="number"
              value={isLeague ? pot : buyIn}
              placeholder="—"
              onChange={(e) => (isLeague ? setPot(e.target.value) : setBuyIn(e.target.value))}
              className="w-full px-3 py-2 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 font-mono text-sm focus:outline-none focus:border-yellow-500/50"
            />
            {!isLeague && (
              <div className="font-mono text-[10px] text-yellow-100/40 mt-1">
                pot recalculated on save from buy-in × ({attendees.length} players + {Object.values(rebuys).reduce((a, b) => a + (b || 0), 0)} rebuys)
              </div>
            )}
          </div>
          {isLeague && (
            <>
              <div>
                <div className="flex justify-between items-baseline mb-1">
                  <span className="font-mono text-xs text-yellow-100/40 tracking-widest">LEAGUE £</span>
                  <button
                    onClick={fillLeagueFromPot}
                    disabled={!pot}
                    className="text-[10px] font-mono text-emerald-400 hover:text-emerald-300 disabled:opacity-30 disabled:cursor-not-allowed"
                    title="Set to 10% of pot"
                  >
                    = 10% pot
                  </button>
                </div>
                <input
                  type="number"
                  value={leagueMoney}
                  placeholder="—"
                  onChange={(e) => setLeagueMoney(e.target.value)}
                  className="w-full px-3 py-2 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 font-mono text-sm focus:outline-none focus:border-yellow-500/50"
                />
              </div>
              <div>
                <div className="flex justify-between items-baseline mb-1">
                  <span className="font-mono text-xs text-yellow-100/40 tracking-widest">SUBS £</span>
                  <button
                    onClick={fillSubsFromPlayers}
                    disabled={!playerCount}
                    className="text-[10px] font-mono text-emerald-400 hover:text-emerald-300 disabled:opacity-30 disabled:cursor-not-allowed"
                    title={`Set to £3 × ${playerCount} players`}
                  >
                    = £3 × {playerCount}
                  </button>
                </div>
                <input
                  type="number"
                  value={subs}
                  placeholder="—"
                  onChange={(e) => setSubs(e.target.value)}
                  className="w-full px-3 py-2 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 font-mono text-sm focus:outline-none focus:border-yellow-500/50"
                />
              </div>
            </>
          )}
        </div>

        {/* Payouts */}
        <div className="mb-5">
          <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">PAYOUTS</div>
          <div className="grid grid-cols-5 gap-2">
            {[1, 2, 3, 4, 5].map((place) => (
              <div key={place}>
                <div className="font-mono text-xs text-yellow-100/40 mb-1">{place === 1 ? '1st' : place === 2 ? '2nd' : place === 3 ? '3rd' : `${place}th`} £</div>
                <input
                  type="number"
                  value={payouts[String(place)] || ''}
                  onChange={(e) => updatePayout(String(place), e.target.value)}
                  className="w-full px-2 py-1.5 rounded bg-black/40 border border-yellow-500/20 text-yellow-50 font-mono text-sm focus:outline-none focus:border-yellow-500/50"
                />
              </div>
            ))}
          </div>
        </div>

        {/* Points awarded (per-player) — league only */}
        {/* Finishing order — works for league AND HR games. Per-position
            dropdowns covering every attendee. Picking a player who's
            already at another place swaps them so the order stays a valid
            permutation. Top 3 get medal emojis. Drives the per-game
            position colour on standings + the source of truth for
            first-out. League points are NOT auto-recomputed — edit them
            in POINTS BY PLAYER if needed. */}
        {attendees.length > 0 && (() => {
          // Count occurrences of each PID across the VISIBLE order (first
          // attendees.length slots). Stale trailing entries past the
          // rendered rows are ignored — admin can't fix what they can't
          // see, and save() trims them anyway.
          const counts = {};
          (finishOrder || []).slice(0, attendees.length).forEach((pid) => {
            if (pid) counts[pid] = (counts[pid] || 0) + 1;
          });
          const dupPids = new Set(Object.keys(counts).filter((k) => counts[k] > 1));
          return (
          <div className="mb-5">
            <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">FINISHING ORDER</div>
            <div className="text-yellow-100/40 text-xs mb-2">
              Pick who finished in each position. Swapping shuffles the existing player into the slot you picked from.
            </div>
            {dupPids.size > 0 && (
              <div className="mb-2 px-3 py-2 rounded-lg bg-red-950/40 border border-red-500/40 text-red-200 font-mono text-xs">
                ⚠ Duplicate{dupPids.size > 1 ? 's' : ''}: {Array.from(dupPids).map((p) => playersById[p]?.displayName || p).join(', ')}. Fix before saving.
              </div>
            )}
            <div className="max-h-72 overflow-y-auto space-y-1 pr-1">
              {attendees.map((_, i) => {
                const place = i + 1;
                const current = finishOrder[i] || '';
                const placeLabel = ['1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th', '10th'][i] || `${place}th`;
                const medal = ['🥇', '🥈', '🥉'][i] || null;
                const isDup = current && dupPids.has(current);
                return (
                  <div
                    key={i}
                    className={`flex items-center gap-2 p-2 rounded border ${isDup ? 'bg-red-950/30 border-red-500/40' : 'bg-black/30 border-transparent'}`}
                  >
                    <div className="font-mono text-xs text-yellow-100/40 w-14 shrink-0 flex items-center gap-1">
                      {medal && <span className="text-sm">{medal}</span>}
                      {placeLabel}
                    </div>
                    <select
                      value={current}
                      onChange={(e) => setPlaceTo(i, e.target.value)}
                      className={`flex-1 px-2 py-1.5 rounded bg-black/40 border text-yellow-50 font-mono text-sm focus:outline-none ${isDup ? 'border-red-400/60 focus:border-red-400' : 'border-yellow-500/20 focus:border-yellow-500/50'}`}
                    >
                      <option value="" style={{ background: '#0a3d1f' }}>—</option>
                      {attendees.map((pid) => (
                        <option key={pid} value={pid} style={{ background: '#0a3d1f' }}>
                          {(playersById[pid]?.displayName) || pid}
                        </option>
                      ))}
                    </select>
                  </div>
                );
              })}
            </div>
          </div>
          );
        })()}

        {isLeague && (
          <div className="mb-5">
            <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">POINTS BY PLAYER</div>
            <div className="text-yellow-100/40 text-xs mb-2">Set 0 or blank to remove the player from this game.</div>
            <div className="max-h-64 overflow-y-auto space-y-1 pr-1">
              {attendees.map((pid) => {
                const p = playersById[pid] || { displayName: pid };
                return (
                  <div key={pid} className="flex items-center gap-2 p-2 rounded bg-black/30">
                    <span className="flex-1 text-emerald-100 text-sm truncate">{p.displayName}</span>
                    <input
                      type="number"
                      value={pointsAwarded[pid] || ''}
                      onChange={(e) => updatePoints(pid, e.target.value)}
                      className="w-24 px-2 py-1 rounded bg-black/40 border border-yellow-500/20 text-yellow-50 font-mono text-sm text-right focus:outline-none focus:border-yellow-500/50"
                    />
                  </div>
                );
              })}
            </div>
          </div>
        )}


        {/* Per-player rebuys — HR only. Each attendee gets a +/- counter so
            the profit/loss math stays accurate (buyIns += buyIn × (1 + rebuys)). */}
        {!isLeague && attendees.length > 0 && (
          <div className="mb-5">
            <div className="flex justify-between items-baseline mb-2">
              <div className="font-mono text-xs text-yellow-100/40 tracking-widest">REBUYS PER PLAYER</div>
              <div className="font-mono text-[11px] text-yellow-100/40">
                total: {Object.values(rebuys).reduce((a, b) => a + (b || 0), 0)}
              </div>
            </div>
            <div className="text-yellow-100/40 text-xs mb-2">Each rebuy adds £{game.buyIn || 30} to that player's buy-ins.</div>
            <div className="max-h-64 overflow-y-auto space-y-1 pr-1">
              {attendees.map((pid) => {
                const p = playersById[pid] || { displayName: pid };
                const count = rebuys[pid] || 0;
                return (
                  <div key={pid} className="flex items-center gap-2 p-2 rounded bg-black/30">
                    <span className="flex-1 text-emerald-100 text-sm truncate">{p.displayName}</span>
                    <button
                      onClick={() => bumpRebuy(pid, -1)}
                      disabled={count === 0}
                      className="w-7 h-7 rounded bg-black/40 border border-yellow-500/20 text-yellow-100 font-mono text-base disabled:opacity-30"
                    >
                      −
                    </button>
                    <div className="w-10 text-center font-mono text-yellow-50 text-sm">
                      {count > 0 ? `+${count}` : '—'}
                    </div>
                    <button
                      onClick={() => bumpRebuy(pid, +1)}
                      className="w-7 h-7 rounded bg-yellow-500/20 border border-yellow-500/40 text-yellow-100 font-mono text-base hover:bg-yellow-500/30"
                    >
                      +
                    </button>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {error && <div className="text-red-400 font-mono text-sm mb-3">Error: {error}</div>}

        <div className="flex gap-2 mb-3">
          <button
            onClick={onClose}
            disabled={busy}
            className="flex-1 px-4 py-2.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100 font-mono text-sm disabled:opacity-30"
          >
            CANCEL
          </button>
          <button
            onClick={save}
            disabled={busy || finishOrderHasDupes}
            className="flex-1 px-4 py-2.5 rounded-full font-display text-lg text-black disabled:opacity-30"
            style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
            title={finishOrderHasDupes ? 'Resolve duplicate finishing positions first' : 'Save changes'}
          >
            {busy ? 'Saving...' : finishOrderHasDupes ? 'FIX DUPLICATES TO SAVE' : 'SAVE CHANGES'}
          </button>
        </div>

        <div className="border-t border-red-500/10 mt-4 pt-4 space-y-2">
          <div className="text-yellow-100/30 text-xs font-mono tracking-widest mb-1">DESTRUCTIVE</div>
          <button
            onClick={() => setShowDeleteConfirm(true)}
            disabled={busy}
            className="w-full px-4 py-2 rounded-full bg-red-950/40 border border-red-500/30 text-red-300 font-mono text-xs hover:bg-red-900/60 disabled:opacity-30"
          >
            DELETE THIS GAME
          </button>
          {onRequestDeleteSeason && (
            <button
              onClick={() => { onClose(); onRequestDeleteSeason(); }}
              disabled={busy}
              className="w-full px-4 py-2 rounded-full bg-red-950/40 border border-red-500/30 text-red-300 font-mono text-xs hover:bg-red-900/60 disabled:opacity-30"
            >
              DELETE ENTIRE SEASON
            </button>
          )}
        </div>

        {showDeleteConfirm && (
          <ConfirmDialog
            title="Delete game?"
            message={isLeague
              ? `This will permanently remove Game ${game.gameNumber} from ${game.seasonId}. Player points and history for this game will be lost.`
              : `This will permanently remove the High Rollers game from ${game.date || game.id}. Payout history for this game will be lost.`}
            requireType="DELETE"
            onConfirm={doDelete}
            onCancel={() => setShowDeleteConfirm(false)}
          />
        )}
      </div>
    </div>
  );
}

// ============ SUBS LEDGER MODAL (Admin only) ============
// Per-attendee × per-game grid of subs paid status, scoped to the current
// league season. Cells are ticked when paid, blank when owed, dashed when
// the player wasn't at that game. Click to toggle. Save writes the
// updated subsPaid maps back to each affected game doc. Finals are
// excluded — no subs collected on the final game.
function SubsLedgerModal({ season, games, players, onClose, onSaved }) {
  // Edit buffer: { [gameId]: { [pid]: bool } } — only games with changes.
  const [edits, setEdits] = useState({});
  // Local upfront-paid set — initialized from season.upfrontSubs, mutated
  // by the per-player toggle, persisted to the season doc on save.
  const [upfrontSet, setUpfrontSet] = useState(() => new Set(season?.upfrontSubs || []));
  const [saving, setSaving] = useState(false);
  const [error, setError] = useState(null);
  const [savedAt, setSavedAt] = useState(0);
  // Edit-mode gate. Ledger opens read-only so a stray tap can't flip
  // someone's paid status. Admin has to explicitly enable edits via
  // the confirm dialog, then all cells + upfront toggles become
  // tappable. Exit edit re-locks (unsaved changes kept until Save
  // or Cancel commits/discards them).
  const [editMode, setEditMode] = useState(false);
  const [showEditConfirm, setShowEditConfirm] = useState(false);
  // Per-game grid stays collapsed by default — most sessions just need
  // the aggregate "who owes what" view at the top. Only opened for
  // deep audit / per-game corrections.
  const [gridOpen, setGridOpen] = useState(false);
  // Inline upfront picker state — a search field that filters attendees
  // not already flagged upfront. Only shown in edit mode.
  const [upfrontPickerOpen, setUpfrontPickerOpen] = useState(false);
  const [upfrontQuery, setUpfrontQuery] = useState('');

  const seasonId = season?.id;
  const seasonName = season?.name;
  const initialUpfront = useRef(new Set(season?.upfrontSubs || []));

  const playersById = {};
  players.forEach((p) => { playersById[p.id] = p; });

  // Regular games only, sorted by gameNumber. Finals exempt.
  const regular = (games || [])
    .filter((g) => g.seasonId === seasonId && !g.isFinal)
    .sort((a, b) => (a.gameNumber || 0) - (b.gameNumber || 0));

  // Attendee universe — anyone who showed up to at least one regular game,
  // PLUS anyone flagged as upfront-paid for this season (so admin can see
  // and un-flag them even if they haven't attended any game yet).
  const pidSet = new Set();
  regular.forEach((g) => (g.attendees || []).forEach((pid) => pidSet.add(pid)));
  upfrontSet.forEach((pid) => pidSet.add(pid));
  const attendees = Array.from(pidSet)
    .map((pid) => ({ pid, name: playersById[pid]?.displayName || pid }))
    .sort((a, b) => a.name.localeCompare(b.name));

  // Resolve a cell's effective state, accounting for unsaved edits and
  // round-upfront payment. Upfront players show as paid in every cell
  // they attended; they don't get a toggleable cell.
  const cellState = (game, pid) => {
    if (!(game.attendees || []).includes(pid)) return 'dnp';
    if (upfrontSet.has(pid)) return 'upfront';
    const editVal = edits[game.id]?.[pid];
    if (editVal !== undefined) return editVal ? 'paid' : 'owed';
    const stored = (game.subsPaid || {})[pid];
    // Treat missing data as paid for legacy games (no subsPaid map) —
    // otherwise every old game would show as fully unpaid the moment
    // the ledger opens. Admin can flip if needed.
    if (Object.keys(game.subsPaid || {}).length === 0) return 'paid';
    return stored === true ? 'paid' : 'owed';
  };

  const toggle = (gameId, pid) => {
    if (!editMode) return; // ledger is read-only until admin enables edit
    if (upfrontSet.has(pid)) return; // upfront players are locked
    setEdits((prev) => {
      const game = regular.find((g) => g.id === gameId);
      const current = cellState(game, pid);
      if (current === 'dnp') return prev;
      const next = { ...(prev[gameId] || {}) };
      next[pid] = current !== 'paid'; // owed → paid; paid → owed
      return { ...prev, [gameId]: next };
    });
  };

  const toggleUpfront = (pid) => {
    if (!editMode) return; // gated by edit mode too
    setUpfrontSet((prev) => {
      const next = new Set(prev);
      if (next.has(pid)) next.delete(pid); else next.add(pid);
      return next;
    });
  };

  // Compute total outstanding £ per player given current edits. Upfront
  // payers always owe £0.
  const owedByPid = {};
  attendees.forEach(({ pid }) => {
    if (upfrontSet.has(pid)) return;
    const owed = regular.reduce((acc, g) => {
      return acc + (cellState(g, pid) === 'owed' ? 1 : 0);
    }, 0);
    if (owed > 0) owedByPid[pid] = owed * 3;
  });
  const totalOwed = Object.values(owedByPid).reduce((a, b) => a + b, 0);
  const editedCount = Object.values(edits).reduce((acc, m) => acc + Object.keys(m).length, 0);
  // True if the local upfront set differs from what's stored on the season.
  const upfrontChanged = (() => {
    const before = initialUpfront.current;
    if (before.size !== upfrontSet.size) return true;
    for (const pid of upfrontSet) if (!before.has(pid)) return true;
    return false;
  })();
  const hasChanges = editedCount > 0 || upfrontChanged;

  const save = async () => {
    setError(null);
    setSaving(true);
    try {
      for (const [gameId, changes] of Object.entries(edits)) {
        const game = regular.find((g) => g.id === gameId);
        if (!game) continue;
        const merged = { ...(game.subsPaid || {}), ...changes };
        await window.GRP_DB.saveGame({ ...game, subsPaid: merged });
      }
      if (upfrontChanged && season) {
        await window.GRP_DB.upsertSeason({
          ...season,
          upfrontSubs: Array.from(upfrontSet),
        });
        initialUpfront.current = new Set(upfrontSet);
      }
      setEdits({});
      setSavedAt(Date.now());
      if (onSaved) onSaved();
    } catch (e) {
      setError(e.message || 'Save failed');
    } finally {
      setSaving(false);
    }
  };

  return (
    <div onClick={onClose} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="gold-border rounded-3xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-4xl w-full max-h-[92vh] overflow-y-auto">
        <div className="flex justify-between items-start mb-4 gap-3">
          <div className="min-w-0">
            <div className="font-display text-3xl gold-text">SUBS LEDGER</div>
            <div className="text-yellow-100/60 font-mono text-xs mt-1">
              {seasonName || seasonId} · £3/game · finals excluded
              {editMode
                ? <span className="text-red-300"> · EDIT MODE — cells tappable</span>
                : <span className="text-yellow-100/40"> · read-only</span>}
            </div>
          </div>
          <div className="flex items-center gap-2 shrink-0">
            {editMode ? (
              <button
                onClick={() => setEditMode(false)}
                className="px-3 py-1.5 rounded-full font-mono text-xs border border-red-400/60 bg-red-900/40 text-red-100 hover:bg-red-900/60"
                title="Lock the ledger (unsaved changes are kept until Save/Cancel)"
              >
                ✕ EXIT EDIT
              </button>
            ) : (
              <button
                onClick={() => setShowEditConfirm(true)}
                className="px-3 py-1.5 rounded-full font-mono text-xs border border-yellow-500/30 text-yellow-100/80 hover:bg-yellow-500/10 hover:border-yellow-500/60"
                title="Unlock the ledger for editing (confirms before enabling)"
              >
                ✏️ EDIT
              </button>
            )}
            <button onClick={onClose} className="text-yellow-100/60 hover:text-yellow-100"><X size={20} /></button>
          </div>
        </div>

        {showEditConfirm && (
          <ConfirmDialog
            title="ENABLE EDIT MODE?"
            message="Cells and upfront toggles will become tappable and any change flips the paid/owed state immediately. Nothing writes to the database until you tap SAVE CHANGES at the bottom. Cancel to keep the ledger locked."
            onCancel={() => setShowEditConfirm(false)}
            onConfirm={() => { setEditMode(true); setShowEditConfirm(false); }}
          />
        )}

        {error && (
          <div className="mb-3 p-3 rounded-lg bg-red-950/40 border border-red-500/40 text-red-200 font-mono text-xs">{error}</div>
        )}
        {savedAt > 0 && Object.keys(edits).length === 0 && (
          <div className="mb-3 p-3 rounded-lg bg-emerald-950/40 border border-emerald-500/40 text-emerald-200 font-mono text-xs">
            ✓ Saved. Ledger up to date.
          </div>
        )}

        {regular.length === 0 ? (
          <div className="text-yellow-100/60 font-mono text-sm text-center py-8">
            No regular games saved in this season yet.
          </div>
        ) : attendees.length === 0 ? (
          <div className="text-yellow-100/60 font-mono text-sm text-center py-8">
            No attendees recorded yet.
          </div>
        ) : (
          <>
            {/* --- OUTSTANDING (aggregate — the "at a glance" view) --- */}
            <div className="mb-4 p-4 rounded-xl bg-black/30 border border-yellow-500/15">
              <div className="flex items-baseline justify-between gap-3 mb-2">
                <div className="font-mono text-xs text-yellow-100/60 tracking-widest">OUTSTANDING</div>
                <div className="font-display text-3xl text-yellow-100">£{totalOwed}</div>
              </div>
              {Object.keys(owedByPid).length === 0 ? (
                <div className="font-mono text-sm text-emerald-300/80">Everyone paid up ✓</div>
              ) : (
                <div className="space-y-1">
                  {Object.entries(owedByPid)
                    .sort((a, b) => b[1] - a[1])
                    .map(([pid, owed]) => (
                      <div key={pid} className="flex justify-between items-center font-mono text-sm py-1">
                        <span className="text-emerald-100">{playersById[pid]?.displayName || pid}</span>
                        <span className="text-red-300">£{owed}</span>
                      </div>
                    ))}
                </div>
              )}
            </div>

            {/* --- UPFRONT ROUND-PAYERS --- */}
            <div className="mb-4 p-4 rounded-xl bg-black/20 border border-emerald-500/15">
              <div className="flex items-center justify-between mb-2">
                <div className="font-mono text-xs text-yellow-100/60 tracking-widest">UPFRONT · PAID FOR ROUND</div>
                {editMode && !upfrontPickerOpen && (
                  <button
                    onClick={() => { setUpfrontPickerOpen(true); setUpfrontQuery(''); }}
                    className="px-2 py-0.5 rounded-full text-[10px] font-mono border border-yellow-500/30 text-yellow-100/80 hover:border-yellow-500/60"
                  >
                    + ADD
                  </button>
                )}
              </div>
              {upfrontSet.size === 0 && !upfrontPickerOpen && (
                <div className="font-mono text-xs text-yellow-100/40 italic">Nobody has paid upfront for the round.</div>
              )}
              {upfrontSet.size > 0 && (
                <div className="flex flex-wrap gap-1.5 mb-2">
                  {Array.from(upfrontSet)
                    .map((pid) => ({ pid, name: playersById[pid]?.displayName || pid }))
                    .sort((a, b) => a.name.localeCompare(b.name))
                    .map(({ pid, name }) => (
                      <span key={pid} className="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-mono bg-emerald-700/40 border border-emerald-300/60 text-emerald-50">
                        🪙 {name}
                        {editMode && (
                          <button
                            onClick={() => toggleUpfront(pid)}
                            className="text-emerald-50/70 hover:text-red-300"
                            title="Remove upfront flag"
                          >
                            ✕
                          </button>
                        )}
                      </span>
                    ))}
                </div>
              )}
              {upfrontPickerOpen && (() => {
                const q = upfrontQuery.trim().toLowerCase();
                const candidates = attendees
                  .filter(({ pid }) => !upfrontSet.has(pid))
                  .filter(({ name }) => !q || name.toLowerCase().includes(q));
                return (
                  <div className="mt-2 space-y-2">
                    <div className="flex gap-2">
                      <input
                        autoFocus
                        type="text"
                        value={upfrontQuery}
                        onChange={(e) => setUpfrontQuery(e.target.value)}
                        placeholder="Search a player…"
                        className="flex-1 px-3 py-1.5 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 text-xs font-mono focus:outline-none focus:border-yellow-500/50"
                      />
                      <button
                        onClick={() => { setUpfrontPickerOpen(false); setUpfrontQuery(''); }}
                        className="px-3 py-1.5 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-100/70 text-xs font-mono"
                      >
                        DONE
                      </button>
                    </div>
                    <div className="max-h-40 overflow-y-auto space-y-1">
                      {candidates.length === 0 && (
                        <div className="font-mono text-xs text-yellow-100/40 italic px-2 py-1">
                          {q ? 'No matches.' : 'Everyone in this season is already flagged upfront.'}
                        </div>
                      )}
                      {candidates.slice(0, 20).map(({ pid, name }) => (
                        <button
                          key={pid}
                          onClick={() => { toggleUpfront(pid); setUpfrontQuery(''); }}
                          className="w-full text-left px-2 py-1.5 rounded-lg bg-emerald-950/40 border border-emerald-500/20 hover:bg-emerald-900/50 text-emerald-100 text-xs font-mono"
                        >
                          + {name}
                        </button>
                      ))}
                    </div>
                  </div>
                );
              })()}
            </div>

            {/* --- PER-GAME BREAKDOWN (collapsible — for deep audit) --- */}
            <div className="mb-4">
              <button
                onClick={() => setGridOpen((v) => !v)}
                className="w-full flex items-center justify-between px-3 py-2 rounded-lg bg-black/30 border border-yellow-500/15 hover:border-yellow-500/40 font-mono text-xs text-yellow-100/70"
              >
                <span>{gridOpen ? '▼' : '▶'} PER-GAME BREAKDOWN ({regular.length} game{regular.length === 1 ? '' : 's'})</span>
                <span className="text-yellow-100/40">{editMode ? 'tap cells to correct' : 'view only'}</span>
              </button>
              {gridOpen && (
                <div className="overflow-x-auto mt-2 border border-emerald-500/15 rounded-lg">
                  <table className="w-full font-mono text-xs">
                    <thead>
                      <tr className="bg-black/40">
                        <th className="text-left p-2 text-yellow-100/60 sticky left-0 bg-black/60 z-10" style={{ minWidth: 140 }}>Player</th>
                        {regular.map((g) => (
                          <th key={g.id} className="text-center p-2 text-emerald-300 whitespace-nowrap" style={{ minWidth: 72 }}>
                            G{g.gameNumber}
                          </th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {attendees.map(({ pid, name }) => {
                        const isUpfront = upfrontSet.has(pid);
                        return (
                          <tr key={pid} className="border-t border-emerald-500/10">
                            <td className="p-2 sticky left-0 bg-emerald-950/60 z-10" style={{ minWidth: 140 }}>
                              <span className="text-emerald-100">{name}</span>
                              {isUpfront && <span className="ml-1 text-emerald-300/70 text-[10px]">🪙</span>}
                            </td>
                            {regular.map((g) => {
                              const state = cellState(g, pid);
                              if (state === 'dnp') {
                                return <td key={g.id} className="text-center p-1 text-yellow-100/20">—</td>;
                              }
                              if (state === 'upfront') {
                                return (
                                  <td key={g.id} className="text-center p-1" title="Covered by upfront round payment">
                                    <span className="inline-block px-2 py-1 rounded border bg-emerald-600/30 border-emerald-400/60 text-emerald-100 text-[11px] font-mono">✓</span>
                                  </td>
                                );
                              }
                              const isPaid = state === 'paid';
                              return (
                                <td key={g.id} className="text-center p-1">
                                  <button
                                    onClick={() => toggle(g.id, pid)}
                                    disabled={!editMode}
                                    className={`px-2 py-1 rounded border text-[11px] font-mono ${
                                      isPaid
                                        ? 'bg-emerald-600/30 border-emerald-400/60 text-emerald-100'
                                        : 'bg-red-900/40 border-red-400/60 text-red-100'
                                    } ${editMode ? '' : 'opacity-70 cursor-not-allowed'}`}
                                    title={editMode
                                      ? (isPaid ? 'Paid — click to mark owed' : 'Owed — click to mark paid')
                                      : (isPaid ? 'Paid' : 'Owed')}
                                  >
                                    {isPaid ? '✓' : 'OWES'}
                                  </button>
                                </td>
                              );
                            })}
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </>
        )}

        <div className="flex gap-2">
          <button
            onClick={onClose}
            disabled={saving}
            className="flex-1 px-4 py-2.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100 font-mono text-sm disabled:opacity-30"
          >
            {hasChanges ? 'CANCEL' : 'CLOSE'}
          </button>
          <button
            onClick={save}
            disabled={saving || !hasChanges}
            className="flex-1 px-4 py-2.5 rounded-full font-display text-lg text-black disabled:opacity-30"
            style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
          >
            {saving ? 'SAVING…' : hasChanges ? 'SAVE CHANGES' : 'NO CHANGES'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ============ SEASON MANAGER MODAL (Admin only) ============
// Create / edit / rename / archive seasons. Each row starts collapsed;
// tap to expand and edit fields. Rename cascades through migrateSeason
// (re-IDs the season doc and every attached game).
function SeasonManagerModal({ seasons, onClose, onChanged }) {
  const [expandedId, setExpandedId] = useState(null);
  const [edits, setEdits] = useState({}); // { seasonId: { field: value, ... } }
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [status, setStatus] = useState(null); // { kind: 'ok' | 'err', msg }
  const [renameFor, setRenameFor] = useState(null); // seasonId when the rename form is open
  const [creating, setCreating] = useState(false);
  const [newSeason, setNewSeason] = useState({
    id: '', name: '', startDate: '', endDate: '', totalGames: 7, finalGameIndex: 7, status: 'active',
  });

  const orderedSeasons = seasons
    .slice()
    .sort((a, b) => (b.startDate || '').localeCompare(a.startDate || ''));

  const getField = (season, field) => {
    if (edits[season.id] && edits[season.id][field] !== undefined) return edits[season.id][field];
    return season[field] ?? '';
  };
  const setField = (season, field, value) => {
    setEdits((prev) => ({ ...prev, [season.id]: { ...(prev[season.id] || {}), [field]: value } }));
  };
  const dirty = (seasonId) => edits[seasonId] && Object.keys(edits[seasonId]).length > 0;

  const saveSeason = async (season) => {
    setError(null); setBusy(true); setStatus(null);
    try {
      const patch = edits[season.id] || {};
      const merged = { ...season, ...patch };
      // Coerce numeric fields
      if (patch.totalGames !== undefined) merged.totalGames = parseInt(patch.totalGames) || 0;
      if (patch.finalGameIndex !== undefined) merged.finalGameIndex = parseInt(patch.finalGameIndex) || 0;
      await window.GRP_DB.upsertSeason(merged);
      setEdits((prev) => { const n = { ...prev }; delete n[season.id]; return n; });
      setStatus({ kind: 'ok', msg: `Saved ${merged.name}` });
      if (onChanged) onChanged();
    } catch (e) {
      setError(e.message || 'Save failed');
    } finally {
      setBusy(false);
    }
  };

  const doRename = async (season, newId, newName) => {
    if (!newId || newId === season.id) { setRenameFor(null); return; }
    setError(null); setBusy(true); setStatus(null);
    try {
      const res = await window.GRP_DB.migrateSeason({
        oldSeasonId: season.id,
        newSeasonId: newId,
        newName: newName || season.name,
      });
      setStatus({ kind: 'ok', msg: `Migrated ${season.id} → ${newId} (${res?.migratedGameCount ?? '?'} games updated)` });
      setRenameFor(null);
      setExpandedId(newId);
      if (onChanged) onChanged();
    } catch (e) {
      setError(e.message || 'Rename failed');
    } finally {
      setBusy(false);
    }
  };

  const createSeason = async () => {
    if (!newSeason.id.trim() || !newSeason.name.trim()) {
      setError('New season needs an id and a name.');
      return;
    }
    if (seasons.some((s) => s.id === newSeason.id.trim())) {
      setError(`Season "${newSeason.id.trim()}" already exists.`);
      return;
    }
    setError(null); setBusy(true); setStatus(null);
    try {
      await window.GRP_DB.upsertSeason({
        id: newSeason.id.trim(),
        name: newSeason.name.trim(),
        startDate: newSeason.startDate || '',
        endDate: newSeason.endDate || '',
        totalGames: parseInt(newSeason.totalGames) || 0,
        finalGameIndex: parseInt(newSeason.finalGameIndex) || 0,
        status: newSeason.status,
      });
      setStatus({ kind: 'ok', msg: `Created ${newSeason.name.trim()}` });
      setCreating(false);
      setNewSeason({ id: '', name: '', startDate: '', endDate: '', totalGames: 7, finalGameIndex: 7, status: 'active' });
      if (onChanged) onChanged();
    } catch (e) {
      setError(e.message || 'Create failed');
    } finally {
      setBusy(false);
    }
  };

  const statusPillColor = (s) => {
    if (s === 'active') return 'bg-emerald-500/25 border-emerald-400/60 text-emerald-100';
    if (s === 'upcoming') return 'bg-blue-500/20 border-blue-400/50 text-blue-100';
    return 'bg-yellow-900/40 border-yellow-500/30 text-yellow-100/70'; // complete or unknown
  };

  return (
    <div onClick={onClose} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="gold-border rounded-3xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-2xl w-full max-h-[92vh] overflow-y-auto">
        <div className="flex justify-between items-start mb-4 gap-3">
          <div>
            <div className="font-display text-3xl gold-text">SEASONS</div>
            <div className="text-yellow-100/60 font-mono text-xs mt-1">
              Create · edit · rename · archive
            </div>
          </div>
          <button onClick={onClose} className="text-yellow-100/60 hover:text-yellow-100"><X size={20} /></button>
        </div>

        {error && (
          <div className="mb-3 p-3 rounded-lg bg-red-950/40 border border-red-500/40 text-red-200 font-mono text-xs">{error}</div>
        )}
        {status && (
          <div className={`mb-3 p-3 rounded-lg border font-mono text-xs ${
            status.kind === 'ok'
              ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-200'
              : 'bg-red-950/40 border-red-500/40 text-red-200'
          }`}>{status.msg}</div>
        )}

        {/* New season */}
        <div className="mb-4">
          {!creating ? (
            <button
              onClick={() => setCreating(true)}
              className="w-full px-3 py-2 rounded-lg bg-emerald-900/30 border border-emerald-400/40 text-emerald-100 font-mono text-xs hover:bg-emerald-800/40"
            >
              + NEW SEASON
            </button>
          ) : (
            <div className="p-4 rounded-xl bg-black/30 border border-emerald-500/25 space-y-2">
              <div className="font-mono text-xs text-emerald-300/80 tracking-widest mb-2">NEW SEASON</div>
              <div className="grid grid-cols-2 gap-2">
                <label className="font-mono text-[10px] text-yellow-100/50">
                  ID
                  <input
                    type="text" value={newSeason.id} placeholder="2026-r2"
                    onChange={(e) => setNewSeason((s) => ({ ...s, id: e.target.value }))}
                    className="mt-1 w-full px-2 py-1.5 rounded bg-black/50 border border-yellow-500/20 text-yellow-50 text-xs font-mono"
                  />
                </label>
                <label className="font-mono text-[10px] text-yellow-100/50">
                  Name
                  <input
                    type="text" value={newSeason.name} placeholder="2026 — Round 2"
                    onChange={(e) => setNewSeason((s) => ({ ...s, name: e.target.value }))}
                    className="mt-1 w-full px-2 py-1.5 rounded bg-black/50 border border-yellow-500/20 text-yellow-50 text-xs font-mono"
                  />
                </label>
                <label className="font-mono text-[10px] text-yellow-100/50">
                  Start date
                  <input
                    type="date" value={newSeason.startDate}
                    onChange={(e) => setNewSeason((s) => ({ ...s, startDate: e.target.value }))}
                    className="mt-1 w-full px-2 py-1.5 rounded bg-black/50 border border-yellow-500/20 text-yellow-50 text-xs font-mono"
                  />
                </label>
                <label className="font-mono text-[10px] text-yellow-100/50">
                  End date
                  <input
                    type="date" value={newSeason.endDate}
                    onChange={(e) => setNewSeason((s) => ({ ...s, endDate: e.target.value }))}
                    className="mt-1 w-full px-2 py-1.5 rounded bg-black/50 border border-yellow-500/20 text-yellow-50 text-xs font-mono"
                  />
                </label>
                <label className="font-mono text-[10px] text-yellow-100/50">
                  Total games
                  <input
                    type="number" min="1" value={newSeason.totalGames}
                    onChange={(e) => setNewSeason((s) => ({ ...s, totalGames: e.target.value }))}
                    className="mt-1 w-full px-2 py-1.5 rounded bg-black/50 border border-yellow-500/20 text-yellow-50 text-xs font-mono"
                  />
                </label>
                <label className="font-mono text-[10px] text-yellow-100/50">
                  Final game #
                  <input
                    type="number" min="1" value={newSeason.finalGameIndex}
                    onChange={(e) => setNewSeason((s) => ({ ...s, finalGameIndex: e.target.value }))}
                    className="mt-1 w-full px-2 py-1.5 rounded bg-black/50 border border-yellow-500/20 text-yellow-50 text-xs font-mono"
                  />
                </label>
                <label className="font-mono text-[10px] text-yellow-100/50 col-span-2">
                  Status
                  <select
                    value={newSeason.status}
                    onChange={(e) => setNewSeason((s) => ({ ...s, status: e.target.value }))}
                    className="mt-1 w-full px-2 py-1.5 rounded bg-black/50 border border-yellow-500/20 text-yellow-50 text-xs font-mono"
                  >
                    <option value="active" style={{ background: '#062815' }}>active</option>
                    <option value="upcoming" style={{ background: '#062815' }}>upcoming</option>
                    <option value="complete" style={{ background: '#062815' }}>complete</option>
                  </select>
                </label>
              </div>
              <div className="flex gap-2 pt-1">
                <button
                  onClick={() => { setCreating(false); setError(null); }}
                  disabled={busy}
                  className="flex-1 px-3 py-1.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100/70 font-mono text-xs"
                >
                  CANCEL
                </button>
                <button
                  onClick={createSeason}
                  disabled={busy || !newSeason.id.trim() || !newSeason.name.trim()}
                  className="flex-1 px-3 py-1.5 rounded-full font-mono text-xs text-black disabled:opacity-30"
                  style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
                >
                  {busy ? 'SAVING…' : 'CREATE'}
                </button>
              </div>
            </div>
          )}
        </div>

        {/* Existing seasons */}
        <div className="space-y-2">
          {orderedSeasons.length === 0 && (
            <div className="text-yellow-100/40 font-mono text-sm text-center py-6 italic">
              No seasons yet — create one above.
            </div>
          )}
          {orderedSeasons.map((season) => {
            const isOpen = expandedId === season.id;
            const isDirty = dirty(season.id);
            return (
              <div key={season.id} className="rounded-xl bg-black/30 border border-yellow-500/15 overflow-hidden">
                <button
                  onClick={() => setExpandedId(isOpen ? null : season.id)}
                  className="w-full flex items-center justify-between gap-3 px-4 py-3 hover:bg-black/20"
                >
                  <div className="flex items-center gap-3 min-w-0">
                    <span className="text-yellow-100/60 font-mono text-xs">{isOpen ? '▼' : '▶'}</span>
                    <div className="text-left min-w-0">
                      <div className="text-emerald-100 truncate">{season.name || season.id}</div>
                      <div className="font-mono text-[10px] text-yellow-100/40 truncate">
                        {season.id} · {season.startDate || '?'} → {season.endDate || '?'} · {season.totalGames || '?'} games
                      </div>
                    </div>
                  </div>
                  <span className={`px-2 py-0.5 rounded-full text-[10px] font-mono border ${statusPillColor(season.status)}`}>
                    {season.status || 'unknown'}
                  </span>
                </button>
                {isOpen && (
                  <div className="px-4 pb-4 pt-2 space-y-2 border-t border-yellow-500/10">
                    <div className="grid grid-cols-2 gap-2">
                      <label className="font-mono text-[10px] text-yellow-100/50">
                        Name
                        <input
                          type="text" value={getField(season, 'name')}
                          onChange={(e) => setField(season, 'name', e.target.value)}
                          className="mt-1 w-full px-2 py-1.5 rounded bg-black/50 border border-yellow-500/20 text-yellow-50 text-xs font-mono"
                        />
                      </label>
                      <label className="font-mono text-[10px] text-yellow-100/50">
                        Status
                        <select
                          value={getField(season, 'status') || 'active'}
                          onChange={(e) => setField(season, 'status', e.target.value)}
                          className="mt-1 w-full px-2 py-1.5 rounded bg-black/50 border border-yellow-500/20 text-yellow-50 text-xs font-mono"
                        >
                          <option value="active" style={{ background: '#062815' }}>active</option>
                          <option value="upcoming" style={{ background: '#062815' }}>upcoming</option>
                          <option value="complete" style={{ background: '#062815' }}>complete</option>
                        </select>
                      </label>
                      <label className="font-mono text-[10px] text-yellow-100/50">
                        Start date
                        <input
                          type="date" value={getField(season, 'startDate') || ''}
                          onChange={(e) => setField(season, 'startDate', e.target.value)}
                          className="mt-1 w-full px-2 py-1.5 rounded bg-black/50 border border-yellow-500/20 text-yellow-50 text-xs font-mono"
                        />
                      </label>
                      <label className="font-mono text-[10px] text-yellow-100/50">
                        End date
                        <input
                          type="date" value={getField(season, 'endDate') || ''}
                          onChange={(e) => setField(season, 'endDate', e.target.value)}
                          className="mt-1 w-full px-2 py-1.5 rounded bg-black/50 border border-yellow-500/20 text-yellow-50 text-xs font-mono"
                        />
                      </label>
                      <label className="font-mono text-[10px] text-yellow-100/50">
                        Total games
                        <input
                          type="number" min="1" value={getField(season, 'totalGames') || ''}
                          onChange={(e) => setField(season, 'totalGames', e.target.value)}
                          className="mt-1 w-full px-2 py-1.5 rounded bg-black/50 border border-yellow-500/20 text-yellow-50 text-xs font-mono"
                        />
                      </label>
                      <label className="font-mono text-[10px] text-yellow-100/50">
                        Final game #
                        <input
                          type="number" min="1" value={getField(season, 'finalGameIndex') || ''}
                          onChange={(e) => setField(season, 'finalGameIndex', e.target.value)}
                          className="mt-1 w-full px-2 py-1.5 rounded bg-black/50 border border-yellow-500/20 text-yellow-50 text-xs font-mono"
                        />
                      </label>
                    </div>

                    {/* Rename (id migration) */}
                    <div className="pt-1">
                      {renameFor !== season.id ? (
                        <button
                          onClick={() => setRenameFor(season.id)}
                          className="text-[10px] font-mono text-yellow-100/50 underline hover:text-yellow-100/80"
                        >
                          rename id ({season.id})…
                        </button>
                      ) : (
                        <RenameSeasonForm
                          season={season}
                          busy={busy}
                          onCancel={() => setRenameFor(null)}
                          onConfirm={doRename}
                        />
                      )}
                    </div>

                    <div className="flex gap-2 pt-2">
                      <button
                        onClick={() => {
                          setEdits((prev) => { const n = { ...prev }; delete n[season.id]; return n; });
                        }}
                        disabled={!isDirty || busy}
                        className="flex-1 px-3 py-1.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100/70 font-mono text-xs disabled:opacity-30"
                      >
                        DISCARD
                      </button>
                      <button
                        onClick={() => saveSeason(season)}
                        disabled={!isDirty || busy}
                        className="flex-1 px-3 py-1.5 rounded-full font-mono text-xs text-black disabled:opacity-30"
                        style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
                      >
                        {busy ? 'SAVING…' : (isDirty ? 'SAVE CHANGES' : 'NO CHANGES')}
                      </button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>

        <button
          onClick={onClose}
          className="mt-4 w-full px-4 py-2.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100 font-mono text-sm"
        >
          CLOSE
        </button>
      </div>
    </div>
  );
}

      <div className="grid grid-cols-2 gap-2">

          New ID

            type="text" value={newId}
            onChange={(e) => setNewId(e.target.value)}
            className="mt-1 w-full px-2 py-1.5 rounded bg-black/50 border border-yellow-500/30 text-yellow-50 text-xs font-mono"
          />
        </label>
        <label className="font-mono text-[10px] text-yellow-100/50">
          New name
          <input
            type="text" value={newName}
            onChange={(e) => setNewName(e.target.value)}
            className="mt-1 w-full px-2 py-1.5 rounded bg-black/50 border border-yellow-500/30 text-yellow-50 text-xs font-mono"
          />
        </label>
      </div>
      {!confirming ? (
        <div className="flex gap-2">
          <button
            onClick={onCancel}
            className="flex-1 px-3 py-1.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100/70 font-mono text-xs"
          >
            CANCEL
          </button>
          <button
            onClick={() => setConfirming(true)}
            disabled={!idChanged || busy}
            className="flex-1 px-3 py-1.5 rounded-full font-mono text-xs border border-red-400/60 bg-red-900/40 text-red-100 disabled:opacity-30"
          >

      ) : (
        <div className="p-2 rounded-lg bg-red-950/40 border border-red-500/40 space-y-2">

          </div>
          <div className="flex gap-2">
            <button
              onClick={() => setConfirming(false)}

            >
              BACK
            </button>
            <button
              onClick={() => onConfirm(season, newId.trim(), newName.trim())}
              disabled={busy}
              className="flex-1 px-3 py-1.5 rounded-full font-mono text-xs text-red-100 border border-red-400/70 bg-red-800/60 disabled:opacity-30"
            >
              {busy ? 'MIGRATING…' : 'CONFIRM'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ============ IMPORT MODAL (Admin only) ============
function ImportModal({ onClose, onDone }) {
  const [busy, setBusy] = useState(false);
  const [progress, setProgress] = useState('');
  const [error, setError] = useState(null);

  const runImport = async () => {
    setBusy(true);
    setError(null);
    try {
      setProgress('Loading import data...');
      const res = await fetch('import-data.json');
      if (!res.ok) throw new Error('Could not load import-data.json');
      const data = await res.json();

      setProgress(`Importing ${data.players.length} players, ${data.seasons.length} seasons, ${data.games.length} games...`);
      await window.GRP_DB.bulkImport(data);

      setProgress('Done!');
      setTimeout(onDone, 800);
    } catch (e) {
      setError(e.message);
      setBusy(false);
    }
  };

  return (
    <div onClick={busy ? null : onClose} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="gold-border rounded-2xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-md w-full">
        <div className="flex justify-between items-center mb-4">
          <div className="font-display text-2xl gold-text">IMPORT HISTORY</div>
          {!busy && <button onClick={onClose} className="text-yellow-100/60 hover:text-yellow-100"><X size={18} /></button>}
        </div>
        <div className="text-yellow-100/70 text-sm mb-4">
          This will load the 2025–2026 league history into Firestore: 32 players, 2 seasons (R1 + R2), and 17 games.
        </div>
        <div className="text-yellow-100/40 text-xs font-mono mb-4">
          Note: finish-order positions are best-effort inferred from points. Points themselves are exact.
        </div>
        {progress && <div className="text-emerald-300 font-mono text-sm mb-4">{progress}</div>}
        {error && <div className="text-red-400 font-mono text-sm mb-4">Error: {error}</div>}
        <div className="flex gap-2 mt-2">
          <button
            onClick={onClose}
            disabled={busy}
            className="flex-1 px-4 py-2.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100 font-mono text-sm disabled:opacity-30"
          >
            CANCEL
          </button>
          <button
            onClick={runImport}
            disabled={busy}
            className="flex-1 px-4 py-2.5 rounded-full font-display text-lg text-black disabled:opacity-30"
            style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
          >
            {busy ? 'Importing...' : 'Import now'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ============ RESUME GAME BANNER ============
// Floats over the home screen when an in-progress game snapshot is found.
// Snapshot can come from localStorage (per-browser) or Firestore (cross-device).
function ResumeGameBanner({ snap, onResume, onDiscard }) {
  const playersN = (snap.players || []).length;
  const eliminatedN = (snap.eliminatedPlayers || []).length;
  const remaining = Math.max(0, playersN - eliminatedN);
  const lvls = snap.levels || [];
  const lvl = lvls[snap.currentLevel ?? 0];
  const blindsStr = lvl ? (lvl.isBreak ? `BREAK` : `${lvl.sb}/${lvl.bb}`) : '—';
  const ago = (() => {
    if (!snap.savedAtClient) return '';
    const mins = Math.max(0, Math.round((Date.now() - snap.savedAtClient) / 60000));
    if (mins < 1) return 'just now';
    if (mins < 60) return `${mins} min ago`;
    const hrs = Math.floor(mins / 60);
    return `${hrs}h ${mins % 60}m ago`;
  })();
  const label = snap.gameType === 'highrollers' ? 'HIGH ROLLERS' : 'LEAGUE';

  return (
    <div className="fixed left-1/2 -translate-x-1/2 top-4 z-50 max-w-md w-[calc(100%-2rem)] px-4">
      <div className="gold-border rounded-2xl bg-gradient-to-br from-emerald-950 to-black p-4 shadow-2xl backdrop-blur">
        <div className="flex items-start gap-3">
          <div className="flex-1 min-w-0">
            <div className="font-mono text-[10px] text-emerald-300 tracking-widest mb-1">GAME IN PROGRESS</div>
            <div className="font-display text-xl gold-text leading-tight">{label} · {blindsStr}</div>
            <div className="font-mono text-xs text-yellow-100/60 mt-1">
              {remaining} of {playersN} players left{ago && <> · saved {ago}</>}
            </div>
          </div>
        </div>
        <div className="flex gap-2 mt-3">
          <button
            onClick={onDiscard}
            className="flex-1 px-3 py-2 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100/60 font-mono text-xs hover:bg-red-950/40 hover:border-red-500/30 hover:text-red-200"
          >
            DISCARD
          </button>
          <button
            onClick={onResume}
            className="flex-1 px-3 py-2 rounded-full font-display text-base text-black"
            style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
          >
            RESUME
          </button>
        </div>
      </div>
    </div>
  );
}

// Button used inside Admin Tools panels to flip test mode on/off.
// Visually red-tinted when on, neutral when off.
function TestModeToggle() {
  const [on, setOn] = useTestMode();
  return (
    <button
      onClick={() => setOn(!on)}
      className={`px-3 py-1.5 rounded font-mono text-xs border ${
        on
          ? 'border-red-400/60 bg-red-900/40 text-red-100 hover:bg-red-900/60'
          : 'border-emerald-500/40 text-emerald-100 hover:bg-emerald-500/15'
      }`}
      title={on ? 'Disable test mode — saves resume as normal.' : 'Enable test mode — nothing will be saved to the database.'}
    >
      🧪 TEST MODE: {on ? 'ON' : 'OFF'}
    </button>
  );
}

// Banner that sits across the top of every screen when test mode is on.
// Uses `sticky top-0` so it takes its own slot in document flow (content
// reflows beneath it instead of being occluded) but stays pinned to the
// viewport top as the page scrolls.
function TestModeBanner() {
  const [on, setOn] = useTestMode();
  if (!on) return null;
  return (
    <div
      className="sticky top-0 z-[100] px-3 py-2 flex items-center justify-between gap-3"
      style={{ background: 'linear-gradient(90deg, #7f1d1d, #b91c1c, #7f1d1d)', borderBottom: '1px solid rgba(252, 165, 165, 0.4)', boxShadow: '0 2px 8px rgba(0,0,0,0.4)' }}
    >
      <div className="text-red-100 font-mono text-[11px] sm:text-xs tracking-widest truncate">
        🧪 TEST MODE — nothing will be saved
      </div>
      <button
        onClick={() => setOn(false)}
        className="px-3 py-1 rounded-full bg-black/40 border border-red-300/40 text-red-50 font-mono text-[10px] sm:text-[11px] hover:bg-black/60 shrink-0"
      >
        TURN OFF
      </button>
    </div>
  );
}

function App() {
  // Route state: 'home' | 'league-context' | 'setup' | 'timer' | 'league-info' | 'highrollers-info'
  const [route, setRoute] = useState('home');
  const [gameType, setGameType] = useState(null);
  const [leagueContext, setLeagueContext] = useState(null);
  const [config, setConfig] = useState(null);
  const [customSounds, setCustomSounds] = useState({});
  const [showSignIn, setShowSignIn] = useState(false);
  const [liveResume, setLiveResume] = useState(null); // saved in-progress game snapshot
  const [resumeChecked, setResumeChecked] = useState(false);
  const { ready: fbReady, user: fbUser } = useFirebase();

  useEffect(() => {
    loadCustomSounds().then(setCustomSounds);
  }, []);

  // On boot, look for an in-progress game saved by a previous session.
  // Prefer Firestore (cross-device, requires sign-in); fall back to
  // localStorage (per-browser, works without auth — handles laptop crash).
  useEffect(() => {
    if (resumeChecked) return;
    let cancelled = false;
    const readLocal = () => {
      try {
        const raw = localStorage.getItem('grp-live-game');
        if (raw) return JSON.parse(raw);
      } catch (_) {}
      return null;
    };
    const finish = (snap) => {
      if (cancelled) return;
      setLiveResume(snap);
      setResumeChecked(true);
    };
    if (fbReady && fbUser && window.GRP_DB && window.GRP_DB.getLiveGame) {
      window.GRP_DB.getLiveGame()
        .then((snap) => finish(snap || readLocal()))
        .catch(() => finish(readLocal()));
    } else if (fbReady) {
      // Firebase ready but not signed in — fall back to localStorage.
      finish(readLocal());
    }
  }, [fbReady, fbUser, resumeChecked]);

  const dismissResume = async () => {
    try { localStorage.removeItem('grp-live-game'); } catch (_) {}
    if (window.GRP_DB && window.GRP_DB.clearLiveGame) {
      try { await window.GRP_DB.clearLiveGame(); } catch (_) {}
    }
    setLiveResume(null);
  };

  const acceptResume = () => {
    if (!liveResume) return;
    // Reconstruct the config the way SetupWizard would have produced it,
    // plus a _resume bag that PokerTimerMain uses to hydrate live state.
    const oc = liveResume.origConfig || {};
    const lvls = liveResume.levels || [];
    const players = liveResume.players || [];
    setGameType(liveResume.gameType || 'league');
    setLeagueContext(liveResume.leagueContext || null);
    setConfig({
      buyIn: oc.buyIn,
      stackSize: oc.stackSize,
      playerStartingStacks: oc.playerStartingStacks || null,
      format: oc.format || 'rebuy',
      gameType: liveResume.gameType || 'league',
      leagueContext: liveResume.leagueContext || null,
      levels: lvls,
      players,
      _resume: {
        levels: lvls,
        players,
        currentLevel: liveResume.currentLevel ?? 0,
        timeLeft: liveResume.timeLeft ?? (lvls[0]?.duration || 1) * 60,
        eliminatedPlayers: liveResume.eliminatedPlayers || [],
        rebuyCounts: liveResume.rebuyCounts || {},
        knockedOutBy: liveResume.knockedOutBy || {},
        knockouts: liveResume.knockouts || [],
        buyInsPaidByName: liveResume.buyInsPaidByName || {},
        subsPaidByName: liveResume.subsPaidByName || {},
        gameStartedAt: liveResume.gameStartedAt || null,
      },
    });
    setLiveResume(null);
    setRoute('timer');
  };

  const handlePick = (type, action) => {
    setGameType(type);
    if (action === 'setup') {
      // League games go through context confirmation first
      setRoute(type === 'league' ? 'league-context' : 'setup');
    } else if (action === 'info') {
      setRoute(type === 'highrollers' ? 'highrollers-info' : 'league-info');
    }
  };

  const goHome = () => {
    setRoute('home');
    setGameType(null);
    setConfig(null);
    setLeagueContext(null);
  };

  // Single render tree so TestModeBanner sits above every route. Each
  // route assigns to `content` rather than returning directly.
  let content;
  if (route === 'home') {
    content = (
      <>
        <GameTypePicker onPick={handlePick} />
        {liveResume && <ResumeGameBanner snap={liveResume} onResume={acceptResume} onDiscard={dismissResume} />}
        <div className="fixed bottom-4 right-4 z-40">
          {fbUser ? (
            <button
              onClick={() => window.GRP_FIREBASE?.signOut(window.GRP_FIREBASE.auth)}
              className="px-3 py-1.5 rounded-full bg-black/40 border border-emerald-500/30 text-emerald-300 font-mono text-xs hover:bg-black/60"
              title={`Signed in as ${fbUser.email}`}
            >
              Signed in
            </button>
          ) : fbReady ? (
            <button
              onClick={() => setShowSignIn(true)}
              className="px-3 py-1.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100/60 font-mono text-xs hover:bg-black/60"
            >
              Sign in
            </button>
          ) : null}
        </div>
        {showSignIn && <SignInModal onClose={() => setShowSignIn(false)} />}
      </>
    );
  } else if (route === 'league-info') {
    content = <LeagueDashboard onBack={goHome} fbUser={fbUser} />;
  } else if (route === 'highrollers-info') {
    content = <HighRollersHistory onBack={goHome} fbUser={fbUser} />;
  } else if (route === 'league-context') {
    content = (
      <LeagueContextScreen
        onConfirm={(ctx) => {
          setLeagueContext(ctx);
          setRoute('setup');
        }}
        onBack={goHome}
        fbUser={fbUser}
      />
    );
  } else {
    content = config
      ? <PokerTimerMain
          config={config}
          customSounds={customSounds}
          onReset={goHome}
          onViewLeague={() => { setConfig(null); setRoute('league-info'); }}
          gameType={gameType}
          fbUser={fbUser}
        />
      : <SetupWizard
          customSounds={customSounds}
          gameType={gameType}
          leagueContext={leagueContext}
          onStart={setConfig}
          onBack={goHome}
          fbUser={fbUser}
        />;
  }

  return (
    <>
      <TestModeBanner />
      {content}
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
