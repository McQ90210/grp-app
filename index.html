// Generate a blind structure from buy-in, stack, players, and target duration.
function generateBlindStructure(buyIn, stackSize, numPlayers, durationMinutes, includeAntes) {
  const targetFinalBB = Math.max(stackSize / 15, stackSize / 10);

  let levelLength;
  if (durationMinutes <= 90) levelLength = 15;
  else if (durationMinutes <= 240) levelLength = 20;
  else levelLength = 25;

  const breakEveryNLevels = Math.max(3, Math.round(90 / levelLength));
  const breakLength = 10;

  let nPlayLevels = Math.floor(durationMinutes / levelLength);
  const estimatedBreaks = Math.floor(nPlayLevels / breakEveryNLevels);
  nPlayLevels = Math.max(4, Math.floor((durationMinutes - estimatedBreaks * breakLength) / levelLength));

  // Natural poker BB schedule — strictly increasing, no awkward jumps,
  // and once we pass 1000, no trailing 50s (1000/1500/2000/3000/5000/8000...).
  const BB_SCHEDULE = [
    100, 200, 300, 400, 500, 600, 800, 1000,
    1500, 2000, 3000, 4000, 5000, 6000, 8000,
    10000, 15000, 20000, 30000, 40000, 50000,
    60000, 80000, 100000, 150000, 200000,
  ];

  // Pick a start index and end index into the schedule, then sample evenly.
  const startBB = Math.max(100, BB_SCHEDULE.find((v) => v >= stackSize / 100) || 100);
  const endBB = BB_SCHEDULE.find((v) => v >= targetFinalBB) || BB_SCHEDULE[BB_SCHEDULE.length - 1];

  const startIdx = BB_SCHEDULE.indexOf(startBB);
  const endIdx = Math.max(startIdx + 1, BB_SCHEDULE.indexOf(endBB));

  const levels = [];
  let playLevelCount = 0;
  let lastBB = 0;
  for (let i = 0; i < nPlayLevels; i++) {
    // Linear interpolation through the schedule, ensuring strict increase.
    const t = nPlayLevels === 1 ? 0 : i / (nPlayLevels - 1);
    let idx = Math.round(startIdx + t * (endIdx - startIdx));
    let bb = BB_SCHEDULE[Math.min(idx, BB_SCHEDULE.length - 1)];
    if (bb <= lastBB) {
      // Find the next schedule entry above lastBB
      bb = BB_SCHEDULE.find((v) => v > lastBB) || lastBB + 1000;
    }
    lastBB = bb;
    const sb = bb / 2;
    const ante = includeAntes && i >= Math.floor(nPlayLevels / 3) ? bb / 4 : 0;
    levels.push({ sb, bb, ante, duration: levelLength, isBreak: false });
    playLevelCount++;
    if (playLevelCount % breakEveryNLevels === 0 && i < nPlayLevels - 1) {
      levels.push({ sb: 0, bb: 0, ante: 0, duration: breakLength, isBreak: true });
    }
  }
  return levels;
}

// Step to the next sensible blind value above the given one (used for manual "add level")
function nextBlindStep(current) {
  const SCHEDULE = [100, 200, 300, 400, 500, 600, 800, 1000, 1500, 2000, 3000, 4000, 5000, 6000, 8000, 10000, 15000, 20000, 30000, 40000, 50000, 60000, 80000, 100000];
  const next = SCHEDULE.find((v) => v > current);
  return next || current * 2;
}

// (Retained for any legacy callers — not used by the generator any more)
function roundBlind(value) {
  if (value < 100) return Math.max(100, Math.round(value / 50) * 50);
  if (value < 1000) return Math.round(value / 100) * 100;
  if (value < 5000) return Math.round(value / 500) * 500;
  if (value < 10000) return Math.round(value / 1000) * 1000;
  return Math.round(value / 1000) * 1000;
}

const formatTime = (seconds) => {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
};

// Synthesised animal sounds using Web Audio API. No external files.
// Each sound is a function that takes an AudioContext and plays.

let sharedAudioCtx = null;
function getAudioCtx() {
  if (sharedAudioCtx) return sharedAudioCtx;
  try {
    sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  } catch (e) { return null; }
  return sharedAudioCtx;
}

// --- Audio synthesis helpers ---

// Filtered tone with proper ADSR. Used as a basic voiced-formant building block.
function tone(ctx, { type = 'sine', freq = 440, freqEnd = null, freqCurve = null,
                     start = 0, duration = 0.2, gain = 0.3,
                     attack = 0.01, decay = 0.05, sustain = 0.7, release = 0.05,
                     filterType = null, filterFreq = 2000, filterQ = 1, dest = null }) {
  const t0 = ctx.currentTime + start;
  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (Array.isArray(freqCurve)) {
    // freqCurve: [[time, freq], ...] relative to start
    freqCurve.forEach(([dt, f]) => osc.frequency.linearRampToValueAtTime(f, t0 + dt));
  } else if (freqEnd !== null) {
    osc.frequency.linearRampToValueAtTime(freqEnd, t0 + duration);
  }
  // ADSR
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + attack);
  g.gain.linearRampToValueAtTime(gain * sustain, t0 + attack + decay);
  g.gain.setValueAtTime(gain * sustain, t0 + duration - release);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);

  let last = g;
  if (filterType) {
    const filter = ctx.createBiquadFilter();
    filter.type = filterType;
    filter.frequency.value = filterFreq;
    filter.Q.value = filterQ;
    g.connect(filter);
    last = filter;
  }
  last.connect(dest || ctx.destination);
  osc.connect(g);
  osc.start(t0);
  osc.stop(t0 + duration + 0.1);
  return { osc, gain: g };
}

// Filtered noise burst — for breath, consonants, animal texture
function noise(ctx, { start = 0, duration = 0.1, gain = 0.15,
                      filterType = 'lowpass', filterFreq = 2000, filterQ = 1,
                      attack = 0.005, release = 0.02, dest = null }) {
  const t0 = ctx.currentTime + start;
  const buf = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * duration)), ctx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const filter = ctx.createBiquadFilter();
  filter.type = filterType;
  filter.frequency.value = filterFreq;
  filter.Q.value = filterQ;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + attack);
  g.gain.setValueAtTime(gain, t0 + duration - release);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  src.connect(filter);
  filter.connect(g);
  g.connect(dest || ctx.destination);
  src.start(t0);
  src.stop(t0 + duration);
  return { source: src, gain: g, filter };
}

// FM synthesis — modulator changes the carrier frequency, creating rich timbres
function fmTone(ctx, { carrierFreq = 200, modFreq = 300, modDepth = 100, modDepthCurve = null,
                       freqCurve = null, start = 0, duration = 0.3, gain = 0.3,
                       attack = 0.01, release = 0.05, dest = null }) {
  const t0 = ctx.currentTime + start;
  const carrier = ctx.createOscillator();
  const modulator = ctx.createOscillator();
  const modGain = ctx.createGain();
  const out = ctx.createGain();
  carrier.frequency.setValueAtTime(carrierFreq, t0);
  if (Array.isArray(freqCurve)) {
    freqCurve.forEach(([dt, f]) => carrier.frequency.linearRampToValueAtTime(f, t0 + dt));
  }
  modulator.frequency.setValueAtTime(modFreq, t0);
  modGain.gain.setValueAtTime(modDepth, t0);
  if (Array.isArray(modDepthCurve)) {
    modDepthCurve.forEach(([dt, d]) => modGain.gain.linearRampToValueAtTime(d, t0 + dt));
  }
  modulator.connect(modGain);
  modGain.connect(carrier.frequency);
  out.gain.setValueAtTime(0, t0);
  out.gain.linearRampToValueAtTime(gain, t0 + attack);
  out.gain.setValueAtTime(gain, t0 + duration - release);
  out.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  carrier.connect(out);
  out.connect(dest || ctx.destination);
  carrier.start(t0);
  modulator.start(t0);
  carrier.stop(t0 + duration + 0.1);
  modulator.stop(t0 + duration + 0.1);
  return { carrier, modulator, gain: out };
}

// Formant — vocal-tract resonance, used to give voiced sounds character.
// Creates a bandpass-filtered noise+tone hybrid.
function formant(ctx, { fundamental = 200, formantFreqs = [800, 1200], start = 0,
                        duration = 0.3, gain = 0.2, attack = 0.02, release = 0.05,
                        pitchCurve = null }) {
  const t0 = ctx.currentTime + start;
  // Build harmonic-rich source (sawtooth)
  const src = ctx.createOscillator();
  src.type = 'sawtooth';
  src.frequency.setValueAtTime(fundamental, t0);
  if (Array.isArray(pitchCurve)) {
    pitchCurve.forEach(([dt, f]) => src.frequency.linearRampToValueAtTime(f, t0 + dt));
  }
  const srcGain = ctx.createGain();
  srcGain.gain.setValueAtTime(0, t0);
  srcGain.gain.linearRampToValueAtTime(gain, t0 + attack);
  srcGain.gain.setValueAtTime(gain, t0 + duration - release);
  srcGain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
  src.connect(srcGain);
  // Run through multiple bandpass formants in parallel
  formantFreqs.forEach((ff) => {
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = ff;
    filter.Q.value = 8;
    srcGain.connect(filter);
    filter.connect(ctx.destination);
  });
  src.start(t0);
  src.stop(t0 + duration + 0.1);
  return { src, gain: srcGain };
}

// =========================================================================

// Buffer cache for loaded MP3s
const audioBufferCache = new Map();
const audioFailedCache = new Set(); // paths we've already failed to load

async function loadAudioBuffer(path) {
  // Try the given path first, then swap mp3<->wav as fallback so users can drop in either format
  const tryPaths = [path];
  if (path.endsWith('.mp3')) tryPaths.push(path.replace(/\.mp3$/, '.wav'));
  else if (path.endsWith('.wav')) tryPaths.push(path.replace(/\.wav$/, '.mp3'));

  for (const p of tryPaths) {
    if (audioBufferCache.has(p)) return audioBufferCache.get(p);
    if (audioFailedCache.has(p)) continue;
    const ctx = getAudioCtx();
    if (!ctx) return null;
    try {
      const res = await fetch(p);
      if (!res.ok) throw new Error('not ok');
      const arr = await res.arrayBuffer();
      const buffer = await ctx.decodeAudioData(arr);
      audioBufferCache.set(p, buffer);
      return buffer;
    } catch (e) {
      audioFailedCache.add(p);
    }
  }
  return null;
}

// Play a sound. Tries to use the bundled MP3 file first; falls back to synthesis.
// Play a sound. Resolves when the sound has finished playing (so callers can
// chain follow-up actions like winner announcements without overlap).
// Synthesised fallbacks resolve after a 3s heuristic since they don't expose
// a precise duration.
async function playSound(soundKey, customSounds = {}) {
  if (!soundKey || soundKey === 'none') return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  if (ctx.state === 'suspended') {
    try { await ctx.resume(); } catch (e) {}
  }

  const playBuffer = (buffer) => new Promise((resolve) => {
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const g = ctx.createGain();
    g.gain.value = 0.9;
    src.connect(g);
    g.connect(ctx.destination);
    src.onended = () => resolve();
    src.start();
  });

  // Look in custom sounds (from sounds.json) first
  const custom = customSounds[soundKey];
  if (custom && custom.file) {
    const buffer = await loadAudioBuffer(custom.file);
    if (buffer) return playBuffer(buffer);
    return; // Custom sound failed — don't fall through to synth
  }

  // Built-in library
  const sound = SOUND_LIBRARY[soundKey];
  if (!sound) return;
  if (sound.file) {
    const buffer = await loadAudioBuffer(sound.file);
    if (buffer) return playBuffer(buffer);
  }
  sound.play(ctx);
  // Synthesised fallback: no precise duration, use a 3s heuristic.
  await new Promise((r) => setTimeout(r, 3000));
}

// Play a pre-recorded voice clip from sounds/voice/{key}.mp3.
// Returns a Promise that resolves when playback ends, or rejects if the file
// doesn't exist / fails to load — callers fall back to Web Speech in that case.
//
// We reuse a single <audio> element across clips. iOS Safari only allows
// fresh `new Audio()` instances to play if created during a user gesture,
// so creating new ones for each clip (e.g. for the blinds clip ~4s after
// the welcome) was sporadically failing with NotAllowedError and causing
// the Web Speech fallback to fire in a different system voice. Reusing a
// single element preserves the audio unlock across the whole session.
let _voiceAudio = null;
let _voiceResolve = null;
let _voiceReject = null;
function playVoiceClip(key) {
  return new Promise((resolve, reject) => {
    if (!_voiceAudio) {
      _voiceAudio = new Audio();
      _voiceAudio.volume = 1;
      _voiceAudio.onended = () => {
        const r = _voiceResolve; _voiceResolve = _voiceReject = null;
        if (r) r();
      };
      _voiceAudio.onerror = () => {
        const r = _voiceReject; _voiceResolve = _voiceReject = null;
        if (r) r(new Error('clip error'));
      };
    }
    // Abandon any in-flight clip's promise — caller of the new one wins.
    _voiceResolve = _voiceReject = null;
    try { _voiceAudio.pause(); } catch (e) {}
    _voiceResolve = resolve;
    _voiceReject = reject;
    _voiceAudio.src = `sounds/voice/${key}.mp3`;
    try { _voiceAudio.currentTime = 0; } catch (e) {}
    _voiceAudio.play().catch((e) => {
      const r = _voiceReject; _voiceResolve = _voiceReject = null;
      if (r) r(e);
    });
  });
}

// Load the optional sounds.json manifest, which lets users add their own
// sounds without code changes. Format:
// {
//   "beans": { "label": "Beans", "file": "sounds/beans.mp3" },
//   "horse-laugh": { "label": "Horse laugh", "file": "sounds/horse-laugh.mp3" }
// }
async function loadCustomSounds() {
  try {
    const res = await fetch('sounds/sounds.json');
    if (!res.ok) return {};
    const data = await res.json();
    // Validate shape
    const out = {};
    for (const [key, val] of Object.entries(data)) {
      if (val && typeof val.file === 'string') {
        out[key] = { label: val.label || key, file: val.file };
      }
    }
    return out;
  } catch (e) {
    return {};
  }
}

// ============ PAYOUT LOGIC ============
// Standard small-field payout structures by number of payable places.
// PAYOUT_STRUCTURES drives the dropdown only. The actual amounts come from
// computePayouts(pot, buyIn, paidCount). The `splits` field is legacy but kept
// for back-compat with code that maps over it for rendering rows.
const PAYOUT_STRUCTURES = {
  '1': { label: 'Winner takes all', splits: [100] },
  '2': { label: 'Top 2 (66/34)', splits: [66, 34] },
  '3': { label: 'Top 3 (56/31/13)', splits: [56, 31, 13] },
  '4': { label: 'Top 4 (54/30/16 + buy-in)', splits: [54, 30, 16, 0] },
  '5': { label: 'Top 5 (50/28/15/7 + buy-in)', splits: [50, 28, 15, 7, 0] },
};

function defaultPayoutKey(numPlayers) {
  if (numPlayers <= 9) return '3';
  if (numPlayers <= 13) return '4';
  return '5';
}

// ============ PAYOUT CALCULATION ============
// Rule (locked May 2026):
//
//   1 paid:  winner takes all
//   2 paid:  1st = 66% of pot,  2nd = 34% of pot
//   3 paid:  1st = 56%, 2nd = 31%, 3rd = 13% of pot
//   4 paid:  1st = 54% rem, 2nd = 30% rem, 3rd = 16% rem; 4th = buy-in
//   5 paid:  1st = 50% rem, 2nd = 28% rem, 3rd = 15% rem, 4th = 7% rem; 5th = buy-in
//
// Where "rem" = pot − buy-in.
//
// For 1-3 paid: no buy-in floor (3rd is a real cash spot, deserves a real cut).
// For 4-5 paid: last place is the bubble — they get only their buy-in back, and
// everyone above splits the remaining pot.
//
// After rounding each amount to nearest £10, the residual is absorbed onto 1st
// place so the total equals the (rounded) pot.

// For 1-3 paid: percentages of FULL pot (last place still gets a meaningful share)
const FULL_POT_PERCENTAGES = {
  1: [1.00],
  2: [0.66, 0.34],
  3: [0.56, 0.31, 0.13],
};

// For 4-5 paid: percentages of REMAINING pot (after subtracting last place's buy-in)
const REMAINING_PERCENTAGES = {
  4: [0.54, 0.30, 0.16],          // 4th gets buy-in
  5: [0.50, 0.28, 0.15, 0.07],    // 5th gets buy-in
};

function computePayouts(pot, buyIn, paidCount) {
  if (!pot || pot <= 0 || !paidCount) return Array(paidCount || 0).fill(0);

  // Small-pot safety: if pot won't cover the structure, just split equally
  if (pot <= buyIn) {
    return Array(paidCount).fill(Math.round(pot / paidCount / 10) * 10);
  }

  const targetTotal = Math.round(pot / 10) * 10;
  let raw;

  if (paidCount <= 3 && FULL_POT_PERCENTAGES[paidCount]) {
    // Each position gets a percentage of the full pot, no buy-in floor.
    raw = FULL_POT_PERCENTAGES[paidCount].map((p) => pot * p);
  } else if (REMAINING_PERCENTAGES[paidCount]) {
    // Top positions split remaining (pot − buy-in); last place gets buy-in.
    const remaining = pot - buyIn;
    raw = REMAINING_PERCENTAGES[paidCount].map((p) => remaining * p).concat([buyIn]);
  } else {
    return Array(paidCount).fill(0);
  }

  const rounded = raw.map((v) => Math.round(v / 10) * 10);
  const diff = targetTotal - rounded.reduce((a, b) => a + b, 0);
  rounded[0] += diff;
  return rounded.map((v) => Math.max(0, v));
}

// Back-compat wrapper: old code passes (splits[]) but the splits no longer drive
// the calculation — we now pick the percentage table by paidCount alone.
function roundPayoutsToTens(splits, prizePool, buyIn = 30) {
  return computePayouts(prizePool, buyIn, splits.length);
}

// ============ BOUNTY + SCORING HELPERS ============

// Per the locked league rules:
// - Bounty is in the player's birth month, EXCEPT:
// - June birthdays are bountied in May (June = R1 final)
// - December birthdays are bountied in November (December = R2 final)
function getBountiedMonthFor(birthMonth) {
  if (!birthMonth) return null;
  if (birthMonth === 6) return 5;
  if (birthMonth === 12) return 11;
  return birthMonth;
}

// Given a roster and a game date (YYYY-MM-DD), return the player IDs who should
// be bountied for a game played that month.
function computeBountyHolders(playersRoster, gameDate) {
  if (!gameDate) return [];
  const month = parseInt(gameDate.slice(5, 7), 10);
  if (!month) return [];
  return playersRoster
    .filter((p) => p.birthday && getBountiedMonthFor(p.birthday.month) === month)
    .map((p) => p.id);
}

// Slugify a display name the same way the database does, so we can map between
// in-game display names and Firestore player IDs.
function slugifyName(name) {
  return (name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

// Compute the per-player points for a league game given:
//   attendees: [{ name, ... }, ...] of players who played
//   finishOrder: [name, name, ...] in finishing order, 1st first
//   bountiedNames: Set of names who were bountied at start of game
//   knockedOutBy: { eliminatedName: knockerOuterName }
//   isFinal: boolean (finals award no league points)
// Returns { [name]: pointsTotal }
function computePointsAwarded({ attendees, finishOrder, bountiedNames, knockedOutBy, isFinal }) {
  if (isFinal) return {}; // Finals don't award league points
  const points = {};
  const POSITION_BONUSES = [8000, 5000, 3000, 1000, 500];
  // Base 2000 turn-up for everyone who played
  attendees.forEach((p) => { points[p.name] = 2000; });
  // Add position bonuses for top 5
  finishOrder.slice(0, 5).forEach((name, i) => {
    if (points[name] !== undefined) points[name] += POSITION_BONUSES[i];
  });
  // Add bounty +2000 for each bountied player who was knocked out
  if (knockedOutBy && bountiedNames) {
    Object.entries(knockedOutBy).forEach(([eliminated, knocker]) => {
      if (bountiedNames.has(eliminated) && knocker && points[knocker] !== undefined) {
        points[knocker] += 2000;
      }
    });
  }
  return points;
}

// ============ LEAGUE CONTEXT SCREEN ============
// Shown before the setup wizard for league games. Auto-detects active season
// and next game number, lets user confirm or override.
function LeagueContextScreen({ onConfirm, onBack }) {
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [seasons, setSeasons] = useState([]);
  const [games, setGames] = useState([]);
  const [players, setPlayers] = useState([]);
  const [seasonId, setSeasonId] = useState(null);
  const [gameNumber, setGameNumber] = useState(1);
  const [editing, setEditing] = useState(false); // false: confirm mode, true: override mode

  useEffect(() => {
    let cancelled = false;
    const doLoad = async () => {
      try {
        const [allSeasons, allPlayers] = await Promise.all([
          window.GRP_DB.getAllSeasons(),
          window.GRP_DB.getAllPlayers(),
        ]);
        if (cancelled) return;
        setSeasons(allSeasons);
        setPlayers(allPlayers);
        // Prefer the season whose date range contains today; fall back to the
        // 'active' flag, then to the most recent. Date-range wins so a stale
        // future season tagged active (e.g. 2026-r2 dated Jul-Dec) doesn't
        // get picked while we're still in the prior round.
        const today = new Date().toISOString().slice(0, 10);
        const byDate = allSeasons.find(s => s.startDate && s.endDate && s.startDate <= today && s.endDate >= today);
        const active = byDate || allSeasons.find(s => s.status === 'active') || allSeasons[0];
        if (active) {
          setSeasonId(active.id);
          const seasonGames = await window.GRP_DB.getGamesForSeason(active.id);
          if (cancelled) return;
          setGames(seasonGames);
          // Next un-played game number
          const played = new Set(seasonGames.map(g => g.gameNumber));
          let next = 1;
          while (played.has(next) && next <= active.totalGames) next++;
          setGameNumber(Math.min(next, active.totalGames));
        }
        setLoading(false);
      } catch (e) {
        if (!cancelled) {
          setError(e.message);
          setLoading(false);
        }
      }
    };
    if (window.GRP_DB) doLoad();
    else {
      const onReady = () => doLoad();
      window.addEventListener('firebase-ready', onReady);
      const t = setTimeout(() => {
        if (!cancelled && !window.GRP_DB) { setError('Firebase did not load.'); setLoading(false); }
      }, 8000);
      return () => {
        cancelled = true;
        window.removeEventListener('firebase-ready', onReady);
        clearTimeout(t);
      };
    }
    return () => { cancelled = true; };
  }, []);

  // Re-load games when season changes
  useEffect(() => {
    if (!seasonId || !window.GRP_DB) return;
    (async () => {
      try {
        const seasonGames = await window.GRP_DB.getGamesForSeason(seasonId);
        setGames(seasonGames);
      } catch (e) { setError(e.message); }
    })();
  }, [seasonId]);

  const season = seasons.find(s => s.id === seasonId);
  const isFinal = season && gameNumber === season.finalGameIndex;
  const playersById = {};
  players.forEach(p => { playersById[p.id] = p; });

  // For finals: compute round-totals per player, sorted descending
  const playerRoundTotals = (() => {
    if (!isFinal) return [];
    const totals = {};
    games.forEach(g => {
      Object.entries(g.pointsAwarded || {}).forEach(([pid, pts]) => {
        totals[pid] = (totals[pid] || 0) + (pts || 0);
      });
    });
    return Object.entries(totals)
      .filter(([_, t]) => t > 0)
      .sort((a, b) => b[1] - a[1])
      .map(([pid, total]) => ({ player: playersById[pid] || { displayName: pid, id: pid }, total }));
  })();

  const handleConfirm = () => {
    onConfirm({
      seasonId,
      gameNumber,
      isFinal,
      season,
      playerRoundTotals: isFinal ? playerRoundTotals : [],
    });
  };

  return (
    <div className="min-h-screen w-full flex items-center justify-center p-4" style={{
      background: 'radial-gradient(ellipse at top, #0a3d1f 0%, #062815 40%, #020a06 100%)',
      fontFamily: "'Inter', system-ui, sans-serif",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
        .font-display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .gold-text {
          background: linear-gradient(135deg, #14a37b 0%, #1ec890 50%, #0e8c69 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }
        .gold-border {
          border: 1px solid rgba(20, 163, 123, 0.4);
          box-shadow: 0 0 40px rgba(20, 163, 123, 0.15), inset 0 0 60px rgba(20, 163, 123, 0.05);
        }
      `}</style>

      <div className="w-full max-w-xl">
        <div className="text-center mb-8">
          <button onClick={onBack} className="font-mono text-xs text-yellow-100/40 hover:text-yellow-100/80 mb-2">
            ← change game type
          </button>
          <div className="font-display text-5xl gold-text mb-1">LEAGUE GAME</div>
          <div className="font-mono text-xs text-emerald-200/60 tracking-widest">CONFIRM CONTEXT</div>
        </div>

        {loading ? (
          <div className="text-center py-12 text-emerald-200/60 font-mono">Loading...</div>
        ) : error ? (
          <div className="text-center py-12 text-red-400 font-mono">{error}</div>
        ) : seasons.length === 0 ? (
          <div className="gold-border rounded-2xl p-6 bg-gradient-to-br from-emerald-950 to-black text-center">
            <div className="text-yellow-100/80 mb-2">No seasons set up yet.</div>
            <div className="text-yellow-100/40 text-xs font-mono">
              Sign in as admin and import historical data, or contact the league organiser.
            </div>
          </div>
        ) : (
          <>
            <div className="gold-border rounded-2xl p-6 bg-gradient-to-br from-emerald-950/80 to-black/80 backdrop-blur mb-6">
              {!editing ? (
                <>
                  <div className="text-center mb-4">
                    <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-1">SEASON</div>
                    <div className="font-display text-3xl gold-text">{season?.name}</div>
                  </div>
                  <div className="text-center mb-5">
                    <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-1">GAME</div>
                    <div className="font-display text-5xl text-emerald-200">
                      G{gameNumber}{isFinal && <span className="text-yellow-300 ml-2">— FINAL</span>}
                    </div>
                    <div className="text-yellow-100/40 text-xs font-mono mt-1">
                      of {season?.totalGames}
                    </div>
                  </div>
                  <div className="text-center">
                    <button
                      onClick={() => setEditing(true)}
                      className="text-emerald-300/80 hover:text-emerald-200 font-mono text-xs underline"
                    >
                      change
                    </button>
                  </div>
                </>
              ) : (
                <div className="space-y-4">
                  <div>
                    <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">SEASON</div>
                    <select
                      value={seasonId || ''}
                      onChange={(e) => setSeasonId(e.target.value)}
                      className="w-full px-3 py-2.5 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 focus:outline-none focus:border-yellow-500/50"
                    >
                      {seasons.map(s => (
                        <option key={s.id} value={s.id} style={{ background: '#0a3d1f' }}>
                          {s.name} {s.status === 'active' ? '(active)' : '(complete)'}
                        </option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">
                      GAME NUMBER (1 to {season?.totalGames})
                    </div>
                    <input
                      type="number"
                      min="1"
                      max={season?.totalGames}
                      value={gameNumber}
                      onChange={(e) => setGameNumber(parseInt(e.target.value) || 1)}
                      className="w-full px-3 py-2.5 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 focus:outline-none focus:border-yellow-500/50"
                    />
                    {isFinal && (
                      <div className="text-yellow-300/80 text-xs font-mono mt-2">
                        This is the FINAL game of {season?.name}.
                      </div>
                    )}
                  </div>
                  <button
                    onClick={() => setEditing(false)}
                    className="text-emerald-300/80 hover:text-emerald-200 font-mono text-xs underline"
                  >
                    done
                  </button>
                </div>
              )}
            </div>

            {/* Final game starting stacks preview */}
            {isFinal && playerRoundTotals.length > 0 && (
              <div className="gold-border rounded-2xl p-5 bg-gradient-to-br from-yellow-950/40 to-black/80 backdrop-blur mb-6">
                <div className="font-mono text-xs text-yellow-300/80 tracking-widest mb-3">
                  FINAL STARTING STACKS · POINTS + 10,000
                </div>
                <div className="space-y-1.5 max-h-72 overflow-y-auto pr-1">
                  {playerRoundTotals.map(({ player, total }, i) => (
                    <div key={player.id} className="flex justify-between items-baseline gap-3 py-1 border-b border-yellow-500/10 last:border-0">
                      <div className="flex gap-2 items-baseline">
                        <span className="text-yellow-100/40 text-xs font-mono w-6">{i + 1}.</span>
                        <span className="text-emerald-100">{player.displayName}</span>
                      </div>
                      <div className="text-right">
                        <span className="text-yellow-100/40 font-mono text-xs mr-2">{total.toLocaleString()} pts</span>
                        <span className="font-display text-xl text-yellow-300">
                          {(total + 10000).toLocaleString()}
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="text-yellow-100/40 text-xs font-mono mt-3">
                  Each player starts with their round points + 10,000 chips.
                  The 10,000 base is fixed for finals.
                </div>
              </div>
            )}

            <button
              onClick={handleConfirm}
              disabled={!seasonId}
              className="w-full px-6 py-4 rounded-full font-display text-2xl text-black disabled:opacity-30"
              style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
            >
              CONTINUE TO SETUP
            </button>
          </>
        )}
      </div>
    </div>
  );
}

// ============ SETUP WIZARD ============
function SetupWizard({ onStart, customSounds, gameType = 'league', leagueContext = null, onBack, fbUser }) {
  const isFinal = leagueContext?.isFinal === true;
  const [step, setStep] = useState(0);
  const [buyIn, setBuyIn] = useState('20');
  const [stackSize, setStackSize] = useState('10000');
  const [roster, setRoster] = useState([]); // currently displayed list
  const [allGrpPlayers, setAllGrpPlayers] = useState([]); // full GRP roster — picker source
  const [hrRegulars, setHrRegulars] = useState([]); // names on the HR regulars allowlist
  const [showPlayerPicker, setShowPlayerPicker] = useState(false);
  const [playingTonight, setPlayingTonight] = useState(new Set()); // names selected for this game
  const [newPlayer, setNewPlayer] = useState('');
  const [duration, setDuration] = useState('180');
  const [includeAntes, setIncludeAntes] = useState(false);
  const [rosterLoaded, setRosterLoaded] = useState(false);

  const readHrRegulars = () => {
    try {
      const saved = localStorage.getItem('grp-hr-regulars');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) {}
    return [];
  };

  // Load roster on mount: Firestore first (the source of truth), fall back to
  // localStorage if Firebase isn't ready. League mode shows the full Greene
  // Room roster; High Rollers mode shows only the HR regulars allowlist
  // (managed via the + picker and × delete button).
  useEffect(() => {
    let cancelled = false;
    const finalize = (allMembers) => {
      if (cancelled) return;
      setAllGrpPlayers(allMembers);
      if (gameType === 'highrollers') {
        const hrReg = readHrRegulars();
        setHrRegulars(hrReg);
        // Build the displayed roster: GRP players in the allowlist, plus any
        // non-GRP names that were added via "new player" in the picker.
        const grpInAllow = allMembers.filter(p => hrReg.includes(p.name));
        const nonGrp = hrReg
          .filter(n => !allMembers.find(p => p.name === n))
          .map(n => ({ name: n, sound: 'none' }));
        setRoster([...grpInAllow, ...nonGrp]);
      } else {
        setRoster(allMembers);
      }
      // All start unchecked — admin picks who's actually playing tonight
      setPlayingTonight(new Set());
      setRosterLoaded(true);
    };

    // Pull any locally-saved sound choices (set when picking sounds without
    // being signed in — these need to survive a Firestore reload).
    const readLocalSounds = () => {
      try {
        const saved = localStorage.getItem("poker-roster");
        if (!saved) return {};
        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed)) return {};
        const out = {};
        parsed.forEach((p) => {
          const name = typeof p === 'string' ? p : p.name;
          const sound = typeof p === 'string' ? null : p.sound;
          if (name && sound && sound !== 'none') out[name] = sound;
        });
        return out;
      } catch (e) { return {}; }
    };

    const loadFromFirestore = async () => {
      try {
        const firestorePlayers = await window.GRP_DB.getAllPlayers();
        if (firestorePlayers && firestorePlayers.length > 0) {
          const localSounds = readLocalSounds();
          const members = firestorePlayers
            .filter((p) => p.active !== false)
            .map((p) => ({
              name: p.displayName,
              // Local choice wins so picks made without sign-in survive a reload.
              sound: localSounds[p.displayName] || p.sound || 'none',
            }));
          finalize(members);
          return true;
        }
      } catch (e) { /* fall through to localStorage */ }
      return false;
    };

    const loadFromLocalStorage = async () => {
      try {
        const saved = ({ value: localStorage.getItem("poker-roster") });
        if (saved && saved.value) {
          const parsed = JSON.parse(saved.value);
          if (Array.isArray(parsed) && parsed.length > 0) {
            const migrated = parsed.map((p) =>
              typeof p === 'string' ? { name: p, sound: 'none' } : { name: p.name, sound: p.sound || 'none' }
            );
            finalize(migrated);
            return;
          }
        }
      } catch (e) { /* no saved roster */ }
      finalize([]);
    };

    (async () => {
      // If Firebase is already loaded, use it directly
      if (window.GRP_DB) {
        const ok = await loadFromFirestore();
        if (!ok) await loadFromLocalStorage();
        return;
      }
      // Otherwise wait briefly for firebase-ready, then fall back
      const onReady = async () => {
        window.removeEventListener('firebase-ready', onReady);
        const ok = await loadFromFirestore();
        if (!ok) await loadFromLocalStorage();
      };
      window.addEventListener('firebase-ready', onReady);
      // Timeout: if Firebase hasn't loaded in 3 seconds, use localStorage
      setTimeout(() => {
        if (!cancelled && !rosterLoaded) {
          window.removeEventListener('firebase-ready', onReady);
          loadFromLocalStorage();
        }
      }, 3000);
    })();

    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [gameType]);

  // Persist roster whenever it changes
  useEffect(() => {
    if (!rosterLoaded) return;
    (async () => {
      try {
        localStorage.setItem("poker-roster", JSON.stringify(roster));
      } catch (e) { /* fail silently */ }
    })();
  }, [roster, rosterLoaded]);

  // Persist HR regulars allowlist when in HR mode
  useEffect(() => {
    if (!rosterLoaded || gameType !== 'highrollers') return;
    try {
      localStorage.setItem('grp-hr-regulars', JSON.stringify(hrRegulars));
    } catch (e) { /* fail silently */ }
  }, [hrRegulars, rosterLoaded, gameType]);

  // Add one-or-more names from the picker modal to the roster (HR mode only).
  // GRP-roster names come with their saved sound; new names start at 'none'.
  const addFromPicker = (names) => {
    if (!names || names.length === 0) {
      setShowPlayerPicker(false);
      return;
    }
    const newReg = Array.from(new Set([...hrRegulars, ...names]));
    setHrRegulars(newReg);
    const toAdd = names
      .filter(n => !roster.find(p => p.name === n))
      .map(n => {
        const grp = allGrpPlayers.find(p => p.name === n);
        return grp ? { ...grp } : { name: n, sound: 'none' };
      });
    setRoster([...roster, ...toAdd]);
    setPlayingTonight((prev) => new Set([...prev, ...names]));
    setShowPlayerPicker(false);
  };

  const addPlayer = () => {
    const name = newPlayer.trim();
    if (!name) return;
    const existing = roster.find((p) => p.name === name);
    if (existing) {
      // Already in roster — just make sure they're selected
      setPlayingTonight((prev) => new Set([...prev, name]));
    } else {
      setRoster([...roster, { name, sound: 'none' }]);
      setPlayingTonight((prev) => new Set([...prev, name]));
    }
    setNewPlayer('');
  };

  const togglePlaying = (name) => {
    setPlayingTonight((prev) => {
      const next = new Set(prev);
      if (next.has(name)) next.delete(name);
      else next.add(name);
      return next;
    });
  };

  const updatePlayerSound = (name, soundKey) => {
    setRoster(roster.map((p) => (p.name === name ? { ...p, sound: soundKey } : p)));
    // Persist to Firestore so the choice sticks across sessions and devices.
    // Writes need auth; if not signed in, the localStorage copy still holds it
    // for this browser (and load logic now overlays local choices on top of
    // Firestore data so the picks survive).
    if (fbUser && window.GRP_DB) {
      window.GRP_DB.upsertPlayer({ displayName: name, sound: soundKey })
        .catch((e) => { console.error('[grp] failed to save sound to Firestore:', e); });
    }
  };

  // Remove from roster entirely. In HR mode this also drops the name from the
  // regulars allowlist so they won't reappear next session unless re-added.
  const removeFromRoster = (name) => {
    setRoster(roster.filter((p) => p.name !== name));
    setPlayingTonight((prev) => {
      const next = new Set(prev);
      next.delete(name);
      return next;
    });
    if (gameType === 'highrollers') {
      setHrRegulars((prev) => prev.filter((n) => n !== name));
    }
  };

  const selectAll = () => setPlayingTonight(new Set(roster.map((p) => p.name)));
  const selectNone = () => setPlayingTonight(new Set());

  const playersArray = roster.filter((p) => playingTonight.has(p.name));

  const canAdvance = () => {
    if (step === 0) return parseFloat(buyIn) > 0;
    if (step === 1) return parseInt(stackSize) > 0;
    if (step === 2) return playersArray.length >= 2;
    if (step === 3) return parseInt(duration) >= 30;
    return true;
  };

  const finish = () => {
    // For finals: base stack is fixed at 10,000 plus each player's round points so far
    const baseStack = isFinal ? 10000 : parseInt(stackSize);

    // Compute per-player starting stacks
    const playerStartingStacks = {};
    if (isFinal && leagueContext?.playerRoundTotals) {
      // Map round totals by displayName for quick lookup
      const totalsByName = {};
      leagueContext.playerRoundTotals.forEach(({ player, total }) => {
        totalsByName[player.displayName] = total;
      });
      playersArray.forEach(p => {
        const pts = totalsByName[p.name] || 0;
        playerStartingStacks[p.name] = pts + 10000;
      });
    } else {
      playersArray.forEach(p => { playerStartingStacks[p.name] = baseStack; });
    }

    // For blind structure: use avg starting stack (for finals it'll be higher than 10k)
    const avgStartingStack = Math.round(
      Object.values(playerStartingStacks).reduce((a, b) => a + b, 0) / playersArray.length
    );

    const levels = generateBlindStructure(
      parseFloat(buyIn),
      avgStartingStack,
      playersArray.length,
      parseInt(duration),
      includeAntes
    );
    onStart({
      gameType,
      buyIn: parseFloat(buyIn),
      stackSize: baseStack,
      playerStartingStacks,
      players: playersArray,
      duration: parseInt(duration),
      levels,
      leagueContext, // pass through so the main timer & save flow know which season/game
    });
  };

  const steps = ['BUY-IN', 'STACK', 'PLAYERS', 'DURATION', 'REVIEW'];

  return (
    <div className="min-h-screen w-full flex items-center justify-center p-4" style={{
      background: 'radial-gradient(ellipse at top, #0a3d1f 0%, #062815 40%, #020a06 100%)',
      fontFamily: "'Inter', system-ui, sans-serif",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
        .font-display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .gold-text {
          background: linear-gradient(135deg, #f4d03f 0%, #f7dc6f 50%, #d4ac0d 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }
        .gold-border {
          border: 1px solid rgba(244, 208, 63, 0.3);
          box-shadow: 0 0 40px rgba(244, 208, 63, 0.1), inset 0 0 60px rgba(244, 208, 63, 0.05);
        }
        .felt-texture {
          background-image:
            radial-gradient(circle at 25% 25%, rgba(255,255,255,0.03) 1px, transparent 1px),
            radial-gradient(circle at 75% 75%, rgba(255,255,255,0.02) 1px, transparent 1px);
          background-size: 24px 24px;
        }
        .input-large {
          font-family: 'Bebas Neue', sans-serif;
          letter-spacing: 0.02em;
          background: rgba(0,0,0,0.4);
          border: 1px solid rgba(244, 208, 63, 0.2);
          color: #fef3c7;
          text-align: center;
          width: 100%;
          padding: 1rem;
          border-radius: 1rem;
          transition: all 0.2s;
        }
        .input-large:focus {
          outline: none;
          border-color: rgba(244, 208, 63, 0.6);
          box-shadow: 0 0 30px rgba(244, 208, 63, 0.2);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(244, 208, 63, 0.3); border-radius: 3px; }
        @keyframes slideIn {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .step-content { animation: slideIn 0.3s ease-out; }
      `}</style>

      <div className="felt-texture w-full max-w-2xl">
        <div className="text-center mb-8">
          <div className="font-display text-5xl gold-text">
            {gameType === 'highrollers' ? 'HIGH ROLLERS' : 'LEAGUE GAME'}
          </div>
          <div className="font-mono text-xs text-emerald-200/60 tracking-widest mt-1">TOURNAMENT SETUP</div>
          {onBack && (
            <button
              onClick={onBack}
              className="mt-3 text-xs font-mono text-yellow-100/40 hover:text-yellow-100/80"
            >
              ← change game type
            </button>
          )}
        </div>

        <div className="flex justify-center gap-2 mb-8">
          {steps.map((label, i) => (
            <div key={i} className={`h-2 rounded-full transition-all ${i === step ? 'bg-yellow-400 w-8' : i < step ? 'bg-yellow-600 w-2' : 'bg-yellow-500/20 w-2'}`} />
          ))}
        </div>

        <div className="gold-border rounded-3xl bg-gradient-to-br from-emerald-950/80 to-black/80 backdrop-blur p-8 sm:p-12">
          <div key={step} className="step-content">
            {step === 0 && (
              <div>
                <div className="font-mono text-xs text-yellow-500/60 tracking-widest mb-2 text-center">STEP 1 OF 5</div>
                <div className="font-display text-3xl gold-text text-center mb-2">WHAT'S THE BUY-IN?</div>
                <div className="text-yellow-100/50 text-center mb-8 text-sm">How much each player puts in to play</div>
                <div className="relative max-w-xs mx-auto">
                  <div className="absolute left-6 top-1/2 -translate-y-1/2 font-display text-3xl text-yellow-500/40">£</div>
                  <input
                    type="number"
                    value={buyIn}
                    onChange={(e) => setBuyIn(e.target.value)}
                    autoFocus
                    className="input-large text-5xl pl-14"
                  />
                </div>
                <div className="flex gap-2 justify-center mt-4">
                  {['10', '20', '50', '100'].map((v) => (
                    <button key={v} onClick={() => setBuyIn(v)} className="px-4 py-1.5 rounded-full bg-black/30 border border-yellow-500/20 text-yellow-100/70 font-mono text-sm hover:border-yellow-500/50">£{v}</button>
                  ))}
                </div>
              </div>
            )}

            {step === 1 && (
              <div>
                <div className="font-mono text-xs text-yellow-500/60 tracking-widest mb-2 text-center">STEP 2 OF 5</div>
                <div className="font-display text-3xl gold-text text-center mb-2">STARTING STACK?</div>
                <div className="text-yellow-100/50 text-center mb-8 text-sm">
                  {isFinal
                    ? <>Base stack for FINAL <span className="text-yellow-300 font-bold">locked at 10,000</span><br/>+ each player's round points</>
                    : 'Chips each player starts with'}
                </div>
                <div className="max-w-xs mx-auto">
                  <input
                    type="number"
                    value={isFinal ? '10000' : stackSize}
                    onChange={(e) => !isFinal && setStackSize(e.target.value)}
                    disabled={isFinal}
                    autoFocus
                    className={`input-large text-5xl ${isFinal ? 'opacity-60' : ''}`}
                  />
                </div>
                {!isFinal && (
                  <div className="flex gap-2 justify-center mt-4 flex-wrap">
                    {['5000', '10000', '20000', '50000'].map((v) => (
                      <button key={v} onClick={() => setStackSize(v)} className="px-4 py-1.5 rounded-full bg-black/30 border border-yellow-500/20 text-yellow-100/70 font-mono text-sm hover:border-yellow-500/50">{parseInt(v).toLocaleString()}</button>
                    ))}
                  </div>
                )}
                {isFinal && (
                  <div className="text-center mt-4 text-yellow-300/60 font-mono text-xs">
                    Per-player starting stacks set on the previous screen.
                  </div>
                )}
              </div>
            )}

            {step === 2 && (
              <div>
                <div className="font-mono text-xs text-yellow-500/60 tracking-widest mb-2 text-center">STEP 3 OF 5</div>
                <div className="font-display text-3xl gold-text text-center mb-2">WHO'S PLAYING?</div>
                <div className="text-yellow-100/50 text-center mb-6 text-sm">
                  {roster.length === 0
                    ? 'Add your regulars below'
                    : `${playersArray.length} of ${roster.length} playing tonight`}
                </div>
                {gameType === 'highrollers' ? (
                  <div className="flex justify-center mb-4">
                    <button
                      onClick={() => setShowPlayerPicker(true)}
                      className="px-6 py-3 rounded-xl bg-yellow-500/20 border border-yellow-500/40 text-yellow-100 font-display text-lg hover:bg-yellow-500/30 flex items-center gap-2"
                    >
                      <Plus size={20} /> ADD PLAYER
                    </button>
                  </div>
                ) : (
                  <div className="flex gap-2 mb-4 max-w-md mx-auto">
                    <input
                      type="text"
                      value={newPlayer}
                      onChange={(e) => setNewPlayer(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && addPlayer()}
                      placeholder={roster.length === 0 ? "Add player..." : "Add new player..."}
                      autoFocus
                      className="flex-1 px-4 py-3 rounded-xl bg-black/40 border border-yellow-500/20 text-yellow-50 placeholder-yellow-100/30 focus:outline-none focus:border-yellow-500/50"
                    />
                    <button onClick={addPlayer} className="px-5 rounded-xl bg-yellow-500/20 border border-yellow-500/40 text-yellow-100 hover:bg-yellow-500/30">
                      <Plus size={20} />
                    </button>
                  </div>
                )}

                {roster.length > 0 && (
                  <>
                    <div className="flex justify-center gap-3 mb-3">
                      <button onClick={selectAll} className="px-3 py-1 rounded-full bg-black/30 border border-yellow-500/20 text-yellow-100/70 font-mono text-xs hover:border-yellow-500/50">
                        ALL IN
                      </button>
                      <button onClick={selectNone} className="px-3 py-1 rounded-full bg-black/30 border border-yellow-500/20 text-yellow-100/70 font-mono text-xs hover:border-yellow-500/50">
                        CLEAR
                      </button>
                    </div>
                    <div className="max-w-md mx-auto space-y-2 max-h-80 overflow-y-auto pr-1">
                      {roster.map((player) => {
                        const playing = playingTonight.has(player.name);

                    <div className="font-mono text-xs text-yellow-500/60 tracking-widest">BUY-IN</div>

                    <div className="font-mono text-xs text-yellow-500/60 tracking-widest">STACK</div>

        <div className="flex gap-3 mt-6">

            onClick={step === 4 ? finish : () => setStep(step + 1)}

            className="flex-1 px-6 py-3 rounded-full font-display text-xl text-black disabled:opacity-30 disabled:cursor-not-allowed flex items-center justify-center gap-2"

      {showPlayerPicker && (
        <PlayerPickerModal

  );
}

// ============ PLAYER PICKER MODAL (HR setup) ============
// Used in High Rollers setup to add players to the regulars list. Shows every
// GRP-roster player not already on the list (checkbox select-multiple) plus a
// text field for adding a new (non-GRP) name.
function PlayerPickerModal({ allPlayers, alreadyAdded, onAdd, onClose }) {
  const [selected, setSelected] = useState(new Set());
  const [newName, setNewName] = useState('');

  const available = allPlayers.filter((p) => !alreadyAdded.includes(p.name));

  const toggle = (name) => {
    setSelected((prev) => {
      const next = new Set(prev);
      if (next.has(name)) next.delete(name);
      else next.add(name);
      return next;
    });
  };

  const commit = () => {
    const names = [...selected];
    const extra = newName.trim();
    if (extra && !names.includes(extra) && !alreadyAdded.includes(extra)) {
      names.push(extra);
    }
    onAdd(names);
  };

  const total = selected.size + (newName.trim() && !alreadyAdded.includes(newName.trim()) ? 1 : 0);

  return (
    <div onClick={onClose} className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
      <div onClick={(e) => e.stopPropagation()} className="gold-border rounded-3xl bg-gradient-to-br from-emerald-950 to-black p-6 max-w-md w-full max-h-[90vh] flex flex-col">
        <div className="font-display text-2xl gold-text mb-1">ADD PLAYERS</div>
        <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-4">
          Pick from your GRP roster or add a new name
        </div>

        <div className="flex-1 overflow-y-auto pr-1 mb-4">
          {available.length > 0 ? (
            <>
              <div className="font-mono text-xs text-emerald-300 tracking-widest mb-2">FROM GRP ROSTER</div>
              <div className="space-y-1 mb-4">
                {available.map((p) => {
                  const isSelected = selected.has(p.name);
                  return (
                    <button
                      key={p.name}
                      onClick={() => toggle(p.name)}
                      className={`w-full flex items-center gap-3 p-2.5 rounded-lg border transition-colors ${
                        isSelected
                          ? 'bg-emerald-950/40 border-emerald-500/40 text-emerald-100'
                          : 'bg-black/30 border-yellow-500/10 text-yellow-100/80 hover:border-yellow-500/30'
                      }`}
                    >
                      <span className={`w-5 h-5 rounded border-2 flex items-center justify-center flex-shrink-0 ${
                        isSelected ? 'bg-emerald-500 border-emerald-400' : 'border-yellow-100/30'
                      }`}>
                        {isSelected && (
                          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="black" strokeWidth="3">
                            <polyline points="20 6 9 17 4 12" />
                          </svg>
                        )}
                      </span>
                      <span className="flex-1 text-left">{p.name}</span>
                    </button>
                  );
                })}
              </div>
            </>
          ) : (
            <div className="text-yellow-100/40 text-sm text-center py-4 mb-2">
              All GRP players are already on the regulars list.
            </div>
          )}

          <div className="font-mono text-xs text-emerald-300 tracking-widest mb-2 mt-4">OR ADD A NEW NAME</div>
          <input
            type="text"
            value={newName}
            onChange={(e) => setNewName(e.target.value)}
            onKeyDown={(e) => { if (e.key === 'Enter' && total > 0) commit(); }}
            placeholder="New player name"
            className="w-full px-3 py-2 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 text-sm focus:outline-none focus:border-yellow-500/50"
          />
        </div>

        <div className="flex gap-2">
          <button
            onClick={onClose}
            className="flex-1 px-4 py-2.5 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100 font-mono text-sm"
          >
            CANCEL
          </button>
          <button
            onClick={commit}
            disabled={total === 0}
            className="flex-1 px-4 py-2.5 rounded-full font-display text-base text-black disabled:opacity-30"
            style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
          >
            ADD{total > 0 ? ` (${total})` : ''}
          </button>
        </div>
      </div>
    </div>
  );
}

// ============ MAIN TIMER ============
function PokerTimerMain({ config, onReset, customSounds, onViewLeague, fbUser }) {
  const [levels, setLevels] = useState(config.levels);
  const [players, setPlayers] = useState(config.players); // [{name, sound}, ...]
  const [currentLevel, setCurrentLevel] = useState(0);
  const [timeLeft, setTimeLeft] = useState(config.levels[0].duration * 60);
  const [isRunning, setIsRunning] = useState(false);
  const [voiceEnabled, setVoiceEnabled] = useState(true);
  const [eliminatedPlayers, setEliminatedPlayers] = useState([]); // names, in elimination order
  const [rebuyCounts, setRebuyCounts] = useState({}); // { playerName: number }
  const [payoutKey, setPayoutKey] = useState(() => defaultPayoutKey(config.players.length));
  const [newPlayerName, setNewPlayerName] = useState('');
  const [activePanel, setActivePanel] = useState(null);
  const [hasStarted, setHasStarted] = useState(false);
  const [voices, setVoices] = useState([]);
  const [selectedVoiceURI, setSelectedVoiceURI] = useState(null);
  const [showHomeConfirm, setShowHomeConfirm] = useState(false);
  const [showEliminate, setShowEliminate] = useState(false);
  const [winner, setWinner] = useState(null);
  const [fullRoster, setFullRoster] = useState([]); // [{ name, sound }, ...] — for late-entry picker
  const [knockedOutBy, setKnockedOutBy] = useState({}); // { eliminatedPlayerName: knockerOuterName }
  const [pendingKnockout, setPendingKnockout] = useState(null); // player being eliminated, awaiting "who knocked them out?"
  const [showSaveModal, setShowSaveModal] = useState(false);
  const [fullRosterFromDB, setFullRosterFromDB] = useState([]); // raw player docs from Firestore — for bounty calc

  const intervalRef = useRef(null);
  const scrubDraggingRef = useRef(false);

  // Load the full club roster from Firestore so late-entry can suggest existing names
  useEffect(() => {
    let cancelled = false;
    const doLoad = async () => {
      try {
        const allPlayers = await window.GRP_DB.getAllPlayers();
        if (cancelled) return;
        const active = (allPlayers || [])
          .filter((p) => p.active !== false)
          .map((p) => ({ name: p.displayName, sound: p.sound || 'none' }));
        setFullRoster(active);
        setFullRosterFromDB(allPlayers || []); // raw, for bounty calc
      } catch (e) { /* silent — late-entry falls back to free text */ }
    };
    if (window.GRP_DB) doLoad();
    else {
      const onReady = () => doLoad();
      window.addEventListener('firebase-ready', onReady);
      return () => {
        cancelled = true;
        window.removeEventListener('firebase-ready', onReady);
      };
    }
    return () => { cancelled = true; };
  }, []);

  // Load available voices. They load asynchronously in some browsers.
  useEffect(() => {
    if (typeof window === 'undefined' || !window.speechSynthesis) return;
    const loadVoices = () => {
      const all = window.speechSynthesis.getVoices();
      // Prefer English voices, but show all
      const sorted = [...all].sort((a, b) => {
        const aEn = a.lang.startsWith('en') ? 0 : 1;
        const bEn = b.lang.startsWith('en') ? 0 : 1;
        if (aEn !== bEn) return aEn - bEn;
        return a.name.localeCompare(b.name);
      });
      setVoices(sorted);
      if (sorted.length > 0 && !selectedVoiceURI) {
        // Default: Google US English. Fall back through other Google voices, then anything en.
        const best = sorted.find(v => /google.*us english/i.test(v.name))
          || sorted.find(v => /google/i.test(v.name) && v.lang === 'en-US')
          || sorted.find(v => /google/i.test(v.name) && v.lang.startsWith('en'))
          || sorted.find(v => /natural|premium|enhanced|neural/i.test(v.name) && v.lang.startsWith('en'))
          || sorted.find(v => v.lang === 'en-US')
          || sorted.find(v => v.lang.startsWith('en'))
          || sorted[0];
        setSelectedVoiceURI(best.voiceURI);
      }
    };
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
    return () => { window.speechSynthesis.onvoiceschanged = null; };
  }, [selectedVoiceURI]);

  const getVoice = useCallback(() => {
    if (!selectedVoiceURI) return null;
    return voices.find(v => v.voiceURI === selectedVoiceURI) || null;
  }, [voices, selectedVoiceURI]);

  const speak = useCallback((text) => {
    if (!voiceEnabled || typeof window === 'undefined' || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    const v = getVoice();
    if (v) utterance.voice = v;
    utterance.rate = 0.95;
    utterance.pitch = 1;
    utterance.volume = 1;
    window.speechSynthesis.speak(utterance);
  }, [voiceEnabled, getVoice]);

  // Pre-recorded voice clip with Web Speech fallback.
  // key = filename (without .mp3) under sounds/voice/, e.g. 'final-3', 'goodbye-cactus'.
  const speakClip = useCallback(async (key, fallbackText) => {
    if (!voiceEnabled) return;
    if (typeof window !== 'undefined' && window.speechSynthesis) window.speechSynthesis.cancel();
    try { await playVoiceClip(key); }
    catch (e) { if (fallbackText) speak(fallbackText); }
  }, [voiceEnabled, speak]);

  // Play a sequence of pre-recorded clips. items: [{ key, fallback }, ...].
  const speakClipQueue = useCallback(async (items) => {
    if (!voiceEnabled) return;
    if (typeof window !== 'undefined' && window.speechSynthesis) window.speechSynthesis.cancel();
    for (const item of items) {
      try { await playVoiceClip(item.key); }
      catch (e) {
        if (item.fallback) {
          speak(item.fallback);
          await new Promise((r) => setTimeout(r, 2000));
        }
      }
    }
  }, [voiceEnabled, speak]);

  // Queue multiple lines so they play in sequence (longer welcome message)
  const speakQueue = useCallback((lines) => {
    if (!voiceEnabled || typeof window === 'undefined' || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const v = getVoice();
    lines.forEach((text) => {
      const u = new SpeechSynthesisUtterance(text);
      if (v) u.voice = v;
      u.rate = 0.95;
      u.pitch = 1;
      u.volume = 1;
      window.speechSynthesis.speak(u);
    });
  }, [voiceEnabled, getVoice]);

  const announceLevel = useCallback((levelIdx) => {
    const level = levels[levelIdx];
    if (!level) return;
    if (level.isBreak) {
      speakClip(`break-${level.duration}`, `Break time. ${level.duration} minute break. Stretch your legs.`);
    } else {
      // Pre-recorded blinds clip keyed by BB; ante variant when present.
      // Level number and round duration are visible on screen, so we don't
      // announce them verbally (would require dynamic Web Speech mid-Adam).
      const anteText = level.ante > 0 ? `, with an ante of ${level.ante}` : '';
      const key = level.ante > 0 ? `blinds-${level.bb}-ante` : `blinds-${level.bb}`;
      speakClip(key, `Blinds are now ${level.sb} and ${level.bb}${anteText}.`);
    }
  }, [levels, speakClip]);

  // Welcome message — only when starting from level 1 for the first time.
  // Plays the pre-recorded Adam clip, then announces the opening blinds.
  // Falls back to Web Speech for the welcome if the clip fails.
  const speakWelcome = useCallback(async () => {
    const level = levels[0];
    if (!level || level.isBreak) return;
    await speakClip('welcome', 'Welcome to the home game, everyone. Best of luck.');
    // Brief pause then announce the starting blinds for level 1.
    await new Promise((r) => setTimeout(r, 400));
    announceLevel(0);
  }, [levels, speakClip, announceLevel]);

  // Mid-game level transition: "Blinds Up!" then the new blinds.
  // Breaks skip the "Blinds Up" prefix — just play the break clip.
  // Used for both the automatic timer roll-over and the manual NEXT button.
  const announceLevelTransition = useCallback(async (levelIdx) => {
    const lvl = levels[levelIdx];
    if (!lvl) return;
    if (lvl.isBreak) {
      announceLevel(levelIdx);
      return;
    }
    await speakClip('blinds-up', 'Blinds up!');
    await new Promise((r) => setTimeout(r, 200));
    announceLevel(levelIdx);
  }, [levels, speakClip, announceLevel]);

  useEffect(() => {
    if (!isRunning) return;
    intervalRef.current = setInterval(() => {
      setTimeLeft((t) => {
        if (t <= 1) {
          setCurrentLevel((lvl) => {
            const next = Math.min(lvl + 1, levels.length - 1);
            if (next !== lvl) {
              setTimeout(() => announceLevelTransition(next), 100);
              setTimeout(() => setTimeLeft(levels[next].duration * 60), 0);
            } else {
              setIsRunning(false);
              setTimeout(() => speakClip('complete', 'Tournament complete. Well played.'), 100);
            }
            return next;
          });
          return 0;
        }
        // Only fire the 5-min warning if the round itself is longer than 5 min
        if (t === 301 && levels[currentLevel].duration > 5 && !levels[currentLevel].isBreak) {
          speakClip('five-min', 'Five minutes remaining in this round.');
        }
        if (t === 61 && !levels[currentLevel].isBreak) {
          speakClip('one-min', 'One minute remaining.');
        }
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(intervalRef.current);
  }, [isRunning, levels, currentLevel, announceLevel, announceLevelTransition, speak, speakClip]);

  const togglePlay = () => {
    // iOS / Safari requires the very first speak() call to happen synchronously
    // inside a user gesture. Fire a silent priming utterance to unlock the engine.
    if (voiceEnabled && typeof window !== 'undefined' && window.speechSynthesis) {
      try {
        const prime = new SpeechSynthesisUtterance('');
        prime.volume = 0;
        window.speechSynthesis.speak(prime);
      } catch (e) { /* ignore */ }
    }
    // Welcome message only on the very first start (level 1, full time, not yet started)
    if (!isRunning && !hasStarted && currentLevel === 0 && timeLeft === levels[0].duration * 60) {
      speakWelcome();
      setHasStarted(true);
    }
    setIsRunning(!isRunning);
  };

  const nextLevel = () => {
    if (currentLevel < levels.length - 1) {
      const next = currentLevel + 1;
      setCurrentLevel(next);
      setTimeLeft(levels[next].duration * 60);
      if (isRunning) announceLevelTransition(next);
    }
  };

  const prevLevel = () => {
    if (currentLevel > 0) {
      const prev = currentLevel - 1;
      setCurrentLevel(prev);
      setTimeLeft(levels[prev].duration * 60);
    }
  };

  // Add a player to the live game. If `pick` is supplied (from the roster typeahead),
  // use that name + sound. Otherwise use whatever's in the text field as a free-text fallback.
  const addPlayer = (pick) => {
    let name, sound;
    if (pick) {
      name = pick.name;
      sound = pick.sound || 'none';
    } else {
      name = newPlayerName.trim();
      sound = 'none';
    }
    if (!name) return;
    // Skip if already in this game
    if (players.find((p) => p.name === name)) {
      setNewPlayerName('');
      return;
    }
    setPlayers([...players, { name, sound }]);
    setNewPlayerName('');
  };

  const togglePlayerEliminated = (name) => {
    setEliminatedPlayers((prev) => prev.includes(name) ? prev.filter((p) => p !== name) : [...prev, name]);
  };

  const removePlayer = (idx) => setPlayers(players.filter((_, i) => i !== idx));

  // Rebuy: add 1 to rebuy count for this player and announce.
  const addRebuy = (name) => {
    setRebuyCounts((prev) => ({ ...prev, [name]: (prev[name] || 0) + 1 }));
    if (voiceEnabled) speakClip(`rebuy-${slugifyName(name)}`, `Rebuy for ${name}.`);
  };

  const removeRebuy = (name) => {
    setRebuyCounts((prev) => {
      const next = { ...prev };
      const cur = next[name] || 0;
      if (cur <= 1) delete next[name];
      else next[name] = cur - 1;
      return next;
    });
  };

  const totalRebuys = Object.values(rebuyCounts).reduce((a, b) => a + b, 0);

  // Eliminate a player: voice "Goodbye <name>", then play their sound.
  // Also triggers "final 3" announcement and winner announcement when appropriate.
  // Step 1: user taps OUT in the eliminate modal. For league games, open the
  // "who knocked them out?" picker (for bounty credit). High Rollers has no
  // bounties, so skip straight to elimination.
  const requestEliminate = (player) => {
    setShowEliminate(false);
    if (config.gameType === 'league') {
      setPendingKnockout(player);
    } else {
      doEliminate(player);
    }
  };

  // Step 2: user has chosen a knocker-outer (or skipped). Now actually eliminate.
  const confirmEliminate = (knockerOuterName) => {
    const player = pendingKnockout;
    if (!player) return;
    setPendingKnockout(null);
    if (knockerOuterName) {
      setKnockedOutBy((prev) => ({ ...prev, [player.name]: knockerOuterName }));
    }
    doEliminate(player);
  };

  const doEliminate = (player) => {
    const remainingAfter = activePlayers.length - 1;
    setEliminatedPlayers((prev) => [...prev, player.name]);

    // Always: goodbye + their sound. Capture the player-sound promise so we
    // can chain the winner announcement off it on the final elimination.
    let playerSoundPromise;
    if (voiceEnabled) {
      speakClip(`goodbye-${slugifyName(player.name)}`, `Goodbye, ${player.name}.`);
      playerSoundPromise = new Promise((resolve) => {
        setTimeout(() => { resolve(playSound(player.sound, customSounds)); }, 1400);
      });
    } else {
      playerSoundPromise = playSound(player.sound, customSounds);
    }

    // Final 3: announcement (only if we just dropped TO 3, and only when starting field was >3)
    if (remainingAfter === 3 && players.length > 3) {
      setTimeout(() => {
        if (voiceEnabled) speakClip('final-3', 'We are down to the final three!');
      }, 3000);
    }

    // Winner: 1 player left. Wait for the eliminated player's sound to finish
    // before triggering the fanfare and winner announcement so they don't overlap.
    if (remainingAfter === 1) {
      setIsRunning(false);
      const winnerObj = activePlayers.find((p) => p.name !== player.name);
      (async () => {
        try { await playerSoundPromise; } catch (e) { /* ignore */ }
        // Small breath between the player's sound ending and the fanfare
        await new Promise((r) => setTimeout(r, 400));
        setWinner(winnerObj);
        playSound('fanfare', customSounds);
        // Let fanfare lead for ~2.2s before the winner announcement
        await new Promise((r) => setTimeout(r, 2200));
        if (voiceEnabled && winnerObj) {
          const slug = slugifyName(winnerObj.name);
          speakClipQueue([
            { key: `winner-${slug}`, fallback: `And the winner is... ${winnerObj.name}!` },
            { key: `congrats-${slug}`, fallback: `Congratulations, ${winnerObj.name}!` },
          ]);
        }
      })();
    }
  };

  // Keep `eliminatePlayer` as a back-compat alias used by some places (e.g. eliminate modal OUT button).
  // It now goes through the picker flow.
  const eliminatePlayer = requestEliminate;

  // Un-eliminate (in case of misclick)
  const restorePlayer = (name) => {
    setEliminatedPlayers((prev) => prev.filter((p) => p !== name));
  };

  const updateLevel = (idx, field, value) => {
    const newLevels = [...levels];
    newLevels[idx] = { ...newLevels[idx], [field]: value };
    setLevels(newLevels);
  };

  const addLevel = () => {
    const last = levels[levels.length - 1];
    setLevels([...levels, { ...last, sb: last.sb * 2, bb: last.bb * 2 }]);
  };

  const removeLevel = (idx) => {
    if (levels.length > 1) {
      setLevels(levels.filter((_, i) => i !== idx));
      if (currentLevel >= levels.length - 1) setCurrentLevel(Math.max(0, levels.length - 2));
    }
  };

  const level = levels[currentLevel];
  const nextLvl = levels[currentLevel + 1];
  const activePlayers = players.filter((p) => !eliminatedPlayers.includes(p.name));
  const progress = 1 - timeLeft / (level.duration * 60);
  // Prize pool includes rebuys
  const totalEntries = players.length + totalRebuys;
  const prizePool = config.buyIn * totalEntries;
  // Avg stack: sum of all starting stacks (per-player if set, else config.stackSize) + rebuy chips, ÷ active players
  const baseChipsFromStarting = config.playerStartingStacks
    ? Object.values(config.playerStartingStacks).reduce((a, b) => a + b, 0)
    : config.stackSize * players.length;
  const totalChipsInPlay = baseChipsFromStarting + (config.stackSize * totalRebuys);
  const avgStack = activePlayers.length > 0 ? Math.round(totalChipsInPlay / activePlayers.length) : 0;

  // Final 3 dramatic mode: when 3 or fewer remain and the field started larger.
  const finalThreeMode = activePlayers.length <= 3 && players.length > 3 && !winner;

  return (
    <div className="min-h-screen w-full relative overflow-hidden" style={{
      background: finalThreeMode
        ? 'radial-gradient(ellipse at top, #4a0e1a 0%, #2a0712 40%, #100308 100%)'
        : 'radial-gradient(ellipse at top, #0a3d1f 0%, #062815 40%, #020a06 100%)',
      fontFamily: "'Inter', system-ui, sans-serif",
      transition: 'background 1.2s ease',
    }}>
      {/* Final-3 floating money symbols */}
      {finalThreeMode && (
        <div className="pointer-events-none fixed inset-0 z-0" aria-hidden="true">
          {Array.from({ length: 18 }).map((_, i) => (
            <div
              key={i}
              className="absolute font-display text-yellow-400/30"
              style={{
                left: `${(i * 53) % 100}%`,
                top: '-10%',
                fontSize: `${24 + (i % 4) * 12}px`,
                animation: `floatMoney ${10 + (i % 5) * 2}s linear ${i * 0.7}s infinite`,
              }}
            >
              {['£', '$', '£', '€', '$'][i % 5]}
            </div>
          ))}
        </div>
      )}
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
        .font-display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .felt-texture {
          background-image:
            radial-gradient(circle at 25% 25%, rgba(255,255,255,0.03) 1px, transparent 1px),
            radial-gradient(circle at 75% 75%, rgba(255,255,255,0.02) 1px, transparent 1px);
          background-size: 24px 24px;
        }
        .gold-text {
          background: linear-gradient(135deg, #f4d03f 0%, #f7dc6f 50%, #d4ac0d 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }
        .gold-border {
          border: 1px solid rgba(244, 208, 63, 0.3);
          box-shadow: 0 0 40px rgba(244, 208, 63, 0.1), inset 0 0 60px rgba(244, 208, 63, 0.05);
        }
        @keyframes pulse-warning {
          0%, 100% { color: #ef4444; text-shadow: 0 0 30px rgba(239, 68, 68, 0.6); }
          50% { color: #fca5a5; text-shadow: 0 0 50px rgba(239, 68, 68, 0.9); }
        }
        .warning { animation: pulse-warning 1s infinite; }
        @keyframes floatMoney {
          0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
          10% { opacity: 1; }
          90% { opacity: 1; }
          100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
        @keyframes winnerPop {
          0% { transform: scale(0.5); opacity: 0; }
          60% { transform: scale(1.1); opacity: 1; }
          100% { transform: scale(1); opacity: 1; }
        }
        @keyframes confetti {
          0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
          100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }
        @keyframes winnerGlow {
          0%, 100% { text-shadow: 0 0 30px rgba(244, 208, 63, 0.5), 0 0 60px rgba(244, 208, 63, 0.3); }
          50% { text-shadow: 0 0 50px rgba(244, 208, 63, 0.9), 0 0 100px rgba(244, 208, 63, 0.6); }
        }
        .control-btn { transition: all 0.2s ease; }
        .control-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(244, 208, 63, 0.2); }
        .control-btn:active { transform: translateY(0); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(244, 208, 63, 0.3); border-radius: 3px; }
      `}</style>

      <div className="felt-texture min-h-screen p-4 sm:p-8">
        <div className="max-w-4xl mx-auto">
          <div className="flex justify-between items-center mb-8">
            <div className="flex items-center gap-3">
              <img src="logos/GreeneRoomPokerLogo-02.svg" alt="" className="h-8 w-8 shrink-0" />
              <div className="font-display text-3xl gold-text">
                {config.gameType === 'highrollers' ? 'HIGH ROLLERS' : 'LEAGUE GAME'}
              </div>
            </div>
            <div className="flex gap-2 flex-wrap justify-end">
              <button
                onClick={() => {
                  const nextState = !voiceEnabled;
                  setVoiceEnabled(nextState);
                  if (nextState && typeof window !== 'undefined' && window.speechSynthesis) {
                    try {
                      window.speechSynthesis.cancel();
                      const u = new SpeechSynthesisUtterance('Voice ready.');
                      const v = getVoice();
                      if (v) u.voice = v;
                      u.rate = 0.95; u.pitch = 1; u.volume = 1;
                      window.speechSynthesis.speak(u);
                    } catch (e) { /* ignore */ }

                className="control-btn p-3 rounded-full bg-black/40 border border-yellow-500/20 text-yellow-100"
                title={voiceEnabled ? 'Mute voice (tap to test)' : 'Enable voice'}
              >
                {voiceEnabled ? <Volume2 size={18} /> : <VolumeX size={18} />}
              </button>
              <button onClick={() => setActivePanel(activePanel === 'players' ? null : 'players')} className={`control-btn p-3 rounded-full border text-yellow-100 ${activePanel === 'players' ? 'bg-yellow-500/20 border-yellow-500/60' : 'bg-black/40 border-yellow-500/20'}`} title="Players & rebuys">
                <Users size={18} />
              </button>
              <button onClick={() => setActivePanel(activePanel === 'payouts' ? null : 'payouts')} className={`control-btn p-3 rounded-full border text-yellow-100 ${activePanel === 'payouts' ? 'bg-yellow-500/20 border-yellow-500/60' : 'bg-black/40 border-yellow-500/20'}`} title="Payouts">
                <Trophy size={18} />
              </button>
              <button onClick={() => setActivePanel(activePanel === 'settings' ? null : 'settings')} className={`control-btn p-3 rounded-full border text-yellow-100 ${activePanel === 'settings' ? 'bg-yellow-500/20 border-yellow-500/60' : 'bg-black/40 border-yellow-500/20'}`} title="Settings & blinds">
