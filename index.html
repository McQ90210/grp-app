// Play a sound. Tries to use the bundled MP3 file first; falls back to synthesis.
// Play a sound. Resolves when the sound has finished playing (so callers can
// chain follow-up actions like winner announcements without overlap).
// Synthesised fallbacks resolve after a 3s heuristic since they don't expose
// a precise duration.
// playSound(soundKey, customSounds, customUrl?)
//   soundKey     — library or sounds.json key (or 'none')
//   customSounds — the { key: {label, file} } map loaded from sounds.json
//   customUrl    — optional. A per-player uploaded Storage URL that takes
//                  priority over `soundKey`. When set, always plays that
//                  URL if it loads; falls through to soundKey only if the
//                  URL fetch fails.
async function playSound(soundKey, customSounds = {}, customUrl = null) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  if (ctx.state === 'suspended') {
    try { await ctx.resume(); } catch (e) {}
  }

  const playBuffer = (buffer) => new Promise((resolve) => {
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const g = ctx.createGain();
    g.gain.value = 0.9;
    src.connect(g);
    g.connect(ctx.destination);
    src.onended = () => resolve();
    src.start();
  });

  // Per-player upload wins if provided.
  if (customUrl) {
    const buffer = await loadAudioBuffer(customUrl);
    if (buffer) return playBuffer(buffer);
    // If the URL fetch failed (e.g. offline), fall through to whatever
    // soundKey the player also had picked.
  }

  if (!soundKey || soundKey === 'none') return;

  // Look in custom sounds (from sounds.json) first
  const custom = customSounds[soundKey];
  if (custom && custom.file) {
    const buffer = await loadAudioBuffer(custom.file);
    if (buffer) return playBuffer(buffer);
    return; // Custom sound failed — don't fall through to synth
  }

  // Built-in library
  const sound = SOUND_LIBRARY[soundKey];
  if (!sound) return;
  if (sound.file) {
    const buffer = await loadAudioBuffer(sound.file);
    if (buffer) return playBuffer(buffer);
  }
  sound.play(ctx);
  // Synthesised fallback: no precise duration, use a 3s heuristic.
  await new Promise((r) => setTimeout(r, 3000));
}

// Play a pre-recorded voice clip from sounds/voice/{key}.mp3.
// Returns a Promise that resolves when playback ends, or rejects if the file
// doesn't exist / fails to load — callers fall back to Web Speech in that case.
//
// We reuse a single <audio> element across clips. iOS Safari only allows
// fresh `new Audio()` instances to play if created during a user gesture,
// so creating new ones for each clip (e.g. for the blinds clip ~4s after
// the welcome) was sporadically failing with NotAllowedError and causing
// the Web Speech fallback to fire in a different system voice. Reusing a
// single element preserves the audio unlock across the whole session.
let _voiceAudio = null;
let _voiceResolve = null;
let _voiceReject = null;
function playVoiceClip(key) {
  return new Promise((resolve, reject) => {
    if (!_voiceAudio) {
      _voiceAudio = new Audio();
      _voiceAudio.volume = 1;
      _voiceAudio.onended = () => {
        const r = _voiceResolve; _voiceResolve = _voiceReject = null;
        if (r) r();
      };
      _voiceAudio.onerror = () => {
        const r = _voiceReject; _voiceResolve = _voiceReject = null;
        if (r) r(new Error('clip error'));
      };
    }
    // Abandon any in-flight clip's promise — caller of the new one wins.
    _voiceResolve = _voiceReject = null;
    try { _voiceAudio.pause(); } catch (e) {}
    _voiceResolve = resolve;
    _voiceReject = reject;
    _voiceAudio.src = `sounds/voice/${key}.mp3`;
    try { _voiceAudio.currentTime = 0; } catch (e) {}
    _voiceAudio.play().catch((e) => {
      const r = _voiceReject; _voiceResolve = _voiceReject = null;
      if (r) r(e);
    });
  });
}

// Load the optional sounds.json manifest, which lets users add their own
// sounds without code changes. Format:
// {
//   "beans": { "label": "Beans", "file": "sounds/beans.mp3" },
//   "horse-laugh": { "label": "Horse laugh", "file": "sounds/horse-laugh.mp3" }
// }
async function loadCustomSounds() {
  try {
    const res = await fetch('sounds/sounds.json');
    if (!res.ok) return {};
    const data = await res.json();
    // Validate shape
    const out = {};
    for (const [key, val] of Object.entries(data)) {
      if (val && typeof val.file === 'string') {
        out[key] = { label: val.label || key, file: val.file };
      }
    }
    return out;
  } catch (e) {
    return {};
  }
}

// ============ PAYOUT LOGIC ============
// Standard small-field payout structures by number of payable places.
// PAYOUT_STRUCTURES drives the dropdown only. The actual amounts come from
// computePayouts(pot, buyIn, paidCount). The `splits` field is legacy but kept
// for back-compat with code that maps over it for rendering rows.
const PAYOUT_STRUCTURES = {
  '1': { label: 'Winner takes all', splits: [100] },
  '2': { label: 'Top 2 (66/34)', splits: [66, 34] },
  '3': { label: 'Top 3 (56/31/13)', splits: [56, 31, 13] },
  '4': { label: 'Top 4 (54/30/16 + buy-in)', splits: [54, 30, 16, 0] },
  '5': { label: 'Top 5 (50/28/15/7 + buy-in)', splits: [50, 28, 15, 7, 0] },
};

function defaultPayoutKey(numPlayers) {
  if (numPlayers <= 9) return '3';
  if (numPlayers <= 13) return '4';
  return '5';
}

// ============ PAYOUT CALCULATION ============
// Rule (locked May 2026):
//
//   1 paid:  winner takes all
//   2 paid:  1st = 66% of pot,  2nd = 34% of pot
//   3 paid:  1st = 56%, 2nd = 31%, 3rd = 13% of pot
//   4 paid:  1st = 54% rem, 2nd = 30% rem, 3rd = 16% rem; 4th = buy-in
//   5 paid:  1st = 50% rem, 2nd = 28% rem, 3rd = 15% rem, 4th = 7% rem; 5th = buy-in
//
// Where "rem" = pot − buy-in.
//
// For 1-3 paid: no buy-in floor (3rd is a real cash spot, deserves a real cut).
// For 4-5 paid: last place is the bubble — they get only their buy-in back, and
// everyone above splits the remaining pot.
//
// After rounding each amount to nearest £10, the residual is absorbed onto 1st
// place so the total equals the (rounded) pot.

// For 1-3 paid: percentages of FULL pot (last place still gets a meaningful share)
const FULL_POT_PERCENTAGES = {
  1: [1.00],
  2: [0.66, 0.34],
  3: [0.56, 0.31, 0.13],
};

// For 4-5 paid: percentages of REMAINING pot (after subtracting last place's buy-in)
const REMAINING_PERCENTAGES = {
  4: [0.54, 0.30, 0.16],          // 4th gets buy-in
  5: [0.50, 0.28, 0.15, 0.07],    // 5th gets buy-in
};

function computePayouts(pot, buyIn, paidCount) {
  if (!pot || pot <= 0 || !paidCount) return Array(paidCount || 0).fill(0);

  // Small-pot safety: if pot won't cover the structure, just split equally
  if (pot <= buyIn) {
    return Array(paidCount).fill(Math.round(pot / paidCount / 10) * 10);
  }

  const targetTotal = Math.round(pot / 10) * 10;
  let raw;

  if (paidCount <= 3 && FULL_POT_PERCENTAGES[paidCount]) {
    // Each position gets a percentage of the full pot, no buy-in floor.
    raw = FULL_POT_PERCENTAGES[paidCount].map((p) => pot * p);
  } else if (REMAINING_PERCENTAGES[paidCount]) {
    // Top positions split remaining (pot − buy-in); last place gets buy-in.
    const remaining = pot - buyIn;
    raw = REMAINING_PERCENTAGES[paidCount].map((p) => remaining * p).concat([buyIn]);
  } else {
    return Array(paidCount).fill(0);
  }

  const rounded = raw.map((v) => Math.round(v / 10) * 10);
  const diff = targetTotal - rounded.reduce((a, b) => a + b, 0);
  rounded[0] += diff;
  return rounded.map((v) => Math.max(0, v));
}

// Back-compat wrapper: old code passes (splits[]) but the splits no longer drive
// the calculation — we now pick the percentage table by paidCount alone.
function roundPayoutsToTens(splits, prizePool, buyIn = 30) {
  return computePayouts(prizePool, buyIn, splits.length);
}

// ============ BOUNTY + SCORING HELPERS ============

// Per the locked league rules:
// - Bounty is in the player's birth month, EXCEPT:
// - June birthdays are bountied in May (June = R1 final, no regular June game)
// - December birthdays USED to shift to November when Dec was the R2 final.
//   From Round 2 2026 onwards the round has a regular Dec game (Dec 2) AND a
//   separate Christmas Final (Dec 17), so December birthdays now bounty in
//   December as normal. The cutoff is birthMonth-only — past games already
//   have their bountyHolders frozen on the doc.
function getBountiedMonthFor(birthMonth) {
  if (!birthMonth) return null;
  if (birthMonth === 6) return 5;
  return birthMonth;
}

// Given a roster and a game date (YYYY-MM-DD), return the player IDs who should
// be bountied for a game played that month.
function computeBountyHolders(playersRoster, gameDate) {
  if (!gameDate) return [];
  const month = parseInt(gameDate.slice(5, 7), 10);
  if (!month) return [];
  return playersRoster
    .filter((p) => p.birthday && getBountiedMonthFor(p.birthday.month) === month)
    .map((p) => p.id);
}

// ============ TEST MODE ============
// When on (toggle in Admin Tools), no Firestore writes happen anywhere:
// - Live-game state stays in localStorage but isn't synced to Firestore
// - Final SAVE GAME button becomes FINISH TEST — closes without writing
// - LeagueContextScreen does NOT auto-create new seasons (uses the most
//   recent season as a stand-in so admin can still set up a game)
// A persistent banner sits across the top of every screen while it's on.
// Toggle persists in localStorage; tabs receive 'grp-test-mode-change' so
// the banner re-renders.
function readTestMode() {
  try { return localStorage.getItem('grp-test-mode') === '1'; } catch (_) { return false; }
}
function writeTestMode(on) {
  try {
    if (on) localStorage.setItem('grp-test-mode', '1');
    else localStorage.removeItem('grp-test-mode');
  } catch (_) {}
  try { window.dispatchEvent(new CustomEvent('grp-test-mode-change', { detail: { on: !!on } })); } catch (_) {}
}
// Hook so components react when the toggle flips elsewhere in the app.
function useTestMode() {
  const [on, setOn] = useState(readTestMode());
  useEffect(() => {
    const onChange = (e) => setOn(!!(e && e.detail && e.detail.on));
    window.addEventListener('grp-test-mode-change', onChange);
    return () => window.removeEventListener('grp-test-mode-change', onChange);
  }, []);
  return [on, (v) => writeTestMode(v)];
}

// Slugify a display name the same way the database does, so we can map between
// in-game display names and Firestore player IDs.
function slugifyName(name) {
  return (name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

// Round-2-2026 was the first season with the new scoring engine. Games dated
// on/after this cutoff use v2 rules; earlier games keep v1 so re-saving an
// older game from EditGameModal doesn't silently retro-score it.
const V2_RULES_START_DATE = '2026-07-01';
function rulesVersionForGame({ date, rulesVersion }) {
  if (rulesVersion === 'v2' || rulesVersion === 'v1') return rulesVersion;
  if (date && date >= V2_RULES_START_DATE) return 'v2';
  return 'v1';
}

// v1 (Jan 2025 — Jun 2026, R1):
//   attendance 2,000 + position [8000, 5000, 3000, 1000, 500] for places 1–5
//   + bounty 2,000 for knocking out a bountied player
//
// v2 (Jul 2026 — R2 onwards):
//   attendance 2,000
//   + position [8000, 6000, 4000, 3000, 2000, 1000] for places 1–6
//     (attendance stacks on top → 1st = 10k, 2nd = 8k, 3rd = 6k, 4th = 5k,
//      5th = 4k, 6th = 3k, DNP-top-6 = 2k)
//   + 1,000 per knockout
//   + 1,000 first-out bonus
//   + 2,000 per live bounty claim (knocker gets it if they KO the bountied
//     player; bountied player self-claims their unresolved respawn at game
//     end if they survive — see SaveGameModal's bountyClaims compute).
//
// Inputs (all v1+v2):
//   attendees:     [{ name, ... }, ...] who played
//   finishOrder:   [name, name, ...] in finishing order, 1st first
//   bountiedNames: Set of names who were bountied at start of game
//   knockedOutBy:  { eliminatedName: knockerOuterName } (legacy v1 shape;
//                  back-compat for v2 — first/only known KO per eliminated)
//   isFinal:       boolean (finals award no league points in either version)
//
// v2-only inputs:
//   knockouts:     [{ eliminated, knocker }] chronological KO log — captures
//                  multiple knockouts of the same player (each rebuy = a fresh
//                  bounty respawn, claimable on next KO). Falls back to
//                  knockedOutBy entries if absent.
//   bountyClaims:  [{ bountied, claimedBy }] — pre-resolved claims (incl.
//                  self-claims where bountied === claimedBy). Falls back to
//                  deriving from knockouts + bountiedNames if absent.
//   firstOut:      name of first player eliminated (defaults to last in
//                  finishOrder, fallback if not passed).
//
// Returns { [name]: pointsTotal }.
function computePointsAwarded({
  attendees,
  finishOrder,
  bountiedNames,
  knockedOutBy,
  isFinal,
  date,
  rulesVersion,
  knockouts,
  bountyClaims,
  firstOut,
}) {
  if (isFinal) return {}; // Finals don't award league points
  const version = rulesVersionForGame({ date, rulesVersion });
  const points = {};
  attendees.forEach((p) => { points[p.name] = 2000; });

  if (version === 'v1') {
    const POSITION_BONUSES = [8000, 5000, 3000, 1000, 500];
    finishOrder.slice(0, 5).forEach((name, i) => {
      if (points[name] !== undefined) points[name] += POSITION_BONUSES[i];
    });
    if (knockedOutBy && bountiedNames) {
      Object.entries(knockedOutBy).forEach(([eliminated, knocker]) => {
        if (bountiedNames.has(eliminated) && knocker && points[knocker] !== undefined) {
          points[knocker] += 2000;
        }
      });
    }
    return points;
  }

  // v2
  const POSITION_BONUSES_V2 = [8000, 6000, 4000, 3000, 2000, 1000];
  finishOrder.slice(0, 6).forEach((name, i) => {
    if (points[name] !== undefined) points[name] += POSITION_BONUSES_V2[i];
  });

  // KO bonus +1,000 per knockout. Prefer the chronological `knockouts` log
  // (which captures multiple KOs of the same player when they rebuy);
  // fall back to `knockedOutBy` for older flows.
  const koList = Array.isArray(knockouts) && knockouts.length
    ? knockouts
    : Object.entries(knockedOutBy || {})
        .filter(([, k]) => !!k)
        .map(([eliminated, knocker]) => ({ eliminated, knocker }));
  koList.forEach(({ knocker }) => {
    if (knocker && points[knocker] !== undefined) points[knocker] += 1000;
  });

  // Bounty claims: prefer the explicit list (which supports self-claims and
  // respawn semantics); otherwise derive from KO log + bountied set.
  const claims = Array.isArray(bountyClaims) && bountyClaims.length
    ? bountyClaims
    : koList
        .filter(({ eliminated, knocker }) =>
          bountiedNames && bountiedNames.has(eliminated) && knocker
        )
        .map(({ eliminated, knocker }) => ({ bountied: eliminated, claimedBy: knocker }));
  claims.forEach(({ claimedBy }) => {
    if (claimedBy && points[claimedBy] !== undefined) points[claimedBy] += 2000;
  });

  // First-out bonus +1,000. Falls back to the last entry of finishOrder
  // (which by construction is the first player eliminated).
  // First-out = FIRST player knocked out chronologically, even if they
  // later rebought and finished mid-pack. That's why we prefer the
  // knockouts log over finishOrder — the last entry in finishOrder is
  // whoever was PERMANENTLY eliminated first, not the same thing.
  // (finishOrder fallback kept for legacy games that pre-date the log.)
  const firstOutName = firstOut
    || (Array.isArray(knockouts) && knockouts.length > 0 ? knockouts[0].eliminated : null)
    || (finishOrder.length > 0 ? finishOrder[finishOrder.length - 1] : null);
  if (firstOutName && points[firstOutName] !== undefined) {
    points[firstOutName] += 1000;
  }

  return points;
}

// Break a single game's points for a specific PID into its constituent
// parts (attendance / position / KOs / bounties / first-out). Used by the
// League Dashboard's points-breakdown popup so admins can see exactly how
// a player earned their season total.
//
// Returns null if the player didn't attend that game. Otherwise:
//   {
//     parts: [{ label, points, detail? }, ...],
//     total: sum(parts.points),
//     rulesVersion: 'v1' | 'v2',
//   }
function computePointsBreakdownForGame(pid, game, playersById = {}) {
  const attendees = game.attendees || [];
  if (!attendees.includes(pid)) return null;

  const version = rulesVersionForGame({ date: game.date, rulesVersion: game.rulesVersion });
  const parts = [];

  // Finals don't award league points — surface that plainly.
  if (game.isFinal) {
    return { parts: [], total: 0, rulesVersion: version, isFinal: true };
  }

  parts.push({ label: 'Attendance', points: 2000 });

  const nameOf = (id) => playersById[id]?.displayName || id;
  const ordinal = (n) => {
    const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  };

  const finishOrder = game.finishOrder || [];
  const finishPos = finishOrder.indexOf(pid);
  const POSITION_BONUSES_V2 = [8000, 6000, 4000, 3000, 2000, 1000];
  const POSITION_BONUSES_V1 = [8000, 5000, 3000, 1000, 500];
  const bonuses = version === 'v2' ? POSITION_BONUSES_V2 : POSITION_BONUSES_V1;
  if (finishPos >= 0 && finishPos < bonuses.length) {
    parts.push({
      label: `${ordinal(finishPos + 1)} place`,
      points: bonuses[finishPos],
    });
  }

  if (version === 'v2') {
    const kos = (game.knockouts || []).filter((k) => k.knocker === pid);
    if (kos.length > 0) {
      parts.push({
        label: `Knockouts (×${kos.length})`,
        points: kos.length * 1000,
        detail: kos.map((k) => nameOf(k.eliminated)).join(', '),
      });
    }

    const claims = (game.bountyClaims || []).filter((c) => c.claimedBy === pid);
    if (claims.length > 0) {
      parts.push({
        label: `Bounty claims (×${claims.length})`,
        points: claims.length * 2000,
        detail: claims.map((c) => nameOf(c.bountied)).join(', '),
      });
    }

    // First-out preference: game.firstOut > knockouts[0].eliminated > finishOrder tail
    const knockouts = game.knockouts || [];
    const firstOutId = game.firstOut
      || (knockouts.length > 0 ? knockouts[0].eliminated : null)
      || (finishOrder.length > 0 ? finishOrder[finishOrder.length - 1] : null);
    if (firstOutId === pid) {
      parts.push({ label: 'First out', points: 1000 });
    }
  } else {
    // v1 — bounty via knockedOutBy + bountyHolders
    const bountyHolders = new Set(game.bountyHolders || []);
    const claimsV1 = Object.entries(game.knockedOutBy || {})
      .filter(([elim, knocker]) => knocker === pid && bountyHolders.has(elim));
    if (claimsV1.length > 0) {
      parts.push({
        label: `Bounty claims (×${claimsV1.length})`,
        points: claimsV1.length * 2000,
        detail: claimsV1.map(([elim]) => nameOf(elim)).join(', '),
      });
    }
  }

  const total = parts.reduce((s, p) => s + p.points, 0);
  return { parts, total, rulesVersion: version, isFinal: false };
}

// Resolve the full set of bounty claims for a v2 game — including respawns
// and self-claims. Used by SaveGameModal and (optionally) the live points
// readout.
//
// Inputs:
//   bountiedNames: Set of bountied-player names at game start
//   knockouts:     [{ eliminated, knocker }, ...] chronological KO log
//   rebuyCounts:   { name: count } — how many times each player rebought
//   winnerName:    name of the player who won (last one standing)
//
// Returns [{ bountied, claimedBy }] with one entry per LIVE bounty (initial
// + one per rebuy). claimedBy === bountied indicates a self-claim (the
// bountied player won without being eliminated again before game end).
function resolveBountyClaims({ bountiedNames, knockouts, rebuyCounts, winnerName }) {
  if (!bountiedNames || !bountiedNames.size) return [];
  const claims = [];
  bountiedNames.forEach((name) => {
    const lives = 1 + (rebuyCounts?.[name] || 0);
    const kosOfThem = (knockouts || []).filter((k) => k.eliminated === name);
    // Each KO of the bountied player consumes one live bounty → knocker.
    kosOfThem.forEach(({ knocker }) => {
      if (knocker) claims.push({ bountied: name, claimedBy: knocker });
    });
    // Any unresolved bounty at game end self-claims, but ONLY if the player
    // is still standing at the end (= the winner). If they got eliminated
    // the unresolved bounty just vanishes (shouldn't happen — a KO always
    // claims, but be defensive).
    const unresolved = lives - kosOfThem.length;
    if (unresolved > 0 && name === winnerName) {
      // At most one live bounty exists at any moment, so cap at 1.
      claims.push({ bountied: name, claimedBy: name });
    }
  });
  return claims;
}

// Compute a season's status from its date range and (optionally) its games,
// ignoring any stale `status` field saved on the doc. Rules:
//   - upcoming: today is before startDate
//   - complete: today is past endDate, OR all games have been played
//   - active:   within the date range and at least one game still unplayed
// If games aren't provided, the "all played" check is skipped — date alone
// decides between upcoming / active / complete. Used by the league wizard
// and dashboard so seasons don't have to be hand-flagged.
function computeSeasonStatus(season, gamesForSeason) {
  if (!season || !season.startDate || !season.endDate) return 'unknown';
  const today = new Date().toISOString().slice(0, 10);
  if (today < season.startDate) return 'upcoming';
  if (today > season.endDate) return 'complete';
  if (gamesForSeason && season.totalGames) {
    const played = gamesForSeason.filter(g => g.seasonId === season.id).length;
    if (played >= season.totalGames) return 'complete';
  }
  return 'active';
}

// ============ LEAGUE CONTEXT SCREEN ============
// Shown before the setup wizard for league games. Auto-detects active season
// and next game number, lets user confirm or override.
// Given the most recent season doc, compute sensible defaults for the next
// one. R1 → R2 (same year, Jul–Dec). R2 → next year's R1 (Jan–Jun). Falls
// back to current-year R1 if the latest ID doesn't match the pattern.
// totalGames defaults to 7 (the new standard from Round 2 2026 onwards).
function computeNextSeasonDefaults(lastSeason) {
  const m = (lastSeason?.id || '').match(/^(\d{4})-r(\d+)$/);
  let year, round;
  if (m) {
    year = parseInt(m[1]);
    round = parseInt(m[2]);
  } else {
    year = new Date().getFullYear();
    round = 0; // → next will be year R1
  }
  let nextYear, nextRound;
  if (round === 1) { nextYear = year; nextRound = 2; }
  else { nextYear = (round === 0 ? year : year + 1); nextRound = 1; }
  const startDate = nextRound === 1 ? `${nextYear}-01-01` : `${nextYear}-07-01`;
  const endDate   = nextRound === 1 ? `${nextYear}-06-30` : `${nextYear}-12-31`;
  return {
    id: `${nextYear}-r${nextRound}`,
    name: `${nextYear} — Round ${nextRound}`,
    startDate,
    endDate,
    totalGames: 7,
    finalGameIndex: 7,
    status: 'active',
  };
}

function LeagueContextScreen({ onConfirm, onBack, fbUser }) {
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [seasons, setSeasons] = useState([]);
  const [games, setGames] = useState([]);
  const [players, setPlayers] = useState([]);
  const [seasonId, setSeasonId] = useState(null);
  const [gameNumber, setGameNumber] = useState(1);
  const [editing, setEditing] = useState(false); // false: confirm mode, true: override mode
  const [justCreated, setJustCreated] = useState(null); // {id, name} when we auto-rolled into a new season this load
  const [needsSignInForNew, setNeedsSignInForNew] = useState(false);

  useEffect(() => {
    let cancelled = false;
    const doLoad = async () => {
      try {
        const [allSeasons, allPlayers, allLeagueGames] = await Promise.all([
          window.GRP_DB.getAllSeasons(),
          window.GRP_DB.getAllPlayers(),
          window.GRP_DB.getAllLeagueGames(),
        ]);
        if (cancelled) return;
        setPlayers(allPlayers);

        // Group games by season so computeSeasonStatus can detect the
        // all-games-played-but-still-inside-the-date-range case. Without
        // this, a season whose final has been played on (say) the 5th of
        // its end month still reads as "active" until the month ends —
        // which leaves the wizard pointing at the already-played final
        // instead of rolling forward.
        const gamesBySeasonId = {};
        for (const g of allLeagueGames) {
          if (!g.seasonId) continue;
          (gamesBySeasonId[g.seasonId] = gamesBySeasonId[g.seasonId] || []).push(g);
        }
        const statusOf = (s) => computeSeasonStatus(s, gamesBySeasonId[s.id] || []);

        // 1) Prefer an active season (in date range AND has unplayed games).
        // 2) Else: an upcoming one (e.g. R2 pre-seeded for July).
        // 3) Else: auto-create the next season so we land on Game 1 ready
        //    to go. Writing requires sign-in — fall back to a prompt if not.
        const today = new Date().toISOString().slice(0, 10);
        let chosen = allSeasons.find(s => statusOf(s) === 'active');
        if (!chosen) {
          const upcoming = allSeasons
            .filter(s => s.startDate && s.startDate > today)
            .sort((a, b) => (a.startDate || '').localeCompare(b.startDate || ''));
          if (upcoming.length > 0) chosen = upcoming[0];
        }
        let workingSeasons = allSeasons;
        if (!chosen) {
          if (readTestMode()) {
            // Test mode: don't create real seasons. Fall back to the most
            // recent one as a stand-in. Save flow won't write anyway, so the
            // gameNumber being "already played" doesn't matter — the admin
            // can override via the change panel.
            chosen = allSeasons[0];
          } else if (!fbUser) {
            // No active/upcoming season and not signed in — surface a prompt.
            setNeedsSignInForNew(true);
            setSeasons(allSeasons);
            setLoading(false);
            return;
          } else {
            // Auto-create. Latest season = first entry (allSeasons is sorted
            // by startDate desc in firebase-init.js).
            const latest = allSeasons[0];
            const next = computeNextSeasonDefaults(latest);
            try {
              await window.GRP_DB.upsertSeason(next);
              // Flip the previous season's stored status to 'complete' if
              // it's still 'active'. Client-side computes status from dates
              // anyway, but keeping the stored field honest prevents
              // getActiveSeason() (which queries where status == 'active')
              // from returning multiple docs.
              if (latest && latest.status === 'active') {
                await window.GRP_DB.upsertSeason({ ...latest, status: 'complete' });
              }
              workingSeasons = [next, ...allSeasons];
              chosen = next;
              if (!cancelled) setJustCreated({ id: next.id, name: next.name });
            } catch (e) {
              if (!cancelled) {
                setError('Could not start the next season: ' + e.message);
                setSeasons(allSeasons);
                setLoading(false);
              }
              return;
            }
          }
        }

        setSeasons(workingSeasons);
        setSeasonId(chosen.id);
        const seasonGames = await window.GRP_DB.getGamesForSeason(chosen.id);
        if (cancelled) return;
        setGames(seasonGames);
        // Next un-played game number
        const played = new Set(seasonGames.map(g => g.gameNumber));
        let next = 1;
        while (played.has(next) && next <= chosen.totalGames) next++;
        setGameNumber(Math.min(next, chosen.totalGames));
        setLoading(false);
      } catch (e) {
        if (!cancelled) {
          setError(e.message);
          setLoading(false);
        }
      }
    };
    if (window.GRP_DB) doLoad();
    else {
      const onReady = () => doLoad();
      window.addEventListener('firebase-ready', onReady);
      const t = setTimeout(() => {
        if (!cancelled && !window.GRP_DB) { setError('Firebase did not load.'); setLoading(false); }
      }, 8000);
      return () => {
        cancelled = true;
        window.removeEventListener('firebase-ready', onReady);
        clearTimeout(t);
      };
    }
    return () => { cancelled = true; };
  }, []);

  // Re-load games when season changes
  useEffect(() => {
    if (!seasonId || !window.GRP_DB) return;
    (async () => {
      try {
        const seasonGames = await window.GRP_DB.getGamesForSeason(seasonId);
        setGames(seasonGames);
      } catch (e) { setError(e.message); }
    })();
  }, [seasonId]);

  const season = seasons.find(s => s.id === seasonId);
  const isFinal = season && gameNumber === season.finalGameIndex;
  const playersById = {};
  players.forEach(p => { playersById[p.id] = p; });

  // For finals: compute round-totals per player, sorted descending
  const playerRoundTotals = (() => {
    if (!isFinal) return [];
    const totals = {};
    games.forEach(g => {
      Object.entries(g.pointsAwarded || {}).forEach(([pid, pts]) => {
        totals[pid] = (totals[pid] || 0) + (pts || 0);
      });
    });
    return Object.entries(totals)
      .filter(([_, t]) => t > 0)
      .sort((a, b) => b[1] - a[1])
      .map(([pid, total]) => ({ player: playersById[pid] || { displayName: pid, id: pid }, total }));
  })();

  // Skip-ahead button: roll forward to the next season even if the current
  // one technically still has games unplayed (typical case: round's final
  // hasn't been played but we want to start the next round's regular games
  // alongside). If a doc already exists for the computed next ID, just
  // switch to it; otherwise create it on the fly.
  const [startingNext, setStartingNext] = useState(false);
  const startNextRound = async () => {
    if (!fbUser) return;
    setStartingNext(true);
    try {
      const previousSeason = season || seasons[0];
      const next = computeNextSeasonDefaults(previousSeason);
      const existing = seasons.find((s) => s.id === next.id);
      if (!existing) {
        await window.GRP_DB.upsertSeason(next);
        // Flip the previous season's stored status to 'complete' when we
        // hop forward. Same reasoning as the auto-create path.
        if (previousSeason && previousSeason.status === 'active') {
          await window.GRP_DB.upsertSeason({ ...previousSeason, status: 'complete' });
          setSeasons((prev) => [next, ...prev.map((s) => s.id === previousSeason.id ? { ...s, status: 'complete' } : s)]);
        } else {
          setSeasons((prev) => [next, ...prev]);
        }
        setJustCreated({ id: next.id, name: next.name });
      }
      setSeasonId(next.id);
      const nextGames = await window.GRP_DB.getGamesForSeason(next.id);
      setGames(nextGames);
      const played = new Set(nextGames.map((g) => g.gameNumber));
      let n = 1;
      while (played.has(n) && n <= next.totalGames) n++;
      setGameNumber(Math.min(n, next.totalGames));
      setEditing(false);
    } catch (e) {
      setError('Could not start next round: ' + e.message);
    } finally {
      setStartingNext(false);
    }
  };

  const handleConfirm = () => {
    onConfirm({
      seasonId,
      gameNumber,
      isFinal,
      season,
      playerRoundTotals: isFinal ? playerRoundTotals : [],
    });
  };

  return (
    <div className="min-h-screen w-full flex items-center justify-center p-4" style={{
      background: 'radial-gradient(ellipse at top, #0a3d1f 0%, #062815 40%, #020a06 100%)',
      fontFamily: "'Inter', system-ui, sans-serif",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
        .font-display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .gold-text {
          background: linear-gradient(135deg, #14a37b 0%, #1ec890 50%, #0e8c69 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }
        .gold-border {
          border: 1px solid rgba(20, 163, 123, 0.4);
          box-shadow: 0 0 40px rgba(20, 163, 123, 0.15), inset 0 0 60px rgba(20, 163, 123, 0.05);
        }
      `}</style>

      <div className="w-full max-w-xl">
        <div className="text-center mb-8">
          <button onClick={onBack} className="font-mono text-xs text-yellow-100/40 hover:text-yellow-100/80 mb-2">
            ← change game type
          </button>
          <div className="font-display text-5xl gold-text mb-1">LEAGUE GAME</div>
          <div className="font-mono text-xs text-emerald-200/60 tracking-widest">CONFIRM CONTEXT</div>
        </div>

        {loading ? (
          <div className="text-center py-12 text-emerald-200/60 font-mono">Loading...</div>
        ) : error ? (
          <div className="text-center py-12 text-red-400 font-mono">{error}</div>
        ) : needsSignInForNew ? (
          <div className="gold-border rounded-2xl p-6 bg-gradient-to-br from-emerald-950 to-black text-center">
            <div className="font-display text-2xl gold-text mb-3">ROUND COMPLETE</div>
            <div className="text-yellow-100/80 mb-2">All seasons on record are finished.</div>
            <div className="text-yellow-100/50 text-sm mb-4">
              Sign in as admin to start the next round automatically.
            </div>
            <div className="text-yellow-100/40 text-xs font-mono">
              The app will create the new season with sensible defaults — you can edit it after.
            </div>
          </div>
        ) : seasons.length === 0 ? (
          <div className="gold-border rounded-2xl p-6 bg-gradient-to-br from-emerald-950 to-black text-center">
            <div className="text-yellow-100/80 mb-2">No seasons set up yet.</div>
            <div className="text-yellow-100/40 text-xs font-mono">
              Sign in as admin and import historical data, or contact the league organiser.
            </div>
          </div>
        ) : (
          <>
            {justCreated && (
              <div className="rounded-2xl p-4 mb-4 bg-emerald-900/30 border border-emerald-400/40 text-center">
                <div className="font-mono text-[11px] text-emerald-300/80 tracking-widest mb-1">✨ NEW SEASON STARTED</div>
                <div className="font-display text-xl text-emerald-100">{justCreated.name}</div>
                <div className="text-emerald-200/60 text-xs font-mono mt-1">
                  Auto-created from the previous round. Defaults to 6 league games + 1 final. Tap CHANGE below to adjust.
                </div>
              </div>
            )}

            <div className="gold-border rounded-2xl p-6 bg-gradient-to-br from-emerald-950/80 to-black/80 backdrop-blur mb-6">
              {!editing ? (
                <>
                  <div className="text-center mb-4">
                    <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-1">SEASON</div>
                    <div className="font-display text-3xl gold-text">{season?.name}</div>
                  </div>
                  <div className="text-center mb-5">
                    <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-1">GAME</div>
                    <div className="font-display text-5xl text-emerald-200">
                      G{gameNumber}{isFinal && <span className="text-yellow-300 ml-2">— FINAL</span>}
                    </div>
                    <div className="text-yellow-100/40 text-xs font-mono mt-1">
                      of {season?.totalGames}
                    </div>
                  </div>
                  <div className="text-center">
                    <button
                      onClick={() => setEditing(true)}
                      className="text-emerald-300/80 hover:text-emerald-200 font-mono text-xs underline"
                    >
                      change
                    </button>
                  </div>
                </>
              ) : (
                <div className="space-y-4">
                  <div>
                    <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">SEASON</div>
                    <select
                      value={seasonId || ''}
                      onChange={(e) => setSeasonId(e.target.value)}
                      className="w-full px-3 py-2.5 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 focus:outline-none focus:border-yellow-500/50"
                    >
                      {seasons.map(s => (
                        <option key={s.id} value={s.id} style={{ background: '#0a3d1f' }}>
                          {s.name} ({computeSeasonStatus(s)})
                        </option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <div className="font-mono text-xs text-yellow-100/40 tracking-widest mb-2">
                      GAME NUMBER (1 to {season?.totalGames})
                    </div>
                    <input
                      type="number"
                      min="1"
                      max={season?.totalGames}
                      value={gameNumber}
                      onChange={(e) => setGameNumber(parseInt(e.target.value) || 1)}
                      className="w-full px-3 py-2.5 rounded-lg bg-black/40 border border-yellow-500/20 text-yellow-50 focus:outline-none focus:border-yellow-500/50"
                    />
                    {isFinal && (
                      <div className="text-yellow-300/80 text-xs font-mono mt-2">
                        This is the FINAL game of {season?.name}.
                      </div>
                    )}
                  </div>
                  {fbUser && (
                    <div className="pt-2 border-t border-emerald-500/15">
                      <button
                        onClick={startNextRound}
                        disabled={startingNext}
                        className="w-full px-4 py-2 rounded-lg bg-emerald-900/30 border border-emerald-400/40 text-emerald-100 font-mono text-xs hover:bg-emerald-900/50 disabled:opacity-50"
                        title="Roll forward to the next round (creates the season if it doesn't exist) and start at Game 1."
                      >
                        {startingNext ? 'Starting…' : '+ start next round'}
                      </button>
                      <div className="text-yellow-100/40 text-[10px] font-mono mt-1 text-center">
                        Skip to {(() => {
                          const next = computeNextSeasonDefaults(season || seasons[0]);
                          return next.name;
                        })()} · Game 1
                      </div>
                    </div>
                  )}
                  <button
                    onClick={() => setEditing(false)}
                    className="text-emerald-300/80 hover:text-emerald-200 font-mono text-xs underline"
                  >
                    done
                  </button>
                </div>
              )}
            </div>

            {/* Bounties this month — direct birthday bounties for the
                current calendar month. Carry-forwards from prior months
                aren't computed automatically (rule is manual: admin
                adds them to bountyHolders when the player next attends). */}
            {!isFinal && (() => {
              const today = new Date().toISOString().slice(0, 10);
              const bountyIds = computeBountyHolders(players, today);
              const bountied = players.filter((p) => bountyIds.includes(p.id));
              if (bountied.length === 0) return null;
              const MONTHS = ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
              const month = parseInt(today.slice(5, 7), 10);
              return (
                <div className="gold-border rounded-2xl p-5 bg-gradient-to-br from-yellow-950/40 to-black/80 backdrop-blur mb-6">
                  <div className="font-mono text-xs text-yellow-300/80 tracking-widest mb-3">
                    🎂 BOUNTIES · {MONTHS[month]?.toUpperCase()}
                  </div>
                  <div className="space-y-1.5">
                    {bountied.map((p) => {
                      const bday = p.birthday
                        ? `${MONTHS[p.birthday.month]} ${p.birthday.day}`
                        : '';
                      return (
                        <div key={p.id} className="flex justify-between items-baseline gap-3 py-1 border-b border-yellow-500/10 last:border-0">
                          <span className="text-emerald-100">{p.displayName}</span>
                          <span className="text-yellow-100/40 font-mono text-xs">{bday}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              );
            })()}

            {/* Final game starting stacks preview */}
            {isFinal && playerRoundTotals.length > 0 && (
              <div className="gold-border rounded-2xl p-5 bg-gradient-to-br from-yellow-950/40 to-black/80 backdrop-blur mb-6">
                <div className="font-mono text-xs text-yellow-300/80 tracking-widest mb-3">
                  FINAL STARTING STACKS · POINTS + 10,000
                </div>
                <div className="space-y-1.5 max-h-72 overflow-y-auto pr-1">
                  {playerRoundTotals.map(({ player, total }, i) => (
                    <div key={player.id} className="flex justify-between items-baseline gap-3 py-1 border-b border-yellow-500/10 last:border-0">
                      <div className="flex gap-2 items-baseline">
                        <span className="text-yellow-100/40 text-xs font-mono w-6">{i + 1}.</span>
                        <span className="text-emerald-100">{player.displayName}</span>
                      </div>
                      <div className="text-right">
                        <span className="text-yellow-100/40 font-mono text-xs mr-2">{total.toLocaleString()} pts</span>
                        <span className="font-display text-xl text-yellow-300">
                          {(total + 10000).toLocaleString()}
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
                <div className="text-yellow-100/40 text-xs font-mono mt-3">
                  Each player starts with their round points + 10,000 chips.
                  The 10,000 base is fixed for finals.
                </div>
              </div>
            )}

            <button
              onClick={handleConfirm}
              disabled={!seasonId}
              className="w-full px-6 py-4 rounded-full font-display text-2xl text-black disabled:opacity-30"
              style={{ background: 'linear-gradient(135deg, #14a37b, #0e8c69)' }}
            >
              CONTINUE TO SETUP
            </button>
          </>
        )}
      </div>
    </div>
  );
}

// ============ SETUP WIZARD ============
function SetupWizard({ onStart, customSounds, gameType = 'league', leagueContext = null, onBack, fbUser }) {
  const isFinal = leagueContext?.isFinal === true;
  const [step, setStep] = useState(0);
  const [buyIn, setBuyIn] = useState(gameType === 'highrollers' ? '40' : '30');
  const [stackSize, setStackSize] = useState(gameType === 'highrollers' ? '6000' : '10000');
  // Format: 'rebuy' (default for league + HR) or 'freezeout' (no rebuys
  // allowed once busted). Finals are always freezeout.
  const [format, setFormat] = useState(isFinal ? 'freezeout' : 'rebuy');
  const [roster, setRoster] = useState([]); // currently displayed list
  const [allGrpPlayers, setAllGrpPlayers] = useState([]); // full GRP roster — picker source
  const [hrRegulars, setHrRegulars] = useState([]); // names on the HR regulars allowlist
  const [showPlayerPicker, setShowPlayerPicker] = useState(false);
  const [playingTonight, setPlayingTonight] = useState(new Set()); // names selected for this game
  // Per-attendee payment capture — keyed by name during the wizard, mapped
  // to PIDs at game-save time. Default state is "OWES" (false); admin
  // taps to flip green as money's collected. For finals, subs are skipped
  // entirely (no subs collected on the final).
  const [buyInsPaidByName, setBuyInsPaidByName] = useState({});
  const [subsPaidByName, setSubsPaidByName] = useState({});
  // Locally-mirrored upfront-paid set so the wizard can flip players into
  // / out of season.upfrontSubs inline. Persists to the season doc on
  // every toggle (admin-only), so the Subs Ledger and any later wizard
  // open see the same truth without manual refetch.
  const [localUpfrontSet, setLocalUpfrontSet] = useState(
    () => new Set(leagueContext?.season?.upfrontSubs || [])
  );
  const toggleUpfrontFor = async (pid) => {
    const current = Array.from(localUpfrontSet);
    const has = current.includes(pid);
    const next = has ? current.filter((x) => x !== pid) : [...current, pid];
    setLocalUpfrontSet(new Set(next));
    if (fbUser && leagueContext?.season && window.GRP_DB) {
      try {
        await window.GRP_DB.upsertSeason({
          ...leagueContext.season,
          upfrontSubs: next,
        });
      } catch (e) {
        console.error('[grp] upfront toggle failed:', e);
      }
    }
  };
  const [newPlayer, setNewPlayer] = useState('');
  // Pending confirm for a round-payment toggle. Set on any tap of the
  // upfront chip; cleared on confirm/cancel. Guards both directions so
  // a stray tap can't add or remove without an explicit yes.
  const [pendingUpfrontToggle, setPendingUpfrontToggle] = useState(null); // { pid, name, nextIsUpfront } | null
  const [duration, setDuration] = useState('180');
  const [includeAntes, setIncludeAntes] = useState(false);
  const [rosterLoaded, setRosterLoaded] = useState(false);

  const readHrRegulars = () => {
    try {
      const saved = localStorage.getItem('grp-hr-regulars');
      if (saved) {
        const parsed = JSON.parse(saved);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) {}
    return [];
  };

  // Load roster on mount: Firestore first (the source of truth), fall back to
  // localStorage if Firebase isn't ready. League mode shows the full Greene
  // Room roster; High Rollers mode shows only the HR regulars allowlist
  // (managed via the + picker and × delete button).
  useEffect(() => {
    let cancelled = false;
    const finalize = (allMembers) => {
      if (cancelled) return;
      setAllGrpPlayers(allMembers);
      if (gameType === 'highrollers') {
        const hrReg = readHrRegulars();
        setHrRegulars(hrReg);
        // Build the displayed roster: GRP players in the allowlist, plus any
        // non-GRP names that were added via "new player" in the picker.
        const grpInAllow = allMembers.filter(p => hrReg.includes(p.name));
        const nonGrp = hrReg
          .filter(n => !allMembers.find(p => p.name === n))
          .map(n => ({ name: n, sound: 'none' }));
        setRoster([...grpInAllow, ...nonGrp]);
      } else {
        setRoster(allMembers);
      }
      // All start unchecked — admin picks who's actually playing tonight
      setPlayingTonight(new Set());
      setRosterLoaded(true);
    };

    // Pull any locally-saved sound choices (set when picking sounds without
    // being signed in — these need to survive a Firestore reload).
    const readLocalSounds = () => {
      try {
        const saved = localStorage.getItem("poker-roster");
        if (!saved) return {};
        const parsed = JSON.parse(saved);
        if (!Array.isArray(parsed)) return {};
        const out = {};
        parsed.forEach((p) => {
          const name = typeof p === 'string' ? p : p.name;
          const sound = typeof p === 'string' ? null : p.sound;
          if (name && sound && sound !== 'none') out[name] = sound;
        });
        return out;
      } catch (e) { return {}; }
    };

    const loadFromFirestore = async () => {
      try {
        const firestorePlayers = await window.GRP_DB.getAllPlayers();
        if (firestorePlayers && firestorePlayers.length > 0) {
          const localSounds = readLocalSounds();
          const members = firestorePlayers
            .filter((p) => p.active !== false)
            .map((p) => ({
              name: p.displayName,
              // Local choice wins so picks made without sign-in survive a reload.
              sound: localSounds[p.displayName] || p.sound || 'none',
              // Per-player uploaded custom sound (via Manage Players). Takes
              // priority over `sound` when set. Passed through onStart into
              // the game state so eliminate + preview can find it.
              customSoundUrl: p.customSoundUrl || null,
            }));
          finalize(members);
          return true;
        }
      } catch (e) { /* fall through to localStorage */ }
      return false;
    };

    const loadFromLocalStorage = async () => {
      try {
        const saved = ({ value: localStorage.getItem("poker-roster") });
        if (saved && saved.value) {
          const parsed = JSON.parse(saved.value);
          if (Array.isArray(parsed) && parsed.length > 0) {
            const migrated = parsed.map((p) =>
              typeof p === 'string' ? { name: p, sound: 'none' } : { name: p.name, sound: p.sound || 'none' }
            );
            finalize(migrated);
            return;
          }
        }
      } catch (e) { /* no saved roster */ }
      finalize([]);
    };

    (async () => {
      // If Firebase is already loaded, use it directly
      if (window.GRP_DB) {
        const ok = await loadFromFirestore();
        if (!ok) await loadFromLocalStorage();
        return;
      }
      // Otherwise wait briefly for firebase-ready, then fall back
      const onReady = async () => {
        window.removeEventListener('firebase-ready', onReady);
        const ok = await loadFromFirestore();
        if (!ok) await loadFromLocalStorage();
      };
      window.addEventListener('firebase-ready', onReady);
      // Timeout: if Firebase hasn't loaded in 3 seconds, use localStorage
      setTimeout(() => {
        if (!cancelled && !rosterLoaded) {
          window.removeEventListener('firebase-ready', onReady);
          loadFromLocalStorage();
        }
      }, 3000);
    })();

    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [gameType]);

  // Persist roster whenever it changes
  useEffect(() => {
    if (!rosterLoaded) return;
    (async () => {
      try {
        localStorage.setItem("poker-roster", JSON.stringify(roster));
      } catch (e) { /* fail silently */ }
    })();
  }, [roster, rosterLoaded]);

  // Persist HR regulars allowlist when in HR mode
  useEffect(() => {
    if (!rosterLoaded || gameType !== 'highrollers') return;
    try {
      localStorage.setItem('grp-hr-regulars', JSON.stringify(hrRegulars));
    } catch (e) { /* fail silently */ }
  }, [hrRegulars, rosterLoaded, gameType]);

  // Add one-or-more names from the picker modal to the roster (HR mode only).
  // GRP-roster names come with their saved sound; new names start at 'none'.
  const addFromPicker = (names) => {
    if (!names || names.length === 0) {
      setShowPlayerPicker(false);
      return;
    }
    const newReg = Array.from(new Set([...hrRegulars, ...names]));
    setHrRegulars(newReg);
    const toAdd = names
      .filter(n => !roster.find(p => p.name === n))
      .map(n => {
        const grp = allGrpPlayers.find(p => p.name === n);
        return grp ? { ...grp } : { name: n, sound: 'none' };
      });
    setRoster([...roster, ...toAdd]);
    setPlayingTonight((prev) => new Set([...prev, ...names]));
    // Seed each newly-added attendee with default paid=true so we don't
    // have to chase consent. Admin un-ticks anyone who walked in owing.
    setBuyInsPaidByName((m) => { const n = { ...m }; names.forEach((nm) => { n[nm] = false; }); return n; });
    setSubsPaidByName((m) => { const n = { ...m }; names.forEach((nm) => { n[nm] = false; }); return n; });
    setShowPlayerPicker(false);
  };

  const addPlayer = () => {
    const name = newPlayer.trim();
    if (!name) return;
    const existing = roster.find((p) => p.name === name);
    if (existing) {
      // Already in roster — just make sure they're selected
      setPlayingTonight((prev) => new Set([...prev, name]));
    } else {
      setRoster([...roster, { name, sound: 'none' }]);
      setPlayingTonight((prev) => new Set([...prev, name]));
    }
    setBuyInsPaidByName((m) => ({ ...m, [name]: false }));
    setSubsPaidByName((m) => ({ ...m, [name]: false }));
    setNewPlayer('');
  };

  const togglePlaying = (name) => {
    setPlayingTonight((prev) => {
      const next = new Set(prev);
      if (next.has(name)) {
        next.delete(name);
        setBuyInsPaidByName((m) => { const n = { ...m }; delete n[name]; return n; });
        setSubsPaidByName((m) => { const n = { ...m }; delete n[name]; return n; });
      } else {
        next.add(name);
        setBuyInsPaidByName((m) => ({ ...m, [name]: false }));
        setSubsPaidByName((m) => ({ ...m, [name]: false }));
      }
      return next;
    });
  };

  const updatePlayerSound = (name, soundKey) => {
    setRoster(roster.map((p) => (p.name === name ? { ...p, sound: soundKey } : p)));
    // Persist to Firestore so the choice sticks across sessions and devices.
    // Writes need auth; if not signed in, the localStorage copy still holds it
    // for this browser (and load logic now overlays local choices on top of
    // Firestore data so the picks survive).
    if (fbUser && window.GRP_DB) {
      window.GRP_DB.upsertPlayer({ displayName: name, sound: soundKey })
        .catch((e) => { console.error('[grp] failed to save sound to Firestore:', e); });
    }
  };

  // Remove from roster entirely. In HR mode this also drops the name from the
  // regulars allowlist so they won't reappear next session unless re-added.
  const removeFromRoster = (name) => {
    setRoster(roster.filter((p) => p.name !== name));
    setPlayingTonight((prev) => {
      const next = new Set(prev);
      next.delete(name);
      return next;
    });
    setBuyInsPaidByName((m) => { const n = { ...m }; delete n[name]; return n; });
    setSubsPaidByName((m) => { const n = { ...m }; delete n[name]; return n; });
    if (gameType === 'highrollers') {
      setHrRegulars((prev) => prev.filter((n) => n !== name));
    }
  };

  const selectAll = () => {
    const allNames = roster.map((p) => p.name);
    setPlayingTonight(new Set(allNames));
    const allOwed = {};
    allNames.forEach((n) => { allOwed[n] = false; });
    setBuyInsPaidByName(allOwed);
    setSubsPaidByName(allOwed);
  };
  const selectNone = () => {
    setPlayingTonight(new Set());
    setBuyInsPaidByName({});
    setSubsPaidByName({});
  };

  const playersArray = roster.filter((p) => playingTonight.has(p.name));

  const canAdvance = () => {
    if (step === 0) return parseFloat(buyIn) > 0;
    if (step === 1) return parseInt(stackSize) > 0;
    if (step === 2) return playersArray.length >= 2;
    if (step === 3) return parseInt(duration) >= 30;
    return true;
  };

  const finish = () => {
    // For finals: base stack is fixed at 10,000 plus each player's round points so far
    const baseStack = isFinal ? 10000 : parseInt(stackSize);

    // Compute per-player starting stacks
    const playerStartingStacks = {};
    if (isFinal && leagueContext?.playerRoundTotals) {
      // Map round totals by displayName for quick lookup
      const totalsByName = {};
      leagueContext.playerRoundTotals.forEach(({ player, total }) => {
        totalsByName[player.displayName] = total;
      });
      playersArray.forEach(p => {
        const pts = totalsByName[p.name] || 0;
        playerStartingStacks[p.name] = pts + 10000;
      });
    } else {
      playersArray.forEach(p => { playerStartingStacks[p.name] = baseStack; });
    }

    // For blind structure: use avg starting stack (for finals it'll be higher than 10k)
    const avgStartingStack = Math.round(
      Object.values(playerStartingStacks).reduce((a, b) => a + b, 0) / playersArray.length
    );

    const levels = generateBlindStructure(
      parseFloat(buyIn),
      avgStartingStack,
      playersArray.length,
      parseInt(duration),
      includeAntes
    );
    onStart({
      gameType,
      buyIn: parseFloat(buyIn),
      stackSize: baseStack,
      playerStartingStacks,
      players: playersArray,
      duration: parseInt(duration),
      levels,
      format: isFinal ? 'freezeout' : format,
      // Per-attendee payment status captured during selection. Keyed by
      // displayName for now; SaveGameModal converts to PIDs at save time.
      buyInsPaidByName,
      subsPaidByName,
      leagueContext, // pass through so the main timer & save flow know which season/game
    });
  };

  const steps = ['BUY-IN', 'STACK', 'PLAYERS', 'DURATION', 'REVIEW'];

  return (
    <div className="min-h-screen w-full flex items-center justify-center p-4" style={{
      background: 'radial-gradient(ellipse at top, #0a3d1f 0%, #062815 40%, #020a06 100%)',
      fontFamily: "'Inter', system-ui, sans-serif",
    }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');
        .font-display { font-family: 'Bebas Neue', sans-serif; letter-spacing: 0.02em; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .gold-text {
          background: linear-gradient(135deg, #f4d03f 0%, #f7dc6f 50%, #d4ac0d 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }
        .gold-border {
          border: 1px solid rgba(244, 208, 63, 0.3);
          box-shadow: 0 0 40px rgba(244, 208, 63, 0.1), inset 0 0 60px rgba(244, 208, 63, 0.05);
        }
        .felt-texture {
          background-image:
            radial-gradient(circle at 25% 25%, rgba(255,255,255,0.03) 1px, transparent 1px),
            radial-gradient(circle at 75% 75%, rgba(255,255,255,0.02) 1px, transparent 1px);
          background-size: 24px 24px;
        }
        .input-large {
          font-family: 'Bebas Neue', sans-serif;
          letter-spacing: 0.02em;
          background: rgba(0,0,0,0.4);
          border: 1px solid rgba(244, 208, 63, 0.2);
          color: #fef3c7;
          text-align: center;
          width: 100%;
          padding: 1rem;
          border-radius: 1rem;
          transition: all 0.2s;
        }
        .input-large:focus {
          outline: none;
          border-color: rgba(244, 208, 63, 0.6);
          box-shadow: 0 0 30px rgba(244, 208, 63, 0.2);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(244, 208, 63, 0.3); border-radius: 3px; }
        @keyframes slideIn {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .step-content { animation: slideIn 0.3s ease-out; }
      `}</style>

      <div className="felt-texture w-full max-w-2xl">
        <div className="text-center mb-8">
          <div className="font-display text-5xl gold-text">
            {gameType === 'highrollers' ? 'HIGH ROLLERS' : 'LEAGUE GAME'}
          </div>
          <div className="font-mono text-xs text-emerald-200/60 tracking-widest mt-1">TOURNAMENT SETUP</div>
          {onBack && (
            <button
              onClick={onBack}
              className="mt-3 text-xs font-mono text-yellow-100/40 hover:text-yellow-100/80"
            >
              ← change game type
            </button>
          )}
        </div>

        <div className="flex justify-center gap-2 mb-8">
          {steps.map((label, i) => (
            <div key={i} className={`h-2 rounded-full transition-all ${i === step ? 'bg-yellow-400 w-8' : i < step ? 'bg-yellow-600 w-2' : 'bg-yellow-500/20 w-2'}`} />
          ))}
        </div>

        <div className="gold-border rounded-3xl bg-gradient-to-br from-emerald-950/80 to-black/80 backdrop-blur p-8 sm:p-12">
          <div key={step} className="step-content">
            {step === 0 && (
              <div>
                <div className="font-mono text-xs text-yellow-500/60 tracking-widest mb-2 text-center">STEP 1 OF 5</div>
                <div className="font-display text-3xl gold-text text-center mb-2">WHAT'S THE BUY-IN?</div>
                <div className="text-yellow-100/50 text-center mb-8 text-sm">How much each player puts in to play</div>
                <div className="relative max-w-xs mx-auto">
                  <div className="absolute left-6 top-1/2 -translate-y-1/2 font-display text-3xl text-yellow-500/40">£</div>
                  <input
                    type="number"
                    value={buyIn}
                    onChange={(e) => setBuyIn(e.target.value)}
                    autoFocus
                    className="input-large text-5xl pl-14"
                  />
                </div>
                <div className="flex gap-2 justify-center mt-4">
                  {['30', '40', '50'].map((v) => (
                    <button key={v} onClick={() => setBuyIn(v)} className="px-4 py-1.5 rounded-full bg-black/30 border border-yellow-500/20 text-yellow-100/70 font-mono text-sm hover:border-yellow-500/50">£{v}</button>
                  ))}
                </div>
                {/* Format toggle — league + HR. Finals are auto-locked to
                    freezeout (no rebuys allowed). */}
                {!isFinal && (
                  <div className="mt-8 max-w-xs mx-auto">
                    <div className="font-mono text-xs text-yellow-500/60 tracking-widest mb-2 text-center">FORMAT</div>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        onClick={() => setFormat('rebuy')}
                        className={`px-4 py-2 rounded-lg font-display text-base ${
                          format === 'rebuy'
                            ? 'bg-emerald-600/30 border border-emerald-400/70 text-emerald-100'
                            : 'bg-black/30 border border-yellow-500/20 text-yellow-100/60 hover:border-yellow-500/50'
                        }`}
                      >
                        REBUY
                      </button>
                      <button
                        onClick={() => setFormat('freezeout')}
                        className={`px-4 py-2 rounded-lg font-display text-base ${
                          format === 'freezeout'
                            ? 'bg-emerald-600/30 border border-emerald-400/70 text-emerald-100'
                            : 'bg-black/30 border border-yellow-500/20 text-yellow-100/60 hover:border-yellow-500/50'
                        }`}
                      >
                        FREEZEOUT
                      </button>
                    </div>
                    <div className="text-center mt-2 text-yellow-100/40 font-mono text-[11px]">
                      {format === 'freezeout' ? 'No rebuys — once busted, you\'re out.' : 'Players can buy back in after busting.'}
                    </div>
                  </div>
                )}
                {isFinal && (
                  <div className="mt-6 text-center">
                    <div className="inline-block px-3 py-1 rounded-full bg-emerald-600/20 border border-emerald-400/40 text-emerald-200 font-mono text-xs">
                      FINAL · FREEZEOUT (no rebuys)
                    </div>
                  </div>
                )}
              </div>
            )}

            {step === 1 && (
              <div>
                <div className="font-mono text-xs text-yellow-500/60 tracking-widest mb-2 text-center">STEP 2 OF 5</div>
                <div className="font-display text-3xl gold-text text-center mb-2">STARTING STACK?</div>
                <div className="text-yellow-100/50 text-center mb-8 text-sm">
                  {isFinal
                    ? <>Base stack for FINAL <span className="text-yellow-300 font-bold">locked at 10,000</span><br/>+ each player's round points</>
                    : 'Chips each player starts with'}
                </div>
                <div className="max-w-xs mx-auto">
                  <input
                    type="number"
                    value={isFinal ? '10000' : stackSize}
                    onChange={(e) => !isFinal && setStackSize(e.target.value)}

                    autoFocus
                    className={`input-large text-5xl ${isFinal ? 'opacity-60' : ''}`}
                  />
                </div>
                {!isFinal && (
                  <div className="flex gap-2 justify-center mt-4 flex-wrap">
                    {['2000', '6000', '8000', '10000'].map((v) => (
                      <button key={v} onClick={() => setStackSize(v)} className="px-4 py-1.5 rounded-full bg-black/30 border border-yellow-500/20 text-yellow-100/70 font-mono text-sm hover:border-yellow-500/50">{parseInt(v).toLocaleString()}</button>
                    ))}

                )}

                  <div className="text-center mt-4 text-yellow-300/60 font-mono text-xs">

              <div>
                <div className="font-mono text-xs text-yellow-500/60 tracking-widest mb-2 text-center">STEP 3 OF 5</div>
                <div className="font-display text-3xl gold-text text-center mb-2">WHO'S PLAYING?</div>
                <div className="text-yellow-100/50 text-center mb-6 text-sm">
                  {roster.length === 0
                    ? 'Add your regulars below'
                    : `${playersArray.length} of ${roster.length} playing tonight`}
                </div>
                {gameType === 'highrollers' ? (
                  <div className="flex justify-center mb-4">
                    <button
                      onClick={() => setShowPlayerPicker(true)}
                      className="px-6 py-3 rounded-xl bg-yellow-500/20 border border-yellow-500/40 text-yellow-100 font-display text-lg hover:bg-yellow-500/30 flex items-center gap-2"
                    >
                      <Plus size={20} /> ADD PLAYER
                    </button>
                  </div>
                ) : (
                  <div className="flex gap-2 mb-4 max-w-md mx-auto">
                    <input
                      type="text"
                      value={newPlayer}
                      onChange={(e) => setNewPlayer(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && addPlayer()}
                      placeholder={roster.length === 0 ? "Add player..." : "Add new player..."}
                      autoFocus
                      className="flex-1 px-4 py-3 rounded-xl bg-black/40 border border-yellow-500/20 text-yellow-50 placeholder-yellow-100/30 focus:outline-none focus:border-yellow-500/50"
                    />
                    <button onClick={addPlayer} className="px-5 rounded-xl bg-yellow-500/20 border border-yellow-500/40 text-yellow-100 hover:bg-yellow-500/30">
                      <Plus size={20} />
                    </button>
                  </div>
                )}

                {roster.length > 0 && (
                  <>
                    <div className="flex justify-center gap-3 mb-3">
                      <button onClick={selectAll} className="px-3 py-1 rounded-full bg-black/30 border border-yellow-500/20 text-yellow-100/70 font-mono text-xs hover:border-yellow-500/50">
                        ALL IN
                      </button>
                      <button onClick={selectNone} className="px-3 py-1 rounded-full bg-black/30 border border-yellow-500/20 text-yellow-100/70 font-mono text-xs hover:border-yellow-500/50">
                        CLEAR
                      </button>
                    </div>
                    <div className="max-w-md mx-auto space-y-2 max-h-80 overflow-y-auto pr-1">
